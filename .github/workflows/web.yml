# Job `web` — lint, types and tests for the TypeScript app.
#
# `npm ci` installs strictly from package-lock.json, so a dependency cannot drift between
# a developer's machine and CI. Playwright's test runner is a declared dev dependency for
# the E2E suite the UI cards will write; NO BROWSER IS INSTALLED here and no E2E run
# happens in CI (ADR-0011: E3/E4 are manual by protocol).
name: web

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: eslint + prettier
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

      - name: Generated client matches contracts/http/openapi.yaml
        run: npm run generate:check

      - name: vitest
        run: npm test
