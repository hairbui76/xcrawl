scope: >
  Định nghĩa chín cổng chuyển giai đoạn G0–G7 và SP1: điều kiện vào, điều kiện ra (máy kiểm
  được ở đâu có thể, trỏ tới đúng check của `evidence/tools/e0_check.py` và đúng nhóm scenario),
  trạng thái hiện tại kèm evidence ref, và quy tắc làm bằng chứng hết hiệu lực. Một cổng KHÔNG
  tự mở vì một gói tuyên bố xong; nó mở khi điều kiện ra của chính nó đo được.
verification: >
  Mỗi `exit_conditions[].machine_check` trỏ tới một `check_id` thật của `e0_check.py` hoặc một
  nhóm scenario của `acceptance/scenarios.yaml`. Trạng thái ở `current_status` được ghim vào một
  `evidence_ref` trong `evidence/index.json`; không có evidence ref thì trạng thái phải là
  `NOT_MET`.
claim_ceiling: DRAFT_FOR_REVIEW

status_vocabulary:
  MET_PROVISIONAL: >
    Điều kiện ra đo được đã đạt trên baseline hiện tại, NHƯNG kết luận dựa một phần vào các
    quyết định còn `PROVISIONAL` chờ Owner phê chuẩn. Không phải `MET`.
  PARTIALLY_MET: "Một số điều kiện ra đạt, một số chưa; danh sách chưa đạt được liệt kê."
  NOT_MET: "Chưa đạt, hoặc không có bằng chứng nào để đo."
  NOT_APPLICABLE_YET: "Cổng thuộc giai đoạn sau; chưa có gì để đo ở giai đoạn Pre-code."

reading_note_vi: >
  Không cổng nào trong file này được ghi `MET`. Lý do rõ ràng: B01–B17 vẫn `OPEN` trong
  `agent_profile/registry.json` và mọi phương án giải chúng đều mang nhãn `PROVISIONAL` chờ Owner
  (baseline §1, §5). `MET_PROVISIONAL` là mức cao nhất mà một Worker được ghi ở phiên này, và nó
  có nghĩa hẹp: "đo được, đã đạt, nhưng đứng trên nền chưa phê chuẩn".

gates:

  - id: G0
    name_vi: "Baseline — nguồn, registry và sổ blocker"
    plan_ref: "SRC-PLAN §12 hàng G0"
    owner_package: PC00
    entry_conditions:
      - "Có bản nguồn spec v0.2 và plan v0.1 với hash đã pin (baseline §2)."
    exit_conditions:
      - id: G0-X1
        statement_vi: "Bản sao nguồn bất biến tồn tại và byte-identical với nguồn đã pin."
        machine_check: "sha256sum precode/source/* == baseline §2"
        met: true
      - id: G0-X2
        statement_vi: "Registry nguyên tử tồn tại; mọi requirement có nguồn; mọi anchor phân giải được."
        machine_check: "e0_check E0-06-requirement-refs; e0_check E0-07-id-refs"
        met: true
      - id: G0-X3
        statement_vi: "B01–B17 mỗi cái xuất hiện đúng một lần, đều `PROVISIONAL`, đều có phương án và cổng bị chặn."
        machine_check: "EV-PC00-04 (PC00 self-validation); xác minh độc lập EV-A1R1-07/08"
        met: true
      - id: G0-X4
        statement_vi: "XN/UQ không bị đổi ngầm: status của mỗi dòng D khớp cột TT của SRC-SPEC."
        machine_check: "EV-A1R1-03 (0 status-fidelity deviations, xác minh độc lập)"
        met: true
      - id: G0-X5
        statement_vi: "Hai quyết định PC00 tự chọn ngoài baseline §5 được theo dõi tới khi Owner trả lời."
        machine_check: "precode/review.md §7 liệt kê F-PC00-01 và F-PC00-02 là mục còn mở của G0"
        met: true
    current_status: MET_PROVISIONAL
    evidence_refs: ["EV-PC09-01", "EV-PC09-04"]
    blocked_by_open_items:
      - "F-PC00-01 (hủy liên kết là hành động trong app, không phải lệnh Telegram thứ tư) — chờ Owner."
      - "F-PC00-02 (hoãn export Saved sang P1) — chờ Owner, gắn REQ-OQ10."
      - "PROV-PC00-01 — phạm vi loại trừ của `data.purge_all`, `OWNER_DECISION_REQUIRED`."
    allows_next_vi: "Soạn topology và từng hợp đồng. KHÔNG cho phép product coding."

  - id: G1
    name_vi: "Boundaries — ownership, capability và registry cạnh"
    plan_ref: "SRC-PLAN §12 hàng G1"
    owner_package: PC01
    entry_conditions:
      - "G0 ở `MET_PROVISIONAL` trở lên."
    exit_conditions:
      - id: G1-X1
        statement_vi: "Mọi operation được trích dẫn ở bất kỳ đâu đều tồn tại trong ports.yaml."
        machine_check: "e0_check E0-04-operation-refs"
        met: true
      - id: G1-X2
        statement_vi: "`allowed_edges` bằng đúng tích caller × owner suy ra từ ports.yaml, cả hai chiều."
        machine_check: "EV-PC01-09/EV-PC01-10; xác minh độc lập EV-A1R2-05 (99 == 99)"
        met: true
      - id: G1-X3
        statement_vi: "Mỗi mutation có đúng MỘT owner ở mức operation VÀ ở mức bảng."
        machine_check: "EV-A1R2-03 (entity↔owner set-diff 0 cả hai chiều, 59 entity/62 token)"
        met: true
      - id: G1-X4
        statement_vi: "Mỗi cạnh bị cấm có scenario từ chối."
        machine_check: "e0_check E0-10a-denied-edge-scenario (SC49)"
        met: true
      - id: G1-X5
        statement_vi: "Mỗi cạnh bị cấm có một denied case với mã lỗi đã pin."
        machine_check: "e0_check E0-10b-denied-edge-oracle"
        met: true
        note_vi: >
          Đóng ở đợt FIX5. Ruling R5-01 chốt bảng ranh giới bốn mã (`UNAUTHORIZED` cho HTTP sai
          principal class · `FORBIDDEN_EDGE` cho lời gọi/import trong tiến trình qua cạnh không có
          trong `allowed_edges` · `CAPABILITY_DENIED` cho thiếu capability tiến trình/mạng/file/tool
          · `CSRF_REJECTED` cho owner mutation thiếu CSRF), và cả 36/36 cạnh nay có
          `denied_cases[]` với `expected_error_code` và `scenario_refs: [SC49]`.
    current_status: MET_PROVISIONAL
    evidence_refs: ["EV-PC09-01"]
    blocked_by_open_items:
      - "B12 và B13 vẫn `PROVISIONAL`: topology và chính sách secret chưa được Owner phê chuẩn."
      - "PROV-PC01-01/-02/-04/-05/-06 chờ Owner hoặc chờ ruling."
      - "Chưa có xác minh độc lập trên epoch chứa các bản sửa FIX5 (A2 chưa chạy)."
    allows_next_vi: >
      Soạn schema và state độc lập framework — đã và đang xảy ra. Mọi điều kiện ra đo được đã đạt;
      `MET_PROVISIONAL` chứ không phải `MET` vì nền vẫn là các quyết định chờ Owner.

  - id: G2
    name_vi: "Data/workflow — identity, transaction, state, checkpoint có oracle"
    plan_ref: "SRC-PLAN §12 hàng G2"
    owner_package: "PC02 + PC03"
    entry_conditions:
      - "G1 ở `PARTIALLY_MET` trở lên và các cạnh liên quan tới ingest/analysis đã đóng."
    exit_conditions:
      - id: G2-X1
        statement_vi: "Mọi schema JSON hợp lệ theo metaschema 2020-12; fixture dương/âm rơi đúng chỗ."
        machine_check: "e0_check E0-02-metaschema; e0_check E0-03-fixture-schema"
        met: true
      - id: G2-X2
        statement_vi: "I02, I03, I04, I08 mỗi cái có oracle theo số hàng/hash/tham chiếu và ít nhất một counterexample."
        machine_check: "e0_check E0-11b-invariant-polarity; contracts/data/invariants.md §I02/I03/I04/I08"
        met: true
      - id: G2-X3
        statement_vi: "Máy trạng thái đóng: enum kín, mọi trạng thái reachable, terminal không phát sinh transition ngoài ngoại lệ đã khai."
        machine_check: "e0_check E0-09-state-lint"
        met: true
        note_vi: >
          Đóng ở đợt FIX5 theo ruling R5-04: TSR-A01 nay viết "`valid` là terminal **trong phạm vi
          một generation**; hai transition duy nhất rời nó là T-AN-12/T-AN-13 (phân tích lại /
          phiên bản paper mới → generation mới, bản cũ được giữ)". Một hành vi, một mô tả.
      - id: G2-X4
        statement_vi: "Mọi mã lỗi của SRC-PLAN §10 map tới một trạng thái đích và có ít nhất một scenario."
        machine_check: "e0_check E0-05-error-code-refs; e0_check E0-16-scenario-catalogue (28/28 mã có SC)"
        met: true
      - id: G2-X5
        statement_vi: "Mọi timeout/budget có số, đơn vị và một dòng lý do."
        machine_check: "EV-PC03-05; xác minh độc lập EV-A1R2-10 (41 budget, 0 thiếu)"
        met: true
      - id: G2-X6
        statement_vi: "Checkpoint chỉ trên dữ liệu đã ACK; một mô tả duy nhất cho mọi đường ghi checkpoint."
        machine_check: "SC21 + SC03; contracts/data/entities.yaml TXN-checkpoint-only; xác minh độc lập EV-A1R2-03"
        met: true
    current_status: MET_PROVISIONAL
    evidence_refs: ["EV-PC09-01"]
    blocked_by_open_items:
      - "B02, B05, B06, B07, B08 vẫn `PROVISIONAL`."
      - "PROV-PC03-04 (tự chạy lại một lần từ `unknown_attempt`) chờ Owner phê chuẩn."
      - "Chưa kiểm chứng trên SQLite thật: partial UNIQUE index và STORED generated column là giả định."
    allows_next_vi: "Soạn report/collector/AI/UI trên interface ổn định — đã xảy ra."

  - id: G3
    name_vi: "Domain contracts — PC04..PC08 đủ semantics, schema, lỗi và fixture"
    plan_ref: "SRC-PLAN §12 hàng G3"
    owner_package: "PC04, PC05, PC06, PC07, PC08"
    entry_conditions:
      - "G2 ở `PARTIALLY_MET` trở lên."
    exit_conditions:
      - id: G3-X1
        statement_vi: "Mọi file hợp đồng mang đủ 14 trường header của baseline §3 (ngoại lệ được khai báo)."
        machine_check: "e0_check E0-08-contract-header; e0_check E0-17-declared-deviations"
        met: true
      - id: G3-X2
        statement_vi: "Mọi fixture nêu caller hợp lệ hoặc tự khai là ca cạnh bị cấm."
        machine_check: "e0_check E0-14-fixture-actor-edge"
        met: true
      - id: G3-X3
        statement_vi: "Mọi cột được fixture khẳng định đều tồn tại trong entities.yaml, hoặc là annotation `_`, hoặc mang `pending_cr`."
        machine_check: "e0_check E0-15-fixture-field-existence (ruling R4-01)"
        met: true
        note_vi: >
          Sau đợt FIX5, tám trong chín thư mục fixture có cột được đo. Riêng `boundary/` trả
          `NOT_APPLICABLE_FREEFORM` (0 cột): nó là một bản quét 36 sự kiện cạnh bị cấm, oracle của
          nó là "không hàng nào đổi" chứ không phải một tập hàng, nên đúng là không có
          `rows.<entity>[]` để đo. `collection/` và `recovery/` — hai thư mục từng
          `NOT_APPLICABLE_FREEFORM` ở đợt trước — nay có cột được đo nhờ các fixture mới, nhưng các
          fixture GỐC của chúng vẫn ở dạng văn xuôi và vẫn không được cửa này chạm tới.
          **0 cột kiểm KHÔNG có nghĩa là sạch** — nguyên tắc này giữ nguyên.
      - id: G3-X4
        statement_vi: "Cửa sổ coverage trong fixture báo cáo là nửa mở và nối liền."
        machine_check: "e0_check E0-13-coverage-windows"
        met: true
      - id: G3-X5
        statement_vi: "Mọi policy bắt buộc có giá trị cụ thể; không `TBD`."
        machine_check: "e0_check E0-12-forbidden-strings"
        met: false
        gap_vi: >
          Không có `TBD` nào được khẳng định, NHƯNG bốn giá trị rate-limit của arXiv/OpenAlex vẫn
          là `PLACEHOLDER_KC` với `null` (REQ-A6 vẫn `KC`), và PC05 tự ghi rằng research connector
          **không được** coi là `CONTRACT_READY` cho tới khi chúng được điền. Giới hạn định dạng
          Telegram cũng vẫn `KC` (CR-PC07-04) và chặn `CONTRACT_READY` của `telegram/delivery.md §3.4`.
      - id: G3-X6
        statement_vi: "Mỗi màn hình của SRC-SPEC §4 có read model, action map, auth và trạng thái rỗng/lỗi/một phần."
        machine_check: "EV-A1R3-10 (10 màn hình, 41 tham chiếu operation, 0 unknown)"
        met: true
    current_status: PARTIALLY_MET
    evidence_refs: ["EV-PC09-01"]
    blocked_by_open_items:
      - "G3-X5: `research_connector_rate_limit` (REQ-A6 `KC`) và giới hạn định dạng Telegram (CR-PC07-04, `KC`) — đây là hai mục CHẶN CỨNG duy nhất còn lại của G3."
      - "B01, B03, B04, B09, B10, B11, B14, B16, B17 vẫn `PROVISIONAL`."
      - "Chưa có xác minh độc lập trên epoch chứa các bản sửa FIX4/FIX5 (A2 chưa chạy)."
    allows_next_vi: "Tích hợp contract review; soạn task card (PC10)."

  - id: G4
    name_vi: "Auditable baseline — traceability đầy đủ, static check đạt, B liên quan đóng"
    plan_ref: "SRC-PLAN §12 hàng G4"
    owner_package: PC09
    entry_conditions:
      - "G3 ở `PARTIALLY_MET` trở lên; PC00–PC08 đã bàn giao."
    exit_conditions:
      - id: G4-X1
        statement_vi: "Không requirement nào mồ côi trong phạm vi P0 với status XN hoặc UQ."
        machine_check: "e0_check E0-11a-no-orphan"
        met: true
      - id: G4-X2
        statement_vi: "Mỗi invariant có ít nhất một scenario dương và một scenario âm."
        machine_check: "e0_check E0-11b-invariant-polarity (17/17)"
        met: true
      - id: G4-X3
        statement_vi: "Mỗi AC-01..AC-18 có scenario; mỗi mã lỗi có scenario; mọi fixture_refs phân giải được."
        machine_check: "e0_check E0-16-scenario-catalogue"
        met: true
      - id: G4-X4
        statement_vi: "E0 đã chạy THẬT và có manifest; mọi thứ chưa chạy ghi NOT_RUN."
        machine_check: "evidence/index.json validate được với evidence/manifest.schema.json; evidence/runs/E0-*.json tồn tại"
        met: true
      - id: G4-X5
        statement_vi: "Mọi check E0 đạt."
        machine_check: "e0_check exit code == 0"
        met: true
        note_vi: >
          Đợt FIX9: 22/22 check PASS, 0 vi phạm, exit code 0. `E0-10b` nay coi "case
          operation: null thiếu `event_type`" là **violation** chứ không phải note (F-A2R2-04),
          và W2 đã bổ sung `event_type` cho cả sáu case — một quy tắc và cửa kiểm trích nó nay
          nói cùng một điều về cái gì là bắt buộc. Bộ check đi 19 → 20 → 22 qua ba đợt
          (`E0-04b` thêm ở FIX6 theo F-A2R1-01, tách thành `E0-04b`/`E0-04c`/`E0-04d` ở FIX7).
          Mọi FAIL của ba đợt được đóng bằng cách SỬA NỘI DUNG hợp đồng — không lần nào bằng cách
          nới một check. Ba check prose có self-test âm đã chạy (xem evidence/tools/README.md §5b).
      - id: G4-X6
        statement_vi: "B01–B17 được giải hoặc bị chặn có phạm vi rõ; KC có scope và probe gate."
        machine_check: "precode/review.md §5 (bảng rà soát B01–B17) và §6 (ĐX/KC)"
        met: false
        gap_vi: >
          Cả 17 blocker vẫn `OPEN` trong `agent_profile/registry.json` và mọi phương án giải là
          `PROVISIONAL` chờ Owner. Đây là điều kiện DUY NHẤT mà không Worker nào có thể tự đóng.
      - id: G4-X7
        statement_vi: "Mọi finding của audit độc lập đã được xử lý hoặc có disposition."
        machine_check: "precode/review.md §4 (bảng finding A1-R1/R2/R3)"
        met: false
        gap_vi: >
          A2 đã chạy `PKT-A2-R1` trên FC-W4 epoch 4 và kết luận **PC09 FAIL** với 11 finding
          (2 MAJOR, 3 MEDIUM, 4 LOW, 2 INFO). Bản sửa cho cả 11 đã land ở đợt FIX6 nhưng **chưa
          được ai độc lập kiểm**; `PKT-A2-R2` trên epoch 5 là lượt tiếp theo. Người viết bản sửa
          KHÔNG được là người xác minh chính bản sửa đó (protocol §8). F-A1R3-01..05 vẫn
          `FIX_PROPOSED`.
    current_status: PARTIALLY_MET
    evidence_refs: ["EV-PC09-01", "EV-PC09-02", "EV-PC09-03", "EV-PC09-04"]
    note_vi: >
      Bốn trong bảy điều kiện ra nay đạt nhờ đợt FIX5 (G4-X1..X5). Hai điều kiện còn lại KHÔNG
      thuộc thẩm quyền của bất kỳ Worker nào: G4-X6 cần Owner phê chuẩn B01–B17, G4-X7 cần một
      auditor độc lập (A2) chạy trên epoch mới — và người xác minh không được là người viết bản sửa
      (protocol §8).
    blocked_by_open_items:
      - "G4-X6: B01–B17 `OPEN`, chờ Owner phê chuẩn qua `precode/owner-decision-request.md` (24 mục). Đây là điều kiện DUY NHẤT mà không Worker nào gỡ được."
