invalidation_rules:

  - id: INV-01
    trigger_vi: "Sửa `contracts/reporting/time-and-tags.md` — mốc freeze tag, ranh giới coverage, backfill."
    invalidates_vi: "Mọi bằng chứng về report, selection, coverage và Save gắn với kỳ."
    scenarios_stale: [SC05, SC06, SC08, SC09, SC19, SC22, SC37, SC38, SC50]
    gates_downgraded: [G3, G4]
    not_invalidated_vi: "Bằng chứng về ingest, identity và Telegram delivery không bị ảnh hưởng."
    source_ref: "SRC-PLAN §16 gạch đầu dòng 3"

  - id: INV-02
    trigger_vi: "Sửa `contracts/data/identity.md` hoặc quy tắc chuẩn hóa DOI/arXiv."
    invalidates_vi: "Mọi bằng chứng về identity, merge, first-announcement và dedup."
    scenarios_stale: [SC07, SC09, SC23, SC29, SC30, SC50]
    gates_downgraded: [G2, G4]
    not_invalidated_vi: "Bằng chứng về delivery và backup không bị ảnh hưởng."
    source_ref: "SRC-PLAN §16 gạch đầu dòng 3"

  - id: INV-03
    trigger_vi: "Sửa `analysis_key` hoặc `prompt_version` / `schema_version` của một task AI."
    invalidates_vi: >
      Toàn bộ cache analysis: key mới nghĩa là kho cũ không dùng lại được. Đây là một thay đổi
      TỐN TIỀN, không chỉ tốn công chạy lại test (ADR-0008).
    scenarios_stale: [SC06, SC10, SC11, SC16, SC28, SC50]
    gates_downgraded: [G2, G3, G4]
    source_ref: "SRC-PLAN §16 gạch đầu dòng 4"

  - id: INV-04
    trigger_vi: "Đổi provider, model hoặc embedding generation."
    invalidates_vi: >
      Bằng chứng CHẤT LƯỢNG (E4) và bằng chứng hành vi schema chuyển STALE cho tới khi kiểm lại.
      Đổi embedding model buộc tính lại toàn kho (REQ-D48).
    scenarios_stale: [SC10, SC11, SC16, SC24, SC52, SC50]
    gates_downgraded: [G3, G4, G7]
    source_ref: "SRC-PLAN §16 gạch đầu dòng 4"

  - id: INV-05
