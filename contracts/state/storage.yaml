  trạng thái (claim, ACK, publish, dispatch), kênh readiness ĐỘC LẬP DB, cách UI phân biệt last-known state với
  trạng thái mới chưa lưu được, và cổng đối soát sau restore. Quy trình backup/restore chi tiết, RPO/RTO và
