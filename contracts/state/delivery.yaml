# ---------------------------------------------------------------------------
# 7. Invariant sở hữu
# ---------------------------------------------------------------------------
invariants_owned:
  - id: I09
    statement_vi: "Telegram thất bại không làm report biến mất hoặc run đổi sang thất bại thu thập."
    owner_transition: [T-DL-04, T-DL-07, T-DL-08, "forbidden_transitions hàng 3 và 4"]
    positive_oracle_vi: >-
      Ép `TELEGRAM_PERMANENT_FAILURE` và ép `TELEGRAM_SEND_UNCERTAIN`: trong cả hai,
      `report.content_hash` không đổi, `run.outcome` không đổi, app mở được report đầy đủ.
    counterexample_vi: >-
      PHẢI FAIL: một đường code đặt `run.status = failed` khi `delivery.state = failed`. Khi đó AC-15 mất khả
      năng phân biệt và người dùng đọc "đợt thất bại" cho một đợt đã thu thập và phân tích thành công.
  - id: I13
    statement_vi: "(phần delivery) `unknown` hiển thị RIÊNG, không gộp với `sent` hay `failed`."
    owner_transition: [T-DL-04, T-DL-06, "DP-03 precedence"]
    positive_oracle_vi: >-
      `delivery.get_status` trả bốn nhãn phân biệt cho bốn tình huống: đầy đủ đã gửi / một phần chưa rõ /
      thất bại vĩnh viễn / đã hủy vì đổi liên kết. UI render bốn nhãn khác nhau.
    counterexample_vi: >-
      PHẢI FAIL: aggregate hiển thị `sent` trong khi còn một part `unknown` (do lấy trạng thái của part cuối
      cùng thay vì theo precedence của DP-03). Người dùng tin là đã gửi xong trong khi có thể thiếu một phần.
  - id: I15
    statement_vi: "(phần dispatch) Restore không tự gửi lại outbox cũ."
    owner_transition: [T-DL-09, "sender_lease.storage_guard_vi"]
    positive_oracle_vi: "SC27: sau restore, số outbound send trước `backup.reconcile_after_restore` = 0."
    counterexample_vi: >-
      PHẢI FAIL: dispatcher khởi động cùng tiến trình server sau restore và bắt đầu quét outbox. Người nhận
      sẽ nhận lại toàn bộ digest của khoảng thời gian trong snapshot.
