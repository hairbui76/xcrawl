  - SRC-SPEC §12 AC-05, AC-08
requirement_refs: [REQ-AC05, REQ-AC08, REQ-AC09, REQ-AC15, REQ-CTAG, REQ-D23, REQ-D27, REQ-D28, REQ-D29, REQ-D57, REQ-S8.2-09, REQ-S8.3-01, REQ-S10.4-03]
decision_refs: [B01, B04, B14, B17, AMD-B01, AMD-B04, ADR-0004, CR-PC04-08, CR-PC04-09, "R-03 (A1-R1)", "F-A1R2-01", "FIX3 rulings (2026-09-06T19:05Z)"]
invariant_refs: [I05, I06, I07, I12, I13]
