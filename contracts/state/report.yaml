# Research Radar — State machine của report (chỉ status/quality; nội dung là của PC04)
# Ngôn ngữ: prose tiếng Việt, identifier/khóa/enum tiếng Anh (baseline §3).
# Gói: PC03 · Packet: PKT-PC03 · Worker: worker-W4

contract_id: CT-state-report
version: 0.3.0
status: draft
owner_role: workflow contract owner
source_refs:
  - SRC-PLAN §8.2
  - SRC-PLAN §9.2
  - SRC-PLAN §10
  - SRC-PLAN §11 PC03
  - SRC-SPEC §3.5
