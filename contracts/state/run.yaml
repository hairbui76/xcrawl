  - id: T-RUN-23
    plan_row_ref: "bổ sung FIX1 — ruling CR-PC03-02 (đường thoát của `blocked`)"
    from: {status: blocked, phase: any}
    event: owner_declares_unblocked
    operation_id: run.resume
    guard_vi: >-
      Owner gọi `run.resume` từ trạng thái `blocked` và cung cấp `unblock_reason` BẮT BUỘC (chuỗi tự do đã che
