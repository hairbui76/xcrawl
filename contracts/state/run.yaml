fields:
  from_entities_yaml:
    - {name: id, note_vi: "PK, ULID. PC02 cam kết không đổi tên."}
    - {name: owner_id}
    - {name: trigger_type, note_vi: "`scheduled` | `manual` (REQ-D14)."}
    - {name: phase}
    - {name: status}
    - {name: outcome}
    - {name: stop_reason}
    - {name: applied_config, note_vi: "Bất biến sau khi run rời `queued`. Đổi tag giữa lúc chạy KHÔNG đổi giá trị này (REQ-D24)."}
    - {name: created_at}
  added_by_pc03:
    - {name: schedule_occurrence_ids, type: json_array_of_string, nullable: false, constraints: "Danh sách occurrence đã gộp vào run này; rỗng khi trigger_type = manual. Là cơ sở của 'khoảng bao trùm' trong tin Telegram (REQ-D15)."}
    - {name: catch_up_window_from, type: timestamp_utc_ms, nullable: true, constraints: "Mốc sớm nhất trong các occurrence đã gộp; NULL khi không phải run bù."}
    - {name: catch_up_window_to, type: timestamp_utc_ms, nullable: true, constraints: "Mốc muộn nhất; hiển thị dạng khoảng bao trùm."}
    - {name: current_lease_epoch, type: integer, nullable: false, constraints: ">= 0. Bằng 0 khi chưa từng cấp lease. Đơn điệu tăng, không bao giờ giảm."}
    - {name: attempt_count, type: integer, nullable: false, constraints: ">= 0. Số lần run đã rời `queued`; dùng cho waiting_retry budget."}
    - {name: next_attempt_at, type: timestamp_utc_ms, nullable: true, constraints: "NOT NULL khi status = waiting_retry; NULL ở mọi trạng thái khác. Chống vòng lặp nóng (SRC-PLAN §8.1)."}
    - {name: last_error_code, type: string, nullable: true, constraints: "Mã trong contracts/errors.yaml. Metadata hiển thị, KHÔNG phải nguồn sự thật của status."}
    - {name: unblock_condition_vi, type: string, nullable: true, constraints: "NOT NULL khi status = blocked. Câu mô tả điều kiện gỡ chặn cho Owner (SRC-PLAN §8.1)."}
    - {name: alert_intent_id, type: string_ulid, nullable: true, constraints: "FK → outbox_intent.id. UNIQUE trong phạm vi run: tối đa MỘT alert cho một run (REQ-AC04)."}
  coverage_metadata:
    note_vi: >-
      Đây là METADATA RIÊNG, không phải trạng thái. `completed` KHÔNG có nghĩa đã quét đủ toàn bộ X
      (SRC-PLAN §8.1, AMD-B05). Các trường này là nơi duy nhất phát biểu giới hạn bao phủ.
    decision_refs: [B05, AMD-B05]
    fields:
      - {name: observed_window_from, type: timestamp_utc_ms, nullable: true, constraints: "`published_at` nhỏ nhất trong các post đã ingest của run. NULL khi run chưa ingest gì."}
      - {name: observed_window_to, type: timestamp_utc_ms, nullable: true, constraints: "`published_at` lớn nhất. Đây là PHẠM VI DỮ LIỆU ĐÃ QUAN SÁT, không phải cam kết bao phủ (SRC-PLAN §9.2)."}
      - {name: posts_observed_total, type: integer, nullable: false, constraints: ">= 0."}
      - {name: posts_ingested_new, type: integer, nullable: false, constraints: ">= 0. Bằng tổng `ingest_receipt.posts_inserted` của run."}
      - {name: limit_hit, type: boolean, nullable: false, constraints: "true khi chạm `per_run_post_limit` hoặc `per_run_duration_limit`."}
      - {name: limit_kind, type: enum, nullable: true, constraints: "`posts` | `duration` | NULL. NOT NULL khi limit_hit = true (REQ-A7: điều kiện dừng phải rõ)."}
      - {name: cursor_invalidated, type: boolean, nullable: false, constraints: "true khi phải đọc lại theo recovery policy vì con trỏ mất hiệu lực (AMD-B05)."}
      - {name: rate_limited_at, type: timestamp_utc_ms, nullable: true, constraints: "NOT NULL khi `stop_reason = rate_limited`. Mốc server ghi nhận nguồn báo giới hạn nhịp. `x_coverage_note_vi` BẮT BUỘC nhắc mốc này (ruling CR-PC10-02: coverage note dạng \"rate limited at <ts>\")."}
      - {name: x_coverage_note_vi, type: string, nullable: true, constraints: "Câu ghi rõ phần feed KHÔNG quan sát được. Cấm để trống khi limit_hit = true hoặc cursor_invalidated = true."}
  forbidden_vi:
    - "Suy ra coverage của kỳ báo cáo từ các trường ở đây — coverage authoritative là `coverage_window` của PC04 (B04)."
    - "Dùng `last_run` làm mốc lọc dữ liệu (REQ-D12)."
    - "Hiển thị `posts_observed_total` như 'số nghiên cứu mới' (REQ-S8.3-01)."

# ---------------------------------------------------------------------------
# 4. Bảng transition
#    Phủ toàn bộ 14 hàng của SRC-PLAN §8.1 + các hàng bắt buộc của PKT-PC03.
#    Cột: from / event / guard / to / transaction / effects / forbidden / oracle / scenario_refs / error_codes
# ---------------------------------------------------------------------------
transitions:

  - id: T-RUN-01
    plan_row_ref: "SRC-PLAN §8.1 hàng 1"
    from: {status: queued, phase: any}
    event: worker_claim
    operation_id: worker.claim_assignment
    guard_vi: >-
      Claim hợp lệ (token đúng scope `collector_token`) VÀ worker khai đủ capability cho phase VÀ
      `storage.health = healthy` VÀ không có lease `held` nào khác cho job này.
    to: {status: running, phase: "phase cần làm tiếp (mặc định collecting; sau resume là phase đã lưu)"}
    transaction_vi: "Một transaction ghi cùng nhau: `assignment_lease` (state=held, lease_epoch = current+1) + `run.status/phase` + `run.current_lease_epoch`."
    effects_vi:
      - "Cấp lease + epoch; lưu `worker_identity` là owner của assignment."
      - "Trả về checkpoint ĐÃ ACK gần nhất cho worker."
      - "Trả về `applied_config` bất biến (tag chỉ là tham số TÌM KIẾM, không phải bộ lọc — REQ-D24, NC-02)."
    forbidden_vi:
      - "Cấp lease khi `storage.health != healthy` (retry-policy `storage_write_blocked_grace_before_refusing_claims = 0`)."
      - "Cấp lease khi `storage.health = recovery_required` trước reconcile (I15, NC-10)."
      - "Cấp hai lease cho cùng job; cùng `claim_request_id` trả cùng assignment."
      - "Đăng ký capability tự nó cấp lease — lease CHỈ đến từ claim (contracts/ops/deployment.md §7)."
    oracle_vi: >-
      Fake-clock: tới mốc lịch, collector online ⇒ trong ≤ `claim_idle_backoff` trần (45 s) có đúng một hàng
      `assignment_lease` state=held và `run.status = running`. Hai worker claim đồng thời ⇒ đúng một lease.
    scenario_refs: [SC01, SC20]
    error_codes: [UNAUTHORIZED, VALIDATION_ERROR, NOT_FOUND, IDEMPOTENCY_CONFLICT, STALE_LEASE, STORAGE_WRITE_FAILED, RESTORE_UNVERIFIED]
    invariant_refs: [I01, I10, I15]

  - id: T-RUN-02
    plan_row_ref: "SRC-PLAN §8.1 hàng 2"
    from: {status: running, phase: collecting}
    event: stop_point_reached
    operation_id: worker.report_stop
    guard_vi: >-
      `stop_reason = limit_reached` (chạm `per_run_post_limit` HOẶC `per_run_duration_limit`) VÀ mọi lô sẽ dùng
      tiếp đã có `ingest_receipt` (đã ACK).
    to: {status: running, phase: enriching}
    transaction_vi: "Ghi cùng nhau: `run.stop_reason = limit_reached` + `run.limit_hit/limit_kind` + `run.phase = enriching` + đóng collection segment. Checkpoint đã ACK GIỮ NGUYÊN (append-only, không UPDATE)."
    effects_vi:
      - "Ghi `stop_reason = limit_reached` — đây KHÔNG phải lỗi (AMD-B02)."
      - "Ghi `observed_window_from/to`, `posts_observed_total`, `x_coverage_note_vi`."
    forbidden_vi:
      - "Đặt `status = failed` vì chạm giới hạn (REQ-S8.3-02: dừng sớm ≠ thất bại, và ≠ hoàn tất)."
      - "Tiến checkpoint cho lô chưa có receipt (I02)."
      - "Để `x_coverage_note_vi` trống khi `limit_hit = true`."
    oracle_vi: >-
