  tuning_values_vi: >-
    Các con số kỹ thuật thuần túy (lease TTL, heartbeat, backoff, timeout inference, probe storage) vẫn mang
    `status: PROVISIONAL`. Chúng nằm trong phạm vi ủy quyền kỹ thuật, đổi được bằng cấu hình mà không cần
