# 3. Trường của run do PC03 sở hữu
#    ENT-run (contracts/data/entities.yaml) khai owned_by_package: "PC03 (state machine, lease, catch-up)".
#    Các cột dưới là BỔ SUNG additive vào ENT-run; xem CR-PC03-03.
