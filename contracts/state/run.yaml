    oracle_vi: >-
      Run ở `blocked`: chờ 24 giờ ⇒ `status` vẫn `blocked` (không có đường tự động). Gọi `run.resume` thiếu
      `unblock_reason` ⇒ `VALIDATION_ERROR`, không hàng nào đổi. Gọi đủ tham số ⇒ `status='queued'`,
