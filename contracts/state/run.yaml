  - id: T-RUN-24
    plan_row_ref: "bổ sung FIX1 — ruling FIX3 cho CR-PC05-01 (`SOURCE_LAYOUT_CHANGED`)"
    from: {status: running, phase: collecting}
    event: source_layout_changed
    operation_id: worker.report_stop
    guard_vi: >-
      Collector VÀO ĐƯỢC nguồn nhưng KHÔNG bóc được các trường bắt buộc của item (bố cục feed đã đổi).
      Phân biệt với T-RUN-16 (`source_blocked`): ở đây không có chặn truy cập nào — request thành công,
      chỉ nội dung không parse được.
    to: {status: blocked, phase: collecting, stop_reason: source_layout_changed}
    transaction_vi: >-
      Ghi cùng nhau: phần đã bóc đủ trường VẪN COMMIT bình thường qua `ingest.submit_batch` TRƯỚC đó;
      rồi `run.status = blocked` + `run.stop_reason = source_layout_changed` +
      `run.unblock_condition_vi` (NOT NULL, liệt kê TÊN trường thiếu) + `outbox_intent` loại `run_alert`
      (idempotency `run_alert_id + channel` ⇒ TỐI ĐA MỘT alert mỗi run).
    effects_vi:
      - "Tạo ĐÚNG MỘT alert intent cho mỗi run — khác T-RUN-16, vì bố cục đổi cần người CHÚ Ý NGAY để sửa bộ đọc, còn bị chặn thì không ai làm gì được ngay."
      - "Phần dữ liệu đã bóc được và đã ACK giữ nguyên: một lô bóc được 12/40 bài vẫn commit 12 hàng."
      - "`unblock_condition_vi` ghi TÊN trường thiếu để người phát triển biết sửa gì."
    forbidden_vi:
      - "Đoán giá trị cho trường không bóc được (I03 mở rộng cho mọi trường bắt buộc)."
      - "Ingest item với trường rỗng hoặc bịa để 'đủ schema'."
      - "Thử parser thay thế, đổi user-agent, bật 'chế độ tương thích' (SRC-SPEC §2.3)."
      - "Tự retry — bố cục sẽ không tự đổi lại (`retry_class = none`)."
      - "Tạo alert intent thứ hai cho cùng run."
      - "Hiển thị là 'không có nghiên cứu mới' (REQ-S8.3-03, I13)."
    oracle_vi: >-
      Fixture `acceptance/fixtures/collection/a-feed-layout-changed.json`: `COUNT(post)` tăng đúng 12 (không
      phải 40); `run.status='blocked'` và `stop_reason='source_layout_changed'`;
      `COUNT(outbox_intent WHERE kind='run_alert' AND run_id=R) = 1` kể cả khi báo dừng hai lần cùng
      `stop_report_id`; trace mạng sau transition không có request tới X.
    scenario_refs: [SC03, SC15]
    error_codes: [SOURCE_LAYOUT_CHANGED, STALE_LEASE, VALIDATION_ERROR, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    invariant_refs: [I02, I13]

  - id: T-RUN-25
    plan_row_ref: "bổ sung FIX3 — ruling CR-PC10-02 (SRC-SPEC §9.3 'Rate limit / bị chặn → dừng đợt, ghi lý do, không luân chuyển gì để lách'; SRC-PLAN §8.1)"
    from: {status: running, phase: collecting}
    event: source_rate_limited
    operation_id: worker.report_stop
    guard_vi: >-
      Nguồn X báo giới hạn nhịp (429, trang yêu cầu chậm lại) VÀ mọi lô sẽ dùng tiếp đã có `ingest_receipt`
      (đã ACK). Phân biệt với T-RUN-16 (`source_blocked`): ở đây X **có** cho vào, chỉ bảo chậm lại; và với
      T-RUN-24 (`source_layout_changed`): ở đây nội dung vẫn đọc được bình thường.
    to: {status: running, phase: enriching, stop_reason: rate_limited}
    transaction_vi: >-
      Ghi cùng nhau: đóng collection segment + `run.stop_reason = rate_limited` + `run.rate_limited_at` (giờ
      server) + `run.x_coverage_note_vi` (NOT NULL, phải nhắc mốc "rate limited at <ts>") + `run.phase =
      enriching`. Checkpoint đã ACK GIỮ NGUYÊN (append-only, không UPDATE).
    effects_vi:
      - "Đợt thu thập DỪNG tại đây; run **đi tiếp** sang `enriching` rồi `reporting` với phần dữ liệu đã có."
      - "outcome DỰ KIẾN = `partial` — có nội dung, nhưng phạm vi quan sát bị cắt bởi nguồn, không phải bởi ngân sách của ta."
      - "Đợt theo lịch KẾ TIẾP chạy bình thường; không có gì bị khóa lại."
      - "KHÔNG tạo alert intent: đây là tình huống vận hành thường gặp, không cần người xử lý ngay (khác T-RUN-09 và T-RUN-24)."
    forbidden_vi:
      - "Thử lại TRONG cùng đợt sau khi đã báo `rate_limited` (SRC-SPEC §9.3: 'dừng đợt, ghi lý do')."
      - "Luân chuyển account, proxy, IP, user-agent hay bất kỳ hình thức lách giới hạn nào (SRC-SPEC §2.3, REQ-S9.3-02)."
      - "Bỏ qua `retry_after_ms` nguồn trả về nếu vẫn còn lời gọi nào đang bay."
      - "Đặt `status = blocked`: rate limit KHÔNG chặn đợt sau, còn `blocked` thì có (T-RUN-23 đòi Owner gỡ). Nhầm hai cái này làm người dùng phải can thiệp tay cho một tình huống tự hết."
      - "Đặt `status = failed`: có dữ liệu và có báo cáo, nên đây không phải đợt thất bại (REQ-S8.3-03)."
      - "Để `x_coverage_note_vi` trống hoặc không nhắc mốc `rate_limited_at`."
    oracle_vi: >-
      Inject 429 sau N lô đã ACK: `COUNT(post)` bằng đúng số đã ingest trước đó và KHÔNG tăng thêm;
      `run.stop_reason='rate_limited'`, `run.rate_limited_at IS NOT NULL`, `run.x_coverage_note_vi` chứa mốc đó;
      `run.status` đi qua `running/enriching` rồi kết thúc `completed` với `outcome='partial'`;
      `COUNT(outbox_intent WHERE kind='run_alert' AND run_id=R) = 0`;
      số request tới X sau thời điểm chuyển = 0; occurrence lịch kế tiếp VẪN sinh run
      (`COUNT(run WHERE trigger_type='scheduled')` tăng bình thường).
    scenario_refs: [SC03, SC15]
    error_codes: [RATE_LIMITED, STALE_LEASE, VALIDATION_ERROR, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    invariant_refs: [I02, I13]

# ---------------------------------------------------------------------------
# 5. Transition bị cấm (kiểm bằng lint; mỗi hàng có counterexample)
# ---------------------------------------------------------------------------
forbidden_transitions:
  - {from: needs_user, to: running, condition_vi: "không qua `run.resume`", reason_vi: "Resume là hành động riêng trong app; `status`/`run-now` không resume (B10/AMD-B10).", counterexample_vi: "Gửi lệnh Telegram `run-now` khi run `needs_user`: nếu run chuyển `running` thì FAIL.", error_code_if_attempted: UNAUTHORIZED_COMMAND}
  - {from: failed, to: completed, condition_vi: "mọi trường hợp", reason_vi: "Terminal là terminal; chạy lại nghĩa là run mới.", counterexample_vi: "Gọi `report.publish` cho một run `failed`: phải bị từ chối, `COUNT(report)` không tăng.", error_code_if_attempted: CONFLICT}
  - {from: cancelled, to: "bất kỳ", condition_vi: "mọi trường hợp", reason_vi: "Cancel thu hồi lease và chặn publish mới.", counterexample_vi: "`worker.claim_assignment` cho run cancelled: không cấp lease.", error_code_if_attempted: CONFLICT}
  - {from: completed, to: "bất kỳ", condition_vi: "mọi trường hợp", reason_vi: "TSR-01: terminal không phát side effect và không đổi trạng thái.", counterexample_vi: "Delivery `failed` sau đó: `run` KHÔNG được đổi (I09).", error_code_if_attempted: CONFLICT}
  - {from: running, to: blocked, condition_vi: "chỉ vì nguồn báo rate limit", reason_vi: "Ruling CR-PC10-02: rate limit ⇒ đóng segment và ĐI TIẾP với outcome `partial` (T-RUN-25). `blocked` đòi Owner gỡ bằng `run.resume`, biến một tình huống tự hết thành việc phải làm tay.", counterexample_vi: "Inject 429: nếu `run.status` thành `blocked` thì FAIL; phải là `running/enriching` với `stop_reason='rate_limited'`.", error_code_if_attempted: RATE_LIMITED}
  - {from: blocked, to: running, condition_vi: "tự động theo thời gian, hoặc bất kỳ đường nào không phải `run.resume` có `unblock_reason`", reason_vi: "Retry tự động khi bị chặn là bước đầu của việc lách (REQ-S9.3-02). Đường thoát DUY NHẤT là T-RUN-23: owner tuyên bố điều kiện chặn đã hết (CR-PC03-02).", counterexample_vi: "Chờ 24 h với run `blocked`: `status` vẫn `blocked`. Gọi `run.resume` thiếu `unblock_reason`: VALIDATION_ERROR, không hàng nào đổi.", error_code_if_attempted: X_ACCESS_BLOCKED}
  - {from: running, to: completed, condition_vi: "khi chưa có publish commit hoặc chưa xác định outcome empty", reason_vi: "`completed` chỉ đến từ T-RUN-06/07/08.", counterexample_vi: "Đóng run ở phase collecting: `outcome` NULL ⇒ FAIL constraint NOT NULL.", error_code_if_attempted: VALIDATION_ERROR}
  - {from: "bất kỳ", to: "bất kỳ", condition_vi: "bởi một worker mang `lease_epoch` cũ", reason_vi: "I10 — stale writer không commit.", counterexample_vi: "Hai worker claim cùng job; worker epoch cũ gọi `worker.report_stop`: `STALE_LEASE`, `run.status` không đổi.", error_code_if_attempted: STALE_LEASE}
  - {from: "bất kỳ", to: "bất kỳ", condition_vi: "trong khi `storage.health != healthy`", reason_vi: "Không có transition nào được TUYÊN BỐ là đã lưu khi DB không ghi được (SRC-PLAN §8.4).", counterexample_vi: "Disk-full: `run.status` đọc lại từ DB sau khi khôi phục phải bằng giá trị TRƯỚC sự cố.", error_code_if_attempted: STORAGE_WRITE_FAILED}
  - {from: "bất kỳ non-terminal", to: failed, condition_vi: "chỉ vì delivery lỗi", reason_vi: "I09 — Telegram lỗi không làm run thất bại.", counterexample_vi: "Ép Telegram trả lỗi vĩnh viễn: `run.outcome` giữ `complete`, `delivery.state = failed`.", error_code_if_attempted: TELEGRAM_PERMANENT_FAILURE}

# ---------------------------------------------------------------------------
# 6. Lease / claim / heartbeat / epoch (checklist PKT-PC03 mục 2)
# ---------------------------------------------------------------------------
lease_model:
  entity: ENT-assignment-lease
  numbers_ref: "contracts/retry-policy.yaml §budgets (lease_ttl_collector, lease_ttl_analysis, heartbeat_interval_*, heartbeat_grace, lease_expiry_sweep_interval, claim_request_timeout, lease_epoch_rule)"
  rules:
    - id: LM-01
      rule_vi: "Đăng ký capability KHÔNG cấp lease. Lease chỉ đến từ `worker.claim_assignment` / `analysis.claim_task` (contracts/ops/deployment.md §7 bước 6)."
    - id: LM-02
      rule_vi: "Một job có tối đa một lease `held`. `ux_lease_job_epoch` (owner_id, job_id, lease_epoch) chống cấp trùng cùng epoch."
    - id: LM-03
      rule_vi: "`lease_epoch` đơn điệu tăng, tăng đúng 1 mỗi lần cấp hoặc thu hồi có chủ đích. Không bao giờ dùng lại."
    - id: LM-04
      rule_vi: >-
        Mọi mutation đang giữ job phải mang `job_id`, `lease_id`, `lease_epoch` (SRC-PLAN §5.1). Kiểm epoch nằm
        TRƯỚC mọi write trong cùng transaction; epoch cũ ⇒ `STALE_LEASE`, không ghi gì.
    - id: LM-05
      rule_vi: "Lease hết hạn khi `now > expires_at + heartbeat_grace`. Heartbeat thành công gia hạn `expires_at = now + lease_ttl`."
    - id: LM-06
      rule_vi: >-
        Thu hồi lease xảy ra ở: hết hạn (sweep), `run.cancel`, `run.resume`, `worker.release_assignment`,
        `backup.reconcile_after_restore`. Mọi trường hợp đều tăng epoch.
    - id: LM-07
      rule_vi: >-
        Resume LUÔN cấp lease mới khi worker claim lại; không có đường tiếp tục bằng lease cũ (I10, SRC-PLAN §8.1
        hàng 4, AMD-B10).
    - id: LM-08
      rule_vi: >-
        Sau `backup.restore_snapshot`, mọi lease trong snapshot bị coi là STALE bất kể `expires_at`: đồng hồ đã
        nhảy và worker cũ có thể không còn tồn tại. Chỉ `backup.reconcile_after_restore` thu hồi chúng và mở khóa
        claim (I15, NC-10).
  stale_writer_rejection:
    error_codes: [STALE_LEASE, WORKER_LEASE_EXPIRED]
    oracle_vi: >-
      Hai worker claim cùng job: worker epoch nhỏ hơn gọi `ingest.submit_batch` ⇒ `STALE_LEASE`,
      `COUNT(post)` và `COUNT(ingest_receipt)` không đổi, hash file DB không đổi.
    counterexample_for_I10_vi: >-
      COUNTEREXAMPLE (phải FAIL gate): worker giữ lease cũ gọi `analysis.submit_result` và server chấp nhận vì
      "kết quả trông hợp lệ". Khi đó hai kết quả `valid` có thể tồn tại cho cùng analysis key, phá I04 và I10.

# ---------------------------------------------------------------------------
# 7. Lịch, timezone, DST, catch-up (checklist PKT-PC03 mục 3)
# ---------------------------------------------------------------------------
schedule_model:
  decision_refs: [B08, AMD-B08, ADR-0007]
  timezone:
    setting_key: schedule_timezone
    value: "Asia/Ho_Chi_Minh"
    status: "ACCEPTED (OD-20260907-01)"
    owner_confirmation_required: false
    ratified_vi: >-
      Owner XÁC NHẬN `Asia/Ho_Chi_Minh` ngày 2026-09-07 (OD-20260907-01 mục 4). Giá trị này KHÔNG còn là giá
      trị tạm. Hệ quả: `Asia/Ho_Chi_Minh` hiện không có DST, nên hai quy tắc DST-01/DST-02 dưới đây ĐÚNG nhưng
      CHƯA kích hoạt với cấu hình hiện tại — chúng được giữ vì đổi timezone là đổi cấu hình, không phải đổi
      hợp đồng, và một quy tắc DST chỉ viết khi cần sẽ được viết vội.
    rule_vi: >-
      MỘT IANA timezone duy nhất lưu trong `settings`, do Owner xác nhận (AMD-B08 nguyên văn: "Hệ thống lưu một
      IANA timezone duy nhất trong Settings, do Owner xác nhận (giá trị tạm: `Asia/Ho_Chi_Minh`)"). Timezone chỉ
      dùng để DIỄN GIẢI lịch và để HIỂN THỊ. Không dùng giờ của browser, của server hay của máy collector.
    timestamp_rule_vi: >-
      AMD-B08 nguyên văn: "Mọi timestamp bền được lưu ở UTC theo RFC 3339 với độ chính xác mili giây, tie-break
      bằng ingest sequence."
    forbidden_vi:
      - "Lấy timezone theo máy chạy app (D56 nguyên văn đã bị AMD-B08 thay)."
      - "So sánh hai timestamp mà không quy về UTC."
      - "Dùng thời gian của worker làm `discovered_at` (SRC-PLAN §9.1: dùng giờ server chấp nhận lần đầu)."
  slots:
    values_ref: "contracts/retry-policy.yaml §budgets.schedule_slots_default (08:00, 20:00 local — ACCEPTED (OD-20260907-01) mục 20)"
  earliest_run_semantics:
    decision_refs: [REQ-D13]
    rule_vi: >-
      Giờ trong lịch là mốc SỚM NHẤT ĐƯỢC CHẠY, không phải deadline. Một occurrence trở nên "tới hạn" khi
      `now >= resolved_utc_instant` và chưa sinh run. Không có occurrence nào chạy trước `resolved_utc_instant`
      (`schedule_coalescing_window` lookahead = 0).
  occurrence_identity:
    rule_vi: >-
      `schedule_occurrence_id` được suy ra một cách xác định từ `(owner_id, slot_key, nominal_local_date,
      nominal_local_time)` — tức từ GIỜ ĐỊA PHƯƠNG DANH NGHĨA, KHÔNG từ instant UTC đã giải. Nhờ vậy một mốc lịch
      không bao giờ sinh hai occurrence dù DST làm giờ đó lặp lại.
    idempotency_ref: "contracts/ports.yaml job.enqueue_scheduled_run (key = schedule_occurrence_id)"
  dst_rules:
    note_vi: >-
      `Asia/Ho_Chi_Minh` hiện KHÔNG có DST, nên các quy tắc dưới đây chưa kích hoạt với giá trị mặc định. Chúng
      vẫn phải được đóng vì Owner chưa xác nhận timezone (B08) và vì ADR-0007 điểm 5 giao việc này cho PC03.
    rules:
      - id: DST-01
        case_vi: "Giờ địa phương KHÔNG TỒN TẠI (spring-forward gap): ví dụ lịch 02:30 nhưng 02:00→03:00 bị nhảy."
        resolution_vi: "Occurrence chạy tại INSTANT ĐẦU TIÊN >= giờ danh nghĩa, tức thời điểm kết thúc khoảng nhảy (03:00 giờ mới). Không bỏ occurrence."
        rationale_vi: "Bỏ occurrence sẽ tạo một lỗ hổng bao phủ trong ngày đó; chạy muộn một chút không vi phạm D13 vì D13 nói 'sớm nhất được chạy'."
        determinism_vi: "Hàm giải: `resolved_utc = min{ t : local(t) >= nominal_local }`. Một nghiệm duy nhất."
      - id: DST-02
        case_vi: "Giờ địa phương LẶP LẠI (fall-back): ví dụ lịch 01:30 xảy ra hai lần."
        resolution_vi: "Chọn lần XUẤT HIỆN ĐẦU TIÊN (offset TRƯỚC chuyển đổi, tức instant UTC nhỏ hơn). Lần thứ hai KHÔNG phải một occurrence riêng."
        rationale_vi: "Chọn lần đầu là quy tắc duy nhất vừa xác định vừa không sinh thêm một đợt chạy; sinh hai đợt sẽ vi phạm 'một occurrence một run'."
        determinism_vi: "Hàm giải: `resolved_utc = min{ t : local(t) == nominal_local }`."
      - id: DST-03
        case_vi: "Owner đổi `schedule_timezone` trong Settings."
        resolution_vi: >-
          Occurrence ĐÃ SINH RUN giữ nguyên. Occurrence chưa sinh run được tính lại theo timezone mới kể từ thời
          điểm đổi. Lịch KHÔNG tự đổi theo nơi Owner đang ở (ADR-0007 §Hệ quả tiêu cực) — chỉ đổi khi Owner sửa Settings.
        rationale_vi: "Tính lại quá khứ sẽ làm `schedule_occurrence_id` của các run đã tồn tại đổi nghĩa và phá idempotency."
  catch_up:
    decision_refs: [REQ-D15, REQ-D16, REQ-AC02, REQ-S8.2-08]
    rules:
      - id: CU-01
        rule_vi: >-
          Mọi occurrence quá hạn chưa sinh run, có `resolved_utc_instant` trong `schedule_catch_up_lookback_max`
          (7 ngày), được GỘP thành ĐÚNG MỘT run (`job.coalesce_overdue`, idempotency `coalesce_window_id`).
      - id: CU-02
        rule_vi: >-
          Run bù ghi `schedule_occurrence_ids` (danh sách đã gộp), `catch_up_window_from` và
          `catch_up_window_to`. Tin Telegram ghi KHOẢNG BAO TRÙM này (REQ-D15).
      - id: CU-03
        rule_vi: "KHÔNG gửi bù các digest cũ (REQ-D16). Chỉ có một digest cho run bù, nội dung theo coverage mới."
      - id: CU-04
        rule_vi: >-
          Occurrence quá hạn hơn `schedule_catch_up_lookback_max` được đánh `skipped_stale`, KHÔNG gộp, và ghi lại
          để `health.get_readiness` hiển thị. Chúng KHÔNG tạo lỗ hổng coverage vì coverage do sổ
          `coverage_window` quyết định, không do lịch (B04).
      - id: CU-05
        rule_vi: "Nếu đang có một run chưa terminal khi tới hạn, occurrence mới KHÔNG sinh run thứ hai; nó được gộp vào cửa sổ catch-up kế tiếp sau khi run hiện tại kết thúc."
    oracle_vi: >-
      AC-02 / REQ-S8.2-08 (máy tắt từ thứ Hai đến thứ Năm, lịch 08:00 và 20:00): fake-clock cho 6 occurrence quá
      hạn ⇒ `COUNT(run WHERE trigger_type='scheduled' AND created trong cửa sổ) = 1`;
      `len(run.schedule_occurrence_ids) = 6`; `COUNT(outbox_intent WHERE type='report_digest') <= 1`.
    scenario_refs: [SC02, SC34]

# ---------------------------------------------------------------------------
# 8. Checkpoint chỉ trên dữ liệu đã ACK (checklist PKT-PC03 mục 4)
# ---------------------------------------------------------------------------
checkpoint_model:
  entity: ENT-checkpoint
  entity_name: checkpoint
  owner_module: MOD-ingest-service
  decision_refs: [B05, AMD-B05, "R-01 (A1-R1)"]
  invariant_refs: [I02]
  rules:
    - id: CP-01
      decision_refs: ["R-01 (A1-R1)"]
      rule_vi: >-
        ĐƯỜNG CHÍNH: `client_checkpoint_proposal` của một lô được commit TRONG CÙNG transaction với `post` và
        `ingest_receipt` (TXN-ingest-batch của PC02). Không có đường ghi checkpoint riêng lẻ đi TRƯỚC dữ liệu (I02).
        Có ĐÚNG MỘT thực thể checkpoint trong hệ thống: `checkpoint`, do `MOD-ingest-service` sở hữu; MOD-job-service
        chỉ ĐỌC trạng thái checkpoint qua `worker.claim_assignment` hoặc một read port nội bộ, không sở hữu nó
        (ruling R-01/R-03 của Coordinator trên AUDIT_REPORT PKT-A1-R1).
    - id: CP-02
      rule_vi: >-
        Định nghĩa vận hành của "đã ACK": `checkpoint.acked_through_ingest_sequence` — mọi post có
        `ingest_sequence <= giá trị này` đã commit ở server.
    - id: CP-03
      rule_vi: "Dữ liệu đã TẢI nhưng CHƯA ingest KHÔNG phải checkpoint bền (SRC-PLAN §8.1). CAPTCHA giữa lúc đó ⇒ checkpoint giữ giá trị cũ."
    - id: CP-04
      rule_vi: "Checkpoint là append-only (`ux_checkpoint_run_sequence`), không UPDATE. `sequence` lùi bị từ chối."
    - id: CP-05
      rule_vi: >-
        Cursor mất hiệu lực ⇒ `checkpoint.cursor_state = invalidated`, `run.cursor_invalidated = true`, và
        recovery policy cho phép ĐỌC LẠI. Dedup xảy ra ở ingest theo `x_post_id` (AMD-B05).
    - id: CP-06
      rule_vi: >-
        Cam kết của hệ thống là KHÔNG INGEST TRÙNG theo `x_post_id`, KHÔNG phải "không bao giờ đọc lại"
        (AMD-B05 nguyên văn). Oracle là số hàng `post`, KHÔNG phải số request.
    - id: CP-07
      decision_refs: ["R-01 (A1-R1)"]
      rule_vi: >-
        ĐƯỜNG PHỤ: `ingest.commit_checkpoint` VẪN TỒN TẠI nhưng bị giới hạn thành một bước TIẾN CON TRỎ THUẦN
        TÚY, KHÔNG kèm item mới. Nó chỉ dùng cho ba tình huống: trang rỗng, hết feed, và đóng collection segment.
      guard_vi: >-
        Con trỏ được đề xuất CHỈ được tham chiếu tới `ingest_sequence <= acked_through_ingest_sequence` đã commit
        của run đó. Một đề xuất vượt quá mốc ACK ⇒ `VALIDATION_ERROR`, KHÔNG ghi một phần nào.
      transaction_vi: >-
        `TXN-checkpoint-only`: APPEND MỘT HÀNG `checkpoint` MỚI (với `sequence` kế tiếp) cùng một hàng
        `ingest_receipt` mang `receipt_kind = 'checkpoint_only'`, trong MỘT transaction. Commit point là COMMIT
        của transaction đó; ACK chỉ sau commit (I02).
      wording_correction_vi: >-
        SỬA Ở FIX1 (finding F-A1R2-04, cite CR-PC02-12). Câu cũ viết "cập nhật MỘT hàng `checkpoint`" — kế thừa
        nguyên văn cách diễn đạt của ruling R-01 — và như vậy mô tả CHÍNH ĐIỀU mà CP-04 cấm ("append-only,
        không UPDATE") và mà `TXN-checkpoint-only.forbidden_effects` của PC02 liệt kê là bị cấm
        ("UPDATE một hàng `checkpoint` đã tồn tại"). Guard và oracle của CP-07 vốn đã đúng; chỉ câu mô tả
        transaction sai, và đó lại chính là câu một người triển khai sẽ đọc như một chỉ dẫn. Nay CP-04, CP-07
        và `TXN-checkpoint-only` phát biểu cùng một điều: checkpoint là APPEND-ONLY, không có ngoại lệ.
      oracle_vi: >-
        Sau BẤT KỲ chuỗi lời gọi `ingest.commit_checkpoint` nào:
        `checkpoint.acked_through_ingest_sequence <= max(committed ingest_receipt.max_ingest_sequence)` —
        checkpoint KHÔNG BAO GIỜ trỏ vượt quá các post đã bền.
      forbidden_vi:
        - "Dùng `ingest.commit_checkpoint` để nộp item — item chỉ đi qua `ingest.submit_batch`."
        - "Tiến con trỏ tới một `ingest_sequence` chưa có receipt (đây chính là counterexample 2 của I02)."
        - "Ghi một phần rồi mới phát hiện đề xuất vượt mốc — kiểm guard nằm TRƯỚC mọi write."
    - id: CP-08
      decision_refs: ["R-03 (A1-R1)"]
      rule_vi: >-
        Tên thực thể dùng trong file này lấy theo `contracts/data/entities.yaml` (PC02) vì đó là nguồn có thẩm
        quyền về tên: `checkpoint`, `assignment_lease`, `ingest_receipt`, `coverage_window`, `identity_alias`,
        `tag_vector`, `outbox_intent`. Các token cũ của PC01 (`ingest_checkpoint`, `lease`, `coverage_ledger`,
        `vector`, `work_alias`) KHÔNG được dùng ở đây.
  ack_loss_replay:
    error_code: INGEST_ACK_LOST
    procedure_vi: >-
      (1) Client mất ACK ⇒ KHÔNG kết luận gì. (2) Gọi `ingest.get_receipt(assignment_id, batch_idempotency_key)`.
      (3) Có receipt ⇒ dùng nó, không gửi lại. (4) `not_committed` ⇒ gửi lại CÙNG `idempotency_key` + CÙNG
      `payload_hash`. (5) Payload khác ⇒ `IDEMPOTENCY_CONFLICT`, không ghi đè.
    oracle_vi: "Crash sau commit trước ACK rồi replay: `COUNT(post)` không đổi, `receipt_hash` không đổi, `checkpoint.sequence` không tăng."
    scenario_refs: [SC21]
  worker_death_after_external_call:
    rule_vi: >-
      Khi worker chết sau một lời gọi ra ngoài (X hoặc provider AI), hệ thống GIỮ tính không chắc chắn: không ghi
      "đã xảy ra" và cũng không ghi "chưa xảy ra". Với X: không có ingest ⇒ không có post, đọc lại là hợp lệ và
      dedup ở ingest. Với provider AI: attempt vào `unknown_attempt` với `cost_uncertain = true`
      (contracts/state/analysis.yaml).
    forbidden_vi:
      - "Suy ra 'chưa gọi' từ việc không có kết quả."
      - "Tuyên bố chưa phát sinh chi phí (SRC-PLAN §10 AI_ATTEMPT_UNCERTAIN)."
    scenario_refs: [SC28]

# ---------------------------------------------------------------------------
# 9. Failure timeline theo ranh giới commit (checklist PKT-PC03 mục 5)
# ---------------------------------------------------------------------------
failure_timelines:

  - id: FT-INGEST
    boundary_vi: "Ranh giới commit ingest (TXN-ingest-batch)"
    steps:
      - {t: t0, event_vi: "Collector tải xong một trang", durable_rows_vi: "chưa có", crash_yields_vi: "Không có gì; dữ liệu chỉ nằm trong RAM của collector", recovery_vi: "Đọc lại trang; không sinh post trùng vì chưa có post nào"}
      - {t: t1, event_vi: "Collector gửi `ingest.submit_batch` (request_id, idempotency_key, payload_hash, lease_id/epoch)", durable_rows_vi: "chưa có", crash_yields_vi: "Server chưa nhận hoặc chưa commit", recovery_vi: "`ingest.get_receipt` trả `not_committed` ⇒ gửi lại cùng key"}
      - {t: t2, event_vi: "Server BEGIN; kiểm epoch; dedup theo `x_post_id`; ghi `post`, `post_work`, `ingest_receipt`, `checkpoint`", durable_rows_vi: "chưa (chưa COMMIT)", crash_yields_vi: "SQLite rollback; không có hàng nào", recovery_vi: "Như t1"}
      - {t: t3, event_vi: "COMMIT", durable_rows_vi: "post + ingest_receipt + checkpoint (cùng transaction)", crash_yields_vi: "Dữ liệu ĐÃ BỀN nhưng client chưa biết", recovery_vi: "`ingest.get_receipt` trả receipt ⇒ client dùng nó, KHÔNG gửi lại"}
      - {t: t4, event_vi: "Server trả ACK (receipt)", durable_rows_vi: "như t3", crash_yields_vi: "INGEST_ACK_LOST — client không biết", recovery_vi: "Bắt buộc tra receipt trước retry (RP-01)"}
      - {t: t5, event_vi: "Collector tiến con trỏ nội bộ", durable_rows_vi: "như t3", crash_yields_vi: "Collector quên đã tới đâu", recovery_vi: "Claim lại; server trả `checkpoint.acked_through_ingest_sequence` làm nguồn sự thật"}
    invariant_refs: [I02]
    forbidden_vi: ["Tiến checkpoint ở t2 hoặc bất kỳ điểm nào trước COMMIT."]
    scenario_refs: [SC21]

  - id: FT-CHECKPOINT-ONLY
    boundary_vi: "Ranh giới TXN-checkpoint-only (tiến con trỏ thuần túy qua `ingest.commit_checkpoint`)"
    decision_refs: ["R-01 (A1-R1)"]
    steps:
      - {t: t0, event_vi: "Collector gặp trang rỗng / hết feed / đóng segment; con trỏ mới không kèm item nào", durable_rows_vi: "checkpoint(seq=N) hiện có", crash_yields_vi: "Không có gì; con trỏ cũ vẫn đúng", recovery_vi: "Claim lại; server trả checkpoint N"}
      - {t: t1, event_vi: "`ingest.commit_checkpoint(lease_id/epoch, checkpoint_seq=N+1, cursor)` được gửi", durable_rows_vi: "vẫn checkpoint(seq=N)", crash_yields_vi: "Server chưa nhận", recovery_vi: "Gửi lại cùng `assignment_id + checkpoint_seq` ⇒ idempotent"}
      - {t: t2, event_vi: "GUARD: kiểm `proposed cursor` chỉ tham chiếu `ingest_sequence <= acked_through_ingest_sequence` đã commit", durable_rows_vi: "chưa ghi gì", crash_yields_vi: "Không có write một phần", recovery_vi: "Đề xuất vượt mốc ACK ⇒ `VALIDATION_ERROR`, KHÔNG ghi; collector phải nộp lô qua `ingest.submit_batch` trước"}
      - {t: t3, event_vi: "COMMIT: cập nhật MỘT hàng `checkpoint` + `ingest_receipt` tương ứng", durable_rows_vi: "checkpoint(seq=N+1) + receipt", crash_yields_vi: "Rollback toàn bộ hoặc bền toàn bộ", recovery_vi: "Cùng seq + cùng payload trả bản đã ghi; seq lùi bị từ chối"}
      - {t: t4, event_vi: "ACK", durable_rows_vi: "như t3", crash_yields_vi: "Client không biết; nhưng con trỏ chỉ tiến tới mốc đã ACK nên đọc lại là an toàn", recovery_vi: "Gọi lại cùng seq; dedup ở ingest theo `x_post_id` (AMD-B05)"}
    invariant_refs: [I02]
    oracle_vi: >-
      Sau BẤT KỲ chuỗi `ingest.commit_checkpoint` nào:
      `checkpoint.acked_through_ingest_sequence <= max(committed ingest_receipt.max_ingest_sequence)`.
      Negative: gửi một đề xuất trỏ tới `ingest_sequence` chưa có receipt ⇒ `VALIDATION_ERROR` và hash file DB không đổi.
    forbidden_vi:
      - "Nộp item qua đường này (chỉ `ingest.submit_batch` mới nhận item)."
      - "Tiến con trỏ vượt mốc ACK — đây chính là counterexample 2 của I02."
      - "Ghi một phần trước khi guard chạy."
    scenario_refs: [SC21]

  - id: FT-CHECKPOINT-CAPTCHA
    boundary_vi: "CAPTCHA xuất hiện giữa lúc đã tải nhưng chưa ingest"
    steps:
      - {t: t0, event_vi: "Batch N đã ACK", durable_rows_vi: "checkpoint(seq=N)", crash_yields_vi: "—", recovery_vi: "—"}
      - {t: t1, event_vi: "Collector tải batch N+1 xong, CHƯA gửi", durable_rows_vi: "vẫn checkpoint(seq=N)", crash_yields_vi: "Mất batch N+1 trong RAM", recovery_vi: "Đọc lại từ cursor của checkpoint N"}
      - {t: t2, event_vi: "X trả CAPTCHA", durable_rows_vi: "vẫn checkpoint(seq=N)", crash_yields_vi: "—", recovery_vi: "—"}
      - {t: t3, event_vi: "`worker.report_stop(challenge_required)` COMMIT", durable_rows_vi: "run.status=needs_user + ĐÚNG MỘT outbox_intent(run_alert)", crash_yields_vi: "Nếu crash trước COMMIT: run vẫn `running`, lease sẽ hết hạn ⇒ T-RUN-14 đưa về `queued`, và lần collect kế tiếp lại gặp CAPTCHA ⇒ tạo alert khi đó", recovery_vi: "Idempotency `assignment_id + stop_report_id` ⇒ báo lại không tạo alert thứ hai"}
      - {t: t4, event_vi: "Owner xử lý challenge, bấm resume", durable_rows_vi: "run.status=queued, epoch+1", crash_yields_vi: "Nếu crash sau khi ghi queued trước khi trả response: idempotent theo request_id", recovery_vi: "Gọi lại `run.resume` cùng request_id ⇒ không cấp hai lease"}
    invariant_refs: [I02, I10, I13]
    forbidden_vi: ["Gọi batch N+1 (đã tải, chưa ingest) là checkpoint bền."]
    scenario_refs: [SC04]

  - id: FT-ANALYSIS-ACCEPT
    boundary_vi: "Ranh giới chấp nhận kết quả phân tích (TXN-analysis-accept)"
    steps:
      - {t: t0, event_vi: "`analysis.claim_task` cấp lease; ghi `analysis_attempt(started_at)`", durable_rows_vi: "analysis_attempt(outcome chưa xác định)", crash_yields_vi: "Attempt treo; lease hết hạn ⇒ `cancelled_stale_lease`", recovery_vi: "Task về `pending`; attempt cũ giữ làm bằng chứng"}
      - {t: t1, event_vi: "Adapter gọi provider", durable_rows_vi: "như t0", crash_yields_vi: "KHÔNG BIẾT model đã chạy chưa ⇒ `unknown_attempt`, `cost_uncertain = true`", recovery_vi: "`analysis.report_attempt_unknown`; tự chạy lại tối đa 1 lần (retry-policy)"}
      - {t: t2, event_vi: "Provider trả output; adapter bóc JSON", durable_rows_vi: "như t0", crash_yields_vi: "Model ĐÃ chạy, đã tốn phí, kết quả mất ⇒ `unknown_attempt`", recovery_vi: "Như t1; KHÔNG tuyên bố chưa tốn phí"}
      - {t: t3, event_vi: "`analysis.submit_result`: kiểm schema + semantic (PC06)", durable_rows_vi: "như t0", crash_yields_vi: "Chưa commit ⇒ không có hàng `analysis`", recovery_vi: "Retry theo `analysis_attempts_per_item`"}
      - {t: t4, event_vi: "COMMIT: `analysis(status=valid)` + `analysis_attempt(outcome=accepted)` cùng transaction", durable_rows_vi: "analysis + attempt", crash_yields_vi: "Đã bền; ACK có thể mất", recovery_vi: "Nộp lại cùng `analysis_key + attempt_id` ⇒ idempotent; payload khác ⇒ IDEMPOTENCY_CONFLICT"}
    invariant_refs: [I04, I14]
    forbidden_vi: ["Biến một `analysis_attempt` thành kết quả (I16 của PC02).", "Ghi usage = 0 khi unknown (I14)."]
    scenario_refs: [SC28]

  - id: FT-PUBLISH
    boundary_vi: "Ranh giới commit publish (CAS)"
    steps:
      - {t: t0, event_vi: "`report.build`: chọn item, tính hướng nổi", durable_rows_vi: "report(status=building)", crash_yields_vi: "Bản build treo ở `building`", recovery_vi: "Quá `report_build_stale_after` ⇒ `aborted`; rebuild với build_id MỚI; backfill KHÔNG bị tiêu thụ"}
      - {t: t1, event_vi: "Đọc predecessor coverage, tag_config_version, embedding generation", durable_rows_vi: "như t0", crash_yields_vi: "Như t0", recovery_vi: "Như t0"}
      - {t: t2, event_vi: "BEGIN; CAS trên `coverage_window.predecessor_window_id`; kiểm tag/model version", durable_rows_vi: "chưa", crash_yields_vi: "Rollback; không có coverage mới", recovery_vi: "Đọc lại rồi thử lại (`cas_conflict_retries`)"}
      - {t: t3, event_vi: "Ghi report + report_item + first-announcement + coverage_window + backfill consumption + tag_config_version + outbox_intent; COMMIT", durable_rows_vi: "TẤT CẢ các hàng trên, cùng một transaction", crash_yields_vi: "Rollback toàn bộ hoặc bền toàn bộ — không có trạng thái giữa", recovery_vi: "Publish lại cùng `report_build_id` trả report đã publish"}
      - {t: t4, event_vi: "Dispatcher đọc outbox và gửi", durable_rows_vi: "như t3", crash_yields_vi: "Digest chưa gửi", recovery_vi: "Outbox còn nguyên; dispatcher thử lại theo `telegram_send_attempts`. Report KHÔNG bị dựng lại"}
    invariant_refs: [I05, I06, I09]
    forbidden_vi: ["Gọi mạng bên trong transaction (SRC-PLAN §5.1).", "Tiêu thụ backfill trước COMMIT."]
    scenario_refs: [SC08, SC19, SC22]

  - id: FT-SEND
    boundary_vi: "Ranh giới gửi Telegram"
    steps:
      - {t: t0, event_vi: "Dispatcher lấy intent; kiểm `storage.health != recovery_required`", durable_rows_vi: "outbox_intent(pending)", crash_yields_vi: "Chưa gửi", recovery_vi: "Thử lại"}
      - {t: t1, event_vi: "COMMIT `delivery_part` attempt (attempt_seq) — TRƯỚC network call", durable_rows_vi: "delivery_part + attempt", crash_yields_vi: "Biết đã ĐỊNH gửi nhưng chưa gọi", recovery_vi: "Attempt tồn tại mà không có receipt ⇒ trạng thái `unknown` nếu không phân biệt được; xem delivery.yaml"}
      - {t: t2, event_vi: "Gọi `sendMessage`", durable_rows_vi: "như t1", crash_yields_vi: "KHÔNG BIẾT đã gửi ⇒ `unknown`", recovery_vi: "KHÔNG tự gửi lại; `delivery.decide_unknown` của Operator"}
      - {t: t3, event_vi: "Nhận message_id", durable_rows_vi: "như t1", crash_yields_vi: "Đã gửi nhưng chưa ghi receipt ⇒ `unknown`", recovery_vi: "Như t2"}
      - {t: t4, event_vi: "COMMIT receipt", durable_rows_vi: "delivery_part(state=sent, provider_message_id)", crash_yields_vi: "Đã bền", recovery_vi: "Retry sau đó CHỈ trả receipt, không gửi lần hai"}
    invariant_refs: [I09, I13]
    forbidden_vi: ["Gọi mạng trước khi commit attempt.", "Gửi lại một part `unknown`.", "Đổi `run` vì kết quả gửi."]
    scenario_refs: [SC14]

# ---------------------------------------------------------------------------
# 10. Invariant: owner transition + counterexample (yêu cầu PKT-PC03 §Invariants)
# ---------------------------------------------------------------------------
invariants_owned:
  - id: I02
    statement_vi: "Receipt ingest chỉ ACK sau commit; checkpoint không đi trước dữ liệu bền."
    owner_transition: [T-RUN-02, T-RUN-13, T-RUN-19, "CP-01", "FT-INGEST t3/t4"]
    positive_oracle_vi: "Replay cùng idempotency_key: `COUNT(post)` và `receipt_hash` không đổi (fixture `f-ingest-replay-idempotent.json`)."
    counterexample_vi: >-
      PHẢI FAIL: server ghi `checkpoint(seq=N+1)` sau khi nhận batch nhưng TRƯỚC COMMIT của các hàng `post`.
      Crash tại đó ⇒ checkpoint chỉ tới N+1 trong khi post chỉ tới N ⇒ khi resume, các post của batch N+1 bị bỏ
      qua vĩnh viễn. Gate fail nếu quan sát được `checkpoint.acked_through_ingest_sequence` >
      `max(post.ingest_sequence)`.
  - id: I09
    statement_vi: "Telegram thất bại không làm report biến mất hoặc run đổi sang thất bại thu thập."
    owner_transition: [T-RUN-06, T-RUN-07, T-RUN-17c, "forbidden_transitions hàng cuối", "FT-SEND"]
    positive_oracle_vi: "Ép Telegram `TELEGRAM_PERMANENT_FAILURE`: `run.outcome` giữ `complete`, `report.content_hash` không đổi, app mở được report."
    counterexample_vi: >-
      PHẢI FAIL: một hàng transition đưa `run.status` sang `failed` khi `delivery.state = failed`. Khi đó
      REQ-AC15 không phân biệt được "đợt thất bại vì nguồn" với "gửi Telegram lỗi", và người dùng đọc thành
      "không có nghiên cứu mới".
  - id: I10
    statement_vi: "CAPTCHA không tự retry/resume; worker stale/cancelled không commit kết quả mới."
    owner_transition: [T-RUN-09, T-RUN-10, T-RUN-11, T-RUN-14, T-RUN-17b, "LM-04", "LM-07"]
    positive_oracle_vi: "Sau `needs_user`: request thu thập mới = 0; sau cancel/hết hạn: lời gọi của worker cũ trả `STALE_LEASE` và số hàng không đổi."
    counterexample_vi: >-
      PHẢI FAIL: `run-now` từ Telegram đưa run từ `needs_user` sang `queued` rồi worker claim và collect tiếp
      trong khi challenge vẫn còn. Hoặc: worker giữ lease epoch cũ gọi `analysis.submit_result` và server ghi
      hàng `analysis` thứ hai cho cùng key.
  - id: I13
    statement_vi: "(phần state) Incomplete, empty, failed và unknown được hiển thị riêng; không gọi thiếu dữ liệu là không có nghiên cứu."
    owner_transition: [T-RUN-07, T-RUN-08, T-RUN-16, T-RUN-18, T-RUN-19, "legacy_enum_mapping.ui_three_states_vi"]
    positive_oracle_vi: >-
      Ba run của REQ-AC15 cho ba bộ ba `(status, outcome, stop_reason)` PHÂN BIỆT: `(completed, empty, null)`,
      `(completed, partial|complete, limit_reached)`, `(failed, failed, *)`. Thêm `unknown` của delivery là chiều
      thứ tư, độc lập.
    counterexample_vi: >-
      PHẢI FAIL: read model gộp `outcome = empty` và `status = failed` vào một nhãn "không có nội dung", hoặc
      hiển thị `delivery.state = unknown` thành `sent`/`failed` (SRC-SPEC §8.3, REQ-S8.3-01..03).
  - id: I15
    statement_vi: "(phần dispatch lock) Restore không tự chạy lại job side effect."
    owner_transition: [T-RUN-01, "LM-08"]
    positive_oracle_vi: >-
      Sau `backup.restore_snapshot`: `worker.claim_assignment` trả `RESTORE_UNVERIFIED`; không lease nào được
      cấp; số outbound send = 0 cho tới `backup.reconcile_after_restore`.
    counterexample_vi: >-
      PHẢI FAIL: sau restore, sweep lease thấy các lease trong snapshot đã hết hạn nên tự đưa run về `queued`,
      worker claim và chạy lại một đợt collect + publish — sinh coverage window trùng và outbox mới. Guard bắt
      buộc là `storage.health != recovery_required` ở T-RUN-01.

# ---------------------------------------------------------------------------
# 11. Scenario do PC03 định nghĩa thêm (SC33+; SC01–SC28 đã có ở SRC-PLAN §13)
# ---------------------------------------------------------------------------
scenario_definitions:
  - {id: SC33, title_vi: "Run-now trong khi đang có run active", input_vi: "Một run `running`; bấm 'chạy ngay' 5 lần trong 10 s với request_id khác nhau", expected_state_vi: "Đúng một run non-terminal; mỗi response trả cùng run_id", durable_rows_vi: "Không hàng `run` mới", forbidden_effects_vi: "Tạo run thứ hai; resume một run needs_user", oracle_vi: "COUNT(run WHERE status NOT IN terminal) = 1"}
  - {id: SC34, title_vi: "Ranh giới DST và occurrence lịch", input_vi: "Fake-clock ở một timezone có DST; lịch đặt vào giờ bị nhảy (DST-01) và giờ lặp (DST-02)", expected_state_vi: "DST-01 sinh đúng 1 occurrence chạy tại instant kết thúc khoảng nhảy; DST-02 sinh đúng 1 occurrence tại lần xuất hiện đầu", durable_rows_vi: "Một hàng run cho mỗi occurrence", forbidden_effects_vi: "Bỏ occurrence; sinh hai run cho giờ lặp", oracle_vi: "COUNT(run) theo bảng đã chốt; schedule_occurrence_id duy nhất"}
  - {id: SC35, title_vi: "Cancel từ mỗi trạng thái non-terminal", input_vi: "Năm run ở queued / running / waiting_retry / needs_user / blocked; gọi run.cancel cho từng cái", expected_state_vi: "Cả năm về (cancelled, cancelled); lease bị thu hồi; dữ liệu commit giữ nguyên", durable_rows_vi: "run.status/outcome; assignment_lease.state=revoked", forbidden_effects_vi: "Xóa post/analysis; thu hồi một delivery đã sent", oracle_vi: "COUNT(post) trước/sau bằng nhau; publish bị từ chối"}
  - {id: SC36, title_vi: "Storage write_blocked giữa run rồi hồi phục", input_vi: "Disk-full injection trong phase collecting; dọn ổ sau 5 phút", expected_state_vi: "Không ACK; readiness đỏ; liveness up; sau 3 probe thành công, run tiếp từ checkpoint cũ", durable_rows_vi: "Không hàng mới trong lúc write_blocked", forbidden_effects_vi: "Tuyên bố đã persist lỗi; cấp assignment mới", oracle_vi: "hash file DB không đổi trong cửa sổ; acked_through_ingest_sequence không đổi"}
