      `unblock_reason` của owner + thu hồi lease cũ + `run.current_lease_epoch += 1`.
    effects_vi:
      - "Giữ checkpoint đã ACK; run tiếp từ đó (giống T-RUN-10)."
      - "Lease MỚI chỉ được cấp khi worker claim lại (I10); không tiếp tục bằng lease cũ."
      - "`unblock_reason` là BẢN GHI CÓ CHỦ ĐÍCH của con người: nó phân biệt 'owner đã kiểm và thấy hết chặn' với 'hệ thống tự thử lại'."
    forbidden_vi:
      - "Tự chuyển `blocked` → `queued` theo thời gian hoặc theo một probe tự động (retry-policy §never_retry)."
      - "Chấp nhận `run.resume` từ `blocked` mà thiếu `unblock_reason`."
      - "Đổi account/proxy như một cách 'gỡ chặn' (REQ-S9.3-02, SRC-SPEC §2.3)."
