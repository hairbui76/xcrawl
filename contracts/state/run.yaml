# 1. Enum (SRC-PLAN §8.1, AMD-B02 — dùng nguyên văn)
# ---------------------------------------------------------------------------
enums:
  phase:
    values: [collecting, enriching, analyzing, reporting]
    note_vi: "`phase` chỉ có nghĩa khi `status ∈ {running, waiting_retry, needs_user, blocked}`; ở trạng thái terminal nó là phase cuối cùng đã đạt (chỉ để hiển thị)."
  status:
    values: [queued, running, waiting_retry, needs_user, blocked, completed, failed, cancelled]
  outcome:
    values: [complete, partial, empty, failed, cancelled]
    note_vi: "NULL khi run chưa kết thúc (ENT-run.outcome nullable). NOT NULL với mọi trạng thái terminal."
  stop_reason:
    values: [limit_reached, captcha, session_expired, source_blocked, storage_unavailable, worker_lost, source_layout_changed, rate_limited]
    note_vi: >-
      Nullable. `stop_reason` là LÝ DO DỪNG, độc lập với `status` và `outcome` (AMD-B02): `completed` +
      `limit_reached` là tổ hợp hợp lệ và phổ biến (AC-03 đọc lại).
  trigger_type:
    values: [scheduled, manual]
    source_refs: [REQ-D14]

initial_state: {status: queued, phase: collecting, outcome: null, stop_reason: null}
terminal_states: [completed, failed, cancelled]
non_terminal_states: [queued, running, waiting_retry, needs_user, blocked]

terminal_state_rule:
  id: TSR-01
  statement_vi: >-
    Không một trạng thái terminal nào phát sinh side effect. Từ `completed`, `failed`, `cancelled` KHÔNG có hàng
    transition đi ra, không gọi Chrome, không gọi provider AI, không gửi Telegram, không tiến coverage.
  clarification_vi: >-
    Delivery của một report đã publish tiếp tục chạy SAU KHI run đã `completed` — nhưng đó là vòng đời khác
    (contracts/state/delivery.yaml, I09), do outbox intent đã COMMIT trong transaction publish thúc đẩy, chứ
    không phải do run terminal "làm" gì. Chuyển trạng thái delivery không bao giờ ghi vào bảng `run`.
  retry_note_vi: "Muốn chạy lại: tạo một RUN MỚI (run.run_now hoặc occurrence lịch kế tiếp). Không có đường quay lại từ terminal."
  oracle_vi: >-
    Sau khi run đạt terminal, đếm: outbound call tới X = 0, outbound call tới provider AI cho run đó = 0, số hàng
    `coverage_window` không tăng, số hàng `run` với `id = R` được UPDATE = 0.
  invariant_refs: [I09, I13]

# ---------------------------------------------------------------------------
# 2. Bảng ánh xạ enum cũ → mô hình mới (AMD-B02, nguyên văn 13 hàng)
#    Nguồn: precode/decision-register.md §AMD-B02. Dùng verbatim theo chỉ đạo Coordinator.
# ---------------------------------------------------------------------------
legacy_enum_mapping:
  source_refs: [SRC-SPEC §9.1, SRC-SPEC §5.2, SRC-SPEC §12 AC-03]
  decision_refs: [B02, AMD-B02, ADR-0002]
  amendment_verbatim_from: "precode/decision-register.md §AMD-B02 — Bảng ánh xạ enum cũ sang mới"
  rows:
    - {legacy: queued,             maps_to: "status = queued",                                                                  belongs_to: run}
    - {legacy: collecting,         maps_to: "status = running, phase = collecting",                                             belongs_to: run}
    - {legacy: analyzing,          maps_to: "status = running, phase = analyzing",                                              belongs_to: run}
    - {legacy: reporting,          maps_to: "status = running, phase = reporting",                                              belongs_to: run}
    - {legacy: done,               maps_to: "status = completed, outcome = complete",                                           belongs_to: run}
    - {legacy: needs_user,         maps_to: "status = needs_user",                                                              belongs_to: run}
    - {legacy: stopped_limit,      maps_to: "status = completed, stop_reason = limit_reached, outcome ∈ {partial, complete}",   belongs_to: run}
    - {legacy: failed,             maps_to: "status = failed, outcome = failed",                                                belongs_to: run}
    - {legacy: failed_partial,     maps_to: "status = completed, outcome = partial",                                            belongs_to: run}
    - {legacy: delivered,          maps_to: "delivery.state = sent",                                                           belongs_to: delivery, note_vi: "KHÔNG thuộc run (§5.2 mâu thuẫn §9.1)."}
    - {legacy: delivered_partial,  maps_to: "delivery.state ∈ {failed, unknown} trong khi run giữ `outcome` của chính nó",     belongs_to: delivery, note_vi: "KHÔNG thuộc run."}
    - {legacy: null,               maps_to: "status = blocked",                                                                 belongs_to: run, note_vi: "Trạng thái MỚI: X chặn hoặc thiếu capability bắt buộc."}
    - {legacy: null,               maps_to: "outcome = empty",                                                                  belongs_to: run, note_vi: "Trạng thái MỚI: không có mục phù hợp, không có lỗi thiếu dữ liệu."}
  ac03_reread_vi: >-
    AC-03 đọc lại (AMD-B02, nguyên văn): "run chuyển `status = completed`, `stop_reason = limit_reached`,
    checkpoint và tiến độ được lưu".
  ui_three_states_vi: >-
    Ba trạng thái của SRC-SPEC §8.3 / REQ-AC15 phân biệt bằng BỘ BA (status, outcome, stop_reason), không bằng
    một enum: "không có nội dung phù hợp" = (completed, empty, null); "đợt dừng sớm" = (completed, partial|complete,
    limit_reached) hoặc (needs_user, null, captcha|session_expired); "đợt thất bại" = (failed, failed, *) hoặc
    (blocked, null, source_blocked). Ba bộ ba này khác nhau ⇒ I13 kiểm chứng được bằng assertion, không bằng mắt.

