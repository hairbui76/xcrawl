    filesystem_scope: [thư mục artifact model embedding trên server]
    tool_scope: none

  - id: ACT-research-connector
    name_vi: Research connector (tiến trình nội bộ server)
    principal_type: internal_process
    runs_on: server
    module_refs: [MOD-research-connector]
    auth_scope: internal_only
    allowed_operations: [research.fetch_work_metadata, research.get_connector_health]
    denied_capabilities:
      - id: DC-RC-01
        capability_vi: Điều khiển Chrome hoặc truy cập X
        reason_vi: SRC-PLAN §6.
        expected_error_code: CAPABILITY_DENIED
        denied_case_ref: NC-08
      - id: DC-RC-02
        capability_vi: Nhận chỉ dẫn fetch URL tùy ý từ model hoặc từ nội dung nguồn
        reason_vi: Chỉ nhận DOI/arXiv ID đã chuẩn hóa (SRC-PLAN §6).
        expected_error_code: VALIDATION_ERROR
      - id: DC-RC-03
        capability_vi: Đoán DOI khi thiếu ID, hoặc xóa abstract cũ đã có khi nguồn lỗi
        reason_vi: SRC-PLAN §10 SOURCE_METADATA_UNAVAILABLE.
        expected_error_code: SOURCE_METADATA_UNAVAILABLE
    secret_scope: scoped
    secret_items: ["email/định danh liên hệ mà OpenAlex yêu cầu (A6)"]
    network_scope: [arxiv_api, openalex_api]
    filesystem_scope: none
    tool_scope: none

  - id: ACT-server-domain-service
    name_vi: Các domain service của server (auth, settings, tag, job, ingest, identity, analysis, report, saved, delivery, telegram, secret, health)
    principal_type: internal_process
    runs_on: server
    module_refs: [MOD-auth-service, MOD-settings-service, MOD-tag-service, MOD-job-service, MOD-ingest-service, MOD-identity-service, MOD-analysis-service, MOD-report-service, MOD-saved-service, MOD-delivery-service, MOD-telegram-adapter, MOD-secret-service, MOD-health-service]
    auth_scope: internal_only
    allowed_operations_note_vi: >
      Theo đúng `outbound_operations` của từng module trong contracts/modules.yaml; không có quyền chung "gọi mọi
      port nội bộ".
    denied_capabilities:
      - id: DC-SRV-01
        capability_vi: Chọn bảng/path/query tùy ý ngoài phạm vi `data_owner_of` của mình
        reason_vi: Repository port theo phạm vi bảng (SRC-PLAN §6).
        expected_error_code: CAPABILITY_DENIED
      - id: DC-SRV-02
        capability_vi: Đọc giá trị secret (trừ MOD-secret-service)
        reason_vi: Chỉ secret service đọc được giá trị key ở server (SRC-PLAN §6.1).
        expected_error_code: UNAUTHORIZED
      - id: DC-SRV-03
        capability_vi: Gọi mạng ngoài trong một transaction SQLite dài
        reason_vi: External side effect dùng intent/outbox đã commit và receipt sau đó (SRC-PLAN §5.1).
        expected_error_code: CAPABILITY_DENIED
    secret_scope: none
    secret_exception_vi: "MOD-secret-service có `secret_scope: owner`; MOD-auth-service giữ credential đăng nhập của owner."
    network_scope: []
    network_scope_note_vi: >
      Vẫn **rỗng** sau FIX6 và đó là điều được khẳng định, không phải thiếu sót: không domain service nào chạm
      Internet. Hai đường ra ngoài duy nhất của server nằm ở principal riêng —
      `ACT-delivery-dispatcher` (`telegram_bot_api`) và `ACT-research-connector` (`arxiv_api`, `openalex_api`) —
      cộng đường test provider khi owner bấm, đã khai ở `network_egress` của module `MOD-settings-service`.
      `MOD-delivery-service` và `MOD-telegram-adapter` vẫn nằm trong `module_refs` của actor này cho phần **nghiệp
      vụ trong tiến trình** (ghi intent, đọc trạng thái); phần **gửi ra ngoài** thuộc `ACT-delivery-dispatcher`
      (CR-PC10-03).
    filesystem_scope: [volume chứa file SQLite (chỉ qua repository port của phạm vi mình sở hữu)]
    tool_scope: none

# ---------------------------------------------------------------------------
# Readiness / capability registration cho worker chạy trên máy cá nhân
# (checklist PC01 mục 4). Payload này là body của worker.register_capabilities
# và là nguồn dữ liệu cho worker.get_status + health.get_readiness.
# ---------------------------------------------------------------------------
worker_capability_registration:
  operation: worker.register_capabilities
  transport: http
  direction_vi: Luôn là outbound từ máy cá nhân; server không bao giờ gọi vào (SRC-SPEC §6.4).
  payload_fields:
    - field: worker_instance_id
      type: string
      required: true
      description_vi: Định danh ổn định của một cài đặt worker trên một máy.
    - field: worker_kind
      type: enum
      values: [collector, analysis]
      required: true
      description_vi: Quyết định token nào hợp lệ và assignment nào được giao.
    - field: registration_seq
      type: integer
      required: true
      description_vi: Tăng đơn điệu; bản seq lùi bị bỏ qua để tránh ghi đè bằng trạng thái cũ.
    - field: agent_version
      type: string
      required: true
      description_vi: Phiên bản worker, để đối chiếu compatibility với schema_version của server.
    - field: schema_version
      type: string
      required: true
      description_vi: Phiên bản wire mà worker nói (SRC-PLAN §5.1).
    - field: capabilities.collector_online
      type: boolean
      required: "khi worker_kind = collector"
      description_vi: >
        Worker tự khai đang sẵn sàng nhận việc. Đây **chỉ là lời khai**; trạng thái "online" hiển thị trong app do
        server tính từ heartbeat theo ngưỡng ở contracts/ops/deployment.md.
    - field: capabilities.chrome_profile_ready
      type: boolean
      required: "khi worker_kind = collector"
      description_vi: Profile Chrome **riêng của dự án** (D09) tồn tại, mở được và không bị khóa bởi tiến trình khác.
    - field: capabilities.x_session_state
      type: enum
      values: [ok, challenge_required, expired, unknown]
      required: "khi worker_kind = collector"
      description_vi: >
        Trạng thái phiên X quan sát được lần cuối. `unknown` khi chưa kiểm được — không được quy đổi thành `ok`
        (CAP-P5). `challenge_required`/`expired` là đầu vào để server không giao thêm việc và giữ run ở `needs_user`.
    - field: capabilities.ai_providers
      type: array
      required: "khi worker_kind = analysis"
      item_fields:
        - name: provider_id
          type: string
          values: null
          required: true
          note_vi: Định danh provider đã cấu hình trong Settings.
        - name: auth_family
          type: enum
          values: [api_key, cli_acp]
          required: true
          note_vi: Hai họ provider của D41.
        - name: usable
          type: enum
          values: [usable, unusable, unknown]
          required: true
          note_vi: "`unknown` không được quy đổi thành `usable` (CAP-P5, I13)."
        - name: reason_code
          type: enum
          values: [binary_missing, not_logged_in, auth_expired, policy_unverified, isolation_unverified, probe_timeout, probe_error, disabled_by_owner]
          required: "bắt buộc khi usable != usable"
          note_vi: Cùng tập giá trị với `reason_code_enum` bên dưới.
        - name: max_concurrency
          type: integer
          values: null
          required: true
          note_vi: Đường CLI/ACP bằng 1 theo D43; đường API key do provider tự khai.
        - name: tasks_supported
          type: array
          values: [label, summary, direction_phrasing]
          required: true
          note_vi: >
            Ba task cần AI; embedding không nằm ở đây vì chạy local trên server. Chính tả enum lấy từ
            contracts/data/entities.yaml (`analysis_task.task_type`) theo ruling CR-PC03-05 — trước FIX3 file này
            dùng `open_labeling`/`emerging_direction_phrasing`, không khớp entity.
        - name: isolation_verified
          type: boolean
          values: null
          required: true
          note_vi: "`false` ⇒ adapter của provider đó giữ trạng thái disabled (B13)."
        - name: policy_reviewed
          type: boolean
          values: null
          required: true
          note_vi: Điều khoản của chính nhà cung cấp đã được đọc trước khi bật (A5).
      description_vi: >
        Đây là **nguồn sự thật duy nhất** cho biết đường CLI/ACP có dùng được hay không, vì server không probe được
        CLI trên máy cá nhân. settings.test_provider chỉ thử được đường API key.
    - field: capabilities.embedding_supported
      type: boolean
      required: true
      constant_value: false
      description_vi: >
        Luôn `false`: embedding chạy ở server, chỉ local (D50/B12). Server **từ chối** bản đăng ký khai `true`.
    - field: capabilities.local_storage_writable
      type: boolean
      required: true
      description_vi: Máy cá nhân còn ghi được (log, checkpoint tạm); false ⇒ worker báo stop `local_storage_unavailable`.
    - field: observed_at
      type: string (RFC 3339 UTC, millisecond)
      required: true
      description_vi: >
        Thời điểm worker quan sát. Server **không tin clock worker** cho thứ tự nghiệp vụ; mốc authoritative là thời
        điểm server ghi nhận (SRC-PLAN §9.1).
  reason_code_enum:
    - binary_missing
    - not_logged_in
    - auth_expired
    - policy_unverified
    - isolation_unverified
    - probe_timeout
    - probe_error
    - disabled_by_owner
  server_rules:
    - id: WR-01
      rule_vi: Server chỉ giao assignment cho worker đã đăng ký đủ capability cần cho phase đó.
    - id: WR-02
      rule_vi: >
        `usable: unknown` được đối xử như **không dùng được** khi quyết định giao việc, nhưng hiển thị riêng với
        `unusable` trên giao diện (I13).
    - id: WR-03
      rule_vi: >
        Bản đăng ký khai `embedding_supported: true` bị từ chối bằng VALIDATION_ERROR; đây là guard cho D50/B12.
    - id: WR-04
      rule_vi: >
        Đăng ký **không** cấp lease. Lease chỉ đến từ worker.claim_assignment / analysis.claim_task và mang
        `lease_epoch` riêng (I10).
    - id: WR-05
      rule_vi: >
        Trạng thái "collector online" hiển thị cho người dùng do server tính từ heartbeat gần nhất theo ngưỡng
        PROVISIONAL trong contracts/ops/deployment.md, không lấy trực tiếp từ `capabilities.collector_online`.

zero_api_key_path:
  requirement_ref: REQ-AC16
  statement_vi: >
    Nếu owner cấu hình gắn nhãn, summary **và** diễn đạt khối "hướng đang nổi" chạy hết qua CLI/ACP, hệ thống hoàn
    tất một đợt mà không cần API key nào, vì embedding dùng model local ở server (D51, AC-16).
  capability_conditions:
    - "ai_providers có ít nhất một mục `auth_family: cli_acp` với `usable: usable` cho từng task đang bật."
    - "MOD-embedding-service không có network egress tới provider (FE-22)."
    - "secret.issue_task_credential không được gọi cho task dùng đường CLI (không có key để cấp)."
  note_vi: >
    Nếu khối "hướng đang nổi" được bật mà không có provider nào phục vụ task
    `direction_phrasing`, luồng zero-API-key **chưa** đạt AC-16 cho phần đó — báo `insufficient_capability`,
    không âm thầm bỏ khối (SRC-PLAN §11 PC06).
