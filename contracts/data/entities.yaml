      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: receipt_kind, type: enum, nullable: false, constraints: "`batch_ingest` (từ `ingest.submit_batch`) | `checkpoint_only` (từ `ingest.commit_checkpoint`). Cần thiết để 0 item của một checkpoint-only KHÔNG bị đọc nhầm thành một batch bị từ chối. Xem TXN-checkpoint-only."}
      - {name: idempotency_key, type: string, nullable: false, constraints: "Do client cấp, `^[A-Za-z0-9_.:-]{16,128}$`. UNIQUE(owner_id, idempotency_key). Với `checkpoint_only`, PC01 quy định khóa là `assignment_id + checkpoint_seq` (contracts/ports.yaml → ingest.commit_checkpoint.idempotency)."}
      - {name: request_id, type: string, nullable: false, constraints: "ID của lần gọi tạo receipt; replay có request_id khác nhưng receipt không đổi."}
      - {name: payload_hash, type: hash_sha256, nullable: false, constraints: "sha256 của JCS(payload_core) — xem ingest-batch.schema.json §payload_hash_definition."}
      - {name: schema_version, type: string, nullable: false, constraints: "Phiên bản wire schema của batch."}
      - {name: run_id, type: string_ulid, nullable: false, constraints: "FK → run.id."}
      - {name: job_id, type: string_ulid, nullable: false, constraints: "Assignment đã tạo batch."}
      - {name: lease_id, type: string_ulid, nullable: false, constraints: "FK → assignment_lease.id."}
      - {name: lease_epoch, type: integer, nullable: false, constraints: "Epoch tại lúc commit; lease cũ bị từ chối bằng STALE_LEASE (I10)."}
      - {name: items_received, type: integer, nullable: false, constraints: ">= 0."}
      - {name: posts_inserted, type: integer, nullable: false, constraints: ">= 0. Số hàng post MỚI."}
      - {name: posts_duplicate, type: integer, nullable: false, constraints: ">= 0. Số item trùng `x_post_id` đã có. CHECK (posts_inserted + posts_duplicate + items_rejected = items_received)."}
      - {name: items_rejected, type: integer, nullable: false, constraints: ">= 0. Item không hợp lệ ở mức nghiệp vụ (đã qua schema)."}
      - {name: works_linked, type: integer, nullable: false, constraints: ">= 0. Số cạnh post_work mới."}
      - {name: checkpoint_id, type: string_ulid, nullable: false, constraints: "FK → checkpoint.id được commit CÙNG transaction (I02)."}
      - {name: max_ingest_sequence, type: integer, nullable: false, constraints: "Sequence lớn nhất đã cấp trong batch; là mốc ACK."}
      - {name: committed_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ server tại commit point."}
      - {name: receipt_hash, type: hash_sha256, nullable: false, constraints: "sha256 của JCS({idempotency_key, payload_hash, counts, checkpoint_id, max_ingest_sequence}). Client so sánh để biết replay trả đúng receipt cũ."}
    keys:
      primary: [id]
      unique: [{name: ux_ingest_receipt_owner_idempotency_key, columns: [owner_id, idempotency_key]}]
    immutability: "Bất biến sau commit. Replay đọc, không ghi."

  - name: checkpoint
    entity_id: ENT-checkpoint
    status: specified
    owner_module: MOD-ingest-service
    source_refs: ["SRC-SPEC §9.2", "SRC-PLAN §3 B05", "SRC-PLAN §8.1", "SRC-PLAN §7 I02", "AMD-B05"]
    purpose: "Con trỏ tiến độ **chỉ trên dữ liệu server đã commit**. Không bao giờ đi trước dữ liệu bền (I02)."
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: run_id, type: string_ulid, nullable: false, constraints: "FK → run.id."}
      - {name: phase, type: enum, nullable: false, constraints: "`collecting` | `enriching` | `analyzing` | `reporting`."}
      - {name: sequence, type: integer, nullable: false, constraints: "Đơn điệu tăng trong một run. UNIQUE(owner_id, run_id, sequence). Checkpoint là append-only, không UPDATE."}
      - {name: cursor_token, type: string, nullable: true, constraints: "Con trỏ vị trí do collector đề xuất (`client_checkpoint_proposal`). Server lưu **sau** khi dữ liệu kèm theo đã commit; NULL hợp lệ khi cursor mất hiệu lực."}
      - {name: cursor_state, type: enum, nullable: false, constraints: "`valid` | `invalidated`. `invalidated` cho phép đọc lại theo recovery policy; dedup vẫn ở ingest (AMD-B05)."}
      - {name: acked_through_ingest_sequence, type: integer, nullable: false, constraints: "Mốc ACK: mọi post có ingest_sequence <= giá trị này đã commit. Đây là định nghĩa vận hành của 'đã ACK'."}
      - {name: items_ingested_total, type: integer, nullable: false, constraints: ">= 0, tích lũy trong run."}
      - {name: created_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ server; bằng `committed_at` của receipt cùng transaction."}
      - {name: created_by_receipt_id, type: string_ulid, nullable: true, constraints: "FK → ingest_receipt.id. NULL cho checkpoint không sinh từ ingest (ví dụ ranh giới analysis)."}
    keys:
      primary: [id]
      unique: [{name: ux_checkpoint_run_sequence, columns: [owner_id, run_id, sequence]}]
    invariant_ref: I02
    write_paths:
      statement: >-
        Có ĐÚNG HAI đường hợp lệ để một hàng `checkpoint` trở nên bền, cả hai đều do
        MOD-ingest-service thực hiện và cả hai đều ghi kèm một `ingest_receipt` trong CÙNG
        transaction:
      paths:
        - "`TXN-ingest-batch` (operation `ingest.submit_batch`) — đường chính: checkpoint đi cùng post + receipt."
        - "`TXN-checkpoint-only` (operation `ingest.commit_checkpoint`) — chỉ tiến con trỏ, KHÔNG có item mới."
      forbidden_third_path: >-
        Mọi đường khác đều bị cấm, đặc biệt: ghi checkpoint ở một transaction riêng **trước**
        khi transaction chứa post commit, hoặc ghi checkpoint tham chiếu tới `ingest_sequence`
        chưa commit. Xem invariants.md I02 counterexample 2.
      cross_ref: "Ruling R-01 (FIX-A1R1-rulings.md) giải finding F-A1R1-01."
    coverage_limitation:
      decision_refs: [B05, AMD-B05]
      statement: >-
        Cam kết là **không ingest trùng** theo `x_post_id`, KHÔNG phải "không bao giờ đọc lại".
        Con trỏ feed của X có thể mất hiệu lực; khi đó recovery policy (PC03/PC05) cho phép đọc
        lại và dedup xảy ra ở ingest. Giới hạn bao phủ X (phần feed không quan sát được) phải
        được ghi trong metadata của run, không được ngầm hiểu là "đã quét đủ".

