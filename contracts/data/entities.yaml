    purpose: "Một mục trong báo cáo, trỏ tới target union; phân biệt phát hiện mới và tham chiếu."
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: report_id, type: string_ulid, nullable: false, constraints: "FK → report.id."}
      - {name: target_kind, type: enum, nullable: false, constraints: "`work` | `post`."}
      - {name: target_work_id, type: string_ulid, nullable: true, constraints: "exactly_one_check."}
      - {name: target_post_id, type: string_ulid, nullable: true, constraints: "exactly_one_check."}
      - {name: target_key, type: string, nullable: false, constraints: "Khóa union đã resolve tại thời điểm publish."}
      - {name: item_type, type: enum, nullable: false, constraints: "`new_discovery` | `prior_reference` (REQ-D29, REQ-AC09)."}
      - {name: first_announced_report_id, type: string_ulid, nullable: true, constraints: "FK → report.id. NOT NULL khi item_type = 'prior_reference' — 'đã báo cáo ngày D'."}
      - {name: analysis_id, type: string_ulid, nullable: true, constraints: "FK → analysis.id — bản phân tích **đang được đọc** ở kỳ này. Là nguồn của Saved snapshot."}
      - {name: selection_reason, type: json, nullable: false, constraints: "Tag nào khớp, điểm tương đồng. PC04 khóa hình dạng."}
    keys:
      primary: [id]
      unique: [{name: ux_report_item_report_target, columns: [owner_id, report_id, target_key]}]
    owned_by_package: PC04
    pc02_commitment: "Hàng thuộc report `published` là bất biến; merge identity KHÔNG ghi lại `target_key` của hàng đã publish (xem I17 và merge move-set)."

  - name: emerging_direction
    entity_id: ENT-emerging-direction
    status: declared_only
