  - name: saved_item
    entity_id: ENT-saved-item
    status: specified
    owner_module: MOD-saved-service
    source_refs: ["SRC-SPEC §7.1", "SRC-SPEC §3.6 D38, D55", "SRC-SPEC §12 AC-12, AC-13", "SRC-PLAN §7 I08"]
    purpose: "Con trỏ Saved: owner đã lưu target nào, lúc nào, từ kênh nào."
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: target_kind, type: enum, nullable: false, constraints: "`work` | `post`."}
      - {name: target_work_id, type: string_ulid, nullable: true, constraints: "exactly_one_check."}
      - {name: target_post_id, type: string_ulid, nullable: true, constraints: "exactly_one_check."}
      - {name: target_key, type: string, nullable: false, constraints: "Khóa union; là cột của UNIQUE partial."}
      - {name: state, type: enum, nullable: false, constraints: "`active` | `unsaved` | `superseded_by_merge`. Bỏ lưu KHÔNG xóa hàng và KHÔNG xóa snapshot (SRC-SPEC §7.3)."}
      - {name: saved_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ server, bất biến."}
      - {name: unsaved_at, type: timestamp_utc_ms, nullable: true, constraints: "NOT NULL khi state = 'unsaved'."}
      - {name: save_channel, type: enum, nullable: false, constraints: "`app` | `telegram` (SRC-SPEC §4 màn hình Saved)."}
      - {name: saved_snapshot_id, type: string_ulid, nullable: false, constraints: "FK → saved_snapshot.id. NOT NULL: không tồn tại Saved không có snapshot (REQ-D55)."}
      - {name: source_report_item_id, type: string_ulid, nullable: true, constraints: "FK → report_item.id — mục người dùng đang đọc lúc bấm Save. NULL khi Save từ Work detail ngoài báo cáo."}
      - {name: idempotency_key, type: string, nullable: true, constraints: "Khóa chống trùng của callback Telegram; NULL cho Save trong app. UNIQUE(owner_id, idempotency_key) WHERE NOT NULL."}
      - {name: moved_by_merge_id, type: string_ulid, nullable: true, constraints: "FK → identity_merge_audit.id nếu con trỏ đã được ghi lại sang work thắng."}
    keys:
      primary: [id]
      unique:
        - {name: ux_saved_active_owner_target, columns: [owner_id, target_key], partial: "WHERE state = 'active'"}
        - {name: ux_saved_idempotency, columns: [owner_id, idempotency_key], partial: "WHERE idempotency_key IS NOT NULL"}
    foreign_keys:
      - {columns: [saved_snapshot_id], references: "saved_snapshot(id)", on_delete: RESTRICT}
    concurrency:
      statement: >-
        Save đồng thời từ app và Telegram cho cùng target: cả hai transaction cùng chèn; đúng
        một transaction commit, transaction kia nhận vi phạm UNIQUE và **phải** chuyển thành
        đọc-và-trả-về hàng đã tồn tại, trả `already_saved: true` cho client. Không retry chèn,
        không tạo hàng thứ hai (REQ-AC13, I08).
      error_code: CONFLICT
      error_code_note_vi: >-
        Mã trả về là `CONFLICT` — mã ĐÃ ĐĂNG KÝ trong contracts/errors.yaml (danh mục duy nhất).
        Cấm tạo mã cục bộ chỉ tồn tại trong văn xuôi của một file: baseline §3 buộc mọi mã mới
        phải đăng ký ở errors.yaml, và một mã không đăng ký khiến hai hợp đồng trả lời khác
        nhau cho cùng một câu hỏi (finding F-A2R1-06, ruling F-06).
        `already_saved: true` là TRƯỜNG PHẢN HỒI, không phải mã lỗi — hai thứ khác nhau.
      forbidden: ["Đọc-rồi-ghi không khóa (check-then-insert) — chỉ dựa vào UNIQUE làm trọng tài."]

  - name: saved_snapshot
    entity_id: ENT-saved-snapshot
    status: specified
    owner_module: MOD-saved-service
    source_refs: ["SRC-SPEC §3.6 D55", "SRC-SPEC §7.3", "SRC-SPEC §12 AC-12", "SRC-PLAN §7 I08", "SRC-PLAN §11 PC07"]
    purpose: "Nội dung bất biến chụp lúc Save. Bài gốc bị xóa trên X vẫn đọc được (REQ-AC12)."
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: target_kind, type: enum, nullable: false, constraints: "`work` | `post` — ghi lại **giá trị lúc Save**, không cập nhật sau merge."}
      - {name: target_key_at_save, type: string, nullable: false, constraints: "Khóa union tại thời điểm Save. Bất biến — là bằng chứng lịch sử, không phải con trỏ hiện hành."}
      - {name: analysis_id_at_save, type: string_ulid, nullable: true, constraints: "FK → analysis.id: đúng bản phân tích người dùng đang đọc (PC07). KHÔNG lấy bản mới hơn vừa xuất hiện."}
      - {name: payload, type: json, nullable: false, constraints: "Toàn bộ nội dung đọc được: post text/URL/tác giả, work title/DOI/arXiv, summary, evidence_level, tag khớp. Hình dạng do contracts/schemas/saved-snapshot.schema.json (PC07) khóa."}
      - {name: content_hash, type: hash_sha256, nullable: false, constraints: "sha256 của JCS(payload). Oracle của REQ-AC12 và I08."}
      - {name: created_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ server, bằng `saved_item.saved_at` của lần Save tạo ra nó."}
    keys:
      primary: [id]
    immutability:
      statement: "BẤT BIẾN tuyệt đối sau commit. Không UPDATE, không DELETE, kể cả khi merge identity, kể cả khi post bị xóa trên X, kể cả khi tag bị bỏ."
      oracle: "sha256(JCS(payload)) == content_hash tại mọi thời điểm; số hàng chỉ tăng."
    cross_package_ref: "CR-PC02-03: hình dạng `payload` do PC07 khóa; PC02 chỉ khóa tính bất biến, `content_hash` và quy tắc canonical JSON."
    survives_data_deletion:
      scenario_refs: [SC32]
      decision_refs: [R-04]
      statement: >-
        Thao tác "xóa dữ liệu gốc" cho một target (thao tác thứ hai trong ba thao tác của
        SRC-SPEC §7.3, REQ-S7.3-05) KHÔNG được xóa hoặc sửa `saved_snapshot`: snapshot là lý do
        REQ-D55 tồn tại và là oracle của REQ-AC12. Ledger cũng được giữ.
      oracle: "Sau thao tác xóa dữ liệu gốc của target T: `#saved_snapshot` không đổi và mọi `content_hash` không đổi; `#post`/`#work` của T giảm theo hợp đồng của thao tác đó."
      owned_by_package: "PC01 định nghĩa operation; PC08 định nghĩa quy trình; PC09 sở hữu scenario SC32. PC02 chỉ khóa ràng buộc bất biến ở đây (hook, không phải hợp đồng đầy đủ)."

