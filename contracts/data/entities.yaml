    source_refs: ["SRC-SPEC §7.1", "SRC-SPEC §3.5 D53, D54", "SRC-PLAN §3 B14"]
    purpose: "Khối 'hướng đang nổi' của một kỳ. Thuật toán mật độ vector do PC04 khóa (B14)."
