  - name: coverage_window
    entity_id: ENT-coverage-window
    status: declared_only
    owner_module: MOD-report-service
    source_refs: ["SRC-SPEC §3.5 D27", "SRC-PLAN §3 B04", "SRC-PLAN §9.2", "SRC-PLAN §7 I06"]
    purpose: "Sổ coverage authoritative, ĐỘC LẬP với danh sách report hiển thị (B04)."
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: sequence, type: integer, nullable: false, constraints: "Đơn điệu tăng. UNIQUE(owner_id, sequence)."}
      - {name: window_from, type: timestamp_utc_ms, nullable: false, constraints: "Inclusive."}
      - {name: window_to, type: timestamp_utc_ms, nullable: false, constraints: "EXCLUSIVE. CHECK (window_to > window_from)."}
      - {name: ingest_sequence_from, type: integer, nullable: false, constraints: "Biên trái INCLUSIVE trên trục `post.ingest_sequence`. Nửa mở cùng chiều với biên thời gian."}
      - {name: ingest_sequence_to, type: integer, nullable: false, constraints: "Biên phải EXCLUSIVE. CHECK (ingest_sequence_to >= ingest_sequence_from). Phải NỐI LIỀN với cửa sổ liền trước: `ingest_sequence_from` bằng `coverage_window.ingest_sequence_to` của cửa sổ đó (CR-PC04-01). Lý do tồn tại: biên thời gian một mình không đủ vì hai post cùng `discovered_at` chỉ phân biệt được bằng sequence (SRC-PLAN §9.1 tie-break)."}
      - {name: predecessor_window_id, type: string_ulid, nullable: true, constraints: "FK → coverage_window.id. NULL chỉ cho cửa sổ đầu tiên. Guard CAS: `window_from` bằng `coverage_window.window_to` của cửa sổ liền trước (I06)."}
      - {name: report_id, type: string_ulid, nullable: true, constraints: "FK → report.id. NULL hợp lệ: kỳ rỗng vẫn có coverage record, không có digest (REQ-D57)."}
      - {name: advanced_at, type: timestamp_utc_ms, nullable: false, constraints: "Coverage chỉ tiến tại publish commit (B04)."}
    keys:
      primary: [id]
      unique:
        - {name: ux_coverage_window_owner_sequence, columns: [owner_id, sequence]}
        - {name: ux_coverage_window_predecessor, columns: [owner_id, predecessor_window_id], note: "Chống hai kỳ cùng nối sau một kỳ (CAS thua phải đọc lại, SRC-PLAN §9.2)."}
    contiguity_oracle_vi: >-
      Với mọi cửa sổ có predecessor: `window_from` bằng `coverage_window.window_to` của cửa sổ liền trước VÀ
      `ingest_sequence_from` bằng `coverage_window.ingest_sequence_to` của cửa sổ đó. Hai bất đẳng thức phải cùng
      đúng; chỉ kiểm biên thời gian là chưa đủ (I06).
    owned_by_package: PC04

