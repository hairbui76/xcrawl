      Nguồn đếm cho rate limit của ngoại lệ B09. `contracts/telegram/commands.yaml` đặt ngưỡng
      cho các chuỗi khớp ĐÚNG định dạng mã liên kết nhưng sai mã; trước FIX3 không bảng nào lưu
      bộ đếm đó nên ngưỡng không ép được ở mức dữ liệu (CR-PC07-02 do chính PC07 nêu).
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id (D01)."}
      - {name: chat_id_hash, type: hash_sha256, nullable: false, constraints: "sha256 của chat ID. KHÔNG lưu chat ID thô của chat chưa liên kết: biết chat ID không phải là quyền, và lưu thô biến bảng này thành danh sách người từng nhắn cho bot (REQ-S11.3-03)."}
      - {name: attempted_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ SERVER. Cửa sổ rate limit tính trên cột này."}
      - {name: outcome, type: enum, nullable: false, constraints: "`format_match_code_invalid` | `format_match_code_expired` | `format_match_code_consumed` | `format_match_code_valid` | `rate_limited_not_checked`. Chỉ ghi các lần chuỗi KHỚP ĐỊNH DẠNG; tin không khớp định dạng KHÔNG tạo hàng ở đây (nếu ghi, bảng này thành log mọi tin nhắn của người lạ)."}
      - {name: link_code_id, type: string_ulid, nullable: true, constraints: "FK → telegram_link_code.id khi đối chiếu ra một mã cụ thể; NULL khi không mã nào khớp."}
    keys:
      primary: [id]
      unique: []
      indexes:
        - {name: ix_link_attempt_chat_window, columns: [owner_id, chat_id_hash, attempted_at], note: "Phục vụ đếm trong cửa sổ trượt; KHÔNG phải UNIQUE."}
    rate_limit_rule:
      counter_vi: "Số hàng có cùng `chat_id_hash` và `attempted_at` trong cửa sổ trượt của commands.yaml § linking → rate_limit (PROVISIONAL 5 lần/giờ)."
      over_limit_vi: "Vượt ngưỡng ⇒ tiếp tục IM LẶNG và NGỪNG đối chiếu; ghi hàng `rate_limited_not_checked`. Không bao giờ trả `RATE_LIMITED` cho chat chưa liên kết — im lặng vẫn là im lặng (REQ-S11.3-02)."
    retention:
      value: 30
      unit: days
      status: PROVISIONAL
      decision_ref: CR-PC02-17
      ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
      rule_vi: >-
        Đây là NGOẠI LỆ của quy tắc retention vô thời hạn (REQ-D58): bảng chứa dấu vết của
        người KHÔNG phải owner. Giữ đủ lâu để rate limit và điều tra có tác dụng, rồi xóa.
        Cửa sổ rate limit (giờ) ngắn hơn retention (ngày) rất nhiều, nên xóa không làm hỏng
        phép đếm. Owner chốt số thật.
    forbidden:
      - "Lưu chat ID thô hoặc nội dung tin nhắn của chat chưa liên kết."
      - "Ghi hàng cho tin KHÔNG khớp định dạng mã."
      - "Dùng bảng này để trả lời chat lạ bất cứ điều gì."
    cross_package_ref: "CR-PC02-16 → PC01: thêm `telegram_link_attempt` vào `MOD-telegram-adapter` → `data_owner_of` trong contracts/modules.yaml."

  - name: purge_challenge
    entity_id: ENT-purge-challenge
    status: declared_only
    owner_module: MOD-data-admin-service
    origin: pc01_data_owner_of
    finding_ref: F-A1R1-03
    decision_refs: [R-03, R-04]
    source_refs: ["SRC-SPEC §7.3", "contracts/ports.yaml → data.purge_all", "FIX-A1R1-rulings.md R-04"]
    purpose: >-
      Cụm từ xác nhận do SERVER phát cho thao tác xóa toàn bộ. Người dùng phải gõ đúng cụm từ
      này; client không được tự sinh cụm từ (REQ-S7.3-05 "đòi xác nhận gõ tay").
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id (D01)."}
      - {name: phrase_hash, type: hash_sha256, nullable: false, constraints: "Hash của cụm từ; KHÔNG lưu cụm từ ở dạng thô."}
      - {name: issued_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ server."}
      - {name: expires_at, type: timestamp_utc_ms, nullable: false, constraints: "Ngắn hạn; giá trị do PC08 khóa."}
      - {name: consumed_at, type: timestamp_utc_ms, nullable: true, constraints: "Dùng MỘT lần."}
      - {name: state, type: enum, nullable: false, constraints: "`active` | `consumed` | `expired`."}
    keys:
      primary: [id]
      unique:
        - {name: ux_purge_challenge_active, columns: [owner_id], guarantees: "Tối đa một challenge đang hiệu lực.", does_not_guarantee: "KHÔNG bảo đảm thao tác purge an toàn; chỉ bảo đảm có một bước xác nhận không thể bấm nhầm."}
    partial_index: "WHERE state = 'active'"
    precondition: "Chỉ chạy được khi trạng thái kho là `maintenance` (PC03 `contracts/state/storage.yaml`; đọc qua `storage.get_health`) (R-04); lease bị thu hồi trước."
    owned_by_package: "PC08."

# ---------------------------------------------------------------------------
# 6. Giới hạn có số (mọi giá trị PROVISIONAL đều có decision ref)
# ---------------------------------------------------------------------------
limits:
  ingest_batch_max_items:
    value: 200
    unit: items
    status: ACCEPTED_WORKING_VALUE
    decision_ref: "OD-20260907-01 mục 20 (REQ-OQ05); đo lại sau M0"
    rationale: >-
      Một batch không được lớn hơn giới hạn của cả một đợt; nếu owner đặt giới hạn đợt thấp
      hơn thì giới hạn đợt thắng. Owner đã CHẤP NHẬN 200 làm giá trị làm việc; nó vẫn phụ
      thuộc đo đạc thật ở M0 (REQ-A1), nên trạng thái là `ACCEPTED_WORKING_VALUE` chứ không
      phải `ACCEPTED` tuyệt đối — con số có thể đổi khi có dữ liệu, mà không cần Owner họp lại.
  ingest_item_max_text_bytes:
    value: 65536
    unit: bytes_utf8
    status: PROVISIONAL
    decision_ref: CR-PC02-04
    ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
    rationale: >-
      Đủ cho post dài của X kể cả long-form, còn dưới ngưỡng làm phình transaction SQLite.
      Cần xác nhận lại theo giới hạn thực tế quan sát được ở M0; nếu một post vượt ngưỡng thì
      item bị `items_rejected` với lý do rõ, KHÔNG cắt cụt âm thầm.
  ingest_batch_max_payload_bytes:
    value: 8388608
    unit: bytes
    status: PROVISIONAL
    decision_ref: CR-PC02-04
    ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
    rationale: "8 MiB: một batch vẫn nằm gọn trong bộ nhớ và trong một transaction SQLite ngắn."
  ingest_item_max_media_refs:
    value: 8
    unit: items
    status: PROVISIONAL
    decision_ref: CR-PC02-04
    ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
    rationale: "X cho tối đa 4 ảnh/post ở luồng thường; 8 để dự phòng biến thể mà vẫn chặn payload bất thường."
  ingest_item_max_referenced_links:
    value: 32
    unit: items
    status: PROVISIONAL
    decision_ref: CR-PC02-04
    ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
    rationale: "Đủ cho post liệt kê nhiều link; chặn payload rác."
  ingest_thread_context_max_posts:
    value: 50
    unit: items
    status: PROVISIONAL
    decision_ref: CR-PC02-04
    ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
    rationale: "Thread của chính tác giả (REQ-D31); replies người ngoài không được ingest nên không cần lớn hơn."
  identity_merge_max_moved_rows:
    value: 100000
    unit: rows
    status: PROVISIONAL
    decision_ref: CR-PC02-05
    ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
    rationale: >-
      Ngưỡng an toàn: merge vượt số hàng này bị từ chối và chuyển thành `identity_conflict`
      với `conflict_type = 'canonical_value_mismatch'` để owner xem, vì merge quá lớn nhiều khả
      năng là hệ quả của quy tắc chuẩn hóa sai chứ không phải hai bản ghi cùng công trình.
  saved_snapshot_max_payload_bytes:
    value: 1048576
    unit: bytes
    status: PROVISIONAL
    decision_ref: CR-PC02-04
    ratification_note_vi: "KHÔNG nằm trong buổi phê chuẩn OD-20260907-01 (Owner chỉ được hỏi các OQ default và tham số PC04/PC08). Giữ PROVISIONAL; xem CR-PC02-22."
    rationale: "1 MiB cho một snapshot văn bản là dư; vượt ngưỡng nghĩa là payload đang chứa thứ không nên chụp (media nhị phân)."

# ---------------------------------------------------------------------------
# 7. Bản đồ transaction
# ---------------------------------------------------------------------------
transactions:

  - id: TXN-ingest-batch
    contract_id: CT-txn-ingest
    operation_id: ingest.submit_batch
    source_refs: ["SRC-PLAN §9.1", "SRC-PLAN §5.1", "SRC-SPEC §9.2", "SRC-PLAN §10 INGEST_ACK_LOST"]
    invariant_refs: [I02]
    decision_refs: [B05, AMD-B05]
    performed_by: MOD-ingest-service
    requested_by: MOD-x-collector
    rows_written_together:
      - "`post` — một hàng cho mỗi item chưa tồn tại (`x_post_id` mới), kèm `ingest_sequence` do server cấp."
      - "`work` — hàng mới chỉ khi item mang một canonical identifier chưa có trong `identity_alias`."
      - "`identity_alias` — một hàng cho mỗi identifier mới quan sát được."
      - "`post_work` — cạnh cho mỗi liên kết post→work mới."
      - "`identity_conflict` — hàng mới nếu bằng chứng mâu thuẫn (khi đó KHÔNG tạo work mới và các work liên quan chuyển `quarantined`)."
      - "`checkpoint` — đúng một hàng append-only, `acked_through_ingest_sequence` = sequence lớn nhất vừa cấp."
      - "`ingest_receipt` — đúng một hàng, trỏ `checkpoint_id` của hàng trên."
      - "`post.source_deleted_observed_at` — CẬP NHẬT đơn điệu trên hàng post đã tồn tại khi item mang trường đó và giá trị hiện tại là NULL. KHÔNG có operation riêng để đánh dấu xóa nguồn: quan sát đi qua một trường của item ingest (ruling Coordinator PKT-PC02-FIX1; tên operation từng được cân nhắc nằm trong handoff, không nằm trong hợp đồng)."
    commit_point: >-
      Một transaction SQLite duy nhất. ACK (HTTP response) chỉ được gửi SAU khi COMMIT trả về
      thành công. Không có ACK nào phát ra từ giữa transaction (I02).
    external_observer:
      before_commit: >-
        Không thấy gì: không post mới, không receipt, `checkpoint` mới nhất vẫn là hàng cũ,
        `MAX(ingest_sequence)` không đổi. Không có event/webhook nào được phát.
      after_commit: >-
        Thấy đồng thời toàn bộ: post mới, cạnh post_work, receipt và checkpoint mới. Không có
        trạng thái trung gian nào trong đó receipt tồn tại mà post chưa tồn tại, hoặc checkpoint
        tiến mà post chưa commit — đó chính là I02.
      never_observable: "Checkpoint đi trước dữ liệu; receipt không có checkpoint; post không có receipt."
    clock_clamp:
      decision_refs: [CR-PC04-03]
      rule_vi: >-
        `discovered_at` = đồng hồ server. NẾU đồng hồ server nhỏ hơn `discovered_at` lớn nhất
        đã commit của owner (NTP kéo lùi, máy ảo khôi phục snapshot), KẸP giá trị về
        `max(discovered_at) + 1 ms` và vẫn cấp `ingest_sequence` kế tiếp.
      why_vi: >-
        `coverage_window` là khoảng nửa mở trên trục thời gian VÀ trục `ingest_sequence`
        (CR-PC04-01). Một lần nhảy lùi đồng hồ sẽ tạo post có `discovered_at` nằm TRƯỚC biên
        trái của cửa sổ đã đóng, khiến nó không bao giờ được chọn vào kỳ nào — mất dữ liệu im
        lặng, đúng thứ mà I06 phải chặn. Kẹp đồng hồ giữ tính đơn điệu mà không cần khóa phân tán.
      oracle_vi: >-
        Với mọi owner: chuỗi `discovered_at` sắp theo `ingest_sequence` là KHÔNG GIẢM. Bơm một
        lần nhảy lùi 5 phút giữa hai batch ⇒ batch sau vẫn có `discovered_at` lớn hơn batch
        trước đúng 1 ms cho item đầu, và `ingest_sequence` tiếp tục tăng.
      forbidden_vi:
        - "Dùng đồng hồ worker (`collected_at`) để thay thế."
        - "Từ chối batch vì đồng hồ lùi — dữ liệu không có lỗi gì."
        - "Kẹp bằng cách ghi đè `discovered_at` của hàng ĐÃ commit."
    idempotency:
      key: "(owner_id, idempotency_key)"
      same_key_same_payload: >-
        Trả receipt đã lưu (đọc-only, KHÔNG mở transaction ghi). `posts_inserted` giữ nguyên giá
        trị của lần commit đầu; không tạo post mới, không tăng checkpoint sequence.
      same_key_different_payload: >-
        `IDEMPOTENCY_CONFLICT`, không ghi gì. So sánh bằng `payload_hash` — hai payload chỉ khác
        `request_id` vẫn cho cùng `payload_hash` vì `payload_hash` tính trên `payload_core`.
      different_key_same_content: >-
        Transaction chạy bình thường; chống trùng ở mức hàng do `ux_post_owner_x_post_id` đảm
        nhiệm: `posts_inserted = 0`, `posts_duplicate = N`, receipt mới được tạo. Đây là hành
        vi đúng, không phải lỗi.
    concurrency:
      guard: "`lease_id` + `lease_epoch` phải là epoch hiện hành của job; epoch cũ → `STALE_LEASE`, transaction rollback, không dữ liệu nào đổi (I10)."
      sequence_allocation: "`ingest_sequence` cấp trong transaction; hai batch song song không thể nhận cùng số vì UNIQUE(owner_id, ingest_sequence)."
    failure_timeline:
      - {point: "Trước BEGIN (validate schema/lease thất bại)", server_state: "không đổi", client_sees: "lỗi 4xx có mã", recovery: "sửa payload hoặc claim lại; không có gì để dọn"}
      - {point: "Sau BEGIN, trước COMMIT (crash/hết ổ)", server_state: "rollback hoàn toàn: 0 post, 0 receipt, 0 checkpoint", client_sees: "timeout hoặc 5xx", recovery: "gửi lại CÙNG idempotency_key; vì không có receipt, transaction chạy lại từ đầu"}
      - {point: "COMMIT thành công, ACK mất trên đường về", server_state: "post + receipt + checkpoint đã bền", client_sees: "không biết kết quả (SRC-PLAN §5.1: timeout ≠ rollback)", recovery: "gửi lại CÙNG idempotency_key → nhận đúng receipt cũ; `posts_inserted` và `checkpoint.sequence` KHÔNG đổi. Đây là oracle của INGEST_ACK_LOST."}
      - {point: "Sau ACK, collector crash", server_state: "không đổi", client_sees: "khởi động lại đọc receipt/checkpoint từ server", recovery: "tiếp từ `acked_through_ingest_sequence`; nếu `cursor_state = 'invalidated'` thì đọc lại theo recovery policy và dedup ở ingest (AMD-B05)"}
    forbidden_effects:
      - "ACK trước COMMIT."
      - "Ghi checkpoint ở một transaction riêng sau ingest."
      - "Cập nhật `discovered_at` của post đã tồn tại khi replay."
      - "Ghi đè `source_deleted_observed_at` đã NOT NULL bằng giá trị mới (trường này đơn điệu)."
      - "Gọi arXiv/OpenAlex hoặc Telegram bên trong transaction (SRC-PLAN §5.1: network không nằm trong transaction SQLite dài)."
      - "Đoán DOI/arXiv từ ảnh chụp trong post (REQ-D33)."

  - id: TXN-identity-merge
    contract_id: CT-txn-identity-merge
    operation_id: identity.merge_works
    source_refs: ["SRC-PLAN §9.1", "SRC-PLAN §3 B06, B15", "SRC-PLAN §7 I03"]
    invariant_refs: [I03, I17]
    decision_refs: [B06, B15]
    performed_by: MOD-identity-service
    requested_by: "MOD-identity-service (tự động khi có bằng chứng liên kết) hoặc MOD-web-ui qua MOD-backend-api (owner_manual)"
    preconditions:
      - "Có `linking_evidence` cụ thể (một identifier chuẩn hóa trỏ tới cả hai work, từ nguồn không phải AI)."
      - "Hai work cùng `owner_id`, cả hai `identity_state = 'active'`."
      - "Không mâu thuẫn canonical: nếu cả hai có `canonical_doi` khác nhau, hoặc `canonical_arxiv_id` khác nhau → KHÔNG merge, tạo `identity_conflict` (B15)."
      - "Tổng số hàng phải chuyển <= mục `limits` → `identity_merge_max_moved_rows`."
    winner_selection:
      rule_order:
        - "1. `owner_choice` nếu owner đã chỉ định (ghi `winner_selection_rule = 'owner_choice'`)."
        - "2. `only_candidate_with_canonical_doi` nếu đúng một bên có `canonical_doi` — DOI là định danh bền hơn arXiv ID."
        - "3. `earliest_first_discovered_at`; tie-break bằng `ingest_sequence` nhỏ hơn, rồi bằng `id` nhỏ hơn theo thứ tự byte."
      rationale: "Quy tắc phải toàn phần và tất định để hai lần chạy trên cùng dữ liệu cho cùng kết quả (oracle tái lập được)."
    merge_move_set:
      description: "Danh sách ĐÓNG các cột được phép ghi lại. Cột ngoài danh sách này giữ nguyên."
      moves:
        - {table: identity_alias, column: work_id, action: "loser → winner; ghi `superseded_by_merge_id`"}
        - {table: post_work, column: work_id, action: "loser → winner; nếu cạnh (post, winner) đã tồn tại thì XÓA hàng thừa và cộng vào `identity_merge_audit.moved_counts` khóa `post_work`"}
        - {table: work_version, column: work_id, action: "loser → winner; nếu trùng `version_label` thì giữ hàng của winner và ghi hàng loser thành `version_label || '-from-merge-' || loser_work_id` để không mất bằng chứng"}
        - {table: work_label, columns: [target_work_id, target_key], action: "loser → winner"}
        - {table: analysis, columns: [target_work_id, target_key, moved_by_merge_id], action: "loser → winner; nếu va chạm `ux_analysis_valid_key` thì giữ hàng có `analyzed_at` sớm hơn ở `valid` và chuyển hàng kia sang `status = 'superseded_by_merge'`"}
        - {table: saved_item, columns: [target_work_id, target_key, moved_by_merge_id], action: "loser → winner; nếu va chạm `ux_saved_active_owner_target` thì giữ hàng `saved_at` sớm hơn ở `active`, hàng kia chuyển `state = 'superseded_by_merge'`"}
        - {table: work, columns: [identity_state, merged_into_work_id], action: "loser: `identity_state='merged'`, `merged_into_work_id` = `work.id` của work thắng"}
        - {table: work, columns: [canonical_doi, canonical_arxiv_id, first_discovered_at, metadata_state], action: "winner: nhận giá trị canonical còn thiếu từ loser; `first_discovered_at` = MIN của hai bên; `metadata_state` = giá trị 'đầy đủ hơn' theo thứ tự none < partial < unavailable < complete"}
      explicitly_not_moved:
        - "`saved_snapshot` — mọi cột, kể cả `target_key_at_save`. Snapshot là bằng chứng lịch sử (I17)."
        - "`report_item` của report đã `published` — kỳ cũ giữ nguyên nội dung đã công bố (I05)."
        - "`ingest_receipt`, `analysis_attempt`, `identity_merge_audit` — bất biến."
        - "`post.discovered_at`, `post.ingest_sequence` — bất biến."
        - "`first_announced` ledger — xem interface bên dưới; PC04 quyết định policy."
    first_announced_interface:
      owner_package: PC04
      pc02_provides:
        - "`identity_merge_audit.id` + `winner_work_id` + `loser_work_id` + `merged_at` — đủ để PC04 quyết định."
        - "`identity_merge_audit.moved_counts` khóa `first_announced` — ô đã dành sẵn để PC04 ghi số hàng nó đã xử lý trong CÙNG transaction merge."
      pc02_does_not_decide: >-
        Việc first-announcement của work thua có được coi là first-announcement của work thắng
        hay không (và do đó kỳ sau hiển thị 'phát hiện mới' hay 'tham chiếu có ngày') là quyết
        định của PC04 theo I07 và REQ-D29. PC02 chỉ cam kết: transaction merge cung cấp điểm
        móc để PC04 ghi cùng commit, và nếu PC04 chưa khóa policy thì merge bị chặn ở phạm vi
        có first-announcement (OWNER_DECISION_REQUIRED không cần: đây là CR-PC02-06 tới PC04).
    commit_point: "Một transaction. `identity_merge_audit` được ghi TRONG cùng transaction; không có merge nào không có audit."
    external_observer:
      before_commit: "Hai work `active` riêng biệt; hai bộ alias; Saved/analysis trỏ vào hai work."
      after_commit: "Một work `active` (winner) và một work `merged` (loser, dữ liệu canonical cũ được giữ); mọi alias trỏ winner; đúng một hàng audit mới."
      never_observable: "Alias trỏ tới work `merged`; hai hàng Saved `active` cùng `target_key`; work `merged` không có `merged_into_work_id`."
    failure_timeline:
      - {point: "Precondition fail (mâu thuẫn canonical)", server_state: "không merge; tạo `identity_conflict` state='open' và đặt các work liên quan `quarantined`", client_sees: "IDENTITY_CONFLICT", recovery: "owner giải bằng `identity.resolve_conflict`; nguồn không bị mất (B15)"}
      - {point: "Crash giữa transaction", server_state: "rollback: hai work vẫn `active`, không audit", client_sees: "lỗi/timeout", recovery: "chạy lại; vì bằng chứng vẫn còn, merge sẽ được thử lại và cho cùng winner (quy tắc tất định)"}
      - {point: "Sau commit", server_state: "bất biến hóa: `ux_merge_audit_owner_loser` chặn merge lại cùng loser", client_sees: "kết quả merge", recovery: "undo KHÔNG được hỗ trợ ở MVP (identity.md non-goals)"}
    forbidden_effects:
      - "Merge dựa trên tiêu đề giống nhau, tác giả giống nhau, hoặc bất kỳ suy luận nào của AI (B15, `performed_by` không có giá trị AI)."
      - "Xóa work thua hoặc alias của nó."
      - "Sửa `saved_snapshot` hoặc report đã publish."
      - "Merge không ghi audit."

  - id: TXN-save-target
    contract_id: CT-txn-save
    operation_id: save.create
    source_refs: ["SRC-SPEC §3.6 D38, D55", "SRC-SPEC §12 AC-12, AC-13", "SRC-PLAN §7 I08", "SRC-PLAN §11 PC07"]
    invariant_refs: [I08, I17]
    decision_refs: [B01]
    performed_by: MOD-saved-service
    requested_by: "MOD-web-ui (`save_channel='app'`) hoặc MOD-telegram-adapter (`save_channel='telegram'`)"
    rows_written_together:
      - "`saved_snapshot` — một hàng, `payload` dựng từ **bản analysis đang được đọc** (`report_item.analysis_id` của kỳ người dùng đang mở), không phải bản analysis mới nhất."
      - "`saved_item` — một hàng `state='active'` trỏ tới snapshot vừa tạo."
    snapshot_source_rule:
      statement: >-
        Snapshot lấy từ `report_item.analysis_id` của mục đang đọc. Nếu Save từ Work detail
        ngoài phạm vi một báo cáo (`source_report_item_id` NULL) thì lấy hàng `analysis`
        `valid` có `analyzed_at` lớn nhất **tại thời điểm bắt đầu transaction**, và ghi
        `analysis_id_at_save` để về sau biết chính xác bản nào đã được chụp.
      forbidden: "Lấy một bản analysis mới hơn vừa xuất hiện giữa lúc người dùng đọc và lúc bấm Save (SRC-PLAN §11 PC07)."
    commit_point: "Một transaction; snapshot và con trỏ cùng commit. Không tồn tại `saved_item` trỏ tới snapshot chưa commit."
    external_observer:
      before_commit: "Không có Saved cho target đó (hoặc có hàng `unsaved` cũ)."
      after_commit: "Đúng một `saved_item` `active` + đúng một `saved_snapshot` mới."
      never_observable: "`saved_item` không có snapshot; hai `saved_item` `active` cùng `target_key`."
    concurrency:
      scenario: "App và Telegram bấm Save cùng lúc cho cùng target (REQ-AC13)."
      resolution: >-
        Cả hai transaction chèn; UNIQUE partial `ux_saved_active_owner_target` cho đúng một
        transaction commit. Transaction thua **không** retry chèn: nó rollback (bao gồm cả
        `saved_snapshot` vừa tạo — snapshot mồ côi không được để lại), đọc hàng active hiện có
        và trả `already_saved: true` cùng `saved_item.id` đã tồn tại. Bot Telegram vẫn phản hồi
        trạng thái mỗi lần bấm (REQ-D38) nhưng chỉ có một bản ghi.
      oracle: "COUNT(saved_item WHERE target_key = T AND state='active') = 1; COUNT(saved_snapshot WHERE target_key_at_save = T) = 1 sau khi cả hai request kết thúc."
      telegram_replay: "Callback Telegram lặp mang cùng `idempotency_key` → `ux_saved_idempotency` trả về hàng cũ; 5 lần bấm = 1 hàng, 5 phản hồi (SRC-SPEC §8.2 dòng 10)."
    unsave_and_resave:
      unsave: "`saved_item.state` → `unsaved`, `unsaved_at` được ghi. `saved_snapshot` KHÔNG bị xóa, KHÔNG bị sửa (SRC-SPEC §7.3)."
      resave: "Tạo hàng `saved_item` MỚI với snapshot MỚI chụp tại thời điểm đó. Hàng cũ ở lại làm lịch sử. Do đó `saved_item` có thể có nhiều hàng cho một target, nhưng tối đa một `active`."
    failure_timeline:
      - {point: "Crash sau khi tạo snapshot, trước khi chèn saved_item", server_state: "rollback: không snapshot, không saved_item", client_sees: "lỗi", recovery: "bấm Save lại; không có snapshot mồ côi"}
      - {point: "Va chạm UNIQUE", server_state: "hàng active có sẵn không đổi", client_sees: "`already_saved: true` + id hàng cũ", recovery: "không cần"}
      - {point: "Sau commit, hệ thống khởi động lại", server_state: "snapshot bền", client_sees: "Saved còn nguyên (REQ-AC12)", recovery: "oracle: `content_hash` sau restart = trước restart"}
      - {point: "Post gốc bị xóa trên X sau đó", server_state: "`post.source_deleted_observed_at` được ghi; snapshot KHÔNG đổi", client_sees: "vẫn đọc được nội dung trong Saved", recovery: "không cần; đây là oracle của REQ-AC12"}
    forbidden_effects:
      - "Xóa hoặc sửa `saved_snapshot` khi bỏ lưu, khi bỏ tag, hoặc khi merge identity."
      - "Ghi snapshot ở transaction riêng sau `saved_item`."
      - "Dùng bản analysis mới hơn bản đang đọc."

  - id: TXN-analysis-accept
    contract_id: CT-txn-analysis-accept
    operation_id: analysis.submit_result
    source_refs: ["SRC-PLAN §3 B07", "SRC-PLAN §8.2", "SRC-PLAN §9.3", "SRC-SPEC §3.5 D25, D26", "SRC-PLAN §7 I04"]
    invariant_refs: [I04, I16]
    decision_refs: [B07, B12]
    performed_by: MOD-analysis-service
    requested_by: MOD-analysis-worker
    input_rule:
      decision_refs: [B12]
      statement: >-
        Analysis worker nhận task từ **server sau ingest commit**, không bao giờ nhận dữ liệu
        trực tiếp từ collector (cạnh COL→AW của SRC-SPEC §6.2 bị loại bỏ theo B12).
    rows_written_together:
      - "`analysis_attempt` — hàng của attempt hiện tại được cập nhật `outcome='accepted'`, `ended_at`."
      - "`analysis` — đúng một hàng mới `status='valid'`."
      - "`work_label` — các hàng nhãn (chỉ khi `task_type='label'`), trỏ `analysis_id` vừa tạo."
    commit_point: "Một transaction. Attempt và kết quả cùng commit; không có kết quả `valid` nào không có attempt tương ứng (`accepted_from_attempt_id` NOT NULL)."
    validation_before_commit:
      order:
        - "1. Kiểm `lease_id`/`lease_epoch` còn hiệu lực → nếu không: `STALE_LEASE`, ghi attempt `cancelled_stale_lease`, KHÔNG ghi kết quả (I10)."
        - "2. Validate payload theo analysis-result schema (PC06) → sai: attempt `schema_invalid`, `AI_OUTPUT_INVALID`, không ghi `analysis`."
        - "3. Kiểm `evidence_level` không vượt nguồn thực có (ví dụ `full_text` khi chỉ có post) → sai: `schema_invalid`."
        - "4. Chèn `analysis`; va chạm `ux_analysis_valid_key` → transaction thua rollback và trả hàng đã tồn tại (`already_valid: true`)."
      forbidden: "Lấy JSON bất kỳ rồi bỏ field không kiểm chứng được (SRC-PLAN §10 AI_OUTPUT_INVALID)."
    external_observer:
      before_commit: "Có `analysis_generation` và ≥1 `analysis_attempt` đang chạy; không có hàng `analysis` `valid` cho key đó."
      after_commit: "Đúng một `analysis` `valid` cho key; attempt tương ứng `accepted`."
      never_observable: "Hai hàng `valid` cùng key; hàng `valid` không có attempt; nhãn `work_label` trỏ tới analysis chưa commit."
    retry_and_cost:
      statement: >-
        Retry KHÔNG tạo hai kết quả hợp lệ cùng key (I04). Nhưng hệ thống KHÔNG hứa inference
        bên ngoài chạy đúng một lần: worker chết sau khi model đã chạy vẫn có thể phát sinh phí
        (SRC-PLAN §8.2). Attempt đó được ghi `outcome='timeout_unknown'`, `cost_uncertain=true`.
      usage_unknown: "Đường CLI không có token count → `usage_tokens_in/out = NULL`. CẤM ghi 0 (REQ-D44, I14)."
    tag_independence:
      statement: >-
        Tag KHÔNG nằm trong analysis key. Bỏ tag rồi thêm lại không tạo generation mới, không
        tạo attempt mới, không gọi provider (REQ-AC06, REQ-D25).
      oracle: "provider call counter delta = 0; COUNT(analysis_attempt) không đổi; hàng `analysis` `valid` được dùng lại nguyên vẹn (`payload_hash` không đổi)."
    failure_timeline:
      - {point: "Provider timeout, worker không biết model đã chạy chưa", server_state: "attempt `timeout_unknown`, `cost_uncertain=true`, không có `analysis`", client_sees: "AI_ATTEMPT_UNCERTAIN", recovery: "theo retry policy PC06; attempt mới có `attempt_number` mới; KHÔNG tuyên bố chưa mất phí"}
      - {point: "Schema sai", server_state: "attempt `schema_invalid`", client_sees: "AI_OUTPUT_INVALID", recovery: "thử lại một lần (REQ-D43); hết budget → mục thiếu summary, ghi `pending_item_ledger`, report `quality='partial'` (B17)"}
      - {point: "Crash sau COMMIT trước khi worker nhận ACK", server_state: "`analysis` `valid` đã bền", client_sees: "không biết", recovery: "submit lại cùng key → va chạm UNIQUE → trả `already_valid: true`; không tạo hàng thứ hai"}
      - {point: "Lease hết hạn giữa chừng", server_state: "attempt `cancelled_stale_lease`, không kết quả", client_sees: "STALE_LEASE", recovery: "epoch mới claim lại (PC03)"}
    forbidden_effects:
      - "Ghi `analysis` `valid` mà không có attempt `accepted`."
      - "Cho phép worker tự tạo `analysis_generation` hoặc tự quyết 'work này đã báo cáo' (SRC-PLAN §6.1)."
      - "Ghi `usage_tokens = 0` khi không biết."
      - "Cho nội dung nguồn điều khiển việc chọn provider, đọc secret hay gửi Telegram (I11)."

  - id: TXN-checkpoint-only
    contract_id: CT-txn-checkpoint-only
    operation_id: ingest.commit_checkpoint
    source_refs: ["SRC-SPEC §9.2", "SRC-PLAN §8.1", "SRC-PLAN §7 I02", "contracts/ports.yaml → ingest.commit_checkpoint"]
    invariant_refs: [I02, I10]
    decision_refs: [B05, AMD-B05, R-01]
    finding_ref: F-A1R1-01
    performed_by: MOD-ingest-service
    requested_by: MOD-x-collector
    purpose: >-
      Tiến con trỏ vị trí khi collector KHÔNG có item mới để nộp: trang rỗng, hết feed, hoặc
      đóng một segment thu thập. Đây là đường ghi checkpoint hợp lệ THỨ HAI (đường thứ nhất là
      TXN-ingest-batch); mọi đường khác bị cấm.
    hard_restriction:
      statement: "KHÔNG có item nào được ghi trong transaction này. `items_received = 0`, `posts_inserted = 0`, `works_linked = 0`."
      rationale: >-
        Tách bạch hai đường làm cho I02 kiểm được: nếu một operation vừa ghi post vừa tiến con
        trỏ ở transaction khác thì không oracle nào phân biệt được "checkpoint đi trước dữ
        liệu" với "checkpoint đi sau dữ liệu".
    guard:
      precondition: >-
        Con trỏ đề xuất chỉ được tham chiếu `ingest_sequence` **đã commit** cho run đó, tức
        `proposed_acked_through <= checkpoint_hiện_hành.acked_through_ingest_sequence`.
        Đề xuất vượt quá mốc đó → `VALIDATION_ERROR`, KHÔNG ghi một phần.
      monotonic_seq: "`checkpoint.sequence` chỉ tăng; seq lùi bị từ chối (PC01 `ingest.commit_checkpoint.idempotency.rule_vi`)."
      lease: "`lease_id` + `lease_epoch` phải là epoch hiện hành; epoch cũ → `STALE_LEASE`, rollback, không dữ liệu nào đổi (I10)."
    rows_written_together:
      - "`checkpoint` — đúng MỘT hàng mới (append-only, `sequence` = seq hiện hành + 1) với `cursor_token`/`cursor_state` mới và `acked_through_ingest_sequence` **KHÔNG tăng**."
      - "`ingest_receipt` — đúng một hàng với `receipt_kind = 'checkpoint_only'`, mọi count = 0, `checkpoint_id` trỏ hàng trên, `max_ingest_sequence` = `acked_through_ingest_sequence` hiện hành."
    append_only_note:
      ruling_text: "R-01 viết 'single row update of `checkpoint` + receipt'."
      pc02_interpretation: >-
        PC02 giữ `checkpoint` là bảng APPEND-ONLY (đã khóa ở PKT-PC02: `sequence` UNIQUE,
        không UPDATE). Vì vậy 'single row' được hiện thực bằng MỘT hàng checkpoint mới thay vì
        UPDATE tại chỗ. Ngữ nghĩa tương đương — một mốc con trỏ mới — và giữ được lịch sử con
        trỏ để chẩn đoán khi cursor mất hiệu lực. Ghi nhận là diễn giải, không phải bác bỏ
        ruling; nếu Coordinator muốn UPDATE tại chỗ thì đó là thay đổi mô hình bảng và cần
        packet mới (CR-PC02-12).
    commit_point: "Một transaction SQLite. ACK chỉ sau COMMIT thành công, giống TXN-ingest-batch (I02)."
    external_observer:
      before_commit: "`MAX(checkpoint.sequence)` của run không đổi; không receipt mới."
      after_commit: "Đúng một checkpoint mới + đúng một receipt `checkpoint_only`; `acked_through_ingest_sequence` KHÔNG đổi; `#post` KHÔNG đổi."
      never_observable: "`acked_through_ingest_sequence` tăng qua đường này; hoặc `#post` tăng qua đường này."
    oracle:
      primary: >-
        Sau BẤT KỲ chuỗi lời gọi `ingest.commit_checkpoint` nào (xen kẽ tùy ý với
        `ingest.submit_batch`): `checkpoint.acked_through_ingest_sequence <=
        MAX(ingest_receipt.max_ingest_sequence)` trên tập receipt ĐÃ COMMIT của owner đó —
        checkpoint không bao giờ trỏ vượt qua post đã bền.
      supporting:
        - "`checkpoint.acked_through_ingest_sequence <= MAX(post.ingest_sequence)` (dạng mạnh hơn, dùng khi kiểm trực tiếp trên bảng post)."
        - "Với mọi hàng receipt `checkpoint_only`: `items_received = posts_inserted = posts_duplicate = items_rejected = works_linked = 0`."
        - "Delta `#post` qua một lời gọi `ingest.commit_checkpoint` = 0."
        - "`checkpoint.sequence` đơn điệu tăng trong một run; không có hàng nào bị UPDATE (kiểm bằng so sánh tập `(id, sequence, acked_through_ingest_sequence)` trước/sau)."
    idempotency:
      key: "`assignment_id + checkpoint_seq` (PC01). Lưu vào `ingest_receipt.idempotency_key`."
      same_key_same_payload: "Trả receipt đã lưu; không tạo checkpoint mới."
      same_key_different_payload: "`IDEMPOTENCY_CONFLICT`, không ghi gì."
      seq_regression: "Seq nhỏ hơn seq hiện hành → `VALIDATION_ERROR`, không ghi gì."
    failure_timeline:
      - {point: "Guard fail (con trỏ vượt mốc đã ACK, hoặc seq lùi)", server_state: "không đổi", client_sees: "VALIDATION_ERROR", recovery: "collector đọc lại checkpoint hiện hành từ server rồi đề xuất lại; đây chính là hàng rào của oracle chính"}
      - {point: "Lease cũ", server_state: "không đổi", client_sees: "STALE_LEASE", recovery: "claim lại với epoch mới (PC03)"}
      - {point: "Crash giữa transaction", server_state: "rollback: không checkpoint mới, không receipt", client_sees: "timeout — KHÔNG BIẾT kết quả", recovery: "gọi lại cùng `assignment_id + checkpoint_seq`; vì không có receipt nên transaction chạy lại từ đầu"}
      - {point: "COMMIT xong, ACK mất", server_state: "checkpoint + receipt đã bền", client_sees: "không biết", recovery: "gọi lại cùng key → nhận receipt cũ; `#checkpoint` và `acked_through_ingest_sequence` KHÔNG đổi"}
      - {point: "Hết ổ đĩa", server_state: "không ACK, trạng thái kho chuyển `write_blocked` (PC03 `contracts/state/storage.yaml`; đọc qua `storage.get_health`)", client_sees: "STORAGE_WRITE_FAILED", recovery: "không tiến cursor, không hứa đã persist lỗi (SRC-PLAN §10)"}
    forbidden_effects:
      - "Ghi bất kỳ hàng `post`, `work`, `post_work`, `identity_alias` nào."
      - "Tăng `acked_through_ingest_sequence` (chỉ TXN-ingest-batch được tăng, và chỉ tới sequence vừa cấp trong chính transaction đó)."
      - "Chấp nhận con trỏ tham chiếu dữ liệu chưa commit — đây là hành vi mà I02 counterexample 2 cấm."
      - "UPDATE một hàng `checkpoint` đã tồn tại."
      - "ACK trước COMMIT."

  - id: TXN-delete-target
    contract_id: CT-txn-delete-target
    operation_id: data.delete_target
    source_refs: ["SRC-SPEC §7.3", "SRC-SPEC §3.6 D55, D58", "SRC-SPEC §12 AC-12", "contracts/ports.yaml → data.delete_target"]
    requirement_refs: [REQ-S7.3-05, REQ-D55, REQ-D58, REQ-AC12]
    invariant_refs: [I08, I17]
    decision_refs: [R-04, CR-PC01-05]
    scenario_refs: [SC32]
    finding_ref: F-A1R1-04
    performed_by: MOD-data-admin-service
    requested_by: MOD-web-ui
    purpose: >-
      Thao tác THỨ HAI trong ba thao tác của SRC-SPEC §7.3: "xóa dữ liệu gốc" của MỘT target.
      Khác "bỏ lưu" (chỉ đổi `saved_item.state`) và khác "xóa toàn bộ" (TXN-purge-all).
    preconditions:
      - "Cờ xác nhận tường minh trong request (PC01 `data.delete_target`); thiếu cờ → `VALIDATION_ERROR`, không ghi gì."
      - "Target tồn tại và đã resolve (`work` phải ở `identity_state = 'active'`; không xóa qua một work `merged` — phải gọi trên work thắng)."
      - "Không có `identity_conflict` đang `open` liên quan tới target: xóa dữ liệu khi identity chưa rõ sẽ làm mất bằng chứng cần cho việc giải xung đột (B15)."
    core_principle:
      statement: >-
        Xóa NỘI DUNG, giữ KHUNG. Hàng mang định danh được giữ lại ở trạng thái
        `content_state = 'redacted_by_owner_deletion'`; nếu xóa hẳn hàng thì đợt thu thập sau
        sẽ ingest lại đúng nội dung vừa xóa (dedup theo `x_post_id`/canonical id sẽ không còn
        gì để so), tức thao tác xóa tự vô hiệu hóa chính nó.
      cross_ref: "Vì `saved_snapshot` bất biến (I08, I17), không con trỏ nào của nó được phép NULL hóa."
    tables:
      deleted_rows:
        - {table: post_work, scope: "mọi cạnh của target", why: "cạnh dẫn xuất, không có gì bất biến trỏ tới"}
        - {table: work_label, scope: "mọi nhãn của target", why: "dẫn xuất từ analysis; sẽ được tính lại nếu target được ingest lại"}
        - {table: tag_vector, scope: "không áp dụng", why: "tag_vector thuộc tag, không thuộc target"}
        - {table: analysis, scope: "CHỈ các hàng KHÔNG được `saved_snapshot.analysis_id_at_save` hoặc `report_item.analysis_id` (report đã publish) trỏ tới", why: "hàng được bằng chứng bất biến trỏ tới phải ở lại, nếu không FK RESTRICT bị vi phạm và snapshot mất truy vết"}
        - {table: analysis_generation, scope: "chỉ generation không còn hàng `analysis` nào", why: "dọn khung rỗng"}
        - {table: analysis_task, scope: "mọi task đang mở của target", why: "không để hàng đợi hồi sinh nội dung đã xóa"}
      redacted_rows:
        - {table: post, columns_cleared: [text, media_refs, referenced_links, author_display_name, author_x_user_id, url, lang, source_snapshot_hash], columns_kept: [id, owner_id, x_post_id, author_handle, discovered_at, ingest_sequence, discovered_by_run_id, ingest_receipt_id, identity_resolution, source_deleted_observed_at], set_to: "content_state = 'redacted_by_owner_deletion'"}
        - {table: work, columns_cleared: [title, paper_url, code_url], columns_kept: [id, owner_id, canonical_doi, canonical_arxiv_id, identity_state, first_discovered_at, ingest_sequence, metadata_state], set_to: "content_state = 'redacted_by_owner_deletion'"}
        - {table: work_version, columns_cleared: [abstract_text], columns_kept: [id, work_id, version_label, content_fingerprint, announced_at, observed_at, is_current], note: "`content_fingerprint` được giữ: nó là hash, không phải nội dung, và là thành phần của analysis key (B07)."}
      untouched:
        - {table: saved_snapshot, why: "REQ-D55/REQ-AC12 — lý do tồn tại của snapshot là đọc được khi nguồn không còn. I08, I17."}
        - {table: saved_item, why: "con trỏ tới snapshot; bỏ lưu là thao tác KHÁC"}
        - {table: identity_merge_audit, why: "audit trail của B15/I03; xóa audit là xóa khả năng kiểm toán"}
        - {table: identity_alias, why: "giữ để lần ingest sau vẫn resolve về đúng work đã redact thay vì tạo work mới"}
        - {table: ingest_receipt, why: "bất biến (I02)"}
        - {table: checkpoint, why: "bất biến, append-only"}
        - {table: analysis_attempt, why: "bất biến; là bằng chứng chi phí đã phát sinh (I16)"}
        - {table: first_announced_ledger, why: "xóa dữ liệu KHÔNG được biến một công trình đã báo cáo thành phát hiện mới ở kỳ sau (I07, REQ-D29)"}
        - {table: coverage_window, why: "coverage là sổ độc lập với nội dung hiển thị (B04)"}
        - {table: pending_item_ledger, why: "như trên"}
        - {table: backfill_ledger, why: "backfill đã tiêu thụ không được hoàn lại (SRC-PLAN §9.2)"}
        - {table: report, why: "report đã publish bất biến (I05)"}
        - {table: report_item, why: "kỳ cũ giữ nguyên nội dung đã công bố; mục sẽ hiển thị nội dung từ snapshot/analysis còn lại"}
    referential_integrity:
      rule: "Mọi FK vẫn `ON DELETE RESTRICT`; transaction phải xóa theo thứ tự lá → gốc và KHÔNG được tắt `PRAGMA foreign_keys`."
      order: ["analysis_task", "work_label", "analysis (tập đủ điều kiện)", "analysis_generation (rỗng)", "post_work", "redact post/work/work_version"]
      no_nulling_of_immutable_pointers: "`saved_snapshot.analysis_id_at_save` và `report_item.analysis_id` KHÔNG BAO GIỜ bị NULL hóa; đó chính là lý do tập `analysis` bị xóa được thu hẹp."
    rows_written_together:
      - "Các thao tác xóa/redact ở trên."
      - "`data_deletion_audit` — đúng một hàng, `scope='target'`, kèm `deleted_counts` và `preserved_counts`."
    commit_point: "Một transaction. Response chỉ trả sau COMMIT."
    external_observer:
      before_commit: "Target đọc được đầy đủ."
      after_commit: "Nội dung gốc biến mất khỏi Work detail; Saved vẫn đọc được đầy đủ từ snapshot; kỳ báo cáo cũ vẫn liệt kê mục."
      never_observable: "Saved rỗng; `#saved_snapshot` giảm; `first_announced_ledger` mất hàng."
    oracle:
      - "`#saved_snapshot` không đổi; tập `(id, content_hash)` không đổi (I17)."
      - "`#first_announced_ledger`, `#coverage_window`, `#backfill_ledger`, `#identity_merge_audit`, `#ingest_receipt` không đổi."
      - "`#post` và `#work` KHÔNG đổi (redact, không xóa hàng); nhưng `content_state = 'redacted_by_owner_deletion'` cho các hàng thuộc target."
      - "`data_deletion_audit.preserved_counts.saved_snapshot` bằng `#saved_snapshot` đo được sau commit."
      - "Không tồn tại hàng `analysis` bị xóa mà vẫn được `saved_snapshot` hoặc `report_item` (published) trỏ tới — kiểm bằng FK, phải là 0 vi phạm."
      - "Re-ingest cùng `x_post_id` sau khi xóa: `posts_inserted = 0`, `posts_duplicate = 1`, và nội dung KHÔNG được ghi lại (guard: `content_state = 'redacted_by_owner_deletion'` chặn ghi đè nội dung)."
    failure_timeline:
      - {point: "Thiếu cờ xác nhận", server_state: "không đổi", client_sees: "VALIDATION_ERROR", recovery: "gửi lại có cờ"}
      - {point: "Có identity_conflict đang open", server_state: "không đổi", client_sees: "IDENTITY_CONFLICT", recovery: "giải xung đột trước"}
      - {point: "Crash giữa transaction", server_state: "rollback toàn bộ; không xóa một phần", client_sees: "lỗi", recovery: "gọi lại; thao tác là idempotent theo `content_state`"}
      - {point: "Gọi lại sau khi đã xóa", server_state: "không đổi thêm", client_sees: "thành công, `deleted_counts` toàn 0", recovery: "không cần"}
    forbidden_effects:
      - "Xóa hoặc sửa `saved_snapshot` (mọi cột)."
      - "NULL hóa `saved_snapshot.analysis_id_at_save` hoặc `report_item.analysis_id`."
      - "Xóa hàng `first_announced_ledger`, `identity_merge_audit`, `ingest_receipt`, `checkpoint`, `analysis_attempt`."
      - "Xóa hàng `post`/`work` (phải redact) — vì làm vậy khiến đợt sau ingest lại đúng nội dung vừa xóa."
      - "Tắt `PRAGMA foreign_keys` để xóa nhanh."
      - "Chạy khi thiếu cờ xác nhận tường minh."
    provisional:
      question: "Bản `analysis` (summary) được `saved_snapshot` trỏ tới có phải là 'dữ liệu gốc' cần xóa không?"
      pc02_choice: "KHÔNG xóa — giữ, vì snapshot bất biến trỏ tới nó và nội dung tương đương đã nằm trong snapshot mà REQ-D55 buộc phải giữ."
      status: PROVISIONAL
      escalate_to: "PC08 + Owner (CR-PC02-14). Nếu Owner muốn xóa cả summary thì phải chấp nhận sửa I08/I17, tức là một amendment, không phải một tùy chọn."

  - id: TXN-purge-all
    contract_id: CT-txn-purge-all
    operation_id: data.purge_all
    source_refs: ["SRC-SPEC §7.3", "contracts/ports.yaml → data.purge_all"]
    requirement_refs: [REQ-S7.3-05]
    invariant_refs: [I15]
    decision_refs: [R-04, CR-PC01-05]
    finding_ref: F-A1R1-04
    performed_by: MOD-data-admin-service
    requested_by: MOD-web-ui
    purpose: "Thao tác THỨ BA của SRC-SPEC §7.3: xóa toàn bộ dữ liệu. Đòi xác nhận GÕ TAY (REQ-S7.3-05)."
    preconditions:
      - "Trạng thái kho ở mức `maintenance` (PC03 `contracts/state/storage.yaml`; đọc qua `storage.get_health`). Không chạy khi đang có run hoạt động."
      - "Cụm từ gõ tay khớp `purge_challenge` do SERVER phát, còn `active`, chưa hết hạn, dùng một lần. Client KHÔNG được tự sinh cụm từ."
      - "Mọi `assignment_lease` đang `held` đã bị thu hồi; dispatcher đã khóa."
    tables:
      set_authority_vi: >-
        Ba tập dưới đây là NGUỒN LIỆT KÊ CÓ THẨM QUYỀN cho `data.purge_all` (ruling
        PURGE-LIST 2026-09-07, OD-20260907-01 mục 24). Mọi artefact khác COPY nguyên văn,
        không tự dựng danh sách riêng. Ba tập PHẢI phủ kín và rời nhau đôi một trên toàn bộ
        `entities` — kiểm tự động bởi EV-PC02-08.
      counts: {purged: 37, retained: 21, never_purged: 2, total: 60}
      purged:
        note_vi: "Dữ liệu NGHIÊN CỨU và dữ liệu VẬN HÀNH sinh ra từ nó. Xóa toàn bộ hàng."
        list: [post, post_work, work, work_version, identity_alias, identity_conflict, identity_merge_audit, work_label, analysis, analysis_generation, analysis_attempt, analysis_task, embedding_generation, tag_vector, report, report_item, emerging_direction, coverage_window, pending_item_ledger, backfill_ledger, first_announced_ledger, rescan_ledger, saved_item, saved_snapshot, delivery, delivery_part, delivery_attempt, delivery_receipt, outbox_intent, run, assignment, assignment_lease, checkpoint, ingest_receipt, source_fetch_log, telegram_update_log, telegram_link_attempt]
        telegram_link_attempt_note_vi: "Bộ đếm rate limit là dữ liệu VẬN HÀNH, không phải cấu hình — nên bị xóa (ruling PURGE-LIST)."
      retained_by_owner_decision:
        status: ACCEPTED
        decision_ref: OD-20260907-01
        owner_answer_vi: >-
          Owner quyết định (mục 24): phạm vi xóa CHỈ là dữ liệu nghiên cứu. Các bảng dưới đây
          được GIỮ — xóa chúng biến thao tác thành "cài lại từ đầu" thay vì "xóa dữ liệu".
        tables:
          - {table: owner, reason_vi: "Tài khoản đăng nhập duy nhất phải còn (REQ-D05)."}
          - {table: session, reason_vi: "Phiên đăng nhập được giữ; owner không bị đá ra khỏi app khi xóa dữ liệu nghiên cứu."}
          - {table: secret_ref, reason_vi: "Giữ, để không phải nhập lại mọi API key sau khi xóa dữ liệu."}
          - {table: task_credential, reason_vi: "Giữ cùng secret_ref; credential ngắn hạn tự hết hạn theo TTL của PC08."}
          - {table: secret_audit, reason_vi: "Nhật ký truy cập secret là bằng chứng kiểm toán (I11); xóa audit làm mất khả năng kiểm toán."}
          - {table: telegram_link, reason_vi: "Giữ liên kết bot; không phải liên kết lại sau khi xóa dữ liệu."}
          - {table: telegram_link_code, reason_vi: "Giữ cùng telegram_link (mã ngắn hạn tự hết hạn)."}
          - {table: provider_config, reason_vi: "Cấu hình provider/model theo tác vụ được giữ (REQ-D39)."}
          - {table: provider_test_result, reason_vi: "Giữ cùng provider_config."}
          - {table: settings, reason_vi: "Lịch, giới hạn đợt, N ngày backfill — cấu hình, không phải dữ liệu nghiên cứu."}
          - {table: schedule_occurrence, reason_vi: "Lịch được giữ để đợt kế tiếp vẫn chạy đúng giờ (OD-20260907-01 mục 20 và 24)."}
          - {table: tag, reason_vi: "Tag là SUBSCRIPTION của người dùng (lớp 2 của SRC-SPEC §8.1), không phải dữ liệu nghiên cứu (lớp 1)."}
          - {table: tag_alias, reason_vi: "Đi cùng tag."}
          - {table: tag_exclusion, reason_vi: "Đi cùng tag."}
          - {table: tag_config_version, reason_vi: "Đi cùng tag; cũng là ảnh chụp lịch sử mà report từng trỏ vào."}
          - {table: source_connection, reason_vi: "Trạng thái phiên nguồn; giữ để không phải đăng nhập X lại."}
          - {table: backup_snapshot, reason_vi: "Owner nói rõ: backup KHÔNG bị xóa."}
          - {table: backup_manifest, reason_vi: "Đi cùng backup_snapshot."}
          - {table: restore_record, reason_vi: "Nhật ký khôi phục; đi cùng backup."}
          - {table: purge_challenge, reason_vi: "Chính bảng cấp phép cho thao tác này."}
          - {table: worker_registration, reason_vi: "Đăng ký collector và ràng buộc token là CẤU HÌNH, không chứa dữ liệu nghiên cứu; xóa sẽ buộc đăng ký lại collector (ruling PURGE-LIST 2026-09-07)."}
      never_purged:
        - {table: schema_migration, why_vi: "Mô tả cấu trúc kho, không phải dữ liệu của owner; xóa sẽ làm kho không xác định được phiên bản."}
        - {table: data_deletion_audit, why_vi: "Bản ghi xóa được giữ VĨNH VIỄN theo tham số PC08 đã phê chuẩn (OD-20260907-01 mục 23); chính thao tác purge ghi một hàng audit vào đây."}
      backup_artifacts_rule:
        status: ACCEPTED
        decision_ref: OD-20260907-01
        rule_vi: >-
          Artifact backup trên hệ thống tệp KHÔNG bị đụng tới, và ba bảng `backup_*` cũng không.
          Hệ quả phải nói thẳng trong hộp thoại xác nhận: **dữ liệu vừa xóa vẫn còn trong các
          bản backup**; xóa khỏi backup là thao tác riêng của PC08.
    rows_written_together:
      - "Xóa các bảng ở mục `tables` → `purged`."
      - "`purge_challenge` → `state = 'consumed'`, `consumed_at`."
      - "`data_deletion_audit` — một hàng `scope='all'` với `deleted_counts` và `preserved_counts`, ghi SAU khi xóa nhưng TRONG cùng transaction."
    commit_point: "Một transaction. Nếu engine không giữ nổi một transaction lớn như vậy, phải chạy theo lô có `data_deletion_audit` ghi trước ở trạng thái `running` — thiết kế lô thuộc PC08 (CR-PC02-15)."
    external_observer:
      before_commit: "Dữ liệu còn đủ."
      after_commit: "Mọi bảng ở `purged` rỗng; audit còn đúng một hàng mô tả việc đã xóa."
      never_observable: "Trạng thái nửa vời trong đó report còn nhưng post đã mất — đó là lý do phải một transaction hoặc một audit `running` tường minh."
    oracle:
      - "Với mọi bảng trong mục `tables` → `purged`: số hàng = 0 sau commit (trừ `data_deletion_audit` = 1)."
      - "`#schema_migration` không đổi."
      - "`purge_challenge.state = 'consumed'`; gọi lại với cùng cụm từ → `VALIDATION_ERROR` (dùng một lần)."
      - "`#assignment_lease[state='held'] = 0` tại thời điểm bắt đầu."
      - "Không thao tác nào chạm artifact backup: `backup_snapshot.artifact_sha256` của các bản đã có không đổi, và `#backup_snapshot` không đổi."
      - "Với mọi bảng trong `retained_by_owner_decision`: số hàng KHÔNG đổi."
      - "`#session` không đổi ⇒ owner vẫn đăng nhập được ngay sau khi xóa."
    failure_timeline:
      - {point: "Kho không ở trạng thái maintenance", server_state: "không đổi", client_sees: "VALIDATION_ERROR", recovery: "chuyển maintenance trước (PC03)"}
      - {point: "Cụm từ sai/hết hạn/đã dùng", server_state: "không đổi", client_sees: "VALIDATION_ERROR", recovery: "xin challenge mới"}
      - {point: "Crash giữa chừng", server_state: "rollback nếu một transaction; nếu chạy theo lô thì `data_deletion_audit` ở `running` là bằng chứng trạng thái nửa vời", client_sees: "lỗi", recovery: "PC08 định nghĩa quy trình tiếp tục; KHÔNG được coi kho là sạch khi audit còn `running`"}
    forbidden_effects:
      - "Chạy khi kho không ở `maintenance`."
      - "Chấp nhận cụm từ do client tự sinh."
      - "Xóa `schema_migration`."
      - "Xóa bất kỳ bảng nào trong `retained_by_owner_decision` — Owner đã quyết định giữ chúng (OD-20260907-01 mục 24)."
      - "Chạy khi còn `assignment_lease` ở `held`."
      - "Xóa artifact backup như một phần của thao tác này (backup là hệ thống tệp, thuộc PC08)."

  - id: TXN-report-publish
    contract_id: CT-txn-report-publish
    operation_id: report.publish
    source_refs: ["SRC-PLAN §9.2", "SRC-PLAN §5.1", "contracts/state/report.yaml §publish_cas", "contracts/reporting/time-and-tags.md §4.7.1"]
    requirement_refs: [REQ-D27, REQ-D28, REQ-D29, REQ-D57, REQ-AC08]
    invariant_refs: [I05, I06, I07]
    decision_refs: [B01, B04, AMD-B04, CR-PC04-01, CR-PC04-02, CR-PC04-08, CR-PC04-09]
    finding_ref: F-A1R2-01
    performed_by: MOD-report-service
    requested_by: MOD-report-service
    scope_note_vi: >-
      PC04 sở hữu NGỮ NGHĨA chọn nội dung, mật độ vector và chính sách kỳ rỗng. PC02 chỉ khóa
      phần DỮ LIỆU của điểm commit: hàng nào ghi cùng nhau, CAS trên cột nào, và oracle đếm
      được. Thêm ở FIX3 vì các cột mới (`report_build_id`, `abort_reason`,
      `coverage_window.ingest_sequence_from` / `coverage_window.ingest_sequence_to`, `backfill_ledger.*`) đều commit tại đây.
    rows_written_together:
      - "`report` — chuyển `building` → `published` (hoặc `aborted` + `abort_reason`), ghi `published_at`, `content_hash`."
      - "`report_item` — toàn bộ mục của kỳ."
      - "`emerging_direction` — khối hướng nổi của kỳ."
      - "`coverage_window` — MỘT hàng mới, `predecessor_window_id` = cửa sổ hiện hành, `window_from` = `coverage_window.window_to` của cửa sổ liền trước, `ingest_sequence_from` = `coverage_window.ingest_sequence_to` của cửa sổ đó."
      - "`first_announced_ledger` — hàng cho mỗi `new_discovery` chưa từng được công bố (PC04 sở hữu policy)."
      - "`backfill_ledger` — với subscription tiêu thụ backfill ở kỳ này: `consumed_in_report_id`, `consumed_at`, `entitlement = 'consumed'`."
      - "`pending_item_ledger` — mục thiếu summary."
      - "`outbox_intent` + `delivery` — intent digest, CHỈ khi kỳ không rỗng (REQ-D57)."
      - "`tag_config_version` — chốt tại đây nếu chưa có phiên bản khớp nội dung (B01)."
    idempotency:
      anchor: report_build_id
      decision_ref: F-A1R2-01
      rule_vi: >-
        `report.publish` idempotent theo `(owner_id, report_build_id)`. Replay sau khi mất ACK
        TRA hàng `report` theo khóa này và trả kết quả đã commit; nó KHÔNG thử advance coverage
        lần hai. Đây là điều làm cho lựa chọn "kỳ rỗng vẫn ghi một hàng report `aborted`" an
        toàn khi replay: luôn có một mỏ neo bền để tra, kể cả khi không có digest.
      why_not_coverage_window_vi: >-
        `coverage_window` KHÔNG có cột idempotency. Nếu dùng nó làm mỏ neo, một lần replay sẽ
        không tìm thấy receipt, thử advance lần hai, thua CAS và trả `CONFLICT` — đúng thất bại
        mà SRC-PLAN §5.1 cảnh báo.
    cas:
      guard_vi: >-
        Compare-and-set trên `coverage_window`: publish chỉ thành công nếu cửa sổ hiện hành
        VẪN là `expected_predecessor_window_id` tại lúc commit. Publisher thua CAS phải ĐỌC LẠI
        và rebuild, không được publish kỳ chồng lấn.
      additional_guards_vi:
        - "`tag_config_version` chưa đổi kể từ lúc build; đổi ⇒ `TAG_VERSION_STALE`, abort với `abort_reason = 'tag_version_stale'`."
        - "`embedding_generation` active chưa đổi; đổi ⇒ `abort_reason = 'embedding_generation_mismatch'` (I12)."
        - "Thua CAS ⇒ `abort_reason = 'cas_conflict'`, error `CONFLICT`."
    commit_point: "Một transaction. Không gọi mạng bên trong (SRC-PLAN §5.1) — digest đi qua outbox."
    external_observer:
      before_commit: "Kỳ chưa xuất hiện ở Reports; coverage hiện hành vẫn là cửa sổ cũ."
      after_commit: "Report + items + coverage window mới + ledger + intent xuất hiện đồng thời."
      never_observable: "Coverage đã tiến mà report chưa publish; hai cửa sổ cùng nối sau một cửa sổ; digest intent cho kỳ rỗng."
    oracle:
      - "Với mọi cửa sổ có predecessor: `window_from` bằng `coverage_window.window_to` và `ingest_sequence_from` bằng `coverage_window.ingest_sequence_to` của cửa sổ liền trước (I06, nối liền trên CẢ HAI trục)."
      - "`#report[owner_id, report_build_id]` <= 1 với mọi khóa."
      - "Replay `report.publish` cùng `report_build_id`: `#coverage_window` không đổi, `#report_item` không đổi, `#outbox_intent` không đổi."
      - "`#backfill_ledger[subscription_identity_hash = H AND consumed_in_report_id IS NOT NULL]` <= 1 với mọi H — kể cả sau add–remove–readd (REQ-D28)."
      - "Kỳ rỗng: `#outbox_intent[kind='report_digest']` = 0 VÀ tồn tại `coverage_window` mới VÀ `report.abort_reason = 'empty_period'`."
      - "Mọi hàng `report.status = 'aborted'` có `abort_reason` NOT NULL (CHECK `ck_report_abort_reason`)."
    failure_timeline:
      - {point: "Thua CAS", server_state: "rollback; report → aborted + abort_reason='cas_conflict'", client_sees: "CONFLICT", recovery: "đọc lại cửa sổ hiện hành, build lại với report_build_id MỚI"}
      - {point: "Crash giữa transaction", server_state: "rollback hoàn toàn: không coverage mới, không item, không intent", client_sees: "timeout — KHÔNG BIẾT", recovery: "replay cùng `report_build_id`; không tìm thấy hàng ⇒ chạy lại từ đầu, an toàn"}
      - {point: "COMMIT xong, ACK mất", server_state: "đã bền", client_sees: "KHÔNG BIẾT", recovery: "replay cùng `report_build_id` ⇒ tra ra hàng đã commit, KHÔNG advance coverage lần hai"}
      - {point: "Builder crash trước publish", server_state: "backfill KHÔNG bị tiêu thụ", client_sees: "—", recovery: "SRC-PLAN §9.2: không tiêu thụ backfill chỉ vì builder crash; `entitlement` vẫn `granted`"}
    forbidden_effects:
      - "Advance coverage ngoài transaction publish (B04: coverage chỉ tiến tại publish commit)."
      - "Tiêu thụ backfill khi build thất bại hoặc bị abort."
      - "Tạo digest intent cho kỳ rỗng (REQ-D57)."
      - "Ghi `aborted` mà không có `abort_reason`."
      - "Sửa report đã publish (I05)."
      - "Reset `first_announced_ledger` (I07)."
