  - name: restore_record
    entity_id: ENT-restore-record
    status: declared_only
    owner_module: MOD-backup-service
    origin: pc01_data_owner_of
    finding_ref: F-A1R1-03
    decision_refs: [R-03]
    source_refs: ["SRC-PLAN §7 I15", "SRC-PLAN §10 RESTORE_UNVERIFIED", "SRC-PLAN §11 PC08"]
    purpose: >-
      Một lần khôi phục. Sau restore, dispatcher bị KHÓA cho tới khi reconciliation xong; outbox cũ KHÔNG replay (I15).
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id (D01)."}
      - {name: backup_snapshot_id, type: string_ulid, nullable: false, constraints: "FK → backup_snapshot.id."}
      - {name: restored_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ server."}
      - {name: new_restore_generation, type: integer, nullable: false, constraints: "Giá trị mới của `outbox_intent.restore_generation`; intent generation cũ không được dispatch."}
      - {name: integrity_check_outcome, type: enum, nullable: false, constraints: "`passed` | `failed` | `not_run` — `not_run` là giá trị hợp lệ và PHẢI chặn dispatcher (RESTORE_UNVERIFIED)."}
      - {name: counts_observed, type: json, nullable: false, constraints: "Số hàng đo được sau restore, đối chiếu `backup_manifest.counts`."}
      - {name: leases_revoked, type: integer, nullable: false, constraints: "Số assignment_lease đã thu hồi trước khi mở khóa claim."}
      - {name: dispatcher_unlocked_at, type: timestamp_utc_ms, nullable: true, constraints: "NULL cho tới khi reconciliation xong."}
      - {name: operator_ack_at, type: timestamp_utc_ms, nullable: true, constraints: "Thời điểm người vận hành xác nhận đã đọc kết quả đối chiếu (điều khoản 7 của quy trình reconciliation, CR-PC08-05). NULL = chưa xác nhận."}
      - {name: operator_ack_principal, type: string, nullable: true, constraints: "Danh tính đã xác nhận. NOT NULL khi operator_ack_at NOT NULL."}
      - {name: operator_ack_note, type: string, nullable: true, constraints: "Ghi chú của người vận hành: cái gì đã mất, cái gì chấp nhận. Là bằng chứng con người đã nhìn, không phải máy tự tuyên bố."}
    keys:
      primary: [id]
      unique:
        - {name: ux_restore_record_generation, columns: [owner_id, new_restore_generation], guarantees: "Mỗi lần restore có một generation riêng, đơn điệu tăng.", does_not_guarantee: "Restore thành công KHÔNG chứng minh không mất dữ liệu — chỉ chứng minh khôi phục tới mốc của snapshot."}
    owned_by_package: PC08.
    forbidden: "Mở khóa dispatcher khi integrity_check_outcome != 'passed'; replay outbox của generation cũ; reset first_announced_ledger."

  - name: data_deletion_audit
    entity_id: ENT-data-deletion-audit
    status: declared_only
    owner_module: MOD-data-admin-service
    origin: pc01_data_owner_of
    finding_ref: F-A1R1-03
    decision_refs: [R-03, R-04]
    scenario_refs: [SC32]
    source_refs: ["SRC-SPEC §7.3", "contracts/ports.yaml → data.delete_target", "FIX-A1R1-rulings.md R-04"]
    purpose: >-
      Nhật ký bất biến của thao tác "xóa dữ liệu gốc" (thao tác THỨ HAI trong ba thao tác của
      SRC-SPEC §7.3, REQ-S7.3-05). Ghi cái gì đã bị xóa và cái gì được GIỮ LẠI.
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id (D01)."}
      - {name: scope, type: enum, nullable: false, constraints: "`target` (data.delete_target) | `all` (data.purge_all)."}
      - {name: target_key, type: string, nullable: true, constraints: "Khóa union của target bị xóa; NULL khi scope = 'all'."}
      - {name: requested_at, type: timestamp_utc_ms, nullable: false, constraints: "Giờ server."}
      - {name: confirmation_evidence, type: json, nullable: false, constraints: "Bằng chứng xác nhận: cờ xác nhận tường minh (delete_target) hoặc cụm từ gõ tay khớp challenge do server phát (purge_all, REQ-S7.3-05 'đòi xác nhận gõ tay'). KHÔNG chứa giá trị challenge ở dạng thô."}
      - {name: deleted_counts, type: json, nullable: false, constraints: "Số hàng đã xóa theo bảng."}
      - {name: preserved_counts, type: json, nullable: false, constraints: "Số hàng CỐ Ý GIỮ LẠI theo bảng — bắt buộc gồm `saved_snapshot` và các ledger. Là oracle của SC32."}
    keys:
      primary: [id]
      unique:
        - {name: ux_data_deletion_audit_target, columns: [owner_id, scope, target_key, requested_at], guarantees: "Không ghi trùng một thao tác xóa.", does_not_guarantee: "KHÔNG bảo đảm dữ liệu đã bị xóa khỏi backup: backup là artifact riêng (PC08)."}
    pc02_constraint:
      statement: >-
        `saved_snapshot` KHÔNG bị xóa bởi `data.delete_target` (REQ-D55, REQ-AC12) và
        `first_announced_ledger` không bị reset. PC02 chỉ khóa ràng buộc bất biến này;
        ngữ nghĩa đầy đủ của hai operation thuộc PC01/PC08 và scenario SC32 thuộc PC09.
      oracle: "Sau data.delete_target(T): `#saved_snapshot` không đổi, mọi `content_hash` không đổi, `#first_announced_ledger` không đổi."
    owned_by_package: "PC08 (quy trình), PC09 (SC32)."

