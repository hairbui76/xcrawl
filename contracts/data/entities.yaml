      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: report_id, type: string_ulid, nullable: false, constraints: "FK → report.id."}
      - {name: member_target_keys, type: json, nullable: false, constraints: "Mảng target_key thuộc vùng vector."}
