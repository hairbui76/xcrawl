      - {name: terms_check_at, type: timestamp_utc_ms, nullable: true, constraints: "RFC 3339 UTC mili-giây. Thời điểm owner xác nhận ĐÃ ĐỌC điều khoản của nhà cung cấp này cho đường được bật. NULL = chưa đọc ⇒ không được bật. Là mốc ghi nhận, KHÔNG phải bằng chứng về nội dung điều khoản."}
      - {name: terms_check_by, type: string, nullable: true, constraints: "Principal đã xác nhận. MVP chỉ có một owner, nhưng ghi tường minh để audit đọc được AI đã xác nhận. NOT NULL khi `terms_check_at` NOT NULL."}
      - {name: terms_doc_ref, type: string, nullable: true, constraints: "Định danh tài liệu điều khoản đã đọc: URL + ngày truy cập, hoặc phiên bản/hash nếu nhà cung cấp có đánh phiên bản. Trạng thái `KC` theo REQ-A5 — điều khoản CHƯA được đọc trong giai đoạn Pre-code (không có mạng), nên trường này khóa CHỖ ĐỂ GHI chứ không khẳng định đã đọc. Cấm điền giá trị suy đoán."}
    keys:
      primary: [id]
      unique:
        - {name: ux_provider_config_task, columns: [owner_id, task_type], guarantees: "Một cấu hình hiệu lực cho một tác vụ.", does_not_guarantee: "Không bảo đảm provider thật sự dùng được — xem provider_test_result."}
    checks:
      - {name: ck_provider_config_terms_before_enable, expression: "enabled = 0 OR terms_check_at IS NOT NULL", requirement_refs: [REQ-A5], decision_refs: [ADR-0010, CR-PC07-07], rationale_vi: "REQ-A5 và ADR-0010: đọc điều khoản của TỪNG nhà trước khi bật đường CLI/ACP cho nhà đó. Trước FIX5 điều này chỉ là văn xuôi; nay là ràng buộc kiểm được, và là dạng MẠNH của oracle SC51 mà fixture đã chờ."}
      - {name: ck_provider_config_terms_by, expression: "terms_check_at IS NULL OR terms_check_by IS NOT NULL"}
    terms_check_note_vi: >-
      Ba cột `terms_*` ghi nhận VIỆC ĐÃ ĐỌC, không thay thế việc đọc. `terms_doc_ref` là `KC`
      (REQ-A5): giai đoạn Pre-code không có mạng nên chưa nhà nào được đọc; adapter vì vậy mặc
      định `enabled = false` và CHECK ở trên giữ nguyên trạng đó cho tới khi có người đọc thật.
    owned_by_package: PC06 (capability matrix), PC08 (secret distribution).

