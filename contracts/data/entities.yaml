  - name: backfill_ledger
    entity_id: ENT-backfill-ledger
    status: declared_only
    owner_module: MOD-report-service
    source_refs: ["SRC-SPEC §3.5 D28", "SRC-PLAN §3 B04", "SRC-PLAN §9.2"]
    purpose: "Sổ tiêu thụ backfill N ngày: đúng một lần cho một subscription activation."
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id."}
      - {name: tag_id, type: string_ulid, nullable: false, constraints: "FK → tag.id."}
      - {name: activation_sequence, type: integer, nullable: false, constraints: "Lần kích hoạt thứ mấy của tag đó. add–remove–readd có phải activation mới hay không do PC04 khóa (SRC-PLAN §9.2)."}
      - {name: subscription_identity_hash, type: string, nullable: false, constraints: "sha256 hex của `owner_id + \"\\n\" + văn bản tag ĐÃ CHUẨN HÓA` (quy tắc chuẩn hóa ở contracts/reporting/time-and-tags.md §6.2). Khóa danh tính subscription: xóa tag rồi thêm lại CÙNG chữ cho cùng hash, nên backfill không được tiêu thụ lần hai (CR-PC04-02, finding F-A1R2-03)."}
      - {name: entitlement, type: enum, nullable: false, constraints: "`granted` | `consumed` | `denied_already_consumed`. Trạng thái quyền dùng backfill, tách khỏi việc đã tiêu thụ hay chưa."}
      - {name: entitlement_reason, type: string, nullable: true, constraints: "Văn bản tự do giải thích vì sao `granted`/`denied_already_consumed`. Bắt buộc có nội dung khi `entitlement = 'denied_already_consumed'` để người dùng biết vì sao tag mới thêm lại không được với ngược."}
      - {name: backfill_days, type: integer, nullable: false, constraints: "**ACCEPTED** giá trị 7 ngày (OD-20260907-01 mục 20, REQ-OQ04)."}
      - {name: consumed_in_report_id, type: string_ulid, nullable: true, constraints: "FK → report.id. NULL = chưa tiêu thụ. Crash của builder KHÔNG được tiêu thụ backfill (SRC-PLAN §9.2)."}
      - {name: consumed_at, type: timestamp_utc_ms, nullable: true, constraints: "NOT NULL khi consumed_in_report_id NOT NULL."}
    keys:
      primary: [id]
      unique:
        - {name: ux_backfill_tag_activation, columns: [owner_id, tag_id, activation_sequence]}
        - {name: ux_backfill_subscription_consumed, columns: [owner_id, subscription_identity_hash], partial: "WHERE consumed_in_report_id IS NOT NULL", guarantees: "Một subscription identity chỉ TIÊU THỤ backfill đúng một lần, kể cả sau add–remove–readd (REQ-D28 'đúng một lần').", does_not_guarantee: "KHÔNG chặn việc CẤP nhiều entitlement; chỉ chặn tiêu thụ lần hai. Cũng KHÔNG chặn lệnh 'quét lại kho' — đó là ledger riêng (rescan_ledger)."}
    owned_by_package: PC04

