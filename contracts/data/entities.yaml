  - name: analysis_task
    entity_id: ENT-analysis-task
    status: declared_only
    owner_module: MOD-analysis-service
    origin: pc01_data_owner_of
    finding_ref: F-A1R1-03
    decision_refs: [R-03]
    source_refs: ["SRC-PLAN §3 B12, B17", "SRC-PLAN §8.2", "SRC-SPEC §10.4"]
    purpose: >-
      Hàng đợi task AI. Worker nhận task từ SERVER sau ingest commit, không nhận dữ liệu trực tiếp từ collector (B12).
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id (D01)."}
      - {name: analysis_generation_id, type: string_ulid, nullable: false, constraints: "FK → analysis_generation.id."}
      - {name: target_key, type: string, nullable: false, constraints: "Khóa union."}
      - {name: task_type, type: enum, nullable: false, constraints: "`label` | `summary` | `direction_phrasing`."}
      - {name: state, type: enum, nullable: false, constraints: "`pending` | `running` | `retry_wait` | `valid` | `failed` | `unknown_attempt`. NGUỒN CÓ THẨM QUYỀN là contracts/state/analysis.yaml § enums → item_state (ruling CR-PC06-02); KHÔNG mở rộng enum ở đây. Ánh xạ tên cũ của PC02: `claimed` → `running`; `done` → `valid`; `abandoned` → `failed`."}
      - {name: claimed_by_worker_identity, type: string, nullable: true, constraints: "Ai đang giữ task. Là CON TRỎ, không phải trạng thái: NOT NULL khi state = 'running', NULL ở mọi trạng thái khác. Tách ra để `claimed` không còn là một giá trị enum (CR-PC06-02)."}
      - {name: claimed_lease_id, type: string_ulid, nullable: true, constraints: "FK → assignment_lease.id của lần claim hiện tại; NULL khi state <> 'running'. Lease hết hạn ⇒ T-AN-11 đưa state về `pending` và NULL hóa ba cột claim (I10)."}
      - {name: claimed_at, type: timestamp_utc_ms, nullable: true, constraints: "Giờ server lúc claim; NULL khi state <> 'running'."}
      - {name: enqueued_at, type: timestamp_utc_ms, nullable: false, constraints: "B17: summary được enqueue cho target mà report builder CHỌN lúc build."}
      - {name: attempt_budget_remaining, type: integer, nullable: false, constraints: ">= 0; hết budget → mục thiếu summary và vào pending_item_ledger (B17)."}
    keys:
      primary: [id]
      unique:
        - {name: ux_analysis_task_open, columns: [owner_id, analysis_generation_id], guarantees: "Một generation chỉ có một task đang mở.", does_not_guarantee: "Không bảo đảm task sẽ hoàn tất; không phải là kết quả — kết quả ở bảng `analysis` (I16)."}
    partial_index: "WHERE state NOT IN ('valid','failed')"
    state_authority:
      decision_refs: [CR-PC06-02]
      authoritative_file: contracts/state/analysis.yaml
      rule_vi: >-
        `analysis.yaml § enums → item_state` là nguồn chuẩn cho trạng thái của một MỤC phân tích;
        entities.yaml chỉ lưu giá trị đó. `initial_state = pending`; terminal `valid`, `failed`;
        quasi-terminal `unknown_attempt` (không tự động rời trạng thái ngoài chính sách rerun).
      legacy_mapping_vi:
        - "`claimed` → `running` + ba cột `claimed_*` NOT NULL."
        - "`done` → `valid`."
        - "`abandoned` → `failed`."
      note_vi: >-
        `valid` ở đây là trạng thái của TASK, khác `analysis.status = 'valid'` là KẾT QUẢ. Task
        `valid` nghĩa là đã có một kết quả được chấp nhận; ranh giới attempt/kết quả vẫn là I16.
    owned_by_package: PC06.

  - name: first_announced_ledger
    entity_id: ENT-first-announced-ledger
    status: declared_only
    owner_module: MOD-report-service
    origin: pc01_data_owner_of
    finding_ref: F-A1R1-03
    decision_refs: [R-03]
    source_refs: ["SRC-PLAN §7 I07", "SRC-SPEC §3.5 D29", "SRC-SPEC §12 AC-09", "SRC-PLAN §9.2"]
    purpose: >-
      Sổ 'công trình này được công bố lần đầu ở kỳ nào'. Là hợp đồng của I07 và là nơi CR-PC02-06 đặt quyết định merge.
    fields:
      - {name: id, type: string_ulid, nullable: false, constraints: "PK."}
      - {name: owner_id, type: string_ulid, nullable: false, constraints: "FK → owner.id (D01)."}
      - {name: canonical_work_id, type: string_ulid, nullable: false, constraints: "FK → work.id — PHẢI là work đã resolve (`identity_state = 'active'`), không bao giờ là work `merged`."}
      - {name: first_report_id, type: string_ulid, nullable: false, constraints: "FK → report.id của kỳ công bố lần đầu."}
      - {name: first_announced_at, type: timestamp_utc_ms, nullable: false, constraints: "= `report.published_at` của kỳ đó; là 'ngày D' trong REQ-AC09."}
      - {name: merge_audit_id, type: string_ulid, nullable: true, constraints: "FK → identity_merge_audit.id. NOT NULL khi hàng này là kết quả của một lần merge (work thắng kế thừa first-announcement của work thua). NULL = công bố lần đầu tự nhiên."}
      - {name: superseded_by_merge_id, type: string_ulid, nullable: true, constraints: "FK → identity_merge_audit.id nếu hàng bị thay bởi một merge sau đó."}
    keys:
      primary: [id]
      unique:
        - {name: ux_first_announced_canonical_work, columns: [owner_id, canonical_work_id], guarantees: "ĐÚNG MỘT first-announcement cho một canonical work (I07). Kỳ sau chỉ hiện dạng tham chiếu có ngày, không phải phát hiện mới (REQ-D29, REQ-AC09).", does_not_guarantee: "Không bảo đảm work đó còn khớp tag; Saved và tham chiếu lịch sử độc lập với subscription."}
    i07_interface:
      owner_package: PC04
      provided_by_pc02:
        - "UNIQUE(owner_id, canonical_work_id) — hình dạng ép I07 ở mức schema."
        - "`merge_audit_id` — điểm móc để TXN-identity-merge ghi trong CÙNG transaction merge."
        - "`identity_merge_audit.moved_counts.first_announced` — ô đếm đã dành sẵn, là oracle."
      still_open: >-
        Policy 'work thắng có kế thừa first-announcement của work thua hay không' vẫn là quyết
        định của PC04 (CR-PC02-06). PC02 chỉ khóa hình dạng bảng để PC04 không phải đổi tên cột.
      forbidden: "Reset first_announced khi restore (I15) hoặc khi quét lại kho (REQ-D28)."

  - name: delivery_attempt
    entity_id: ENT-delivery-attempt
    status: declared_only
