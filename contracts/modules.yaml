scope: >
  Registry module của Research Radar: mỗi module có ID ổn định `MOD-<kebab>`, nơi chạy, hình thức triển khai,
  dữ liệu sở hữu, operation vào/ra (trích từ contracts/ports.yaml), phạm vi secret, phạm vi network egress và
  auth scope chấp nhận. Kèm `allowed_edges` (caller → callee → operation), `forbidden_edges` có lý do,
  `denied_cases` (10 ca âm bắt buộc của PC01) và bảng `mutation_ownership`. Đây là **ranh giới quyền và ownership**,
  không bắt buộc microservices: server có thể là modular monolith (SRC-PLAN §6). File này không định nghĩa schema,
  state machine hay số timeout.
verification: >
  E0 self-validation: YAML parse + script kiểm chéo với contracts/ports.yaml (operation tồn tại hai chiều, module
  tồn tại, không trùng operation_id, mọi forbidden edge có lý do, đủ 10 denied case). Không có evidence E1–E4.
claim_ceiling: CONTRACT_READY
ratification_ref: OD-20260907-01
ratification_note_vi: >
  Owner phê chuẩn B01–B17 ngày 2026-09-07 (OD-20260907-01, authority AUTH-OWNER-20260907-02).
  A2-R4 tuyên bố phạm vi "Boundaries and rights" đủ điều kiện CONTRACT_READY khi có phê chuẩn.
  `CONTRACT_READY` khẳng định **bộ hợp đồng đủ trường, không còn quyết định chặn, ví dụ hợp lệ và
  bất hợp lệ đã được kiểm** (SRC-PLAN §2) — nó **không** khẳng định gì về runtime: E1–E4 vẫn NOT_RUN,
  chưa có code, chưa có probe. Các mục còn phụ thuộc KC mang `kc_dependency` riêng và không hạ trần
  của file.

default_deny:
  rule_vi: >
    **Mọi edge không có trong `allowed_edges` đều bị cấm.** Danh sách `forbidden_edges` và `denied_cases` chỉ liệt
    kê những trường hợp cần nêu tên vì dễ bị vi phạm; chúng **không** phải là danh sách đầy đủ các đường bị cấm.
    Thêm một edge phải sửa file này, tăng version và qua review (SRC-PLAN §6).
  enforcement_mechanisms:
    - id: ENF-import-rule
      description_vi: Quy tắc import/dependency giữa package trong cùng tiến trình server (kiểm bằng linter khi có code).
    - id: ENF-api-auth-test
      description_vi: Contract test gọi operation bằng auth scope sai và khẳng định UNAUTHORIZED + không đổi dữ liệu.
    - id: ENF-process-capability
      description_vi: Capability của tiến trình worker trên máy cá nhân (không driver DB, egress allowlist, tool bị khóa).
    - id: ENF-network-egress-allowlist
      description_vi: Danh sách host được phép gọi ra, khai trong `network_egress` của từng module.
    - id: ENF-command-allowlist
      description_vi: Allowlist lệnh Telegram (đúng ba lệnh D36) và allowlist callback target.
    - id: ENF-storage-health-guard
      description_vi: Guard theo `storage.health`; `recovery_required` khóa dispatcher và worker claim cho tới khi reconcile.
  error_code_table_vi: >
    Bảng R5-01 (ruling, ràng buộc): request HTTP bởi một **lớp principal không được phép** cho operation đó ⇒
    `UNAUTHORIZED`; lời gọi/import **trong cùng tiến trình** qua một cạnh không có trong `allowed_edges` ⇒
    `FORBIDDEN_EDGE`; thiếu **capability** tiến trình/mạng/filesystem/tool ⇒ `CAPABILITY_DENIED`; mutation của
    owner session thiếu CSRF hợp lệ ⇒ `CSRF_REJECTED`. Mỗi `forbidden_edges[]` có đúng một `denied_cases[]` với
    `expected_error_code` lấy từ bảng này, cơ chế thực thi và `scenario_refs: [SC49]`.
  attempted_edge_operation_rule_vi: >
    Quy tắc cho `denied_cases[].attempted_edge.operation` (F-A2R1-05, ruling FIX6):
    (a) callee là một `MOD-*` ⇒ trường này **chỉ** được mang tên operation khi **chính callee đó sở hữu** nó trong
    `contracts/ports.yaml`; nếu không thì phải là `null` kèm `event_type` và `operation_absent_reason_vi`. Ghi tên
    một operation mà callee không phục vụ tạo ra một oracle không chạy được.
    (b) callee là một `EXT-*` (hệ thống ngoài) ⇒ hệ thống ngoài không sở hữu operation nào của ta, nên trường này
    mang tên **port nội bộ mà kẻ vi phạm đang cố tạo ra hiệu ứng của nó** — ví dụ `telegram.send_payload` cho
    `EXT-telegram-api`, `research.fetch_work_metadata` cho `EXT-arxiv-api`, `ai.run_inference_task` cho
    `EXT-ai-provider-api`. Đọc là "module này cố tự làm việc mà chỉ port kia được phép làm". Quy ước này trước
    FIX10 **không được ghi ở đâu**; nay nó được ghi ở đây và được gate kiểm.
    Sáu case theo dạng (b): NC-04, NC-07, NC-13, NC-17, NC-25, NC-29.
  error_code_refinement_vi: >
    Hai mã nằm NGOÀI bốn dòng của bảng R5-01 vẫn được dùng, mỗi cái cho một đường đi mà bảng không mô tả — ghi ở
    đây để không ai tưởng là lệch ruling. `CR-PC01-09` **đã được Coordinator phê chuẩn** (ruling FIX6, A2-R1):
    hai mã này là mã hợp lệ cho denied case nằm ngoài bảng bốn dòng R5-01 khi đặc tả gọi tên chúng.
    (1) `UNAUTHORIZED_COMMAND` cho FE-30/FE-31/FE-33 — attempt đến qua **ingress Telegram**, nơi đặc tả bắt buộc
    **bỏ im lặng** (REQ-S11.3-02, AC-18): trả `UNAUTHORIZED` cho chat là tự xác nhận bot tồn tại. Đây là dòng
    "sai lớp principal" của bảng, được hiện thực bằng mã chuyên biệt mà `errors.yaml` đã đăng ký cho đúng đường
    này. (2) `RESTORE_UNVERIFIED` cho FE-34/FE-35 — cạnh bị chặn bởi **guard trạng thái** (`storage.health =
    recovery_required`), không phải bởi thiếu quyền: cùng một caller được phép sau khi đối soát xong. "Chưa được
    phép lúc này" khác "đường đi không tồn tại", và I15 cần phân biệt được hai thứ đó.
  evidence_note_vi: >
    Chỉ có sơ đồ là chưa đủ bằng chứng (SRC-PLAN §6). Mỗi cơ chế trên phải có scenario âm ở PC09; ở PC01 chúng là
    **NOT_RUN**.

data_owner_of_conventions:
  authority_vi: >
    Tên entity trong `contracts/data/entities.yaml` (PC02) là **thẩm quyền đặt tên**; `data_owner_of` của PC01 dùng
    đúng tên đó (ruling R-03, PKT-PC01-FIX2). Đổi tên đã áp dụng: `work_alias` → `identity_alias`;
    `ingest_checkpoint` → `checkpoint`; `lease` → `assignment_lease`; `coverage_ledger` → `coverage_window`;
    `vector` → `tag_vector`. Token `run_checkpoint_pointer` đã **bị gỡ** khỏi MOD-job-service (ruling R-01):
    chỉ có một entity `checkpoint`, do MOD-ingest-service sở hữu.
  entry_forms_vi: >
    Một phần tử của `data_owner_of` là **chuỗi** (token entity, phải khớp một `entities[].name` của PC02) hoặc
    **mapping** `{token: <tên>, kind: artifact}`. `kind: artifact` nghĩa là đối tượng vận hành, **không phải
    entity**, và bị loại khỏi phép so khớp entity↔owner: `sqlite_database_file`, `wal` (MOD-data-store),
    `readiness_snapshot_in_memory` (MOD-health-service).
  pending_entity_contracts_vi: >
    Ruling R-03 giữ nguyên 20 token (`session`, `provider_config`, `provider_test_result`, `rescan_ledger`,
    `schedule_occurrence`, `assignment`, `worker_registration`, `source_fetch_log`, `analysis_task`,
    `first_announced_ledger`, `delivery_attempt`, `delivery_receipt`, `telegram_link_code`, `telegram_update_log`,
    `secret_ref`, `task_credential`, `secret_audit`, `backup_snapshot`, `backup_manifest`, `restore_record`) và
    giao PC02 bổ sung entity contract cho từng cái.
  measured_state_vi: >
    Đo hai lần trong lúc PC02 còn đang ghi, với `contracts/data/entities.yaml` ở hai hash khác nhau —
    `321fed5fad3961a5e7543c70776b903472da991526441e7cb034cca77f3cc101` (17:5xZ) rồi
    `d91c433e749b8db00d5f6cc0e103e92983caaf9c9e62a6207ab8da2fb31bcc29` (17:59Z), cả hai đều 57 entity — và **cùng
    một kết quả**: cả 20 token trên đã có entity contract; chiều entities → PC01 owner dư **0**; sai khác
    owner_module **0**.
    Phần dư duy nhất theo chiều PC01 → entities là hai token do chính PKT-PC01-FIX2 tạo ra:
    `data_deletion_audit` và `purge_challenge` (MOD-data-admin-service) — CR-PC01-06 gửi PC02.
    PC02 có thể còn đang ghi tiếp; con số trên gắn với đúng hash nêu ở đây, không phải một tuyên bố vĩnh viễn.
  audit_refs: [F-A1R1-03, R-03]

runtimes:
  - id: RT-server
    name_vi: Server ngoài mạng nhà
    deployment_vi: Docker cho web + backend + queue + embedding; SQLite là file trên volume (SRC-SPEC §6.4).
    inbound_network_vi: Chỉ HTTPS của app + endpoint ingress Telegram.
  - id: RT-personal-machine
    name_vi: Máy cá nhân của owner
    deployment_vi: >
      Collector và analysis worker chạy như tiến trình trên máy, **không** trong container, vì Chrome phải hiện cửa
      sổ cho người dùng bấm (D09) và CLI/ACP cần phiên đăng nhập của người dùng (SRC-SPEC §6.4).
    inbound_network_vi: >
      **Không mở cổng vào**. Mọi kết nối là outbound tới backend API bằng token riêng (SRC-SPEC §6.4). Cổng debug
      của Chrome chỉ bind loopback (SRC-SPEC §11.2).
  - id: RT-browser
    name_vi: Trình duyệt của owner
    deployment_vi: Tải web app từ server; không giữ secret nào ngoài session.
    inbound_network_vi: Không.

modules:

  - id: MOD-web-ui
    name_vi: Web app
    runs_on: browser
    runtime: RT-browser
    spec_row: "SRC-SPEC §6.1 — Web app"
    purpose_vi: Giao diện Reports/Topics/Saved/Runs/Settings; đăng nhập một tài khoản duy nhất; mở được từ điện thoại (D04).
    data_owner_of: []
    inbound_operations: []
    outbound_operations: [analysis.request_reanalysis, auth.get_session, auth.login, auth.logout, data.delete_target, data.purge_all, delivery.decide_unknown, delivery.get_status, health.get_liveness, health.get_readiness, identity.resolve_conflict, report.get, report.list, run.cancel, run.get, run.list, run.resume, run.run_now, save.create, save.export, save.list, save.remove, settings.get_config, settings.test_provider, settings.update_config, tag.create, tag.delete, tag.list, tag.preview_matches, tag.rescan_corpus, tag.update, telegram.issue_link_code, telegram.unlink, work.get_detail, worker.get_status]
    auth_scope_used: [public_login, owner_session, public_minimal]
    network_egress: [server_app_origin]
    secret_access: none
    secret_note_vi: >
      Frontend **không bao giờ** nhận API key AI, token collector hay nội dung secret store (SRC-SPEC §11.2).
      settings.get_config chỉ trả tham chiếu + trạng thái đã cấu hình.
    notes_vi: Mọi lời gọi đi qua MOD-backend-api; không có đường tới SQLite, worker debug port hay Telegram/AI bằng secret.

  - id: MOD-backend-api
    name_vi: Backend + API (edge HTTP)
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Backend + API"
    role: http_edge
    purpose_vi: >
      Điểm vào HTTP duy nhất của server: TLS, xác thực actor, phân giải auth scope, correlation ID, redaction log,
      rồi định tuyến tới module sở hữu operation. Là **transit**, không sở hữu dữ liệu nghiệp vụ nào.
    data_owner_of: []
    inbound_operations: []
    outbound_operations: []
    transit_for_transports: [http]
    auth_scope_used: [public_login, owner_session, owner_session_or_linked_chat, collector_token, analysis_worker_token, collector_token_or_analysis_worker_token, backup_operator, telegram_ingress_secret, public_minimal]
    network_egress: []
    secret_access: none
    notes_vi: >
      Mọi operation `transport: http` trong contracts/ports.yaml đi qua module này; vì vậy nó không xuất hiện trong
      `allowed_edges` như một hop riêng. Nó **không** được tự quyết định nghiệp vụ hay ghi bảng của module khác.

  - id: MOD-auth-service
    name_vi: Dịch vụ đăng nhập một tài khoản
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §11.1 — một tài khoản đăng nhập duy nhất"
    purpose_vi: Xác thực owner, cấp/thu hồi session; không có signup, không có quên-mật-khẩu tự động (D05).
    data_owner_of: [owner, session]
    inbound_operations: [auth.get_session, auth.login, auth.logout]
    outbound_operations: []
    auth_scope_used: [public_login, owner_session]
    network_egress: []
    secret_access: owner
    secret_note_vi: Sở hữu credential đăng nhập của owner (hash) và khóa ký session; PC08 chốt lifecycle.

  - id: MOD-settings-service
    name_vi: Dịch vụ cấu hình
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §4 — Settings"
    purpose_vi: Lịch, timezone IANA, giới hạn đợt, N ngày với ngược, provider/model theo tác vụ, model embedding, key.
    data_owner_of: [settings, provider_config, provider_test_result, source_connection]
    inbound_operations: [settings.get_config, settings.test_provider, settings.update_config]
    outbound_operations: [embedding.start_generation_rebuild, secret.store_provider_key]
    auth_scope_used: [owner_session, internal_only]
    network_egress: [ai_provider_endpoints_configured]
    secret_access: scoped
    secret_note_vi: >
      Nhận key từ owner một lần và chuyển ngay cho MOD-secret-service; **không** đọc lại giá trị key sau khi lưu và
      không trả về frontend.

  - id: MOD-tag-service
    name_vi: Dịch vụ tag / subscription
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §8.1 lớp Subscription"
    purpose_vi: Tag, từ đồng nghĩa, tag loại trừ, phiên bản cấu hình tag, xem nhãn đang khớp, quét lại kho.
    data_owner_of: [tag, tag_alias, tag_exclusion, tag_config_version, rescan_ledger]
    inbound_operations: [tag.create, tag.delete, tag.freeze_config_version, tag.get_active_config_version, tag.list, tag.preview_matches, tag.rescan_corpus, tag.update]
    outbound_operations: [embedding.generate_vectors, embedding.get_active_generation]
    auth_scope_used: [owner_session, internal_only]
    network_egress: []
    secret_access: none
    notes_vi: >
      Chỉ module này ghi tag và tag_config_version. Collector và analysis worker **không** có đường sửa tag
      (denied case NC-02); collector chỉ nhận tag như tham số **tìm kiếm** trong assignment (D24).

  - id: MOD-scheduler
    name_vi: Scheduler
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-PLAN §6 — Scheduler"
    purpose_vi: Tính mốc lịch tới hạn theo timezone IANA của owner; giờ lịch là "sớm nhất được chạy" (D13).
    data_owner_of: [schedule_occurrence]
    inbound_operations: [scheduler.evaluate_due]
    outbound_operations: [job.coalesce_overdue, job.enqueue_scheduled_run, scheduler.evaluate_due]
    auth_scope_used: [internal_only]
    network_egress: []
    secret_access: none
    notes_vi: >
      Scheduler **chỉ** nói chuyện với job service. Không gọi Chrome, không gửi digest, không đánh dấu report đã
      giao (SRC-PLAN §6, denied case NC-09).

  - id: MOD-job-service
    name_vi: Job queue + vòng đời run + lease của worker
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Job queue"
    purpose_vi: >
      Xếp hàng run theo lịch và lệnh tay, gộp đợt quá hạn, cấp assignment/lease cho collector, giữ trạng thái run
      (`phase/status/outcome/stop_reason` theo B02) và trạng thái readiness của worker.
    data_owner_of: [run, assignment, assignment_lease, worker_registration]
    inbound_operations: [job.coalesce_overdue, job.enqueue_scheduled_run, run.cancel, run.get, run.list, run.resume, run.run_now, worker.claim_assignment, worker.get_status, worker.heartbeat, worker.register_capabilities, worker.release_assignment, worker.report_stop]
    outbound_operations: [delivery.create_intent, ingest.get_checkpoint, report.build, storage.get_health]
    auth_scope_used: [owner_session, owner_session_or_linked_chat, collector_token, analysis_worker_token, collector_token_or_analysis_worker_token, internal_only]
    network_egress: []
    secret_access: none
    notes_vi: >
      Là owner duy nhất của mutation trạng thái run. `run.resume` chỉ đến từ app (B10); lệnh Telegram không có
      đường tới nó.

  - id: MOD-ingest-service
    name_vi: Dịch vụ nhận dữ liệu từ collector
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Backend + API (nhận dữ liệu từ collector)"
    purpose_vi: Nhận lô post, dedup theo `x_post_id`, cấp `discovered_at` phía server + ingest sequence, ghi receipt và checkpoint.
    data_owner_of: [post, post_work, ingest_receipt, checkpoint]
    inbound_operations: [ingest.commit_checkpoint, ingest.get_checkpoint, ingest.get_receipt, ingest.submit_batch]
    outbound_operations: [analysis.enqueue_tasks, embedding.generate_vectors, identity.merge_works, identity.quarantine_conflict, identity.record_alias, identity.resolve_target, research.fetch_work_metadata]
    outbound_note_vi: >
      Gọi identity.merge_works khi đường làm giàu metadata (ingest → research.fetch_work_metadata → nguồn) phát
      hiện một liên kết DOI↔arXiv chứng minh hai `work` đã tồn tại là cùng công trình. MOD-research-connector
      **không** phải caller: nó là connector chỉ-đọc, trả metadata về cho ingest và không ghi dữ liệu authoritative
      (xem `denied_capabilities` DC-RC-03 trong contracts/capabilities.yaml).
    auth_scope_used: [collector_token, internal_only]
    network_egress: []
    secret_access: none
    notes_vi: >
      ACK chỉ sau commit (I02). Đây là **điểm duy nhất** dữ liệu thu thập đi vào hệ thống; analysis nhận task từ
      server **sau ingest commit**, không nhận dữ liệu trực tiếp từ collector (B12 — edge COL→AW của SRC-SPEC §6.2 bị gỡ).

  - id: MOD-identity-service
    name_vi: Dịch vụ canonical identity
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-PLAN §6.1 — backend domain sở hữu post/work identity"
    purpose_vi: Chuẩn hóa DOI/arXiv, phân giải target `work|post`, alias, cách ly xung đột, merge do owner quyết.
    data_owner_of: [work, identity_alias, identity_conflict, identity_merge_audit, work_version]
    inbound_operations: [identity.merge_works, identity.quarantine_conflict, identity.record_alias, identity.resolve_conflict, identity.resolve_target, work.get_detail]
    outbound_operations: [identity.merge_works]
    outbound_note_vi: >
      identity.merge_works là port nội bộ do chính module này gọi khi identity.resolve_conflict được owner quyết
      định `merge`; đó là đường merge duy nhất.
    auth_scope_used: [owner_session, internal_only]
    network_egress: []
    secret_access: none
    notes_vi: "\"0 trùng\" chỉ có nghĩa trên canonical identity đã biết; xung đột đi vào `identity_conflict`, không merge đoán (B15)."

  - id: MOD-research-connector
    name_vi: Research sources connector (arXiv/OpenAlex)
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Research sources"
    purpose_vi: Lấy metadata/abstract/provenance qua API chính thức từ server (D32); tôn trọng nhịp gọi và yêu cầu định danh (A6).
    data_owner_of: [source_fetch_log]
    inbound_operations: [research.fetch_work_metadata, research.get_connector_health]
    outbound_operations: []
    auth_scope_used: [internal_only]
    network_egress: [arxiv_api, openalex_api]
    secret_access: scoped
    secret_note_vi: Chỉ email liên hệ/định danh mà OpenAlex yêu cầu (A6); không có key AI.
    notes_vi: >
      **Không** điều khiển Chrome và **không** nhận chỉ dẫn fetch URL tùy ý từ model (SRC-PLAN §6, denied case NC-08).
      Chỉ nhận DOI/arXiv ID đã chuẩn hóa.

  - id: MOD-embedding-service
    name_vi: Embedding service (model local, server)
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Embedding service"
    purpose_vi: Sinh vector cho nhãn và tag bằng model local; quản lý generation (model, phiên bản, dimension).
    data_owner_of: [tag_vector, embedding_generation]
    inbound_operations: [embedding.activate_generation, embedding.generate_vectors, embedding.get_active_generation, embedding.start_generation_rebuild]
    outbound_operations: [embedding.activate_generation]
    auth_scope_used: [internal_only]
    network_egress: []
    network_note_vi: >
      Không gọi provider API và không gọi CLI (SRC-SPEC §10.1: embedding **chỉ local**). Nhờ vậy luồng không có API
      key nào vẫn hoàn tất (AC-16). Model được nạp từ artifact cục bộ trên server, không tải về lúc chạy.
    secret_access: none

  - id: MOD-analysis-service
    name_vi: Dịch vụ phân tích phía server (task authority)
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-PLAN §6 — Local analysis worker → Analysis API"
    purpose_vi: >
      Tạo task phân tích từ dữ liệu **đã commit**, cấp task/lease cho analysis worker, nhận kết quả đúng schema,
      giữ generation và `analysis_key` (B07).
    data_owner_of: [analysis_task, analysis, analysis_generation, analysis_attempt, work_label]
    inbound_operations: [analysis.claim_task, analysis.enqueue_tasks, analysis.get_task_input, analysis.heartbeat, analysis.report_attempt_unknown, analysis.request_reanalysis, analysis.submit_result]
    outbound_operations: [secret.revoke_task_credential]
    auth_scope_used: [owner_session, analysis_worker_token, internal_only]
    network_egress: []
    secret_access: none
    notes_vi: >
      Analysis worker chỉ **đề xuất** kết quả qua port; nó không được tự quyết "work này đã báo cáo"
      (SRC-PLAN §6.1). Kết quả sai schema không được commit thành `valid`.

  - id: MOD-report-service
    name_vi: Report builder / report service
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Report builder"
    purpose_vi: >
      Chọn mục theo tag hiện tại (truy vấn embedding), tính khối "hướng đang nổi", dựng kỳ nối liền, publish bằng
      transaction CAS và tạo delivery intent.
    data_owner_of: [report, report_item, emerging_direction, coverage_window, first_announced_ledger, backfill_ledger, pending_item_ledger]
    inbound_operations: [report.build, report.get, report.list, report.publish]
    outbound_operations: [analysis.enqueue_tasks, delivery.create_intent, embedding.generate_vectors, embedding.get_active_generation, identity.resolve_target, report.publish, tag.freeze_config_version, tag.get_active_config_version]
    auth_scope_used: [owner_session, internal_only]
    network_egress: []
    secret_access: none
    notes_vi: >
      Sở hữu `first_announced` và coverage (SRC-PLAN §6.1). **Không** gửi Telegram trực tiếp và **không** sửa
      analysis đã commit; delivery không đổi nội dung report đã publish (B01).

  - id: MOD-saved-service
    name_vi: Dịch vụ Saved
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §4 — Saved"
    purpose_vi: Save/bỏ lưu/danh sách/export; snapshot bất biến lúc lưu (D55).
    data_owner_of: [saved_item, saved_snapshot]
    inbound_operations: [save.create, save.export, save.list, save.remove]
    outbound_operations: []
    auth_scope_used: [owner_session, owner_session_or_linked_chat]
    network_egress: []
    secret_access: none
    notes_vi: >
      UNIQUE(owner, target) chống trùng khi Save đồng thời từ app và Telegram (D38/AC-13). Bỏ tag không xóa
      snapshot (I08). Collector **không** có đường tới đây (denied case NC-01).

  - id: MOD-delivery-service
    name_vi: Delivery / outbox
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-PLAN §8.3 — delivery lifecycle"
    purpose_vi: Giữ intent đã commit, dispatch theo part, ghi receipt, đánh dấu `unknown`, nhận quyết định operator.
    data_owner_of: [delivery, delivery_part, delivery_attempt, delivery_receipt, outbox_intent]
    inbound_operations: [delivery.create_intent, delivery.decide_unknown, delivery.dispatch_next, delivery.get_status, delivery.mark_unknown, delivery.record_receipt]
    outbound_operations: [delivery.dispatch_next, delivery.mark_unknown, delivery.record_receipt, telegram.send_payload]
    auth_scope_used: [owner_session, internal_only]
    network_egress: []
    network_note_vi: Không tự gọi mạng ngoài; hành vi mạng Telegram thuộc MOD-telegram-adapter.
    secret_access: none
    notes_vi: >
      Telegram lỗi **không** làm report biến mất hay run đổi thành thất bại thu thập (I09). Part `unknown` không
      được retry tự động (B03).

  - id: MOD-telegram-adapter
    name_vi: Telegram adapter
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Telegram adapter"
    purpose_vi: >
      Xác thực update ingress, thực thi đúng ba lệnh được phép, quản lý liên kết bằng mã một lần, gửi payload đã
      đóng tới recipient đã liên kết.
    data_owner_of: [telegram_link, telegram_link_code, telegram_link_attempt, telegram_update_log]
    data_owner_of_note_vi: >
      `telegram_link_attempt` là nguồn đếm cho rate-limit của ngoại lệ liên kết hẹp B09: một chuỗi đúng định dạng
      mã liên kết từ chat CHƯA liên kết được đối chiếu với mã chưa hết hạn/chưa dùng, và số lần thử phải bị giới
      hạn — nếu không, ngoại lệ hẹp đó thành một oracle dò mã miễn phí. Chủ sở hữu là MOD-telegram-adapter vì
      chính nó xử lý ingress và biết chat nào đã thử (ruling CR-PC02-16). Việc bị từ chối vẫn **bỏ im lặng** phía
      chat (REQ-S11.3-02): đếm để chặn, không để trả lời.
    inbound_operations: [telegram.consume_link_code, telegram.execute_command, telegram.issue_link_code, telegram.receive_update, telegram.send_payload, telegram.unlink]
    outbound_operations: [run.list, run.run_now, save.create, telegram.consume_link_code, telegram.execute_command]
    auth_scope_used: [owner_session, telegram_ingress_secret, internal_only]
    network_egress: [telegram_bot_api]
    secret_access: scoped
    secret_note_vi: Chỉ bot token của Telegram; **không** có quyền đọc key AI (denied case NC-06 liên quan).
    notes_vi: >
      Sở hữu hành vi mạng Telegram nhưng chỉ được gửi một intent hợp lệ tới linked owner; **nội dung nguồn không
      định nghĩa recipient** (SRC-PLAN §6.1, I11). Không sửa SQLite trực tiếp, không sửa tag/cấu hình.

  - id: MOD-secret-service
    name_vi: Secret service
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §11.2 — secret store phía server"
    purpose_vi: Lưu API key AI, cấp credential ngắn hạn theo từng task cho analysis worker, thu hồi khi task kết thúc.
    data_owner_of: [secret_ref, task_credential, secret_audit]
    inbound_operations: [secret.issue_task_credential, secret.revoke_task_credential, secret.store_provider_key]
    outbound_operations: []
    auth_scope_used: [analysis_worker_token, internal_only]
    network_egress: []
    secret_access: owner
    secret_note_vi: >
      Module duy nhất đọc được giá trị key ở server. Worker chỉ nhận credential **của provider gắn với task được
      giao**, ngắn hạn (B13). Phiên X và phiên CLI ở lại máy cá nhân, không đồng bộ lên server.

  - id: MOD-data-admin-service
    name_vi: Dịch vụ vòng đời dữ liệu (xóa có chủ đích)
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §7.3 — ba thao tác riêng: bỏ lưu / xóa dữ liệu gốc / xóa toàn bộ"
    purpose_vi: >
      Sở hữu hai mutation phá hủy của REQ-S7.3-05: `data.delete_target` (xóa dữ liệu gốc của một target) và
      `data.purge_all` (xóa toàn bộ dữ liệu, đòi xác nhận gõ tay). Tách thành module riêng để mutation phá hủy có
      **đúng một** owner và không nằm lẫn trong module nghiệp vụ thường ngày.
    data_owner_of: [data_deletion_audit, purge_challenge]
    inbound_operations: [data.delete_target, data.purge_all]
    outbound_operations: []
    auth_scope_used: [owner_session]
    network_egress: []
    secret_access: none
    cross_scope_note_vi: >
      Đây là **ngoại lệ duy nhất** với quy tắc repository port theo phạm vi bảng (DC-SRV-01): hai operation này
      xóa dữ liệu do nhiều module khác sở hữu, trong một transaction. Ngoại lệ được giới hạn bằng ba điều kiện:
      (1) chỉ hai operation này, (2) chỉ thao tác **xóa** — không sửa, không tạo, (3) phạm vi giữ lại được liệt kê
      tường minh trong contracts/ports.yaml (`preserved_vi`). Danh sách bảng cascade cuối cùng do PC02 chốt
      (CR-PC01-05); quy trình vận hành `maintenance` do PC08 chốt.
    status: ACCEPTED
    ratification_ref: OD-20260907-01
    ratification_note_vi: >
      OD-20260907-01 mục 24 chốt phạm vi `data.purge_all` (chỉ dữ liệu nghiên cứu), nên module này không còn bị
      chặn. Ngoại lệ repository-scope của nó giữ nguyên như mô tả ở `cross_scope_note_vi`.
    audit_refs: [F-A1R1-04, R-04]

  - id: MOD-data-store
    name_vi: Data store (SQLite)
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-SPEC §6.1 — Data store (SQLite)"
    purpose_vi: Nguồn dữ liệu chuẩn duy nhất (D07); file trên volume của server.
    data_owner_of:
      - {token: sqlite_database_file, kind: artifact}
      - {token: wal, kind: artifact}
      - schema_migration
      - maintenance_window   # AMD-ENT-maintenance-01 / CR-PC02-24: cửa sổ bảo trì do Operator mở, ghi bởi T-ST-03/-04/-09 của contracts/state/storage.yaml
    inbound_operations: [storage.get_health]
    outbound_operations: []
    auth_scope_used: [internal_only]
    network_egress: []
    secret_access: none
    repository_ports_vi: >
      Các module domain truy cập DB qua **repository port theo phạm vi bảng** của chính chúng (`data_owner_of` ở
      trên là danh sách phạm vi đó). Không module nào được chọn bảng/path/query tùy ý ngoài phạm vi của mình
      (SRC-PLAN §6). Danh sách bảng/cột chuẩn do PC02 chốt trong contracts/data/entities.yaml; PC01 chỉ chốt
      **ai sở hữu mutation của phạm vi nào**.
    notes_vi: >
      Không có tiến trình nào ngoài server mở được file này; máy cá nhân **không có** driver/đường mạng tới DB
      (denied case NC-05). WAL là một phần trạng thái bền (SRC-PLAN §3.1).

  - id: MOD-backup-service
    name_vi: Backup/restore service
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-PLAN §6 — Backup operator → Backup/restore port có maintenance guard"
    purpose_vi: Snapshot nhất quán (Online Backup API hoặc VACUUM INTO) + manifest; restore có khóa side effect; reconcile.
    data_owner_of: [backup_snapshot, backup_manifest, restore_record]
    inbound_operations: [backup.create_snapshot, backup.reconcile_after_restore, backup.restore_snapshot, backup.verify_snapshot]
    outbound_operations: []
    auth_scope_used: [backup_operator]
    network_egress: [backup_destination_configured]
    secret_access: scoped
    secret_note_vi: Chỉ credential của đích lưu backup; kế hoạch khôi phục secret do PC08 chốt.
    notes_vi: Sau restore, dispatcher và worker claim bị khóa cho tới khi reconcile xong (I15, denied case NC-10).

  - id: MOD-backup-cli
    name_vi: Công cụ vận hành backup (do backup operator chạy trên server)
    runs_on: server
    runtime: RT-server
    deployment_vi: Tiến trình CLI trên server, gọi các operation backup.* qua loopback với auth scope riêng.
    purpose_vi: Giao diện thao tác của actor "backup operator"; tách khỏi session owner của web app.
    data_owner_of: []
    inbound_operations: []
    outbound_operations: [backup.create_snapshot, backup.reconcile_after_restore, backup.restore_snapshot, backup.verify_snapshot]
    auth_scope_used: [backup_operator]
    network_egress: [server_loopback]
    secret_access: scoped
    secret_note_vi: Giữ credential `backup_operator`, không phải session owner và không phải key AI.

  - id: MOD-health-service
    name_vi: Health/readiness service
    runs_on: server
    runtime: RT-server
    spec_row: "SRC-PLAN §8.4 — readiness/health channel độc lập"
    purpose_vi: Kênh liveness/readiness **độc lập DB** để báo được cả khi không ghi được vào SQLite.
    data_owner_of:
      - {token: readiness_snapshot_in_memory, kind: artifact}
    inbound_operations: [health.get_liveness, health.get_readiness]
    outbound_operations: [research.get_connector_health, storage.get_health]
    auth_scope_used: [public_minimal, owner_session, internal_only]
    network_egress: []
    secret_access: none
    notes_vi: >
      `health.get_liveness` chỉ trả `up` + schema version; mọi chi tiết cần `owner_session`. Không tuyên bố đã
      persist lỗi khi DB không ghi được (SRC-PLAN §8.4).

  - id: MOD-x-collector
    name_vi: X collector
    runs_on: personal_machine
    runtime: RT-personal-machine
    spec_row: "SRC-SPEC §6.1 — X collector"
    deployment_vi: Tiến trình trên máy, không container; điều khiển Chrome thật với **profile riêng của dự án** (D09).
    purpose_vi: Kéo việc khi online, đọc X trong phiên của owner, phát hiện điểm dừng và bị chặn, nộp lô post về server.
    data_owner_of: []
    data_ownership_note_vi: >
      Collector **không sở hữu** dữ liệu authoritative nào. Nó chỉ đề xuất dữ liệu qua ingest.submit_batch; server
      quyết định `discovered_at`, dedup và commit (I02).
    inbound_operations: []
    inbound_note_vi: Không có operation vào; máy cá nhân **không mở cổng** (SRC-SPEC §6.4).
    outbound_operations: [health.get_liveness, ingest.commit_checkpoint, ingest.get_receipt, ingest.submit_batch, worker.claim_assignment, worker.heartbeat, worker.register_capabilities, worker.release_assignment, worker.report_stop]
    auth_scope_used: [collector_token, public_minimal]
    network_egress: [server_api_origin, x_web]
    secret_access: scoped
    secret_note_vi: >
      Chỉ token collector→backend (file cấu hình quyền hạn chế trên máy cá nhân) và phiên X nằm trong profile
      Chrome riêng. **Không** có key AI, **không** có token Telegram (SRC-SPEC §11.2).
    filesystem_scope_vi: Thư mục profile Chrome riêng của dự án + file cấu hình token; không đụng profile mặc định của người dùng.
    forbidden_summary_vi: >
      Không ghi SQLite, không gọi Telegram, không lấy secret AI, không xếp hàng analysis trực tiếp, không gọi Save
      (SRC-PLAN §6).

  - id: MOD-analysis-worker
    name_vi: Analysis worker
    runs_on: personal_machine
    runtime: RT-personal-machine
    spec_row: "SRC-SPEC §6.1 — Analysis worker"
    deployment_vi: Tiến trình trên máy, không container; cùng máy với collector vì đường CLI/ACP chỉ tồn tại nơi có phiên đăng nhập (D42).
    purpose_vi: Nhận task từ server, gọi AI adapter, nộp kết quả đúng schema, báo attempt không rõ.
    data_owner_of: []
    data_ownership_note_vi: Worker chỉ đề xuất kết quả qua port; owner của `analysis` là MOD-analysis-service (SRC-PLAN §6.1).
    inbound_operations: []
    inbound_note_vi: Không có operation vào; kết nối chỉ đi ra.
    outbound_operations: [ai.probe_provider_capability, ai.run_inference_task, analysis.claim_task, analysis.get_task_input, analysis.heartbeat, analysis.report_attempt_unknown, analysis.submit_result, health.get_liveness, secret.issue_task_credential, worker.register_capabilities]
    auth_scope_used: [analysis_worker_token, public_minimal]
    network_egress: [server_api_origin]
    secret_access: scoped
    secret_note_vi: >
      Chỉ token analysis worker→backend và **credential ngắn hạn của đúng provider cho task đang giữ lease** (B13).
      Không nhận toàn bộ secret store.
    forbidden_summary_vi: Không sửa tag/report/Saved, không tự publish, không lấy toàn bộ secrets (SRC-PLAN §6).

  - id: MOD-ai-adapter
    name_vi: AI adapter (API key và CLI/ACP)
    runs_on: personal_machine
    runtime: RT-personal-machine
    spec_row: "SRC-SPEC §6.1 — AI adapter"
    purpose_vi: "Giao ước duy nhất: prompt + schema → JSON đúng schema (SRC-SPEC §10.2); hai họ provider API key và CLI/ACP."
    data_owner_of: []
    inbound_operations: [ai.probe_provider_capability, ai.run_inference_task]
    outbound_operations: []
    auth_scope_used: [internal_only]
    network_egress: [ai_provider_endpoints_configured]
    network_note_vi: >
      Chỉ endpoint của provider được cấu hình cho task đang chạy. **Không** fetch URL tùy ý, không đọc file ngoài
      phạm vi, không gọi tool (denied case NC-07). Đường CLI/ACP chạy với tool/file/network bị khóa ngoài phần
      inference; provider nào không kiểm chứng được cô lập thì adapter **giữ nguyên trạng thái disabled** (B13).
    secret_access: scoped
    secret_note_vi: Nhận credential theo từng task từ worker; không lưu lâu dài, không ghi vào log.
    filesystem_scope_vi: Chỉ thư mục làm việc của worker; không truy cập profile Chrome, không truy cập file cấu hình token của collector.

external_systems:
  - id: EXT-telegram-api
    name_vi: Telegram Bot API
    direction: [inbound_webhook_to_server, outbound_from_telegram_adapter]
    notes_vi: >
      Không có idempotency key do client cung cấp cho `sendMessage` (SRC-PLAN §3.1); vì vậy UNIQUE ở DB **không**
      chứng minh exactly-once. Là caller của telegram.receive_update.
  - id: EXT-x-web
    name_vi: Giao diện web X trong Chrome profile riêng
    direction: [outbound_from_collector]
    notes_vi: >
      Chỉ MOD-x-collector chạm tới. Không có cơ chế né CAPTCHA, giả fingerprint, luân chuyển account hay proxy
      (SRC-SPEC §2.3, §13.2). Bị chặn thì dừng và báo.
  - id: EXT-arxiv-api
    name_vi: arXiv API
    direction: [outbound_from_research_connector]
    notes_vi: Nhịp gọi và yêu cầu định danh đọc từ tài liệu chính thức khi triển khai (A6/D34).
  - id: EXT-openalex-api
    name_vi: OpenAlex API
    direction: [outbound_from_research_connector]
    notes_vi: Yêu cầu email liên hệ theo tài liệu chính thức (A6/D34).
  - id: EXT-ai-provider-api
    name_vi: Provider AI đường API key
    direction: [outbound_from_ai_adapter, outbound_from_settings_service_test]
    notes_vi: Chỉ provider đã cấu hình cho task; usage đếm token thật.
  - id: EXT-ai-cli-acp
    name_vi: CLI/ACP local của provider
    direction: [outbound_from_ai_adapter]
    notes_vi: >
      Dùng phiên đăng nhập trên máy cá nhân; song song = 1; usage được phép `unknown` (D43/D44). Điều khoản từng
      nhà phải đọc trước khi bật (A5).
  - id: EXT-chrome-profile
    name_vi: Profile Chrome riêng của dự án (tài nguyên trên máy cá nhân)
    direction: [local_resource_of_collector]
    notes_vi: Cổng debug chỉ bind loopback, không mở ra LAN hay reverse proxy (SRC-SPEC §11.2).

