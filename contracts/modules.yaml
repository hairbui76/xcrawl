# ---------------------------------------------------------------------------
# mutation_ownership: một owner cho một mutation (SRC-PLAN §5, §6.1).
# ---------------------------------------------------------------------------
mutation_ownership:
  rule_vi: >
    Mỗi phạm vi dữ liệu authoritative có **đúng một** module sở hữu mutation. Module khác chỉ đọc qua port hoặc
    đề xuất qua operation của owner. Không actor nào giữ hai vai owner cho cùng một mutation.
  table:
    - scope: session / owner credential
      owner_module: MOD-auth-service
      mutating_operations: [auth.login, auth.logout]
    - scope: settings / provider config
      owner_module: MOD-settings-service
      mutating_operations: [settings.update_config, settings.test_provider]
    - scope: tag / alias / exclusion / tag_config_version / rescan ledger
      owner_module: MOD-tag-service
      mutating_operations: [tag.create, tag.update, tag.delete, tag.rescan_corpus, tag.freeze_config_version]
    - scope: run / assignment / assignment_lease / worker registration
      owner_module: MOD-job-service
      mutating_operations: [run.run_now, run.resume, run.cancel, job.enqueue_scheduled_run, job.coalesce_overdue, worker.register_capabilities, worker.claim_assignment, worker.heartbeat, worker.report_stop, worker.release_assignment]
    - scope: post / post_work / ingest receipt / checkpoint
      owner_module: MOD-ingest-service
      mutating_operations: [ingest.submit_batch, ingest.commit_checkpoint]
    - scope: work / alias / identity conflict / merge audit
      owner_module: MOD-identity-service
      mutating_operations: [identity.record_alias, identity.quarantine_conflict, identity.resolve_conflict, identity.merge_works]
    - scope: analysis task / analysis / generation / work_label
      owner_module: MOD-analysis-service
      mutating_operations: [analysis.enqueue_tasks, analysis.claim_task, analysis.heartbeat, analysis.submit_result, analysis.report_attempt_unknown, analysis.request_reanalysis]
    - scope: vector / embedding generation
      owner_module: MOD-embedding-service
      mutating_operations: [embedding.generate_vectors, embedding.start_generation_rebuild, embedding.activate_generation]
    - scope: report / report_item / coverage / first_announced / backfill / pending ledger
      owner_module: MOD-report-service
      mutating_operations: [report.build, report.publish]
    - scope: saved_item / snapshot
      owner_module: MOD-saved-service
      mutating_operations: [save.create, save.remove]
    - scope: delivery / part / attempt / receipt
      owner_module: MOD-delivery-service
      mutating_operations: [delivery.create_intent, delivery.dispatch_next, delivery.record_receipt, delivery.mark_unknown, delivery.decide_unknown]
    - scope: telegram link / link code / update log / gửi payload
      owner_module: MOD-telegram-adapter
      mutating_operations: [telegram.receive_update, telegram.execute_command, telegram.issue_link_code, telegram.consume_link_code, telegram.unlink, telegram.send_payload]
    - scope: vòng đời dữ liệu phá hủy (xóa target, xóa toàn bộ) / audit xóa / purge challenge
      owner_module: MOD-data-admin-service
      mutating_operations: [data.delete_target, data.purge_all]
    - scope: secret ref / task credential
      owner_module: MOD-secret-service
      mutating_operations: [secret.store_provider_key, secret.issue_task_credential, secret.revoke_task_credential]
    - scope: backup snapshot / restore record
      owner_module: MOD-backup-service
      mutating_operations: [backup.create_snapshot, backup.verify_snapshot, backup.restore_snapshot, backup.reconcile_after_restore]
  no_owner_modules_vi: >
    MOD-web-ui, MOD-backend-api, MOD-x-collector, MOD-analysis-worker, MOD-ai-adapter, MOD-scheduler,
    MOD-backup-cli, MOD-health-service và MOD-data-store **không sở hữu mutation nghiệp vụ nào**: hai module đầu là
    giao diện/transit, ba module tiếp theo chạy trên máy cá nhân và chỉ đề xuất qua port, scheduler chỉ kích hoạt
    job service, backup-cli chỉ là giao diện của actor, health chỉ đọc, data-store chỉ là nơi lưu.
  entity_without_operation_vi: >
    `schema_migration` (MOD-data-store) có owner nhưng **không** có operation nào trong inventory ghi nó: migration
    là hoạt động triển khai, chạy lúc khởi động/nâng cấp, không phải một operation của ứng dụng. Ghi rõ ở đây để
    phép kiểm "mọi mutation có owner" không bị hiểu nhầm thành "mọi entity có mutation operation". PC08 mô tả quy
    trình migration trong runbook.

