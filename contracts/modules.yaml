# ---------------------------------------------------------------------------
# forbidden_edges: các đường bị cấm cần nêu tên (không đầy đủ — default deny vẫn áp dụng).
# ---------------------------------------------------------------------------
forbidden_edges:
  - id: FE-01
    caller: MOD-web-ui
    callee: MOD-data-store
    reason_vi: Frontend không truy cập SQLite trực tiếp; mọi mutation đi qua domain port đã xác thực (I01, SRC-PLAN §6).
    enforcement: [ENF-network-egress-allowlist, ENF-api-auth-test]
  - id: FE-02
    caller: MOD-web-ui
    callee: MOD-secret-service
    reason_vi: Frontend không có đường đọc secret; không operation HTTP nào trả giá trị key (SRC-SPEC §11.2).
    enforcement: [ENF-api-auth-test, ENF-import-rule]
  - id: FE-03
    caller: MOD-web-ui
    callee: EXT-ai-provider-api
    reason_vi: Frontend không gọi provider AI bằng secret; test provider chạy ở server (SRC-PLAN §6).
    enforcement: [ENF-network-egress-allowlist]
  - id: FE-04
    caller: MOD-web-ui
    callee: EXT-telegram-api
    reason_vi: Frontend không gọi Telegram trực tiếp; recipient do hệ thống quyết định (I11).
    enforcement: [ENF-network-egress-allowlist]
  - id: FE-05
    caller: MOD-x-collector
    callee: MOD-data-store
    reason_vi: Collector không ghi trực tiếp SQLite; đẩy qua API có xác thực (D08, B12).
    enforcement: [ENF-process-capability, ENF-network-egress-allowlist]
  - id: FE-06
    caller: MOD-x-collector
    callee: MOD-saved-service
    reason_vi: Save là hành động của người dùng, không phải của collector (SRC-PLAN §6, denied case NC-01).
    enforcement: [ENF-api-auth-test]
  - id: FE-07
    caller: MOD-x-collector
    callee: MOD-analysis-service
    reason_vi: >
      Analysis nhận task từ server **sau ingest commit**; collector không đẩy dữ liệu chưa commit sang analysis
      (B12; edge COL→AW của SRC-SPEC §6.2 bị gỡ).
    enforcement: [ENF-api-auth-test, ENF-import-rule]
  - id: FE-08
    caller: MOD-x-collector
    callee: MOD-analysis-worker
    reason_vi: Như FE-07, kể cả khi hai tiến trình nằm trên cùng máy cá nhân.
    enforcement: [ENF-process-capability]
  - id: FE-09
    caller: MOD-x-collector
    callee: MOD-secret-service
    reason_vi: Collector không có nhu cầu và không có quyền lấy secret AI (SRC-SPEC §11.2).
    enforcement: [ENF-api-auth-test]
  - id: FE-10
    caller: MOD-x-collector
    callee: EXT-telegram-api
    reason_vi: Collector không gửi Telegram; cảnh báo CAPTCHA đi qua delivery intent của server (SRC-PLAN §8.1).
    enforcement: [ENF-network-egress-allowlist]
  - id: FE-11
    caller: MOD-x-collector
    callee: MOD-tag-service
    reason_vi: Worker/collector không đổi tag; tag chỉ là tham số tìm kiếm trong assignment (D24, denied case NC-02).
    enforcement: [ENF-api-auth-test]
  - id: FE-12
    caller: MOD-analysis-worker
    callee: MOD-tag-service
    reason_vi: Analysis worker không sửa subscription của owner (SRC-PLAN §6, denied case NC-02).
    enforcement: [ENF-api-auth-test]
  - id: FE-13
    caller: MOD-analysis-worker
    callee: MOD-report-service
    reason_vi: Worker không tự publish và không tự quyết "work này đã báo cáo" (SRC-PLAN §6.1).
