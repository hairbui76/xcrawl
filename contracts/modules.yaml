  - id: PROV-PC01-03
    topic_vi: >
      Ba thao tác riêng biệt của SRC-SPEC §7.3 (REQ-S7.3-05, trạng thái **XN**) nay đều có mặt trong inventory, mỗi
      thao tác được nêu tên riêng vì bán kính ảnh hưởng khác nhau:
      (1) **bỏ lưu** = `save.remove` — chỉ gỡ `saved_item`, đã có từ bản đầu;
      (2) **xóa dữ liệu gốc của một target** = `data.delete_target` — trước FIX2 thiếu hoàn toàn và không nằm trong
      bất kỳ danh sách unresolved nào (phát hiện F-A1R1-04); nay có auth scope `owner_session`, cờ xác nhận bắt
      buộc, transaction, error map, phạm vi giữ lại (snapshot D55 + ledger) và scenario SC32;
      (3) **xóa toàn bộ dữ liệu** = `data.purge_all` — hai phase với cụm từ xác nhận gõ tay do server phát, chỉ chạy
      khi `storage.health = maintenance`, thu hồi lease trước khi xóa, không tự resume dispatcher.
      Phần còn **chưa** giải: `data.purge_all.exclusions_vi` — "toàn bộ" loại trừ những gì (settings, secrets,
      credential đăng nhập, telegram_link, schema_migration). PC01 đề xuất danh sách đó nhưng **không** tự quyết.
    status: ACCEPTED
    resolution_vi: >
      OD-20260907-01 mục 24: phạm vi `data.purge_all` là **chỉ dữ liệu nghiên cứu**. Ba tập bảng theo ruling
      CR-PC05-06 + CR-PC05-07 (`PURGE-LIST-ruling.md`), phủ đúng 61 entity: **xóa 37**,
      **giữ 22** (`owner`, `session`, `secret_ref`, `task_credential`, `secret_audit`, `telegram_link`, `telegram_link_code`, `provider_config`, `provider_test_result`, `settings`, `schedule_occurrence`, `tag`, `tag_alias`, `tag_exclusion`, `tag_config_version`, `source_connection`, `backup_snapshot`, `backup_manifest`, `restore_record`, `purge_challenge`, `worker_registration`, `maintenance_window`), **không bao giờ xóa 2** (`schema_migration`, `data_deletion_audit`).
      **Backup không bị xóa.** Không còn phần nào của REQ-S7.3-05 ở trạng thái OWNER_DECISION_REQUIRED.
    ratification_ref: OD-20260907-01
    target_package: PC02 (cascade/referential integrity) · PC08 (quy trình maintenance) · PC09 (scenario)
    audit_refs: [F-A1R1-04, R-04]

  - id: PROV-PC01-06
    topic_vi: >
      `MOD-data-admin-service` là module mới do FIX2 tạo ra để hai mutation phá hủy có đúng một owner. Nó mang
      **ngoại lệ duy nhất** với quy tắc repository port theo phạm vi bảng (DC-SRV-01), giới hạn ở thao tác xóa.
      Nếu Owner/Coordinator muốn đặt hai operation này vào một module đã có (ví dụ MOD-data-store) thì cần packet
      sửa, vì điều đó thay đổi câu "data-store chỉ là nơi lưu".
    status: ACCEPTED
    resolution_vi: >
      Module được giữ; OD-20260907-01 mục 24 chốt phạm vi operation nó sở hữu. Đây là quyết định kiến trúc trong
      phạm vi ủy quyền, không phải một câu hỏi còn treo với Owner.
    ratification_ref: OD-20260907-01
    target_package: PC08
    audit_refs: [F-A1R1-04, R-04]
  - id: PROV-PC01-04
    topic_vi: >
      MOD-backup-cli được đặt ra để tách actor "backup operator" khỏi session owner; spec không mô tả giao diện
      backup. Nếu Owner muốn thao tác backup trong app thì phải thêm edge và auth scope mới.
    status: ACCEPTED
    resolution_vi: >
      OD-20260907-01 mục 14 phê chuẩn B11 với backup/restore là quy trình có khóa side effect và operator là vai
      riêng; MOD-backup-cli giữ nguyên. Việc có thêm giao diện backup trong app hay không là một yêu cầu **mới**,
      không phải một quyết định còn treo.
    ratification_ref: OD-20260907-01
    target_package: PC08
