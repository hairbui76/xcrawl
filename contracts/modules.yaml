# ---------------------------------------------------------------------------
# denied_cases: 10 ca âm bắt buộc của PC01 (checklist mục 5).
# ---------------------------------------------------------------------------
denied_cases:
  - id: NC-01
    case_vi: Collector gọi Save
    attempted_edge: {caller: MOD-x-collector, callee: MOD-saved-service, operation: save.create}
    expected_error_code: UNAUTHORIZED
    expected_state_vi: Không tạo saved_item; không đổi bất kỳ hàng nào; ghi audit từ chối đã che secrets.
    enforcement: [ENF-api-auth-test]
    enforcement_detail_vi: >
      `collector_token` không nằm trong auth_scope của save.create (`owner_session_or_linked_chat`). Contract test
      gọi save.create bằng collector token và khẳng định UNAUTHORIZED + số hàng saved_item không đổi.
    forbidden_edge_ref: FE-06
    invariant_refs: [I01, I08]
    scenario_refs: [SC13, SC49]

  - id: NC-02
    case_vi: Worker (collector hoặc analysis) đổi tag
    attempted_edge: {caller: MOD-analysis-worker, callee: MOD-tag-service, operation: tag.update}
    expected_error_code: UNAUTHORIZED
    expected_state_vi: tag_config_version không tăng; bộ tag không đổi; report đang build không bị ảnh hưởng.
    enforcement: [ENF-api-auth-test, ENF-import-rule]
    enforcement_detail_vi: >
      tag.* chỉ nhận `owner_session`. Thêm import rule: package worker không được phụ thuộc package tag.
    forbidden_edge_ref: FE-12
    invariant_refs: [I01, I05]
