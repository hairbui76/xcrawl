  - operation_id: run.resume
    title_vi: Tiếp tục run đang `needs_user` (hành động riêng trong app, B10)
    transport: http
    owner_module: MOD-job-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: true
    idempotency: {required: true, key: "request_id", rule_vi: "Cùng request_id không cấp hai lease mới."}
    request_summary_vi: >
      `run_id`, `request_id`, và tùy trạng thái nguồn: từ `needs_user` cần xác nhận owner đã xử lý challenge;
      từ `blocked` cần `unblock_reason` (bắt buộc, chuỗi tự do đã che secrets) — owner tuyên bố điều kiện chặn
      đã hết.
    response_summary_vi: Trạng thái run sau khi chuyển về `queued`.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/state/run.yaml
    allowed_from_states_vi: >
      **Đúng hai** trạng thái nguồn (ruling CR-PC03-02; PC03 FIX1 thêm hàng transition tương ứng):
      (1) `needs_user` — guard: phiên X được kiểm là KHÔNG còn challenge; nếu hạn chế vẫn còn thì **không**
      chuyển trạng thái (run.yaml `T-RUN-10`, REQ-S5.4-05).
      (2) `blocked` — guard: owner cung cấp `unblock_reason`; hệ thống **không** tự phán đoán điều kiện chặn đã
      hết và **không** thử lại để dò (REQ-S13.2-04: không né chặn, bị chặn thì dừng và báo).
      Gọi từ **bất kỳ** trạng thái nào khác (`queued`, `running`, `waiting_retry`, `completed`, `failed`,
      `cancelled`) ⇒ `CONFLICT`, không đổi trạng thái.
    state_effects_vi: >
      → `queued`, giữ checkpoint đã ACK, **cấp lease mới khi claim**, không tiếp tục bằng lease cũ
      (SRC-PLAN §8.1). Không có lệnh Telegram tương ứng (B10): resume chỉ là hành động trong app.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, CSRF_REJECTED, NOT_FOUND, CONFLICT, STALE_LEASE, X_CHALLENGE_REQUIRED, X_ACCESS_BLOCKED, IDEMPOTENCY_CONFLICT]
    scenario_refs: [SC04, SC20]
    requirement_refs: [REQ-AC04, REQ-P0-12]
    decision_refs: [B10, AMD-B10]
    invariant_refs: [I10]

