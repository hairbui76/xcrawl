      `storage.health = recovery_required` cho tới khi backup.reconcile_after_restore xong (I15).
    error_codes: [TELEGRAM_SEND_UNCERTAIN, TELEGRAM_PERMANENT_FAILURE, RESTORE_UNVERIFIED, STALE_LEASE, STORAGE_WRITE_FAILED]
