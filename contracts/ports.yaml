      contracts/data/identity.md (PC02), ghi `identity_merge_audit` giữ nguyên audit trail hai phía. Snapshot lịch
      sử của Saved **không** bị sửa (I08). Xử lý `first_announced` sau merge **không** do PC01/PC02 quyết định: nó
      theo policy của PC04 (CR-PC02-06) — một canonical work chỉ có một first-announcement (I07). Merge không phải
      là đường "đoán": bằng chứng không đủ thì đi qua identity.quarantine_conflict, không gọi operation này (B15).
    error_codes: [VALIDATION_ERROR, NOT_FOUND, IDENTITY_CONFLICT, CONFLICT, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    error_note_vi: >
