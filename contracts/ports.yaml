      DOI↔arXiv là cùng công trình) và lý do merge (`metadata_link_discovered` | `owner_decision`).
    response_summary_vi: >
      `merge_id`, canonical_id sau merge, số reference đã chuyển theo từng loại (post_work, saved_item, analysis),
      và `first_announced_resolution` do policy PC04 quyết định.
