  - operation_id: worker.report_stop
    title_vi: Báo điểm dừng của đợt (challenge / limit / blocked / hết phiên)
    transport: http
    owner_module: MOD-job-service
    caller_modules: [MOD-x-collector]
    auth_scope: collector_token
    mutation: true
    idempotency: {required: true, key: "assignment_id + stop_report_id", rule_vi: "Báo lại cùng stop_report_id không tạo alert thứ hai."}
    request_summary_vi: >
      lease_id/epoch + `stop_reason` ∈ {`challenge_required`, `limit_reached`, `session_expired`,
      `source_blocked`, `source_layout_changed`, `rate_limited`, `worker_shutdown`, `local_storage_unavailable`}
      + checkpoint đã ACK cuối cùng.
    response_summary_vi: Trạng thái run sau khi ghi nhận + có tạo alert intent hay không.
    request_schema_planned: null
    x-schema-source-request: contracts/state/run.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/state/run.yaml
    state_effects_vi: >
      `challenge_required`/`session_expired` → run `needs_user`, tạo **tối đa một** alert intent cho mỗi run,
      không tự thử lại. `limit_reached` → đóng collection segment, giữ checkpoint, chuyển phase tiếp theo.
      `source_blocked` → run `blocked`, ghi điều kiện gỡ chặn, **không** luân chuyển account/proxy.
      `rate_limited` → đóng collection segment với `RATE_LIMITED`, run kết thúc `outcome: partial`, **không** retry
      trong cùng run; đợt theo lịch kế tiếp chạy bình thường. Đây **khác** `source_blocked`: rate limit nghĩa là X
      **vẫn cho vào** nhưng bảo chờ, còn `source_blocked` nghĩa là X **không cho vào**. Ba cách hiểu gộp làm một sẽ
      cho ba hành vi UI khác nhau ở AC-15 (SRC-SPEC §9.3 "dừng đợt, ghi lý do, không luân chuyển gì để lách";
      ruling CR-PC10-02; PC03 thêm hàng transition trong run.yaml). Giữ checkpoint đã ACK; **không** luân chuyển
      account/proxy và **không** dò lại để tìm giới hạn.
      `source_layout_changed` → run `blocked` với `SOURCE_LAYOUT_CHANGED`: nguồn đổi bố cục nên parser không đọc
      được, **khác hẳn** bị chặn — cách gỡ là sửa parser, không phải chờ hết hạn chế, và **không** được tự thử lại
      để dò (ruling CR-PC05-01; PC03 đăng ký mã trong contracts/errors.yaml). Dữ liệu đã ACK giữ nguyên; không
      đoán nội dung từ bố cục lạ.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, STALE_LEASE, X_CHALLENGE_REQUIRED, X_ACCESS_BLOCKED, SOURCE_LAYOUT_CHANGED, RATE_LIMITED, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    scenario_refs: [SC03, SC04]
    requirement_refs: [REQ-AC03, REQ-AC04, REQ-P0-12, REQ-P0-03]
    decision_refs: [B02, B05, AMD-B02]
    invariant_refs: [I10, I13]

