  # ------------------------------------------------- data lifecycle (§7.3)
  - operation_id: data.delete_target
    title_vi: Xóa dữ liệu gốc của **một** target (thao tác thứ hai của SRC-SPEC §7.3)
    transport: http
    owner_module: MOD-data-admin-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: true
    idempotency: {required: true, key: "request_id", rule_vi: "Cùng request_id trả bản ghi xóa đã commit; xóa lại target đã xóa trả kết quả idempotent, không lỗi."}
    request_summary_vi: >
      `target_ref` (tagged union `work` | `post`), `confirmation.acknowledged: true` (cờ xác nhận **bắt buộc**;
      thiếu hoặc `false` ⇒ `VALIDATION_ERROR`), và lý do tùy chọn.
    response_summary_vi: >
      `deletion_id`, số hàng đã xóa theo từng loại, và danh sách những gì **được giữ lại** (snapshot, ledger) để
      người dùng thấy rõ phạm vi.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/data/entities.yaml
    transaction_vi: >
      Một transaction xóa dữ liệu gốc của target: `post` / `work` và các liên kết `post_work`, `work_label`,
      `analysis` (mọi generation), `tag_vector` của nhãn thuộc target. Ghi một hàng `data_deletion_audit` trong
      **cùng** transaction. Không gọi mạng ngoài trong transaction.
    preserved_vi: >
      **Giữ lại, không được xóa:** `saved_snapshot` của các bản Saved đã có (D55/AC-12 — bài gốc bị xóa vẫn đọc được
      trong Saved); `coverage_window`, `first_announced_ledger`, `backfill_ledger`, `pending_item_ledger`;
      nội dung `report`/`report_item` đã publish (I05, I07 — một canonical work chỉ có một first-announcement, xóa
      dữ liệu gốc không được biến nó thành phát hiện mới ở kỳ sau).
    forbidden_effects_vi: >
      Không sửa report đã publish; không reset `first_announced`; không xóa `saved_snapshot`; không đẩy hay lùi con
      trỏ coverage; không thu hồi lease của run đang chạy (dùng run.cancel cho việc đó).
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, CSRF_REJECTED, NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    error_map_vi: >
      Thiếu cờ xác nhận hoặc `target_ref` sai dạng → `VALIDATION_ERROR` (không xóa gì). Không phải session owner →
      `UNAUTHORIZED`. Target không tồn tại → `NOT_FOUND`. Target đang bị một run/analysis giữ lease, hoặc đang là
      thành phần của một report đang `building` → `CONFLICT` (không xóa một phần). DB không ghi được →
      `STORAGE_WRITE_FAILED`, không xóa một phần.
    state_effects_vi: >
      Quy tắc cascade và referential integrity chi tiết thuộc PC02 (`contracts/data/entities.yaml`,
      `contracts/data/invariants.md`) — PC01 chốt **ai sở hữu mutation, phạm vi giữ lại và cờ xác nhận**, không
      chốt danh sách bảng cuối cùng (CR-PC01-05).
    scenario_refs: [SC32]
    requirement_refs: [REQ-S7.3-05]
    decision_refs: []
    invariant_refs: [I05, I07, I08]
    audit_refs: [F-A1R1-04, R-04]

  - operation_id: data.purge_all
    title_vi: Xóa toàn bộ dữ liệu (thao tác thứ ba của SRC-SPEC §7.3, đòi xác nhận gõ tay)
    transport: http
    owner_module: MOD-data-admin-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: true
    idempotency: {required: true, key: "purge_challenge_id", rule_vi: "Một challenge dùng đúng một lần; gọi lại sau khi đã thực thi trả bản ghi đã commit, không xóa lần hai."}
    two_phase_vi: >
      Một operation_id, hai `phase` để giữ đúng ngữ nghĩa "xác nhận gõ tay" mà không thêm operation thứ ba:
      (1) `phase: request_challenge` — server sinh và lưu một `purge_challenge` có hạn, trả về **cụm từ xác nhận**
      để người dùng gõ lại; không xóa gì. (2) `phase: execute` — yêu cầu `purge_challenge_id` +
      `confirmation_phrase` **khớp chính xác** cụm từ server đã phát; sai hoặc hết hạn → `VALIDATION_ERROR`,
      challenge bị hủy và phải xin lại.
    request_summary_vi: "`phase`, `purge_challenge_id` (phase execute), `confirmation_phrase` (phase execute)."
    response_summary_vi: >
      Phase 1: `purge_challenge_id`, cụm từ phải gõ, thời điểm hết hạn. Phase 2: `purge_id`, số hàng đã xóa theo
      bảng, danh sách phạm vi **được loại trừ**.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/data/entities.yaml
    precondition_vi: >
      Chỉ chạy được khi `storage.health = maintenance`. Ở `healthy`, `write_blocked` hay `recovery_required` →
      `CONFLICT`. Trước khi xóa: thu hồi mọi `assignment_lease` đang hoạt động, dừng scheduler và delivery
      dispatcher; worker cũ mang epoch cũ bị từ chối (I10).
    transaction_vi: >
      Thu hồi lease và dừng dispatcher **trước**, rồi xóa trong một transaction; ghi `data_deletion_audit` với
      `kind: purge_all`. Sau khi xong, `storage.health` vẫn ở `maintenance` cho tới khi owner mở lại — **không** tự
      động resume dispatcher (cùng nguyên tắc với NC-10).
    exclusions_vi: >
      **ĐÃ CHỐT** (OD-20260907-01 mục 24). Ba tập, phủ đúng 60 entity, không chồng lấn. Nguồn chuẩn: ruling của Coordinator ngày 2026-09-07 (`PURGE-LIST-ruling.md`, CR-PC05-06), sửa mâu thuẫn của `TXN-purge-all` bản trước (`schedule_occurrence` nằm ở cả hai tập; `worker_registration` và `data_deletion_audit` bị xếp nhầm vào nhóm xóa). W3 ghi cùng bộ này vào `contracts/data/entities.yaml`.
      **Giữ lại theo quyết định của Owner — 21 bảng:** `owner`, `session`, `secret_ref`, `task_credential`, `secret_audit`, `telegram_link`, `telegram_link_code`, `provider_config`, `provider_test_result`, `settings`, `schedule_occurrence`, `tag`, `tag_alias`, `tag_exclusion`, `tag_config_version`, `source_connection`, `backup_snapshot`, `backup_manifest`, `restore_record`, `purge_challenge`, `worker_registration`.
      **Không bao giờ xóa — 2 bảng:** `schema_migration`, `data_deletion_audit` — `schema_migration` là cấu trúc kho, còn `data_deletion_audit` giữ vĩnh
      viễn theo tham số PC08 đã phê chuẩn; chính lần purge này ghi thêm một hàng audit vào đó.
      **Xóa — 37 bảng:** post/work và liên kết, identity alias/conflict/merge audit, work_label, analysis và các
      bảng phụ thuộc, embedding_generation, tag_vector, report/report_item, emerging_direction, các ledger
      coverage/pending/backfill/first_announced/rescan, Saved, delivery và outbox, run/assignment/assignment_lease/
      checkpoint/ingest_receipt, source_fetch_log, telegram_update_log, và `telegram_link_attempt` (bộ đếm
      rate-limit — dữ liệu vận hành, không phải cấu hình; CR-PC05-07 đưa nó vào tập xóa cho đủ 37).
      **Artifact backup KHÔNG bị xóa**; hộp thoại xác nhận phải nói rõ dữ liệu đã xóa **vẫn còn trong các bản
      backup** cho tới khi chúng hết hạn hoặc bị xóa bằng tay (contracts/ops/backup-restore.md §8.1).
    exclusions_status: ACCEPTED
    exclusions_rationale_vi: >
      Lý do Owner giữ nhóm trên: xóa credential đăng nhập sẽ khóa chính chủ nhà ra ngoài app (REQ-D05 cấm signup
      và cấm quên-mật-khẩu tự động), và xóa cấu hình biến "xóa dữ liệu" thành "gỡ cài đặt" — hai thao tác khác
      nhau về ý định. Sau purge, hệ thống vẫn đăng nhập được và vẫn có đủ cấu hình để chạy đợt mới từ đầu.
    ratification_ref: OD-20260907-01
    forbidden_effects_vi: >
      Không chạy khi `storage.health ≠ maintenance`; không tự resume dispatcher/scheduler sau khi xóa; không replay
      outbox cũ; không xóa khi challenge sai hoặc hết hạn; không xóa một phần rồi báo thành công.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, CSRF_REJECTED, NOT_FOUND, CONFLICT, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    error_map_vi: >
      `confirmation_phrase` sai/hết hạn → `VALIDATION_ERROR` (challenge bị hủy, không xóa gì). Không phải owner →
      `UNAUTHORIZED`. `storage.health ≠ maintenance` → `CONFLICT`. Challenge không tồn tại → `NOT_FOUND`.
      Lỗi ghi giữa chừng → `STORAGE_WRITE_FAILED`; transaction rollback, không có trạng thái "xóa một nửa".
    state_effects_vi: >
      Xem transaction_vi và exclusions_vi. Ba tập bảng (37 xóa / 21 giữ / 2 không bao giờ xóa) theo ruling
      CR-PC05-06 + CR-PC05-07; CR-PC01-05 khép lại.
    scenario_refs: [SC44]
    scenario_note_vi: >
      `SC44` (đăng ký theo ruling FIX3, F-A1R2-06) phải phủ: hai phase xác nhận (`request_challenge` rồi
      `execute`), điều kiện tiên quyết `storage.health = maintenance`, thu hồi lease trước khi xóa, và các ca âm —
      cụm từ xác nhận sai, challenge hết hạn, challenge dùng lại, và gọi khi storage ở trạng thái khác
      `maintenance`. CR-PC01-07 khép lại nhờ ruling này.
    requirement_refs: [REQ-S7.3-05]
    decision_refs: []
    invariant_refs: [I05, I08, I10, I15]
    audit_refs: [F-A1R1-04, R-04]

  - operation_id: save.list
    title_vi: Kho đã lưu (Saved)
    transport: http
    owner_module: MOD-saved-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: false
    idempotency: {required: false, key: null, rule_vi: "Read-only."}
    request_summary_vi: Phân trang + từ khóa tìm kiếm.
    response_summary_vi: Bài đã Save, ngày lưu, snapshot, nguồn Save.
