scope: >
  File này là **danh mục operation duy nhất** của Research Radar ở giai đoạn Pre-code. Mỗi operation có
  operation_id ổn định theo baseline §3 (`<domain>.<verb_noun>`), transport, module sở hữu, danh sách caller,
  auth scope, tính mutation, yêu cầu idempotency, tóm tắt request/response, ảnh hưởng trạng thái, mã lỗi có thể
  trả và scenario tham chiếu. Các gói PC03–PC08 trích dẫn nguyên văn `operation_id` ở đây; PC05 định nghĩa wire
  HTTP trong `contracts/http/openapi.yaml`, PC02/PC04/PC06/PC07 định nghĩa payload schema trong
  `contracts/schemas/`, PC03 định nghĩa transition/timeout/retry. File này **không** định nghĩa schema, số
  timeout hay bảng transition; các trường `*_schema_planned` chỉ trỏ tới file sẽ được tạo.
verification: >
  E0 self-validation: (a) YAML parse bằng python3 yaml.safe_load; (b) script kiểm chéo với contracts/modules.yaml —
  không trùng operation_id, mọi module tham chiếu tồn tại, mọi operation thuộc đúng inbound của owner và outbound
  của từng caller. Không có evidence E1–E4; mọi thứ chưa chạy ghi NOT_RUN.
claim_ceiling: CONTRACT_READY
ratification_ref: OD-20260907-01
ratification_note_vi: >
  Owner phê chuẩn B01–B17 ngày 2026-09-07 (OD-20260907-01, authority AUTH-OWNER-20260907-02).
  A2-R4 tuyên bố phạm vi "Boundaries and rights" đủ điều kiện CONTRACT_READY khi có phê chuẩn.
  `CONTRACT_READY` khẳng định **bộ hợp đồng đủ trường, không còn quyết định chặn, ví dụ hợp lệ và
  bất hợp lệ đã được kiểm** (SRC-PLAN §2) — nó **không** khẳng định gì về runtime: E1–E4 vẫn NOT_RUN,
  chưa có code, chưa có probe. Các mục còn phụ thuộc KC mang `kc_dependency` riêng và không hạ trần
  của file.

conventions:
  operation_id_form: "<domain>.<verb_noun> snake_case, duy nhất toàn hệ thống (baseline §3)"
  transport_values: [http, internal]
  transport_meaning_vi: >
    `http` = qua ranh giới tiến trình/máy, đi qua MOD-backend-api (TLS + xác thực actor) hoặc qua endpoint ingress
    của MOD-telegram-adapter. `internal` = port trong tiến trình server (modular monolith được phép, SRC-PLAN §6)
    hoặc trong tiến trình worker trên máy cá nhân; không mở cổng mạng.
  mutation_meaning_vi: >
    `true` khi operation ghi dữ liệu authoritative (SQLite server) hoặc tạo side effect ngoài (network send).
    Mỗi mutation có đúng một owner module (SRC-PLAN §5, §6.1).
  idempotency_meaning_vi: >
    Theo SRC-PLAN §5.1: mutation từ worker mang `request_id`, `schema_version`, `idempotency_key`, `payload_hash`;
    mutation đang giữ job mang thêm `job_id`, `lease_id`, `lease_epoch`. Cùng key + cùng payload trả receipt đã
    commit; cùng key + payload khác trả IDEMPOTENCY_CONFLICT. Lease cũ trả STALE_LEASE.
  error_envelope_vi: >
    Mọi lỗi dùng envelope SRC-PLAN §5.1: `code`, `scope`, `retry_class`, `message_safe`, `correlation_id`,
    `details_safe`, `retry_after` (nếu có). Không lộ transcript, key, cookie hay nội dung nguồn chưa che.
  prose_token_rule_vi: >
    Quy ước đọc token trong prose (E0-04b/E0-04c, ruling FIX7): một token dạng `<a>.<b>` trong văn bản phải phân
    giải được thành **một operation của file này** hoặc **một cặp `<entity>` + `<column>` của contracts/data/entities.yaml**.
    Ngoài hai loại đó, chỉ bốn dạng sau được phép xuất hiện và **không** phải là tham chiếu hợp đồng:
    (1) đường dẫn file (`contracts/schemas/target.schema.json`), (2) khóa YAML trong chính bộ hợp đồng
    (`conventions.schema_reference_rule_vi`, `attempted_edge.callee`, `capabilities.ai_providers`),
    (3) tên host hoặc hàm thư viện (`api.telegram.org`, `yaml.safe_load`), (4) trường của **payload request**
    được định nghĩa ngay trong cùng operation (`confirmation.acknowledged`).
    Ngoại lệ có tên: **`storage.health`** là tên kênh trạng thái do `contracts/state/storage.yaml` định nghĩa
    (không phải cột entity, không phải operation); mọi lần nhắc trong bộ PC01 đều trỏ tới nó. Mã lỗi trong prose
    phải nằm trong 28 mã của `contracts/errors.yaml`; tên id đã bị bác bỏ **không** được để lại trong prose hợp
    đồng — lịch sử nằm ở handoff (ruling FIX7).
  schema_reference_rule_vi: >
    Phân biệt **JSON Schema** với **hợp đồng mô tả hình dạng** (ruling CR-PC05-05):
    `request_schema_planned` / `response_schema_planned` chỉ được mang một đường dẫn khi đó là **file JSON Schema
    thật** dưới `contracts/schemas/*.schema.json` — thứ mà một `$ref` của OpenAPI dereference được.
    Khi hình dạng payload được mô tả bằng một hợp đồng khác (`contracts/state/*.yaml`, `contracts/data/*.md`,
    `contracts/ops/*.md`, `contracts/ai/*.yaml`, `contracts/telegram/*`, `contracts/reporting/*`,
    `contracts/http/openapi.yaml`), trường đó là **`null`** và hợp đồng được nêu ở
    `x-schema-source-request` / `x-schema-source-response`. Trước FIX4, các trường này trỏ thẳng tới YAML/Markdown
    khiến PC05 không `$ref` được (PC05 phải dùng `GenericObject` + `x-schema-source`); nay hai file nói cùng một
    thứ. `null` **không** có nghĩa "không có hợp đồng" — nó có nghĩa "hợp đồng không ở dạng JSON Schema".
  auth_scope_to_wire_scheme_vi: >
    Ánh xạ tới `components.securitySchemes` của contracts/http/openapi.yaml (PC05 sở hữu tên; PC01 ghi lại để
    đối chiếu được — ruling CR-PC08-02):
    `owner_session` và `owner_session_or_linked_chat` (đường browser) ⇒ **`ownerSessionCookie` + `ownerCsrfToken`**,
    cả hai bắt buộc cho **mọi** operation `mutation: true`;
    `owner_session_or_linked_chat` (đường Telegram) ⇒ update đã xác thực bằng `telegramIngressSecret`, không có CSRF
    vì không có cookie;
    `collector_token` ⇒ `collectorToken`; `analysis_worker_token` ⇒ `analysisWorkerToken`;
    `collector_token_or_analysis_worker_token` ⇒ một trong hai;
    `telegram_ingress_secret` ⇒ `telegramIngressSecret`;
    **`backup_operator` ⇒ `backupOperatorToken`** (áp cho cả bốn operation `backup.*`);
    `public_login` và `public_minimal` ⇒ không scheme; `internal_only` ⇒ không đi qua HTTP.
  csrf_rule_vi: >
    Mọi operation `transport: http`, `mutation: true`, auth scope của owner session mang `CSRF_REJECTED` trong
    `error_codes`: thiếu hoặc lệch CSRF double-submit ⇒ HTTP 403, **không đổi trạng thái**. `CSRF_REJECTED` khác
    `UNAUTHORIZED` (danh tính chưa được xác lập hoặc sai lớp principal) và khác `FORBIDDEN_EDGE` (cạnh không có
    trong registry) — ruling FIX3, giải quyết CR-PC08-03. PC03 đăng ký mã này trong contracts/errors.yaml.
  timeout_note_vi: >
    Giá trị timeout/lease TTL/retry budget **không** được chốt ở file này; PC03 đóng chúng trong
    contracts/retry-policy.yaml và contracts/state/*.yaml. Số duy nhất PC01 chốt là ngưỡng readiness
    "collector online" trong contracts/ops/deployment.md §6 (tham số cấu hình, hiệu chỉnh sau probe A1).

error_code_registry_note:
  owner_file: contracts/errors.yaml (PC03)
  codes_from_plan_10:
    - X_CHALLENGE_REQUIRED
    - X_ACCESS_BLOCKED
    - WORKER_LEASE_EXPIRED
    - INGEST_ACK_LOST
    - SOURCE_METADATA_UNAVAILABLE
    - IDENTITY_CONFLICT
    - AI_OUTPUT_INVALID
    - AI_PROVIDER_UNAVAILABLE
    - AI_ATTEMPT_UNCERTAIN
    - EMBEDDING_GENERATION_MISMATCH
    - TAG_VERSION_STALE
    - TELEGRAM_SEND_UNCERTAIN
    - TELEGRAM_PERMANENT_FAILURE
    - UNAUTHORIZED_COMMAND
    - STORAGE_WRITE_FAILED
    - RESTORE_UNVERIFIED
  codes_added_by_packet:
    - UNAUTHORIZED
    - IDEMPOTENCY_CONFLICT
    - STALE_LEASE
    - VALIDATION_ERROR
    - NOT_FOUND
  codes_from_fix3_ruling:
    - code: CSRF_REJECTED
      registered_by: PC03 (contracts/errors.yaml)
      status: ACCEPTED
      ratification_ref: OD-20260907-01 (mục 25 — thay đổi kỹ thuật được chấp nhận)
      http_status: 403
      scope: request
      retry_class: none
      state_change: none
      used_by_vi: >
        Mọi operation http mutation của owner session (19 operation trong danh mục này). Thiếu hoặc lệch CSRF
        double-submit. Ruling FIX3 tách nó khỏi `FORBIDDEN_EDGE` (vẫn là "cạnh không có trong registry") và khỏi
        `UNAUTHORIZED` (vẫn là "danh tính chưa xác lập / sai lớp principal"). Giải quyết CR-PC08-03.
  codes_requested_provisional:
    - code: CAPABILITY_DENIED
      status: ACCEPTED
      registered_in: contracts/errors.yaml
      change_request: CR-PC01-01 (khép lại)
      reason_vi: >
        Cần một mã cho trường hợp capability tiến trình/mạng/tool bị từ chối (egress allowlist, tool bị khóa,
        module không có driver DB) — khác với UNAUTHORIZED vốn là lỗi xác thực/ủy quyền ở API. PC03 phải đăng ký
        mã này trong contracts/errors.yaml; PC01 không được ghi file đó.
    - code: CONFLICT
      status: ACCEPTED
      registered_in: contracts/errors.yaml
      change_request: CR-PC01-03 (khép lại)
      introduced_by: PKT-PC01-FIX1 (ruling của Coordinator)
      used_by: [identity.merge_works]
      reason_vi: >
        Xung đột trạng thái nghiệp vụ khi cùng một cặp work được yêu cầu merge với bằng chứng khác nhau — khác
        IDEMPOTENCY_CONFLICT (cùng key, payload khác ở tầng wire) và khác IDENTITY_CONFLICT (hai identity mâu
        thuẫn chưa giải, đi vào cách ly). PC03 phải đăng ký trong contracts/errors.yaml; PC01 không được ghi file đó.

operations:

  # ---------------------------------------------------------------- auth
  - operation_id: auth.login
    title_vi: Đăng nhập tài khoản duy nhất
    transport: http
    owner_module: MOD-auth-service
    caller_modules: [MOD-web-ui]
    auth_scope: public_login
    mutation: true
    idempotency: {required: false, key: null, rule_vi: "Không idempotent; mỗi lần tạo một session mới, session cũ vẫn hiệu lực trừ khi bị thu hồi."}
    request_summary_vi: Thông tin đăng nhập của owner; không có trang signup (D05).
    response_summary_vi: Session token/cookie có hạn; không trả bất kỳ secret nào của provider.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/http/openapi.yaml
    state_effects_vi: Tạo một session của owner; ghi audit đăng nhập đã che secrets.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, STORAGE_WRITE_FAILED]
    scenario_refs: [SC17]
    requirement_refs: [REQ-D05, REQ-P0-01]
    decision_refs: []
    invariant_refs: [I01]

  - operation_id: auth.logout
    title_vi: Kết thúc session hiện tại
    transport: http
    owner_module: MOD-auth-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: true
    idempotency: {required: false, key: null, rule_vi: "Gọi lại trên session đã hủy trả kết quả thành công idempotent."}
    request_summary_vi: Không có body; định danh lấy từ session.
    response_summary_vi: Xác nhận session đã bị thu hồi.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/http/openapi.yaml
    state_effects_vi: Thu hồi session; không đụng dữ liệu nghiệp vụ.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, CSRF_REJECTED]
    scenario_refs: [SC40, SC51]
    scenario_note_vi: >
      Vòng đời phiên: SC51 (thiết lập lần đầu — đăng nhập) và SC40 (request không xác thực / thiếu CSRF bị từ chối). Sau `auth.logout`, mọi request mang session đã thu hồi phải rơi vào đúng nhánh của SC40.
    requirement_refs: [REQ-D05]
    decision_refs: []
    invariant_refs: [I01]

  - operation_id: auth.get_session
    title_vi: Đọc trạng thái session
    transport: http
    owner_module: MOD-auth-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: false
    idempotency: {required: false, key: null, rule_vi: "Read-only."}
    request_summary_vi: Không có body.
    response_summary_vi: Trạng thái đăng nhập, thời điểm hết hạn; không có secret.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/http/openapi.yaml
    state_effects_vi: Không.
    error_codes: [UNAUTHORIZED]
    scenario_refs: [SC40, SC51]
    scenario_note_vi: >
      Như auth.logout: SC40 kiểm mặt âm (không có phiên hợp lệ ⇒ UNAUTHORIZED), SC51 kiểm mặt dương trong luồng thiết lập.
    requirement_refs: [REQ-D05]
    decision_refs: []
    invariant_refs: [I01]

  # ------------------------------------------------------------ settings
  - operation_id: settings.get_config
    title_vi: Đọc cấu hình (lịch, giới hạn, provider/model theo tác vụ, embedding, liên kết Telegram)
    transport: http
    owner_module: MOD-settings-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: false
    idempotency: {required: false, key: null, rule_vi: "Read-only."}
    request_summary_vi: Không có body.
    response_summary_vi: >
      Cấu hình đầy đủ với secret ở dạng **tham chiếu + trạng thái đã cấu hình**, không bao giờ là giá trị key
      (SRC-SPEC §11.2). Kèm timezone IANA đang dùng (B08).
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/http/openapi.yaml
    state_effects_vi: Không.
    error_codes: [UNAUTHORIZED]
    scenario_refs: [SC17]
    requirement_refs: [REQ-D39, REQ-D56, REQ-P0-11]
    decision_refs: [B08, B13]
    invariant_refs: [I01, I11]

  - operation_id: settings.update_config
    title_vi: Sửa cấu hình
    transport: http
    owner_module: MOD-settings-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: true
    idempotency: {required: true, key: "request_id", rule_vi: "Cùng request_id + cùng payload_hash trả bản ghi đã commit; payload khác trả IDEMPOTENCY_CONFLICT."}
    request_summary_vi: >
      Delta cấu hình: lịch, timezone IANA, giới hạn mỗi đợt, N ngày với ngược, provider/model theo tác vụ,
      key mới (chỉ ghi vào secret service), model embedding.
    response_summary_vi: Cấu hình sau khi ghi, secret vẫn ở dạng tham chiếu.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/http/openapi.yaml
    state_effects_vi: >
      Ghi bản cấu hình mới; đổi model embedding kích hoạt embedding.start_generation_rebuild (không tự chuyển
      active generation); key mới đi qua secret.store_provider_key.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, CSRF_REJECTED, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    scenario_refs: [SC24]
    requirement_refs: [REQ-D39, REQ-D40, REQ-D48, REQ-P0-11]
    decision_refs: [B08, B13, B14]
    invariant_refs: [I01, I12, I14]

  - operation_id: settings.test_provider
    title_vi: Thử một provider AI đã cấu hình (đường API key, phía server)
    transport: http
    owner_module: MOD-settings-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: true
    idempotency: {required: false, key: null, rule_vi: "Mỗi lần thử ghi một bản ghi kết quả mới; không dùng lại kết quả cũ."}
    request_summary_vi: Provider ID cần thử; không nhận key trực tiếp từ frontend.
    response_summary_vi: >
      Kết quả `usable | unusable | unknown` kèm lý do đã che secrets. Đường CLI/ACP **không** thử được từ server;
      trạng thái của nó chỉ đến từ worker.register_capabilities trên máy cá nhân.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/ai/providers.yaml
    state_effects_vi: Ghi provider_test_result mới nhất; không đổi cấu hình.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, CSRF_REJECTED, AI_PROVIDER_UNAVAILABLE, NOT_FOUND]
    scenario_refs: [SC16]
    requirement_refs: [REQ-D41, REQ-D51]
    decision_refs: [B13]
    invariant_refs: [I11, I14]

  # ----------------------------------------------------------------- tag
  - operation_id: tag.list
    title_vi: Danh sách tag, từ đồng nghĩa, tag loại trừ
    transport: http
    owner_module: MOD-tag-service
    caller_modules: [MOD-web-ui]
    auth_scope: owner_session
    mutation: false
    idempotency: {required: false, key: null, rule_vi: "Read-only."}
    request_summary_vi: Không có body.
    response_summary_vi: Tag + alias + exclusion + phiên bản cấu hình tag đang hoạt động.
    request_schema_planned: null
    x-schema-source-request: contracts/http/openapi.yaml
    response_schema_planned: null
    x-schema-source-response: contracts/http/openapi.yaml
    state_effects_vi: Không.
    error_codes: [UNAUTHORIZED]
    scenario_refs: [SC05]
    requirement_refs: [REQ-P0-02, REQ-D46]
    decision_refs: []
    invariant_refs: [I01]

  - operation_id: tag.create
    title_vi: Thêm tag (kèm alias và exclusion)
    transport: http
    owner_module: MOD-tag-service
    caller_modules: [MOD-web-ui]
