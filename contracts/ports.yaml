  # -------------------------------------------------------------- ingest
  - operation_id: ingest.submit_batch
    title_vi: Nộp một lô post đã thu thập (collector → server, D08)
    transport: http
    owner_module: MOD-ingest-service
    caller_modules: [MOD-x-collector]
    auth_scope: collector_token
    mutation: true
    idempotency: {required: true, key: "assignment_id + batch_idempotency_key", rule_vi: "Cùng key + cùng payload_hash trả receipt đã commit; payload khác trả IDEMPOTENCY_CONFLICT; không ghi đè."}
    request_summary_vi: >
      request_id, schema_version, idempotency_key, payload_hash, job_id, lease_id, lease_epoch, danh sách post
      (x_post_id, tác giả, nội dung, URL, published_at, provenance), link paper phát hiện được.
      Quan sát "nguồn đã bị xóa trên X" là **một trường của item** trong lô — `source_deleted_observed_at`
      (RFC 3339 UTC, nullable) — chứ **không** phải một operation riêng: collector chỉ báo cáo cái nó quan sát
      được ở thời điểm thu thập, còn việc diễn giải và ghi nhận là của server (ruling của Coordinator trong
      PKT-PC01-FIX1). Trường này không xóa dữ liệu và không đụng tới Saved: snapshot đã lưu vẫn đọc được kể cả khi
      bài gốc bị xóa trên X (D55, AC-12).
    response_summary_vi: >
      Receipt gồm số hàng đã commit, số hàng trùng bị bỏ, danh sách target đã resolve, mốc `discovered_at` do
      **server** cấp + ingest sequence.
    request_schema_planned: contracts/schemas/ingest-batch.schema.json
    response_schema_planned: contracts/schemas/ingest-receipt.schema.json
    state_effects_vi: >
      **Đường chính để checkpoint trở nên bền.** Commit post + receipt dedup + `client_checkpoint_proposal` của lô
      trong **cùng một** transaction (PC02 `TXN-ingest-batch`, I02). Dedup theo `x_post_id`; cam kết là **không
      ingest trùng**, không phải "không bao giờ đọc lại" (B05/AMD-B05). ACK chỉ sau commit. Không có đường nào ghi
      checkpoint ở transaction riêng **trước** commit của lô (ruling R-01); ingest.commit_checkpoint chỉ dùng khi
      lô rỗng.
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, STALE_LEASE, WORKER_LEASE_EXPIRED, IDEMPOTENCY_CONFLICT, INGEST_ACK_LOST, IDENTITY_CONFLICT, STORAGE_WRITE_FAILED]
    scenario_refs: [SC07, SC21, SC23]
    requirement_refs: [REQ-D08, REQ-D17, REQ-AC04, REQ-AC07, REQ-P0-03]
    decision_refs: [B05, B06, B12, B15, AMD-B05, ADR-0001]
    invariant_refs: [I01, I02, I03]

  - operation_id: ingest.commit_checkpoint
    title_vi: Đẩy con trỏ checkpoint khi **không có** item mới (cursor-only advance)
    transport: http
    owner_module: MOD-ingest-service
    caller_modules: [MOD-x-collector]
    auth_scope: collector_token
    mutation: true
    scope_restriction_vi: >
      **Đường phụ, chỉ dùng khi lô rỗng.** Đường chính để checkpoint trở nên bền là ingest.submit_batch:
      `client_checkpoint_proposal` được commit **cùng transaction** với post + receipt (PC02 `TXN-ingest-batch`).
      Operation này chỉ tồn tại cho ba tình huống không có item mới: trang rỗng, hết feed, và đóng
      collection segment. Nó **không bao giờ** được dùng để ghi checkpoint cho dữ liệu vừa thu được — dữ liệu đó
      phải đi qua ingest.submit_batch. Ruling R-01 (PKT-PC01-FIX2), phương án (b).
    idempotency: {required: true, key: "assignment_id + checkpoint_seq", rule_vi: "Checkpoint seq lùi bị từ chối; cùng seq + cùng payload trả bản đã ghi; cùng seq + payload khác trả IDEMPOTENCY_CONFLICT."}
    request_summary_vi: >
      lease_id/epoch, `proposed_cursor`, `proposed_acked_through_ingest_sequence`, `reason` ∈
      {`empty_page`, `end_of_feed`, `segment_close`}, và `item_count: 0` (bắt buộc bằng 0).
    response_summary_vi: Trạng thái `checkpoint` sau khi ghi (cursor, `acked_through_ingest_sequence`) + hash.
    request_schema_planned: contracts/schemas/ingest-receipt.schema.json
    response_schema_planned: contracts/schemas/ingest-receipt.schema.json
    guard_vi: >
      `proposed_acked_through_ingest_sequence` chỉ được trỏ tới `ingest_sequence` **đã commit** cho chính run đó:
      hợp lệ khi `proposed ≤ MAX(ingest_receipt.max_ingest_sequence đã commit của run)`. Đề xuất vượt quá mốc đó trả
      `VALIDATION_ERROR` và **không ghi một phần nào** (no partial write). `item_count ≠ 0` cũng trả
      `VALIDATION_ERROR`: lô có item phải đi qua ingest.submit_batch.
    transaction_vi: >
      `TXN-checkpoint-only` (PC02 bổ sung vào transaction map): **một** transaction ghi đúng hai thứ — cập nhật một
      hàng `checkpoint` của run và ghi receipt của lần commit này. Không có hàng `post` nào được ghi trong
      transaction này. Không gọi mạng ngoài trong transaction (SRC-PLAN §5.1).
    commit_point_vi: >
      Commit point là commit của `TXN-checkpoint-only`. ACK chỉ được trả **sau** commit; trước điểm đó collector
      phải coi kết quả là chưa biết.
    failure_timeline_vi: >
      (1) Lỗi trước commit → không có gì thay đổi; collector gọi lại cùng `checkpoint_seq`, nhận bản đã ghi hoặc
      ghi mới. (2) Crash **sau** commit, **trước** ACK → server đã có checkpoint mới; collector không biết, gọi lại
      cùng seq và nhận đúng bản đã commit (không tăng thêm). (3) Lease hết hạn giữa chừng → `STALE_LEASE`, không
      ghi; checkpoint giữ nguyên giá trị đã commit trước đó. (4) `storage.health = write_blocked` →
      `STORAGE_WRITE_FAILED`, con trỏ **không** tiến và không tuyên bố đã persist lỗi (SRC-PLAN §8.4).
    oracle_vi: >
      Sau **bất kỳ** dãy lời gọi ingest.commit_checkpoint và ingest.submit_batch nào (kể cả xen kẽ, replay và crash),
      bất biến sau phải đúng:
      `checkpoint.acked_through_ingest_sequence ≤ MAX(ingest_receipt.max_ingest_sequence đã commit)` cho cùng run.
      Nói cách khác checkpoint **không bao giờ** trỏ vượt qua post đã bền. Đây là oracle kiểm được bằng đếm hàng,
      không phải bằng đọc log.
    state_effects_vi: >
      Checkpoint **không đi trước dữ liệu bền** (I02). Dữ liệu đã tải nhưng chưa ingest không được coi là
      checkpoint bền (SRC-PLAN §8.1). Entity là `checkpoint`, **do MOD-ingest-service sở hữu duy nhất**;
      MOD-job-service chỉ **đọc** trạng thái này qua ingest.get_checkpoint hoặc qua payload của
      worker.claim_assignment, không sở hữu và không ghi (ruling R-01; token `run_checkpoint_pointer` đã bị gỡ).
    error_codes: [VALIDATION_ERROR, UNAUTHORIZED, STALE_LEASE, IDEMPOTENCY_CONFLICT, STORAGE_WRITE_FAILED]
    scenario_refs: [SC03, SC04, SC21]
    requirement_refs: [REQ-AC03, REQ-AC04, REQ-P0-12]
    decision_refs: [B05, AMD-B05]
    invariant_refs: [I02, I10]
    audit_refs: [F-A1R1-01, R-01]

