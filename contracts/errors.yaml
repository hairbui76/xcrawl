  - code: CSRF_REJECTED
    origin: "CR-PC08-03 (ruling FIX3: HTTP 403, scope request, retry_class none)"
    scope: request
    retry_class: none
    title_vi: Thiếu hoặc sai CSRF token trên một mutation dùng phiên owner
    distinct_from_vi: >-
      Ba mã 403/401 KHÔNG được dùng lẫn (ruling CR-PC08-04):
      `UNAUTHORIZED` (401) = danh tính chưa được thiết lập, hoặc LỚP principal không được phép — ví dụ
      collector token gọi `save.create`.
      `FORBIDDEN_EDGE` (403) = cạnh caller→callee không có trong `contracts/modules.yaml` (default deny).
      `CSRF_REJECTED` (403) = danh tính HỢP LỆ và cạnh HỢP LỆ, nhưng lời gọi không chứng minh được nó do
      chính trang của ứng dụng phát ra.
    target_states:
      - {machine: request, to_state: unchanged, note_vi: "KHÔNG đổi bất kỳ hàng nghiệp vụ nào; kiểm CSRF nằm TRƯỚC mọi write."}
    data_kept_vi: "Không có gì được ghi. Phiên KHÔNG bị hủy — một request thiếu token không phải bằng chứng phiên bị chiếm."
    forbidden_vi:
      - "Bỏ qua kiểm CSRF cho một số mutation 'ít rủi ro' — mọi mutation dùng cookie phiên đều phải kiểm."
      - "Thực hiện một phần rồi mới kiểm token."
      - "Hủy phiên owner khi gặp mã này (biến một lỗi tích hợp thành một sự cố đăng xuất)."
      - "Áp mã này cho worker/collector: chúng dùng bearer token nên KHÔNG có bề mặt CSRF."
    oracle_vi: >-
      Gửi một mutation owner-session hợp lệ nhưng thiếu header `X-CSRF-Token` (hoặc giá trị lệch cookie
      `rr_csrf`): response 403 `CSRF_REJECTED`, số hàng của mọi bảng nghiệp vụ KHÔNG đổi, và phiên vẫn dùng
      được ở request kế tiếp.
    message_safe_template_vi: "Yêu cầu không hợp lệ. Hãy tải lại trang rồi thử lại."
    details_safe_keys: [operation_id]
    redaction_vi: "KHÔNG BAO GIỜ ghi giá trị token nhận được hay token mong đợi vào log hoặc details."
