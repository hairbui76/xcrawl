codes:

  # ------------------------------------------------------ nguồn X / thu thập
  - code: X_CHALLENGE_REQUIRED
    origin: SRC-PLAN §10
    scope: run
    retry_class: needs_user
    title_vi: X đòi xác minh hoặc phiên đã hết hạn
    target_states:
      - {machine: run, to_state: "status=needs_user, stop_reason=captcha|session_expired", note_vi: "phase giữ nguyên `collecting`."}
      - {machine: delivery, to_state: pending, note_vi: "Đúng MỘT alert intent cho mỗi run (logical_delivery_key = run_alert_id + channel)."}
    data_kept_vi: >-
      Checkpoint đã ACK (ENT-checkpoint.acked_through_ingest_sequence) giữ nguyên; mọi post đã commit giữ nguyên;
      `applied_config` của run bất biến.
    forbidden_vi:
      - "Tự retry hoặc tự claim lại assignment (REQ-S9.3-01, I10)."
      - "Giả lập thao tác giải xác minh, click tự động, đổi account/proxy (REQ-A7)."
      - "Tạo alert intent thứ hai cho cùng run (REQ-AC04)."
      - "Coi dữ liệu đã tải nhưng chưa ingest là checkpoint bền (SRC-PLAN §8.1)."
      - "`run.run_now` hoặc lệnh Telegram `status` đưa run rời `needs_user` (B10/AMD-B10)."
    oracle_vi: >-
      Inject challenge sau một batch đã ACK: `COUNT(outbox_intent WHERE type='run_alert' AND run_id=R) = 1`;
      số request thu thập mới sau thời điểm chuyển trạng thái = 0 cho tới khi `run.resume` được gọi;
      `checkpoint.acked_through_ingest_sequence` không đổi.
    message_safe_template_vi: "Đợt chạy đang chờ bạn xác minh trên X. Xử lý trong cửa sổ Chrome rồi bấm “tiếp tục”."
    details_safe_keys: [run_id, phase, stop_reason, acked_through_ingest_sequence, detected_at]
    redaction_vi: "Không đưa nội dung trang challenge, cookie, URL đầy đủ hay ảnh chụp màn hình vào details."
    operations: [worker.report_stop, run.resume]
    scenario_refs: [SC04]
    requirement_refs: [REQ-AC04, REQ-S5.4-01, REQ-S5.4-05, REQ-S9.3-01]
    invariant_refs: [I10, I13]

  - code: X_ACCESS_BLOCKED
    origin: SRC-PLAN §10
    scope: run
    retry_class: none
    title_vi: X chặn truy cập hoặc thiếu capability bắt buộc
    target_states:
      - {machine: run, to_state: "status=blocked, stop_reason=source_blocked", note_vi: "Ghi điều kiện gỡ chặn vào run metadata."}
    data_kept_vi: "Toàn bộ nguồn đã thu và đã commit được giữ; checkpoint đã ACK giữ nguyên."
    forbidden_vi:
      - "Luân chuyển account, proxy, user-agent hay bất kỳ hình thức lách chặn nào (REQ-S9.3-02)."
      - "Hiển thị `blocked` như `empty` hoặc như “không có nghiên cứu mới” (I13, REQ-S8.3-03)."
      - "Tự chuyển sang `queued` theo thời gian mà không có hành động của Owner. Đường thoát DUY NHẤT là `run.resume` từ `blocked` với `unblock_reason` (CR-PC03-02 đã giải; contracts/state/run.yaml T-RUN-23)."
    oracle_vi: >-
      Trace mạng sau thời điểm chuyển trạng thái không có request tới X; UI hiển thị lý do khác với `empty`;
      `run.status = blocked` và `stop_reason = source_blocked` cùng lúc.
    message_safe_template_vi: "Đợt chạy dừng vì X đang chặn truy cập. Không có thay đổi nào được thực hiện để lách."
    details_safe_keys: [run_id, phase, stop_reason, blocked_since, unblock_condition_vi]
    redaction_vi: "Không ghi nội dung response của X, không ghi header."
    operations: [worker.report_stop]
    scenario_refs: [SC15]
    requirement_refs: [REQ-S9.3-02, REQ-S8.3-03, REQ-AC15, REQ-A7]
    invariant_refs: [I13]

  # ------------------------------------------------------------- lease/worker
  - code: WORKER_LEASE_EXPIRED
    origin: SRC-PLAN §10
    scope: request
    retry_class: none
    title_vi: Lease của assignment đã hết hạn; worker cũ bị thu hồi quyền
    target_states:
      - {machine: request, to_state: unchanged, note_vi: "Lời gọi của worker cũ bị từ chối và KHÔNG ghi gì."}
      - {machine: run, to_state: "status=queued", note_vi: "Chỉ khi run chưa có `needs_user`/`blocked` đã lưu; do sweep của server thực hiện, không do worker cũ."}
      - {machine: analysis, to_state: pending, note_vi: "Task quay lại hàng đợi; attempt cũ ghi outcome `cancelled_stale_lease`."}
    data_kept_vi: >-
      Mọi hàng đã commit dưới lease cũ giữ nguyên (I02). `analysis_attempt` của lease cũ được giữ làm bằng chứng,
      với `cost_uncertain` đúng theo thực tế.
    forbidden_vi:
      - "Worker giữ lease cũ commit thêm bất kỳ dữ liệu authoritative nào (I10)."
      - "Reset một `needs_user` hoặc `blocked` đã lưu về `queued` chỉ vì lease hết hạn."
      - "Tăng epoch mà không thu hồi lease cũ."
    oracle_vi: >-
      Hai worker cùng claim một job: worker có `lease_epoch` nhỏ hơn nhận WORKER_LEASE_EXPIRED (hoặc STALE_LEASE
      với heartbeat), và `COUNT(post)`, `COUNT(analysis WHERE status='valid')` không đổi sau lời gọi của nó.
    message_safe_template_vi: "Phiên làm việc của worker đã hết hạn. Việc sẽ được giao lại."
    details_safe_keys: [job_id, lease_epoch_seen, lease_epoch_current, expired_at]
    redaction_vi: "Không ghi worker token, không ghi hostname máy cá nhân."
    operations: [worker.heartbeat, ingest.submit_batch, analysis.heartbeat, analysis.submit_result]
    scenario_refs: [SC20]
    requirement_refs: [REQ-D11, REQ-S9.3-07]
    invariant_refs: [I02, I10]

  - code: STALE_LEASE
    origin: SRC-PLAN §5.1 (wire chung)
    scope: request
    retry_class: none
    title_vi: Lời gọi mang lease_epoch cũ hơn epoch hiện hành
    target_states:
      - {machine: request, to_state: unchanged, note_vi: "Không ghi bất kỳ dữ liệu authoritative nào (SRC-PLAN §5.1)."}
    data_kept_vi: "Không có gì bị ghi, không có gì bị xóa."
    forbidden_vi:
      - "Ghi một phần rồi mới phát hiện epoch cũ: kiểm epoch phải nằm TRƯỚC mọi write trong cùng transaction."
      - "Coi STALE_LEASE là retryable: worker phải claim lại, không lặp cùng lease."
    oracle_vi: "Gửi mutation với epoch = current-1: response STALE_LEASE và hash file DB không đổi."
    message_safe_template_vi: "Yêu cầu dùng phiên làm việc đã cũ và bị từ chối."
    details_safe_keys: [job_id, lease_epoch_seen, lease_epoch_current]
    redaction_vi: "Như WORKER_LEASE_EXPIRED."
    operations: [worker.heartbeat, worker.report_stop, worker.release_assignment, ingest.submit_batch, ingest.commit_checkpoint, analysis.heartbeat, analysis.submit_result, analysis.report_attempt_unknown, analysis.get_task_input, delivery.dispatch_next, run.resume]
    scenario_refs: [SC20]
    requirement_refs: [REQ-D11]
    invariant_refs: [I01, I10]

  # ------------------------------------------------------------------ ingest
  - code: INGEST_ACK_LOST
    origin: SRC-PLAN §10
    scope: request
    retry_class: retryable_with_budget
    retry_budget_ref: ingest_batch_attempts
    title_vi: Client không nhận được ACK; server có thể đã commit hoặc chưa
    target_states:
      - {machine: request, to_state: unchanged, note_vi: "Trạng thái authoritative do receipt quyết định, không do client."}
      - {machine: run, to_state: "status=running", note_vi: "Run không đổi trạng thái vì một ACK mất."}
    data_kept_vi: >-
      Nếu server đã commit thì `ingest_receipt` (UNIQUE owner_id+idempotency_key) tồn tại và replay trả lại đúng
      hàng đó với `receipt_hash` không đổi. Nếu chưa commit thì không có hàng nào.
    forbidden_vi:
      - "Tiến `checkpoint.acked_through_ingest_sequence` khi chưa có receipt (I02)."
      - "Retry mutation trước khi tra `ingest.get_receipt` (SRC-PLAN §5.1)."
      - "Replay cùng key với payload khác — đó là IDEMPOTENCY_CONFLICT, không phải replay."
    oracle_vi: >-
      Crash sau commit trước ACK rồi replay cùng `idempotency_key` + cùng `payload_hash`:
      `COUNT(post)` không đổi, `ingest_receipt.receipt_hash` không đổi, `checkpoint.sequence` không tăng.
      Oracle âm: số lần tải trang KHÔNG phải oracle (AMD-B05).
    message_safe_template_vi: "Không nhận được xác nhận cho lô dữ liệu. Hệ thống tra cứu biên nhận trước khi thử lại."
    details_safe_keys: [idempotency_key, payload_hash, attempt_number, retry_after_ms]
