  - code: RATE_LIMITED
    origin: SRC-PLAN §5.1 (wire chung) + SRC-PLAN §10 (rate limit của nguồn)
    scope: request
    retry_class: retryable_with_budget
    retry_budget_ref: research_connector_rate_limit
    title_vi: Bị giới hạn nhịp gọi (nguồn ngoài hoặc chính API nội bộ)
    target_states:
      - {machine: request, to_state: unchanged, note_vi: "`retry_after_ms` BẮT BUỘC có mặt với mã này."}
      - {machine: analysis, to_state: retry_wait, note_vi: "Khi rate limit đến từ provider AI: retry TRONG đợt theo `provider_unavailable_waits`."}
      - {machine: run, to_state: "status=running, phase=enriching, stop_reason=rate_limited, outcome dự kiến=partial", note_vi: "Khi rate limit đến từ X (ruling CR-PC10-02, SRC-SPEC §9.3). Đóng collection segment, giữ checkpoint đã ACK, ĐI TIẾP với phần dữ liệu đã có. KHÔNG phải `blocked`. Xem contracts/state/run.yaml T-RUN-25."}
    retry_class_by_source:
      note_vi: >-
        Mã này có HAI mặt và chúng KHÔNG cùng lớp retry. `retry_class` ở trên (`retryable_with_budget`) áp cho
        NGUỒN NGOÀI DO SERVER GỌI — research connector và provider AI — nơi retry có ngân sách và an toàn.
      x_collector_vi: >-
        Với nguồn X qua collector (`worker.report_stop`), lớp retry hiệu lực là **`none` TRONG PHẠM VI ĐỢT**:
        SRC-SPEC §9.3 nói "Rate limit / bị chặn → dừng đợt, ghi lý do, không luân chuyển gì để lách". "Retry"
        ở đây là ĐỢT THEO LỊCH KẾ TIẾP, không phải một lần thử lại trong cùng run. Không có backoff nào áp cho
        collector, vì không có lần gọi lại nào để mà backoff.
      why_split_vi: >-
        Gộp hai mặt vào một lớp sẽ dẫn tới một trong hai lỗi: hoặc collector thử lại trong đợt (lách giới hạn),
        hoặc connector từ bỏ ngay lần đầu (mất dữ liệu không cần thiết).
    data_kept_vi: >-
      Không mất dữ liệu; con trỏ và checkpoint giữ nguyên. Với nguồn X: mọi post đã ACK trước thời điểm bị
      giới hạn vẫn commit, và run vẫn dựng báo cáo từ chúng.
    forbidden_vi:
      - "Luân chuyển account/proxy/IP/user-agent để lách giới hạn (REQ-S9.3-02, SRC-SPEC §2.3)."
      - "Bỏ qua `retry_after_ms` do nguồn trả về."
      - "Retry nóng không backoff."
      - "Thử lại TRONG cùng đợt sau khi collector đã báo `rate_limited` (SRC-SPEC §9.3)."
      - "Đẩy run sang `blocked` vì rate limit: `blocked` đòi Owner gỡ bằng `run.resume`, còn rate limit tự hết ở đợt sau (ruling CR-PC10-02)."
      - "Coi `rate_limited` là `source_blocked`: X CÓ cho vào, chỉ bảo chậm lại — hai tình huống hiển thị khác nhau ở REQ-AC15."
    oracle_vi: >-
      Nguồn trả 429 kèm Retry-After: lần gọi kế tiếp không sớm hơn `retry_after_ms`; đếm request trong cửa sổ
      ≤ hạn mức đã cấu hình. Với nguồn X (`worker.report_stop`): sau khi báo, số request tới X = 0 trong phần
      còn lại của đợt; `run.stop_reason='rate_limited'`, `run.rate_limited_at IS NOT NULL`,
      `run.outcome='partial'`, `COUNT(outbox_intent kind='run_alert')` = 0, và occurrence lịch kế tiếp VẪN
      sinh run.
    message_safe_template_vi: "Nguồn đang giới hạn nhịp truy cập. Hệ thống chờ rồi thử lại."
    details_safe_keys: [source_kind, retry_after_ms, attempt_number, window_seconds, rate_limited_at]
    redaction_vi: "Không ghi endpoint đầy đủ hay header của nguồn."
    operations: [worker.report_stop, research.fetch_work_metadata, research.get_connector_health, ai.run_inference_task, telegram.send_payload]
    scenario_refs: [SC03, SC11, SC14, SC15]
    requirement_refs: [REQ-A6, REQ-A7, REQ-S9.3-02, REQ-AC15]
    invariant_refs: [I02, I13]
    note_vi: >-
      `worker.report_stop` được thêm ở FIX3 theo ruling CR-PC10-02: trước đó collector gặp rate limit của X
      KHÔNG có đường báo hợp lệ nào — `collector-probe.md` ST-4 bảo dùng mã này, nhưng mã này không liệt kê
      operation nào của collector và `run.yaml` không có `stop_reason` tương ứng. W2 thêm mã vào
      `worker.report_stop.error_codes` của ports.yaml trong PKT-PC01-FIX6.

  - code: INTERNAL
    origin: SRC-PLAN §5.1 (wire chung)
    scope: request
    retry_class: unknown_outcome
    title_vi: Lỗi không phân loại được ở phía server
    target_states:
      - {machine: request, to_state: unchanged, note_vi: "Trạng thái thật do receipt/CAS quyết định, KHÔNG do mã này."}
      - {machine: storage, to_state: healthy, note_vi: "INTERNAL không tự nó nghĩa là storage hỏng; chỉ STORAGE_WRITE_FAILED mới chuyển write_blocked."}
    data_kept_vi: "Chưa biết. Client phải tra receipt/idempotency trước khi kết luận (SRC-PLAN §5.1)."
    forbidden_vi:
      - "Mặc định coi INTERNAL là rollback."
      - "Trả stack trace hoặc tên bảng/cột trong `message_safe`."
      - "Dùng INTERNAL để che một mã đã có trong danh mục này."
    oracle_vi: "Fault injection ở giữa transaction: client tra `ingest.get_receipt` và kết luận đúng trạng thái; số hàng nhất quán với receipt."
    message_safe_template_vi: "Có lỗi hệ thống. Trạng thái của thao tác chưa xác định."
    details_safe_keys: [correlation_id, operation_id]
    redaction_vi: "TUYỆT ĐỐI không stack trace, không SQL, không tên bảng."
    operations: []
    scenario_refs: [SC21, SC26]
    requirement_refs: [REQ-S9.3-08]
    invariant_refs: [I02, I13]
    note_vi: "Chưa được ports.yaml 0.1.0 tham chiếu; đăng ký ở đây theo yêu cầu PKT-PC03. Xem CR-PC03-04."

# ---------------------------------------------------------------------------
# 4. Quy tắc: không bao giờ yêu cầu persist lỗi vào một DB đang không ghi được
#    (điều kiện "Đạt khi" của SRC-PLAN §11 PC03)
# ---------------------------------------------------------------------------
error_persistence_rule:
  id: EPR-01
  statement_vi: >-
    Không có mã lỗi nào trong file này đòi hỏi một hàng DB mới như điều kiện để lỗi được coi là đã xử lý.
    Với mọi mã, đường báo lỗi tối thiểu là: (a) error envelope trả về cho caller, có `correlation_id` sinh trong
    bộ nhớ tiến trình, và (b) kênh health độc lập DB (`health.get_liveness`, `health.get_readiness`,
    `storage.get_health`). Ghi hàng audit/attempt là mong muốn, không phải điều kiện.
  fallback_channel_vi: >-
    Khi `storage.health ∈ {write_blocked, recovery_required}`: `health.get_liveness` vẫn phải trả lời (nó không
    đọc DB nghiệp vụ — contracts/ports.yaml, SRC-PLAN §8.4); `health.get_readiness` báo module đỏ từ trạng thái
    trong bộ nhớ; UI hiển thị "last-known state" kèm nhãn rõ rằng trạng thái mới CHƯA lưu được
    (contracts/state/storage.yaml §ui_read_model).
  forbidden_vi:
    - "Câu 'đã ghi lỗi vào bảng error_log' như một bảo đảm khi DB không ghi được (SRC-PLAN §8.4)."
    - "Retry vô hạn chỉ để ghi cho được một hàng lỗi."
  oracle_vi: >-
    Disk-full injection trong lúc một run đang chạy: `health.get_liveness` trả 'up', `health.get_readiness` báo
    storage đỏ, error envelope trả về cho collector có `correlation_id`, và số hàng của mọi bảng nghiệp vụ không đổi.
  invariant_refs: [I13]

