# 5. Bảng tra nhanh: mã → machine → trạng thái đích
# ---------------------------------------------------------------------------
index_by_machine:
  run: [X_CHALLENGE_REQUIRED, X_ACCESS_BLOCKED, SOURCE_LAYOUT_CHANGED, WORKER_LEASE_EXPIRED, INGEST_ACK_LOST, SOURCE_METADATA_UNAVAILABLE, IDENTITY_CONFLICT, AI_PROVIDER_UNAVAILABLE, AI_ATTEMPT_UNCERTAIN, TAG_VERSION_STALE, TELEGRAM_SEND_UNCERTAIN, TELEGRAM_PERMANENT_FAILURE, STORAGE_WRITE_FAILED, RESTORE_UNVERIFIED, RATE_LIMITED]
  analysis: [WORKER_LEASE_EXPIRED, SOURCE_METADATA_UNAVAILABLE, AI_OUTPUT_INVALID, AI_PROVIDER_UNAVAILABLE, AI_ATTEMPT_UNCERTAIN, RATE_LIMITED]
  report: [EMBEDDING_GENERATION_MISMATCH, TAG_VERSION_STALE, CONFLICT]
  delivery: [TELEGRAM_SEND_UNCERTAIN, TELEGRAM_PERMANENT_FAILURE, RESTORE_UNVERIFIED]
  storage: [STORAGE_WRITE_FAILED, RESTORE_UNVERIFIED, INTERNAL]
  request_only_unchanged: [STALE_LEASE, IDEMPOTENCY_CONFLICT, UNAUTHORIZED, UNAUTHORIZED_COMMAND, CAPABILITY_DENIED, FORBIDDEN_EDGE, CSRF_REJECTED, VALIDATION_ERROR, NOT_FOUND]
