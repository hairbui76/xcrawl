# ---------------------------------------------------------------------------
# 1. Error envelope (SRC-PLAN §5.1). PC05 tham chiếu, không định nghĩa lại.
# ---------------------------------------------------------------------------
error_envelope:
  contract_id: CT-errors-envelope
  applies_to_vi: >-
    Mọi response lỗi của operation trong contracts/ports.yaml, bất kể transport `http` hay `internal`.
  encoding: "application/json; charset=utf-8"
  additional_properties: false
  fields:
    - {name: code, type: string, nullable: false, constraints: "SCREAMING_SNAKE; phải là một `code` khai báo ở mục 3 của file này. Không có mã ngoài danh mục."}
    - {name: scope, type: enum, nullable: false, constraints: "`run` | `item` | `delivery` | `storage` | `request`. Bằng đúng `scope` của mã trong mục 3."}
    - {name: retry_class, type: enum, nullable: false, constraints: "`none` | `retryable_with_budget` | `needs_user` | `operator_decision` | `unknown_outcome`. Bằng đúng `retry_class` của mã."}
    - {name: message_safe, type: string, nullable: false, constraints: "Tiếng Việt, ≤ 300 ký tự, render từ `message_safe_template` của mã. KHÔNG chèn giá trị chưa nằm trong `details_safe_keys`."}
    - {name: correlation_id, type: string, nullable: false, constraints: "ULID. Bắt buộc kể cả khi không ghi được vào DB (mục 4)."}
    - {name: details_safe, type: object, nullable: true, constraints: "Chỉ chứa các khóa liệt kê ở `details_safe_keys` của mã. Khóa lạ ⇒ VALIDATION_ERROR ở phía producer, không gửi ra."}
    - {name: retry_after_ms, type: integer, nullable: true, constraints: "Chỉ có mặt khi `retry_class = retryable_with_budget` hoặc mã `RATE_LIMITED`. Đơn vị mili giây. NULL nghĩa là không có gợi ý, không phải 'retry ngay'."}
  forbidden_content_vi:
    - "Transcript của model, prompt gốc, nội dung post nguyên văn."
    - "API key, bot token, cookie, header Authorization, chat ID, đường dẫn file tuyệt đối trên máy cá nhân."
    - "Stack trace, câu SQL, tên bảng/cột nội bộ."
    - "URL nguồn đầy đủ khi lỗi phát sinh trong đường xử lý nội dung không tin cậy (SRC-SPEC §11.4)."
  correlation_rule_vi: >-
    `correlation_id` được sinh ở biên nhận request và đi kèm mọi log/metric của request đó. Khi
    `storage.health != healthy`, envelope vẫn phải có `correlation_id` — nó đến từ bộ nhớ tiến trình và từ kênh
    health độc lập, KHÔNG cần một hàng DB (SRC-PLAN §8.4). Xem mục 4.

# ---------------------------------------------------------------------------
# 2. Vocabulary
# ---------------------------------------------------------------------------
vocabulary:
  scope:
    run: "Lỗi làm đổi trạng thái của một `run` (ENT-run)."
    item: "Lỗi thuộc về một đơn vị công việc con: một analysis task hoặc một target."
    delivery: "Lỗi thuộc về một `delivery` / `delivery_part` (ENT-delivery, ENT-delivery-part)."
    storage: "Lỗi thuộc về khả năng ghi của data store (contracts/state/storage.yaml)."
    request: "Lỗi ở mức một lần gọi operation; không tự nó đổi trạng thái nghiệp vụ nào."
  retry_class:
    none: "Không retry. Lặp lại y hệt sẽ cho cùng kết quả; cần thay đổi đầu vào hoặc quyết định của người."
    retryable_with_budget: "Được retry theo đúng một budget có tên trong contracts/retry-policy.yaml. Không có budget ⇒ không được retry."
    needs_user: "Chỉ Owner mới gỡ được; hệ thống dừng và chờ. Không có đường tự động."
    operator_decision: "Kết quả cần một quyết định có chủ đích của Operator qua một operation cụ thể; hệ thống không tự chọn."
    unknown_outcome: "Không biết side effect ngoài hệ thống đã xảy ra hay chưa. Timeout transport là KHÔNG BIẾT, không phải rollback (SRC-PLAN §5.1)."
  target_states_semantics_vi: >-
    Mỗi phần tử của `target_states` có `machine` ∈ {run, analysis, report, delivery, storage, request} và
    `to_state`. Với machine ≠ `request`, `to_state` phải là một trạng thái đã khai báo trong file state tương ứng.
    Với machine = `request`, `to_state` luôn là `unchanged`: mã đó không đổi trạng thái nghiệp vụ nào, và đây là
    một phát biểu kiểm chứng được (oracle: số hàng của mọi bảng nghiệp vụ không đổi), không phải chỗ trống.

