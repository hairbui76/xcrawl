  /v1/data/purge:
    post:
      operationId: data.purge_all
      summary: Xóa toàn bộ dữ liệu (thao tác thứ ba của SRC-SPEC §7.3, đòi xác nhận gõ tay)
      description: "`phase`, `purge_challenge_id` (phase execute), `confirmation_phrase` (phase execute).\n\nXem transaction_vi\
        \ và exclusions_vi. Ba tập bảng (37 xóa / 21 giữ / 2 không bao giờ xóa) theo ruling CR-PC05-06 + CR-PC05-07; CR-PC01-05\
        \ khép lại.\n\nXóa dữ liệu nghiên cứu. Phạm vi ĐÃ ĐƯỢC OWNER CHỐT — `ACCEPTED (OD-20260907-01 mục 24)`; nó KHÔNG\
        \ còn `OWNER_DECISION_REQUIRED`, và `PROV-PC00-01` / `PROV-PC01-03` chỉ còn giá trị LỊCH SỬ. Ba tập bảng dưới đây\
        \ lấy nguyên văn từ ruling `PURGE-LIST-ruling.md` (2026-09-07T05:55Z), bản đã sửa lỗi CR-PC05-06. \n\nXÓA (37 bảng):\
        \ post, post_work, work, work_version, identity_alias, identity_conflict, identity_merge_audit, work_label, analysis,\
        \ analysis_generation, analysis_attempt, analysis_task, embedding_generation, tag_vector, report, report_item, emerging_direction,\
        \ coverage_window, pending_item_ledger, backfill_ledger, first_announced_ledger, rescan_ledger, saved_item, saved_snapshot,\
        \ delivery, delivery_part, delivery_attempt, delivery_receipt, outbox_intent, run, assignment, assignment_lease,\
        \ checkpoint, ingest_receipt, source_fetch_log, telegram_update_log, telegram_link_attempt (bộ đếm rate limit, giữ\
        \ 30 ngày — dữ liệu VẬN HÀNH, không phải cấu hình). \n\nGIỮ LẠI (21 bảng): `owner`, `session`, `secret_ref`, `task_credential`,\
        \ `secret_audit`, `telegram_link`, `telegram_link_code`, `provider_config`, `provider_test_result`, `settings`,\
        \ `schedule_occurrence`, `tag`, `tag_alias`, `tag_exclusion`, `tag_config_version`, `source_connection`, `backup_snapshot`,\
        \ `backup_manifest`, `restore_record`, `purge_challenge`, `worker_registration` (đăng ký/token của collector là\
        \ CẤU HÌNH, không chứa dữ liệu nghiên cứu; xóa nó buộc phải đăng ký lại collector). \n\nKHÔNG BAO GIỜ XÓA (2 bảng):\
        \ `schema_migration` (mô tả cấu trúc kho) và `data_deletion_audit` (bản ghi xóa được giữ VĨNH VIỄN theo tham số\
        \ PC08 đã phê chuẩn; chính thao tác purge ghi một hàng audit vào đây). \n\nLÝ DO GIỮ: xóa credential đăng nhập sẽ\
        \ khóa chính chủ nhà ra ngoài app (REQ-D05 cấm signup và cấm quên-mật-khẩu tự động), và xóa cấu hình biến 'xóa dữ\
        \ liệu' thành 'gỡ cài đặt' — hai ý định khác nhau. Sau purge, hệ thống vẫn đăng nhập được, vẫn giữ lịch và tag,\
        \ và vẫn đủ cấu hình để chạy đợt mới từ đầu. \n\nBACKUP KHÔNG BỊ ĐỤNG TỚI: artifact backup trên hệ thống tệp và\
        \ các bảng `backup_*` đều được giữ. Hộp thoại xác nhận PHẢI nói thẳng rằng **dữ liệu vừa xóa vẫn còn trong các bản\
        \ backup**; xóa khỏi backup là một thao tác vận hành RIÊNG (contracts/ops/backup-restore.md). Không được để người\
        \ dùng tin rằng purge đã xóa mọi dấu vết — đây là điểm Owner được cảnh báo là có hậu quả lớn nhất. \n\nHAI PHA (một\
        \ operation_id, hai `phase`): (1) `request_challenge` — server sinh `purge_challenge` có hạn và trả về cụm từ xác\
        \ nhận để người dùng gõ lại; KHÔNG xóa gì. (2) `execute` — đòi `purge_challenge_id` + `confirmation_phrase` khớp\
        \ CHÍNH XÁC cụm từ server đã phát; sai hoặc hết hạn ⇒ 422 `VALIDATION_ERROR`, challenge bị hủy và phải xin lại.\
        \ Một challenge dùng đúng một lần. \n\nTIỀN ĐIỀU KIỆN: chỉ chạy được khi `storage.health = maintenance`; ở `healthy`,\
        \ `write_blocked` hay `recovery_required` ⇒ 409 `CONFLICT`. Thu hồi mọi `assignment_lease`, dừng scheduler và delivery\
        \ dispatcher TRƯỚC khi xóa (I10). Sau khi xong, `storage.health` VẪN ở `maintenance` cho tới khi owner mở lại —\
        \ không tự động resume dispatcher (cùng nguyên tắc NC-10)."
      tags:
      - data-admin
      security:
      - ownerSessionCookie: []
        ownerCsrfToken: []
      x-auth-scope: owner_session
      x-owner-module: MOD-data-admin-service
