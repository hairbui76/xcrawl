    - SRC-SPEC §3.2
    - SRC-SPEC §6
    - SRC-SPEC §9
    - SRC-SPEC §11.1
    - SRC-SPEC §11.2
    - SRC-SPEC §11.3
    requirement_refs:
    - REQ-D04
    - REQ-D05
