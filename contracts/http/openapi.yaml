    - AMD-B11
    - AMD-B12
    - ADR-0001
    - ADR-0010
    - R-01 (A1-R1)
    - R-03 (A1-R1)
    - R-04 (A1-R1)
    invariant_refs:
    - I01
    - I02
    - I03
    - I05
    - I09
    - I10
