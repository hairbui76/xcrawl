        bị xóa trên X" là **một trường của item** trong lô — `source_deleted_observed_at` (RFC 3339 UTC, nullable) — chứ
        **không** phải một operation riêng: collector chỉ báo cáo cái nó quan sát được ở thời điểm thu thập, còn việc diễn
        giải và ghi nhận là của server (ruling của Coordinator trong PKT-PC01-FIX1). Trường này không xóa dữ liệu và không
        đụng tới Saved: snapshot đã lưu vẫn đọc được kể cả khi bài gốc bị xóa trên X (D55, AC-12).


        **Đường chính để checkpoint trở nên bền.** Commit post + receipt dedup + `client_checkpoint_proposal` của lô trong
        **cùng một** transaction (PC02 `TXN-ingest-batch`, I02). Dedup theo `x_post_id`; cam kết là **không ingest trùng**,
        không phải "không bao giờ đọc lại" (B05/AMD-B05). ACK chỉ sau commit. Không có đường nào ghi checkpoint ở transaction
        riêng **trước** commit của lô (ruling R-01); ingest.commit_checkpoint chỉ dùng khi lô rỗng.


