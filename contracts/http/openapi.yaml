    post:
      operationId: worker.report_stop
      summary: Báo điểm dừng của đợt (challenge / limit / blocked / hết phiên)
      description: 'lease_id/epoch + `stop_reason` ∈ {`challenge_required`, `limit_reached`, `session_expired`, `source_blocked`,
        `source_layout_changed`, `rate_limited`, `worker_shutdown`, `local_storage_unavailable`} + checkpoint đã ACK cuối
        cùng.


        `challenge_required`/`session_expired` → run `needs_user`, tạo **tối đa một** alert intent cho mỗi run, không tự
        thử lại. `limit_reached` → đóng collection segment, giữ checkpoint, chuyển phase tiếp theo. `source_blocked` → run
        `blocked`, ghi điều kiện gỡ chặn, **không** luân chuyển account/proxy. `rate_limited` → đóng collection segment
        với `RATE_LIMITED`, run kết thúc `outcome: partial`, **không** retry trong cùng run; đợt theo lịch kế tiếp chạy
        bình thường. Đây **khác** `source_blocked`: rate limit nghĩa là X **vẫn cho vào** nhưng bảo chờ, còn `source_blocked`
        nghĩa là X **không cho vào**. Ba cách hiểu gộp làm một sẽ cho ba hành vi UI khác nhau ở AC-15 (SRC-SPEC §9.3 "dừng
        đợt, ghi lý do, không luân chuyển gì để lách"; ruling CR-PC10-02; PC03 thêm hàng transition trong run.yaml). Giữ
        checkpoint đã ACK; **không** luân chuyển account/proxy và **không** dò lại để tìm giới hạn. `source_layout_changed`
        → run `blocked` với `SOURCE_LAYOUT_CHANGED`: nguồn đổi bố cục nên parser không đọc được, **khác hẳn** bị chặn —
        cách gỡ là sửa parser, không phải chờ hết hạn chế, và **không** được tự thử lại để dò (ruling CR-PC05-01; PC03 đăng
        ký mã trong contracts/errors.yaml). Dữ liệu đã ACK giữ nguyên; không đoán nội dung từ bố cục lạ.


        `challenge_required`/`session_expired` ⇒ run `needs_user` + TỐI ĐA MỘT alert intent mỗi run (REQ-AC04). `limit_reached`
        ⇒ đóng segment, giữ checkpoint, sang phase kế. `source_blocked` ⇒ run `blocked`, KHÔNG luân chuyển account/proxy.'
      tags:
      - worker
      security:
      - collectorToken: []
      x-auth-scope: collector_token
      x-owner-module: MOD-job-service
      x-caller-modules:
      - MOD-x-collector
