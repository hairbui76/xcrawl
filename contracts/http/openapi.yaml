# Research Radar — HTTP wire contract (OpenAPI 3.1.0)
# Ngôn ngữ: prose tiếng Việt, identifier/khóa/enum tiếng Anh (baseline §3).
# Gói: PC05 · Packet: PKT-PC05 · Worker: worker-W4
# SINH TỰ ĐỘNG từ contracts/ports.yaml bằng scratch/w4/gen_openapi.py + assemble_openapi.py.
# operationId giữ nguyên operation_id của ports.yaml (baseline §3: ports.yaml là thẩm quyền đặt tên operation).

openapi: 3.1.0
info:
  title: Research Radar — HTTP wire contract
  version: 0.3.0
  summary: 'Hợp đồng HTTP cho toàn bộ operation `transport: http` của contracts/ports.yaml.'
  description: |-
    Đây là hợp đồng dây (wire) của Research Radar, sinh từ `contracts/ports.yaml` và giữ nguyên `operation_id`
    làm `operationId`. Mỗi operation `transport: http` trong ports.yaml có ĐÚNG MỘT cặp path+method ở đây.

    Những gì file này KHÔNG định nghĩa, và nơi chúng thuộc về:
      - Ngữ nghĩa transition trạng thái  → contracts/state/*.yaml (PC03)
      - Danh mục mã lỗi và envelope      → contracts/errors.yaml (PC03); `ErrorEnvelope` dưới đây là bản sao ĐÚNG
                                           hình dạng của `error_envelope` trong file đó
      - Ngân sách retry/timeout/lease    → contracts/retry-policy.yaml (PC03)
      - Ranh giới module và cạnh bị cấm  → contracts/modules.yaml (PC01)
      - Nội dung/coverage báo cáo        → contracts/reporting/* (PC04)
      - Task và schema AI                → contracts/ai/* (PC06)
      - Ngữ nghĩa lệnh Telegram          → contracts/telegram/commands.yaml (PC07)
      - Vòng đời secret, CSRF, xoay token→ contracts/ops/secrets.md (PC08)

    Wire rules bắt buộc (SRC-PLAN §5.1), áp cho mọi operation:
      - ID truyền dưới dạng string; timestamp UTC RFC 3339 với độ chính xác mili giây (AMD-B08).
      - Mutation từ worker mang `request_id`, `schema_version`, `idempotency_key`, `payload_hash`; mutation đang
        giữ job mang thêm `job_id`, `lease_id`, `lease_epoch`.
      - Cùng idempotency key + cùng payload ⇒ trả receipt đã commit. Cùng key + payload khác ⇒ 409
        `IDEMPOTENCY_CONFLICT`, KHÔNG ghi đè.
      - Lease cũ ⇒ 409 `STALE_LEASE`, KHÔNG dữ liệu authoritative nào đổi.
      - TIMEOUT TRANSPORT LÀ KHÔNG BIẾT KẾT QUẢ, không mặc định là rollback. Trước khi retry một mutation, client
        PHẢI tra receipt (`ingest.get_receipt`, `delivery.get_status`) hoặc replay theo hợp đồng idempotent.
      - Network call KHÔNG nằm trong transaction SQLite dài; side effect ngoài đi qua outbox đã commit.
      - Error envelope không bao giờ chứa transcript, key, cookie, chat ID hay stack trace.

    Default deny (SRC-PLAN §6): một cạnh caller→callee không có trong contracts/modules.yaml là BỊ CẤM. Mỗi
    operation ghi `x-caller-modules` lấy nguyên từ ports.yaml; gọi từ module khác ⇒ 403 `FORBIDDEN_EDGE`.
  x-contract:
    contract_id: CT-http-openapi
    version: 0.3.0
    status: draft
    owner_role: connector contract owner
    source_refs:
    - SRC-PLAN §5
    - SRC-PLAN §5.1
    - SRC-PLAN §6
    - SRC-PLAN §8.1
    - SRC-PLAN §9.1
    - SRC-PLAN §10
    - SRC-PLAN §11 PC05
