    dependencies:
    - contracts/ports.yaml
    - contracts/modules.yaml
    - contracts/capabilities.yaml
    - contracts/errors.yaml
    - contracts/retry-policy.yaml
    - contracts/data/entities.yaml
    - contracts/state/run.yaml
    - contracts/state/analysis.yaml
    - contracts/state/delivery.yaml
    - contracts/state/storage.yaml
    - contracts/schemas/ingest-batch.schema.json
    - contracts/schemas/ingest-receipt.schema.json
    - contracts/schemas/worker-assignment.schema.json
    - contracts/schemas/target.schema.json
    scope: 'Hợp đồng HTTP cho 54 operation `transport: http` của contracts/ports.yaml: path, method, security, header bắt
      buộc, request/response schema (bằng $ref tới file schema), mã trạng thái cho từng mã lỗi, và giới hạn kích thước/timeout.
      31 operation `transport: internal` KHÔNG có mặt ở đây một cách CÓ CHỦ ĐÍCH: chúng là port trong tiến trình, không
      bao giờ lộ ra mạng.'
    verification: 'EV-PC05-01/03 (SELF_VALIDATION): script cấu trúc đối chiếu 1-1 operationId ↔ ports.yaml, kiểm mọi $ref
      tới file tồn tại, kiểm mọi mutation có idempotency + đủ nhóm response lỗi, kiểm mọi mã lỗi tồn tại trong contracts/errors.yaml.
      KHÔNG có validator OpenAPI 3.1 nào được cài; không cài thêm gì (baseline §3).'
    claim_ceiling: DRAFT_FOR_REVIEW
    security_scheme_decision:
      status: PROVISIONAL
      decision_owner: Owner
      coordinated_with: PC08 (W2) — Coordinator đã ra cùng chỉ dẫn cho cả hai gói; PC08 sở hữu quyết định cuối.
      choice_vi: 'Trình duyệt (owner UI): cookie phiên HttpOnly + Secure + SameSite=Lax, KÈM CSRF double-submit (header
        `X-CSRF-Token` phải khớp cookie không-HttpOnly). Collector và analysis worker: bearer token tĩnh trong file cấu
        hình quyền hạn chế trên máy cá nhân. Telegram ingress: header bí mật `X-Telegram-Bot-Api-Secret-Token`.'
      rationale_vi: 'App ra Internet nên D01 (một người dùng) KHÔNG đồng nghĩa không cần bảo vệ (SRC-SPEC §11.1). Cookie
        HttpOnly khiến XSS không đọc được token; vì cookie tự động gửi kèm, CSRF double-submit là bắt buộc cho MỌI mutation
        dùng phiên owner. Worker không phải trình duyệt nên không có bề mặt CSRF: bearer token đơn giản hơn và khớp đúng
        câu ''token collector→backend lưu ở file cấu hình quyền hạn chế'' (SRC-SPEC §11.2).'
      owned_by_pc08_vi: Thời hạn phiên, xoay vòng token, thuật toán ký, lưu trữ at-rest, và quy trình thu hồi. Nếu PC08
        chọn khác, file này phải cập nhật; xem CR-PC05-02.
      fix1_resolution_vi: 'FIX1 (PKT-PC05-FIX1): PC08 `contracts/ops/secrets.md` đã gọi tên đúng sáu scheme này nguyên văn,
        nên KHÔNG có đổi tên (CR-PC08-02 đóng về phía PC05). Hai sửa thực chất: (1) `owner_session` cho mutation nay khai
        cookie và CSRF trong CÙNG một security requirement — quan hệ AND; bản 0.1.0 khai chúng thành hai requirement riêng,
        tức OR, nên cookie một mình đã đủ qua và bảo vệ CSRF trên thực tế không tồn tại. (2) Route `backup.*` nay chỉ nhận
        `backupOperatorToken`, bỏ đường phiên trình duyệt. Thêm: mã 403 `CSRF_REJECTED` được map cho mọi mutation dùng phiên
        owner (CR-PC08-03).'
      csrf_scope_vi: Bearer token (collector, analysis worker, backup operator) và webhook secret KHÔNG có bề mặt CSRF —
        chúng không được trình duyệt tự động gửi kèm. `CSRF_REJECTED` do đó KHÔNG xuất hiện trên các route đó. Với `run.run_now`
        và `save.create` (auth_scope `owner_session_or_linked_chat`), mã này chỉ áp cho nhánh cookie; nhánh Telegram đi
        qua `telegramIngressSecret`.
servers:
- url: https://{host}/api
  description: Server app, truy cập được từ ngoài mạng nhà (REQ-D04). BẮT BUỘC HTTPS.
  variables:
    host:
      default: radar.example.invalid
      description: Host do Owner cấu hình. `.invalid` là placeholder — không phải địa chỉ thật.
tags:
- name: auth
  description: Đăng nhập một tài khoản duy nhất (REQ-D05).
- name: settings
  description: Cấu hình vận hành. KHÔNG bao giờ trả giá trị secret.
- name: tags
  description: Chủ đề theo dõi. Tag chỉ là tham số tìm kiếm với collector (REQ-D24).
- name: runs
  description: Vòng đời đợt chạy (contracts/state/run.yaml).
- name: worker
  description: 'Collector trên máy cá nhân: đăng ký, claim, heartbeat, báo dừng.'
- name: ingest
  description: Đường DUY NHẤT để dữ liệu vào hệ thống (REQ-D08). Collector không ghi SQLite.
- name: identity
  description: Xung đột định danh cần Owner xử lý; không merge đoán (B15).
- name: works
  description: Chi tiết công trình.
- name: analysis
  description: Task phân tích cho worker trên máy cá nhân (REQ-D42).
- name: secrets
  description: Cấp credential theo phạm vi một task (B13).
- name: reports
  description: Báo cáo đã publish; nội dung bất biến (I05).
- name: saved
  description: Save là snapshot bất biến (I08).
- name: data-admin
  description: Xóa dữ liệu gốc và xóa toàn bộ (MOD-data-admin-service, ruling R-04).
- name: telegram
  description: Webhook ingress và liên kết. Ngữ nghĩa lệnh thuộc PC07.
- name: delivery
  description: Trạng thái gửi và quyết định của Operator với part `unknown` (AMD-B03).
- name: backup
  description: Snapshot, verify, restore, reconcile (AMD-B11).
- name: health
  description: Kênh sống/sẵn sàng ĐỘC LẬP DB (SRC-PLAN §8.4).
security:
- ownerSessionCookie: []
  ownerCsrfToken: []
components:
  securitySchemes:
    ownerSessionCookie:
      type: apiKey
      in: cookie
      name: rr_session
      description: 'Cookie phiên HttpOnly + Secure + SameSite=Lax. PROVISIONAL, phối hợp với PC08 (xem info.x-contract.security_scheme_decision).
        Với MUTATION, scheme này xuất hiện CÙNG `ownerCsrfToken` trong MỘT security requirement — tức quan hệ AND, cookie
        một mình KHÔNG đủ. Với read-only, cookie đứng một mình: CSRF bảo vệ thao tác đổi trạng thái, không phải phép đọc.'
    ownerCsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 'CSRF double-submit: giá trị phải khớp cookie `rr_csrf` (không-HttpOnly). Bắt buộc cho MỌI mutation của
        owner session. Thiếu hoặc lệch ⇒ 403 `CSRF_REJECTED` (KHÔNG phải `FORBIDDEN_EDGE`: cạnh vẫn hợp lệ, chỉ lời gọi
        không chứng minh được nó do trang của ứng dụng phát ra — ruling CR-PC08-03/CR-PC08-04). Phiên KHÔNG bị hủy khi gặp
        mã này.'
    collectorToken:
      type: http
      scheme: bearer
      description: Token của collector, lưu trong file cấu hình QUYỀN HẠN CHẾ trên máy cá nhân, KHÔNG BAO GIỜ trong repo
        (SRC-SPEC §11.2). Chỉ mở được các operation `worker.*` và `ingest.*`; gọi `save.create` bằng token này ⇒ 401 (denied
        case NC-01).
    analysisWorkerToken:
      type: http
      scheme: bearer
      description: Token của analysis worker. Chỉ mở `analysis.*` và `secret.issue_task_credential`. KHÔNG mở đường tới
        tag, report hay Saved (denied case NC-02).
    telegramIngressSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Bí mật webhook do app đặt khi đăng ký webhook với Telegram. Sai hoặc thiếu ⇒ 401 và KHÔNG xử lý update.
        Biết chat ID KHÔNG phải là quyền (SRC-SPEC §11.3).
    backupOperatorToken:
      type: http
      scheme: bearer
      description: 'Danh tính operator backup. Tách khỏi phiên owner vì restore là thao tác có khóa side effect (AMD-B11).
        Sửa ở FIX1 (CR-PC08-02): mọi route `backup.*` nhận DUY NHẤT scheme này — trước đây phiên trình duyệt cũng qua được,
        nghĩa là một tab đang mở có thể kích hoạt restore.'
  parameters:
    SchemaVersionHeader:
      name: X-Schema-Version
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/SemVer'
      description: Phiên bản wire schema của request. KHÔNG dùng 'latest' (SRC-PLAN §5). Lệch major ⇒ 422 `VALIDATION_ERROR`
        với `details_safe.violation_kind = schema_version_unsupported`.
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: ID của LẦN GỌI này. Một retry sinh `X-Request-Id` MỚI nhưng GIỮ NGUYÊN `Idempotency-Key` — đó là cách
        server phân biệt replay với một yêu cầu mới.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      description: Khóa chống trùng do client cấp; phạm vi khóa nằm ở `x-idempotency.key_scope` của từng operation. Cùng
        key + cùng payload_hash ⇒ trả kết quả đã commit. Cùng key + payload khác ⇒ 409 `IDEMPOTENCY_CONFLICT`, KHÔNG ghi
        đè (SRC-PLAN §5.1).
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
      description: Double-submit CSRF; phải khớp cookie `rr_csrf`. Chỉ xuất hiện trên MUTATION dùng phiên owner. Thiếu/lệch
        ⇒ 403 `CSRF_REJECTED`.
    TelegramSecretHeader:
      name: X-Telegram-Bot-Api-Secret-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 256
      description: Bí mật webhook. Sai ⇒ 401, không xử lý, không trả lời chat.
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      description: |-
        Envelope lỗi chung (SRC-PLAN §5.1). Hình dạng này là BẢN SAO của `error_envelope` trong contracts/errors.yaml;
        nếu hai bên lệch nhau thì contracts/errors.yaml THẮNG và file này phải sửa.

        `correlation_id` LUÔN có mặt, kể cả khi `storage.health != healthy`: nó sinh trong bộ nhớ tiến trình, không cần
        một hàng DB. Không mã lỗi nào đòi hỏi ghi được vào DB mới coi là đã báo (contracts/errors.yaml §EPR-01).

        Envelope KHÔNG BAO GIỜ chứa: transcript của model, prompt gốc, nội dung post nguyên văn, API key, bot token,
        cookie, header Authorization, chat ID, đường dẫn file tuyệt đối, stack trace, câu SQL, tên bảng/cột nội bộ.
      required:
      - code
      - scope
      - retry_class
      - message_safe
      - correlation_id
      properties:
        code:
          type: string
          enum:
          - X_CHALLENGE_REQUIRED
          - X_ACCESS_BLOCKED
          - WORKER_LEASE_EXPIRED
          - STALE_LEASE
          - INGEST_ACK_LOST
          - IDEMPOTENCY_CONFLICT
          - SOURCE_METADATA_UNAVAILABLE
          - IDENTITY_CONFLICT
          - AI_OUTPUT_INVALID
          - AI_PROVIDER_UNAVAILABLE
          - AI_ATTEMPT_UNCERTAIN
          - EMBEDDING_GENERATION_MISMATCH
          - TAG_VERSION_STALE
          - CONFLICT
          - TELEGRAM_SEND_UNCERTAIN
          - TELEGRAM_PERMANENT_FAILURE
          - UNAUTHORIZED_COMMAND
          - STORAGE_WRITE_FAILED
          - RESTORE_UNVERIFIED
          - SOURCE_LAYOUT_CHANGED
          - CSRF_REJECTED
          - UNAUTHORIZED
          - CAPABILITY_DENIED
          - FORBIDDEN_EDGE
          - VALIDATION_ERROR
          - NOT_FOUND
          - RATE_LIMITED
          - INTERNAL
          description: Phải là một mã đã khai trong contracts/errors.yaml. Không có mã ngoài danh mục.
        scope:
          type: string
          enum:
          - run
          - item
          - delivery
          - storage
          - request
          description: Bằng đúng `scope` của mã trong contracts/errors.yaml.
        retry_class:
          type: string
          enum:
          - none
          - retryable_with_budget
          - needs_user
          - operator_decision
          - unknown_outcome
          description: Bằng đúng `retry_class` của mã. `unknown_outcome` nghĩa là KHÔNG BIẾT side effect đã xảy ra hay chưa
            — client KHÔNG được coi là rollback.
        message_safe:
          type: string
          maxLength: 300
          description: Tiếng Việt, render từ `message_safe_template` của mã. KHÔNG chèn giá trị ngoài `details_safe_keys`.
        correlation_id:
          $ref: '#/components/schemas/Ulid'
        details_safe:
          type:
          - object
          - 'null'
          description: Chỉ chứa các khóa liệt kê ở `details_safe_keys` của mã trong contracts/errors.yaml. Khóa lạ ⇒ producer
            tự từ chối, không gửi ra.
        retry_after_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Chỉ có mặt khi `retry_class = retryable_with_budget` hoặc mã `RATE_LIMITED`. null nghĩa là KHÔNG
            có gợi ý, KHÔNG phải 'retry ngay'.
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      description: ID truyền dưới dạng string (SRC-PLAN §5.1).
    SemVer:
      type: string
      pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    Sha256:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    TimestampUtcMs:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
      description: UTC RFC 3339 với độ chính xác mili giây; tie-break bằng ingest sequence (AMD-B08). Không có offset nào
        khác `Z`.
    IdempotencyKey:
      type: string
      pattern: ^[A-Za-z0-9_.:-]{16,128}$
    PageLimit:
      type: integer
      minimum: 1
      maximum: 100
      default: 25
      description: Phân trang bằng cursor; `limit` có trần cứng 100 để một response không phình.
    TargetRef:
      type: string
      minLength: 3
      maxLength: 512
      pattern: ^(work|post):[A-Za-z0-9_.:%/-]{1,500}$
      description: Tagged union `work | post` (B06/ADR-0009). Hai cột nullable với một UNIQUE mơ hồ KHÔNG đủ (contracts/data/invariants.md
        Phụ lục A).
    SessionInfo:
      type: object
      additionalProperties: false
      required:
      - authenticated
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
          minLength: 32
          maxLength: 128
          description: Giá trị để double-submit. Cũng được đặt vào cookie `rr_csrf` không-HttpOnly.
        expires_at:
          $ref: '#/components/schemas/TimestampUtcMs'
        schema_version:
          $ref: '#/components/schemas/SemVer'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - password
      description: Một tài khoản duy nhất (REQ-D05). KHÔNG có signup, KHÔNG có quên-mật-khẩu tự động. Mật khẩu KHÔNG BAO
        GIỜ được ghi log ở bất kỳ dạng nào.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 1024
          format: password
          writeOnly: true
    StopReport:
      type: object
      additionalProperties: false
      description: |-
        Request của `worker.report_stop`. Enum `stop_reason` giữ ĐÚNG tám giá trị của
        `contracts/ports.yaml` → `worker.report_stop.request_summary_vi`; trạng thái run mà mỗi giá trị dẫn tới
        được khóa ở `contracts/state/run.yaml`:

          challenge_required        -> run needs_user  (T-RUN-09) + TOI DA MOT alert intent moi run
          session_expired           -> run needs_user  (T-RUN-09)
          limit_reached             -> dong segment, phase ke tiep (T-RUN-02); KHONG phai loi
          rate_limited              -> dong segment, phase ke tiep (T-RUN-25), outcome du kien partial;
                                       KHONG retry trong dot; dot theo lich ke tiep chay binh thuong
          source_blocked            -> run blocked     (T-RUN-16); can Owner go bang run.resume
          source_layout_changed     -> run blocked     (T-RUN-24) + mot alert intent; can sua bo doc
          worker_shutdown           -> tra assignment, lease thu hoi
          local_storage_unavailable -> tra assignment; server KHONG doi trang thai nghien cuu

        `rate_limited` va `source_blocked` la HAI gia tri khac nhau mot cach co chu dich: rate limit nghia la X VAN
        cho vao nhung bao cho, con source_blocked nghia la X KHONG cho vao. Gop chung se cho ba hanh vi UI khac nhau
        o AC-15 (SRC-SPEC §9.3; ruling CR-PC10-02).
      required:
      - request_id
      - schema_version
      - assignment_id
      - stop_report_id
      - lease_id
      - lease_epoch
      - stop_reason
      - last_acked_ingest_sequence
      properties:
        request_id:
          $ref: '#/components/schemas/Ulid'
        schema_version:
          $ref: '#/components/schemas/SemVer'
        assignment_id:
          $ref: '#/components/schemas/Ulid'
        stop_report_id:
          allOf:
          - $ref: '#/components/schemas/Ulid'
          description: 'Idempotency: `assignment_id + stop_report_id`. Báo lại cùng giá trị KHÔNG tạo alert thứ hai (REQ-AC04).'
        lease_id:
          $ref: '#/components/schemas/Ulid'
        lease_epoch:
          type: integer
          minimum: 1
          description: Epoch cũ ⇒ 409 `STALE_LEASE`, không ghi gì.
        stop_reason:
          type: string
          enum:
          - challenge_required
          - limit_reached
          - session_expired
          - source_blocked
          - source_layout_changed
          - rate_limited
          - worker_shutdown
          - local_storage_unavailable
        last_acked_ingest_sequence:
          type: integer
          minimum: 0
          description: Mốc ACK cuối cùng collector quan sát được. Server đối chiếu với `checkpoint.acked_through_ingest_sequence`
            của chính nó; giá trị của client KHÔNG ghi đè (I02).
        limit_kind:
          type:
          - string
          - 'null'
          enum:
          - posts
          - duration
          - null
          description: 'NOT NULL khi `stop_reason = limit_reached` (REQ-A7: điều kiện dừng phải rõ).'
        rate_limited_at:
          allOf:
          - $ref: '#/components/schemas/TimestampUtcMs'
          description: Có mặt khi `stop_reason = rate_limited`. Server ghi `run.rate_limited_at` và bắt buộc nhắc mốc này
            trong `x_coverage_note_vi` (ruling CR-PC10-02).
        retry_after_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Giá trị nguồn trả về nếu có. Ghi để truy vết; KHÔNG dùng để thử lại trong đợt (`x_rate_limit_in_run_retries
            = 0`).
        missing_required_fields:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 200
          description: Có mặt khi `stop_reason = source_layout_changed`. CHỈ TÊN TRƯỜNG theo schema; tuyệt đối không kèm
            giá trị quan sát được, HTML/DOM hay URL đầy đủ.
        posts_seen:
          type: integer
          minimum: 0
        posts_observed_total:
          type: integer
          minimum: 0
          description: Tổng số bài quan sát được trong đợt; server ghi vào `run.posts_observed_total`. Là QUAN SÁT của collector,
            không phải dữ liệu authoritative.
        posts_downloaded_not_ingested:
          type: integer
          minimum: 0
          description: Số bài đã TẢI nhưng CHƯA ingest tại thời điểm dừng. Chúng KHÔNG phải checkpoint bền (SRC-PLAN §8.1,
            run.yaml CP-03); trường này chỉ để truy vết phần bị mất khi dừng đột ngột.
        posts_parsed_ok:
          type: integer
          minimum: 0
        x_coverage_note_vi:
          type: string
          maxLength: 1000
          description: Câu ghi phần feed KHÔNG quan sát được. BẮT BUỘC khi `limit_reached` hoặc `rate_limited` (AMD-B05).
        note_vi:
          type: string
          maxLength: 1000
    GenericObject:
      type: object
      description: |-
        Chỗ giữ có chủ đích: hình dạng chi tiết thuộc một gói khác và CHƯA tồn tại tại thời điểm viết file này.
        Xem `$ref` trong `x-response-schema-planned` của ports.yaml cho từng operation. Đây KHÔNG phải giấy phép chấp
        nhận trường tùy ý: gói sở hữu phải thay bằng schema đóng với `additionalProperties: false` trước G3.
x-transport-limits:
  max_request_body_bytes:
    value: 8388608
    unit: bytes
    status: PROVISIONAL
    rationale_vi: 8 MiB, bằng `ingest_batch_max_payload_bytes` của contracts/data/entities.yaml §limits — lô ingest là request
      lớn nhất trong hệ thống. Vượt ⇒ 413 ở tầng reverse proxy trước khi chạm ứng dụng; ứng dụng cũng phải tự kiểm để không
      phụ thuộc proxy.
    decision_ref: CR-PC02-04
  max_url_bytes:
    value: 2048
    unit: bytes
    status: PROVISIONAL
    rationale_vi: Giới hạn thực dụng của proxy và trình duyệt; mọi tham số lớn đi trong body.
  request_timeout_s:
    value: 30
    unit: seconds
    status: PROVISIONAL
    rationale_vi: Deadline phía server cho một request thường. Vượt ⇒ client coi là KHÔNG BIẾT KẾT QUẢ (SRC-PLAN §5.1),
      KHÔNG phải rollback. Riêng `worker.claim_assignment` có deadline riêng 10 s (`claim_request_timeout`).
  ingest_batch_max_items:
    value: 200
    unit: items
    status: PROVISIONAL
    rationale_vi: Tham chiếu contracts/data/entities.yaml §limits.ingest_batch_max_items; giới hạn đợt nhỏ hơn thì giới
      hạn đợt thắng.
    decision_ref: REQ-OQ05
  tls_required:
    value: true
    unit: boolean
    status: XN_derived
    rationale_vi: App ra Internet (REQ-D04, SRC-SPEC §11.1). Không có cổng plaintext. Cổng debug Chrome chỉ bind loopback
