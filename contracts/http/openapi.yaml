        key_scope: assignment_id + stop_report_id
        rule_vi: Báo lại cùng stop_report_id không tạo alert thứ hai.
        header: Idempotency-Key
      x-error-codes-reported-not-returned:
        X_CHALLENGE_REQUIRED: Được BÁO CÁO trong `stop_reason`; lời gọi thành công 200 và run chuyển `needs_user`.
        X_ACCESS_BLOCKED: Được BÁO CÁO trong request body (`stop_reason`) và phản ánh vào `run.status`; lời gọi thành công
          200.
