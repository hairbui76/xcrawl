      operationId: ingest.commit_checkpoint
      summary: Đẩy con trỏ checkpoint khi **không có** item mới (cursor-only advance)
      description: 'lease_id/epoch, `proposed_cursor`, `proposed_acked_through_ingest_sequence`, `reason` ∈ {`empty_page`,
        `end_of_feed`, `segment_close`}, và `item_count: 0` (bắt buộc bằng 0).


        Checkpoint **không đi trước dữ liệu bền** (I02). Dữ liệu đã tải nhưng chưa ingest không được coi là checkpoint bền
        (SRC-PLAN §8.1). Entity là `checkpoint`, **do MOD-ingest-service sở hữu duy nhất**; MOD-job-service chỉ **đọc**
        trạng thái này qua ingest.get_checkpoint hoặc qua payload của worker.claim_assignment, không sở hữu và không ghi
        (ruling R-01; token `run_checkpoint_pointer` đã bị gỡ).


        RULING R-01: đường này chỉ TIẾN CON TRỎ, KHÔNG kèm item mới (trang rỗng / hết feed / đóng segment). GUARD: `proposed_acked_through_ingest_sequence`
        chỉ được <= `acked_through_ingest_sequence` đã commit của run; vượt quá ⇒ 422 VALIDATION_ERROR và KHÔNG có write
        một phần. Oracle: `checkpoint.acked_through_ingest_sequence <= max(committed ingest_receipt.max_ingest_sequence)`.'
      tags:
      - ingest
      security:
      - collectorToken: []
      x-auth-scope: collector_token
      x-owner-module: MOD-ingest-service
      x-caller-modules:
      - MOD-x-collector
      x-mutation: true
      x-scenario-refs:
      - SC03
      - SC04
      - SC21
      x-requirement-refs:
      - REQ-AC03
      - REQ-AC04
      - REQ-P0-12
      x-decision-refs:
      - B05
      - AMD-B05
      x-invariant-refs:
      - I02
      - I10
      x-idempotency:
        required: true
        key_scope: assignment_id + checkpoint_seq
        rule_vi: Checkpoint seq lùi bị từ chối; cùng seq + cùng payload trả bản đã ghi; cùng seq + payload khác trả IDEMPOTENCY_CONFLICT.
        header: Idempotency-Key
      parameters:
      - $ref: '#/components/parameters/SchemaVersionHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/ingest-receipt.schema.json#/$defs/checkpoint_only_request
      responses:
        '200':
          description: 'Receipt `receipt_kind: checkpoint_only` với con trỏ đã lưu.'
          content:
            application/json:
              schema:
                $ref: ../schemas/ingest-receipt.schema.json
          headers:
            X-Schema-Version:
              description: Phiên bản schema của response.
              schema:
                $ref: '#/components/schemas/SemVer'
        '401':
          description: 'Lỗi: `UNAUTHORIZED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'Lỗi: `FORBIDDEN_EDGE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'Lỗi: `STALE_LEASE`, `IDEMPOTENCY_CONFLICT`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'Lỗi: `VALIDATION_ERROR`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'Lỗi: `RATE_LIMITED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Giây do nguồn/API chỉ định. Giá trị này THẮNG mọi backoff cấu hình.
              schema:
                type: integer
                minimum: 0
        '500':
          description: 'Lỗi: `INTERNAL`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: 'Lỗi: `STORAGE_WRITE_FAILED`. `storage.health = write_blocked` hoặc `maintenance`: mutation KHÔNG
            được ACK và KHÔNG có gì được ghi (SRC-PLAN §8.4, I02).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Giây. Gợi ý theo `storage_recovery_probe` (30 s).
              schema:
                type: integer
                minimum: 0
