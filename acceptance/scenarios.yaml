      tiền tố `arXiv:`, URL abs/pdf), cộng một thread bốn post của chính tác giả.
    event_order:
      - "1. `ingest.submit_batch` commit chín post."
      - "2. Chuẩn hóa arXiv ID theo `contracts/data/identity.md` §2.2 cho từng post."
      - "3. `identity.resolve_target` phân giải tất cả về một `canonical_work_id`."
      - "4. `report.publish` dựng kỳ."
    expected_durable_state_vi: >
      Đúng một hàng `work` cho arXiv ID đó; chín hàng `post_work` trỏ vào nó; đúng một
      `report_item` với `target.kind = 'work'`; danh sách post nguồn dẫn có chín phần tử.
    oracle_vi: >
      `COUNT(DISTINCT canonical_work_id) = 1` cho chín post; `COUNT(report_item WHERE
      target_key='work:<id>') = 1`; `COUNT(post_work WHERE work_id=<id>) = 9`; tập
      `identity_alias.id_value_normalized` chứa đúng MỘT giá trị sau chuẩn hóa cho cả năm dạng viết,
      và `identity_alias.id_value_raw` giữ đủ năm dạng gốc.
      Phạm vi "0 trùng" được đọc theo AMD-B15: chỉ tính trong phạm vi canonical identity đã biết.
    forbidden_effects_vi:
      - "Tạo năm hàng `work` rồi merge sau (phá I03 tại thời điểm quan sát)."
      - "Đoán ID từ ảnh chụp paper không có link (REQ-D33)."
      - "Đọc replies của người ngoài để tìm ID (REQ-D31, REQ-P1-02)."
