    needs_live_or_human_vi: >
      Mệnh đề 7 đòi một CON NGƯỜI xác nhận theo thiết kế. Và như `backup-restore.md` §5.7 ghi:
      runbook là thiết kế, không phải bằng chứng — chỉ một drill restore thật mới chứng minh
