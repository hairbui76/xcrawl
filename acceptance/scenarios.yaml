  - id: SC37
    title_vi: "Backfill thêm tag → tiêu thụ; bỏ tag; thêm LẠI → activation mới nhưng KHÔNG cấp lại backfill"
    polarity: mixed
    packages: [PC04]
    ac_ref: null
    requirement_refs: [REQ-D28, REQ-OQ04, REQ-S8.2-04, REQ-AC08]
    invariant_refs: [I06]
    contract_refs:
      - "contracts/reporting/time-and-tags.md"
      - "contracts/data/entities.yaml"
      - "contracts/reporting/selection.md"
    contract_ids: [CT-reporting-time-and-tags]
    error_refs: [CONFLICT, VALIDATION_ERROR]
    fixture_refs: ["acceptance/fixtures/reporting/j-backfill-add-remove-readd.json"]
    input_vi: >
      Tag T được thêm mới; N = 7 ngày (PROVISIONAL, REQ-OQ04). Kỳ đầu của T với ngược 7 ngày,
      đúng một lần. Sau đó T bị bỏ rồi được thêm lại với CÙNG chữ đã chuẩn hóa.
    event_order:
      - "1. `tag.create` T → `backfill_ledger(entitlement='granted')`."
      - "2. Kỳ đầu publish với phần nới 7 ngày → `entitlement='consumed'`."
      - "3. `tag.delete` T."
      - "4. `tag.create` T lần hai (chữ chuẩn hóa giống hệt) → activation mới."
      - "5. Kỳ sau publish."
    expected_durable_state_vi: >
      Sau bước 5: đúng MỘT hàng `backfill_ledger` với `consumed_in_report_id` khác NULL cho
      `subscription_identity_hash` của T; hàng của activation thứ hai mang
      `entitlement='denied_already_consumed'`; kỳ sau KHÔNG nới ngược 7 ngày.
    oracle_vi: >
      `COUNT(backfill_ledger WHERE owner_id=O AND subscription_identity_hash=H AND
      consumed_in_report_id IS NOT NULL) = 1` sau cả năm bước — ràng buộc UNIQUE một phần ép điều
      này ở mức schema; `coverage_from` của kỳ sau KHÔNG lùi trước `coverage_to` của kỳ trước.
      Khóa là **chữ tag đã chuẩn hóa**, không phải `tag.id`: chỉ mục UNIQUE một phần trên
      `state='active'` sinh `tag.id` mới mỗi lần thêm lại, nên khóa theo `tag.id` sẽ cấp lại
      backfill mỗi lần và làm rỗng nghĩa của "đúng một lần" (SRC-SPEC §8.2 hàng 4).
    forbidden_effects_vi:
      - "Cấp lại backfill khi tag được thêm lại."
      - "Tiêu thụ backfill khi phần nới không có ứng viên nào."
      - "Lùi `coverage_from` xuống trước `coverage_to` của kỳ trước."
    evidence_level_required: E2
    mockable_vi: "Ledger và transaction; offline."
    needs_live_or_human_vi: >
      Giá trị N THẬT (REQ-OQ04) chờ Owner; 7 ngày là PROVISIONAL từ baseline §5. Hệ quả đã ghi
      nhận có chủ đích: **đổi TÊN một tag sinh một entitlement mới**, vì hệ thống không được đoán
      rằng hai chuỗi khác nhau là cùng một mối quan tâm.
    status: NOT_RUN

