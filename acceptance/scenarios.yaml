  - id: SC21
    title_vi: "Mất ACK ingest → replay cùng idempotency key trả receipt cũ, số hàng và checkpoint không đổi"
    polarity: mixed
    packages: [PC02, PC03, PC05]
    ac_ref: null
    requirement_refs: [REQ-AC04, REQ-D08, REQ-S9.2-01, REQ-S9.2-06, REQ-S9.3-01, REQ-S9.3-07]
    invariant_refs: [I02]
