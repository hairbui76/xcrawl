    input_vi: >
      Work W là phát hiện mới ở kỳ ngày D. Ở kỳ sau, W vẫn khớp tag. Thêm một biến thể: sau khi
      đã công bố, W và W' được merge identity.
    event_order:
      - "1. Kỳ ngày D publish; `first_announced_ledger(canonical_work_id=W, first_announced_at=D)`."
      - "2. Kỳ sau build; W lại khớp tag."
      - "3. Biến thể merge: `identity.merge_works(W', W)` sau khi cả hai đã có first-announcement."
    expected_durable_state_vi: >
      Ở kỳ sau, `report_item.item_type = 'prior_reference'` với `reference_date = D`, KHÔNG phải
      `new_discovery`. Sau merge, đúng MỘT hàng `first_announced_ledger` active cho canonical id
      thắng, mang ngày SỚM NHẤT; hàng của work thua giữ lại với `superseded_by_merge_id`.
    oracle_vi: >
      `COUNT(first_announced_ledger WHERE canonical_work_id=W AND superseded_by_merge_id IS NULL)
      = 1` ở mọi thời điểm; `report_item(kỳ sau).item_type = 'prior_reference'` và
      `reference_date = D`; report đã publish ở ngày D có `content_hash` KHÔNG đổi sau merge;
      `moved_counts.first_announced ∈ {0,1,2}` theo bảng `time-and-tags.md` §8.3, không phải null.
    forbidden_effects_vi:
      - "Báo lại W như phát hiện mới (REQ-D29)."
      - "Viết lại report đã publish sau merge (I05, I17)."
      - "Xóa hàng first-announcement của work thua (mất bằng chứng, B15)."
      - "Dùng AI để quyết định hai mục có cùng hướng hay không (REQ-D30: không dùng AI)."
    evidence_level_required: E2
    mockable_vi: "Ledger và merge là transaction; fixture + walkthrough đủ."
    needs_live_or_human_vi: "Không có phần bắt buộc live."
    status: NOT_RUN
    partial_evidence_vi: >
      first_announced_ledger và merge hook §8.3 đã chạy ở tầng identity; vế
      report_item.item_type='prior_reference' và content_hash của report đã publish KHÔNG đo
      được — card báo cáo chưa tồn tại.

