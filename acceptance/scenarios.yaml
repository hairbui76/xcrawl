    contract_ids: [CT-state-run, CT-state-report, CT-state-delivery, CT-reporting-selection]
    error_refs: [STORAGE_WRITE_FAILED, AI_OUTPUT_INVALID, TELEGRAM_SEND_UNCERTAIN]
    fixture_refs: ["acceptance/fixtures/e2e/a-happy-path-schedule-to-delivered.json"]
    input_vi: >
      Trạng thái sạch: một owner, ba tag active, một `tag_config_version`, một embedding
      generation active, collector online, một adapter AI đã bật. Không lỗi nào được inject.
      Đây là scenario ĐỐI CHỨNG DƯƠNG cho toàn bộ chuỗi của SRC-SPEC §5.2.
    event_order:
      - "1. Mốc lịch tới hạn → run `queued` → `worker.claim_assignment` → `running/collecting`."
      - "2. Ingest nhiều lô; mỗi lô commit post + receipt + checkpoint trong một transaction."
      - "3. Đạt điểm dừng cấu hình → `running/enriching`; `research.fetch_work_metadata` cho từng work."
      - "4. `running/analyzing`: gắn nhãn mở cho mọi target, embedding local cho nhãn và tag, summary cho các mục builder chọn."
      - "5. `running/reporting`: selection theo tag hiện tại, tính khối 'hướng đang nổi' bằng mật độ vector."
      - "6. `report.publish` commit: report + report_item + coverage_window + first_announced_ledger + delivery intent."
      - "7. `delivery.dispatch_next` gửi digest; nhận message_id → `sent`."
    expected_durable_state_vi: >
      `run.status='completed'`, `outcome='complete'`, `stop_reason` NULL; một report `published`
      với `quality='complete'`; coverage window nối liền window trước; mỗi target được chọn có
      đúng một `analysis` hợp lệ; `delivery.state='sent'` với receipt; `first_announced_ledger`
      có đúng một hàng cho mỗi canonical work lần đầu xuất hiện.
    oracle_vi: >
      Sáu đẳng thức phải đồng thời đúng:
      (1) `checkpoint.acked_through_ingest_sequence == MAX(ingest_receipt.max_ingest_sequence)` (I02);
      (2) `report.content_hash` không đổi ở mọi thời điểm sau bước 6 (I05);
      (3) `coverage_window[n].window_from == coverage_window[n-1].window_to` (I06);
      (4) `COUNT(first_announced_ledger WHERE canonical_work_id=W AND superseded_by_merge_id IS NULL) = 1` cho mọi W mới (I07);
      (5) mọi vector dùng trong selection có cùng `embedding_generation_id` (I12);
      (6) `COUNT(analysis WHERE analysis_key=K AND generation=g AND state='valid') = 1` cho mọi K được chọn (I04).
      Thêm: khối "hướng đang nổi" mang nhãn **"ứng viên để đọc sâu"**, KHÔNG phải "phát hiện mới"
      (REQ-D54); và AI chỉ DIỄN ĐẠT LẠI kết quả đã tính — số lần AI được hỏi "mục nào vào báo
      cáo" hoặc "mật độ bằng bao nhiêu" phải bằng **0** (REQ-S10.1-05).
    forbidden_effects_vi:
      - "Để AI chọn mục vào báo cáo hoặc tính mật độ vector (REQ-S10.1-05)."
      - "Gán nhãn 'phát hiện mới' cho khối hướng đang nổi (REQ-D54)."
      - "ACK trước commit ở bất kỳ bước nào."
      - "Gọi AI lại cho một target đã có analysis hợp lệ cùng key và generation."
      - "Publish khi còn mục được chọn thiếu summary mà không đánh dấu pending (AMD-B17)."
    evidence_level_required: E2
    mockable_vi: >
      Toàn bộ chuỗi mock được: fake-clock, collector giả đọc fixture feed, adapter AI giả,
      Telegram giả. Sáu đẳng thức ở trên đều là truy vấn dữ liệu.
    needs_live_or_human_vi: >
      Một đợt chạy THẬT đầu-cuối (X thật, provider thật, Telegram thật) là E3 và thuộc SP1 +
      giai đoạn triển khai; giá trị của khối "hướng đang nổi" là E4 và cần 3–4 kỳ thật (REQ-A4).
    status: NOT_RUN
    partial_evidence_vi: >
      Hai trong 18 sự kiện của fixture e2e (`ingest.submit_batch` seq 4 và 5) chạy thật qua
      service. 16 sự kiện còn lại — scheduling, enrichment, analysis, report, delivery — chưa có
      code. Sáu đẳng thức của oracle không thể cùng đo.
    notes_vi: >
      Fixture được cấp ở đợt FIX5 (`e2e/a-happy-path-schedule-to-delivered.json`, ruling R5-02),
      trong một thư mục mới `e2e/` và ở dạng `rows.<entity>[]` có cấu trúc để cửa kiểm cột không bị
      rỗng. Lý do scenario này tồn tại vẫn đúng và đáng nhắc: 48 scenario đầu tiên đều là nhánh lỗi
      hoặc một lát cắt, và không cái nào khẳng định rằng một đợt chạy bình thường kết thúc đúng.
      Một bộ hợp đồng chỉ có ca âm không chứng minh được ca dương nào.

