      - "contracts/state/run.yaml"
      - "contracts/errors.yaml"
    contract_ids: [CT-schema-ingest-batch, CT-schema-ingest-receipt, CT-data-entities]
    error_refs: [INGEST_ACK_LOST, IDEMPOTENCY_CONFLICT, VALIDATION_ERROR, CAPABILITY_DENIED, INTERNAL]
    fixture_refs:
      - "acceptance/fixtures/collection/d-duplicate-ingest-replay.json"
      - "acceptance/fixtures/collection/b-cursor-invalidated-reread-dedup.json"
      - "acceptance/fixtures/identity/f-ingest-replay-idempotent.json"
    input_vi: >
      Một lô ingest commit thành công ở server nhưng ACK mất trên đường về. Collector replay cùng
      `idempotency_key` và cùng payload. Biến thể: con trỏ feed mất hiệu lực nên collector đọc lại
      một số trang đã đọc.
    event_order:
      - "1. `ingest.submit_batch` commit post + `ingest_receipt` + `checkpoint` trong một transaction."
      - "2. ACK mất; client rơi vào trạng thái không biết kết quả."
      - "3. Replay cùng key, cùng payload → trả receipt đã commit."
      - "4. Biến thể: cùng key, payload KHÁC → `IDEMPOTENCY_CONFLICT`, không ghi đè."
      - "5. Biến thể: cursor mất hiệu lực, đọc lại 12 post đã có → dedup theo `x_post_id`."
    expected_durable_state_vi: >
      Sau bước 3: `COUNT(post)`, `receipt_hash` và `checkpoint.acked_through_ingest_sequence` bằng
      đúng giá trị sau bước 1. Sau bước 4: không hàng nào đổi. Sau bước 5: không hàng `post` mới.
    oracle_vi: >
      `COUNT(post)` sau bước 3 == sau bước 1; `ingest_receipt.receipt_hash` giống hệt; delta của
      `checkpoint.acked_through_ingest_sequence` bằng 0; sau bước 5 delta của `COUNT(post)` bằng 0
      dù số trang đọc lại > 0. Cam kết được đo là **không ingest trùng theo `x_post_id`**, KHÔNG
      phải "không bao giờ đọc lại" (AMD-B05).
    forbidden_effects_vi:
      - "Ghi đè receipt cũ khi payload khác."
      - "Tiến checkpoint vượt quá post đã commit (I02)."
      - "Tạo hàng `post` thứ hai cho cùng `x_post_id`."
    evidence_level_required: E2
    mockable_vi: "Crash-after-commit-before-ACK inject được; đếm hàng là oracle."
    needs_live_or_human_vi: >
      Độ ổn định THẬT của con trỏ feed X (B05) không chứng minh được offline; probe SP1 ghi lại
      tần suất cursor mất hiệu lực.
    status: "PASS (E2)"
    status_evidence_refs:
      - "evidence/runs/TC-ingest-idempotent-ack-lost-E1-20260907T113827Z.json"
      - "tests/integration/test_ingest_ack_lost.py"
      - "evidence/audits/A3-R1-report.md"
      - "evidence/audits/A3-R2-report.md"
    status_scope_vi: >
      Fault injection thật (ACK mất sau commit, và mất trước commit) trên SQLite: sau replay
      cùng idempotency_key và cùng payload_hash, COUNT(post) và COUNT(ingest_receipt) không đổi,
      receipt_hash bằng lần commit đầu, delta của checkpoint.acked_through_ingest_sequence bằng
      0; và với con trỏ bị vô hiệu hóa, đọc lại trang cũ không ingest thêm hàng nào (AMD-B05:
      cam kết là không ingest trùng theo x_post_id, không phải không đọc lại). KHÔNG thiết lập:
      độ ổn định THẬT của con trỏ feed X (B05, chỉ đo được bằng probe SP1), và hai lần submit
      ĐỒNG THỜI cùng một idempotency_key — A3 ghi rõ điều đó là chưa thiết lập.

