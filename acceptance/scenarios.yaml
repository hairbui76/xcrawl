      `purge_challenge`; pha 2 nhận lại đúng cụm từ xác nhận do server phát. Bốn ca âm: cụm từ
      sai; challenge hết hạn; `storage.health != maintenance`; challenge dùng lại lần hai.
    event_order:
      - "1. Pha 1: `data.purge_all(phase='challenge')` → `purge_challenge` với cụm từ."
      - "2. Ca âm A: pha 2 với cụm từ SAI."
      - "3. Ca âm B: pha 2 khi `storage.health = healthy` (không phải `maintenance`)."
      - "4. Pha 2 hợp lệ trong `maintenance` → thu hồi mọi lease, xóa theo phạm vi."
      - "5. Ca âm C: dùng lại cùng `purge_challenge_id`."
    expected_durable_state_vi: >
      Ca âm A, B, C: KHÔNG hàng nào bị xóa — `COUNT(*)` của cả 60 bảng bằng nhau trước và sau.
      Ca hợp lệ, phân hoạch ba nhóm theo `OD-20260907-01` mục 24 (nguồn liệt kê CÓ THẨM QUYỀN:
      `contracts/data/entities.yaml` → `transactions[TXN-purge-all].tables`): (a) **37 bảng dữ
      liệu nghiên cứu về 0 hàng**; (b) **21 bảng giữ lại KHÔNG đổi một hàng nào**; (c) **2 bảng
      never_purged** — `schema_migration` không đổi, `data_deletion_audit` **tăng đúng 1 hàng**
      (chính bản ghi của lần purge này). Mọi `assignment_lease` `revoked`. Backup và backup
      artefact KHÔNG bị chạm.
    oracle_vi: >
      Ở mỗi ca âm, `COUNT(*)` của cả 60 bảng trước và sau bằng nhau. Ở ca hợp lệ, kiểm ĐỦ BA TẬP,
      không kiểm mẫu:
      (1) `COUNT(*) = 0` cho **37 bảng bị xóa** — post, post_work, work, work_version,
      identity_alias, identity_conflict, identity_merge_audit, work_label, analysis,
      analysis_generation, analysis_attempt, analysis_task, embedding_generation, tag_vector,
      report, report_item, emerging_direction, coverage_window, pending_item_ledger,
      backfill_ledger, first_announced_ledger, rescan_ledger, saved_item, saved_snapshot,
      delivery, delivery_part, delivery_attempt, delivery_receipt, outbox_intent, run,
      assignment, assignment_lease, checkpoint, ingest_receipt, source_fetch_log,
      telegram_update_log, telegram_link_attempt.
      (2) `COUNT(*)` KHÔNG ĐỔI cho **21 bảng giữ lại** — owner, session, secret_ref,
      task_credential, secret_audit, telegram_link, telegram_link_code, provider_config,
      provider_test_result, settings, schedule_occurrence, tag, tag_alias, tag_exclusion,
      tag_config_version, source_connection, backup_snapshot, backup_manifest, restore_record,
      purge_challenge, worker_registration; và Owner **vẫn đăng nhập được** sau purge (kiểm bằng
      một lần đọc phiên thành công trên phiên cũ) — đây là hệ quả REQ-D05 mà Owner được cảnh báo
      trước khi trả lời.
      (3) `schema_migration` không đổi; `data_deletion_audit` tăng ĐÚNG 1 hàng.
      (4) Số hàng của `backup_snapshot`, `backup_manifest`, `restore_record` không đổi VÀ không
      file backup nào trên đĩa bị xóa hay sửa (so sánh manifest trước/sau).
      (5) Ba tập rời nhau và hợp lại đúng bằng danh sách entity của `entities.yaml` —
      37 + 21 + 2 = 60. Một bảng mới thêm vào mà không được phân loại làm oracle này FAIL, chứ
