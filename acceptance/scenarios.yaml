  - id: SC54
    title_vi: "Hai kết quả hợp lệ cho cùng một (analysis_key, generation) là KHÔNG THỂ — phản chứng của I04"
    polarity: negative
    packages: [PC06, PC02]
    ac_ref: null
    requirement_refs: [REQ-D25, REQ-D26, REQ-AC06, REQ-S7.3-02, REQ-S9.2-03, REQ-S10.4-02]
    invariant_refs: [I04]
    contract_refs:
      - "contracts/state/analysis.yaml"
      - "contracts/data/entities.yaml"
      - "contracts/ai/tasks.yaml"
      - "precode/adr/ADR-0008-analysis-key-and-generation.md"
    contract_ids: [CT-state-analysis, CT-data-entities]
    error_refs: [CONFLICT, IDEMPOTENCY_CONFLICT, AI_OUTPUT_INVALID]
    fixture_refs: ["acceptance/fixtures/ai/j-same-key-resubmitted-one-result.json"]
    input_vi: >
      Một `analysis` đã ở trạng thái `valid` cho `(analysis_key = K, generation_number = g)`. Bốn
      đường tấn công vào cùng một chỗ: (a) worker thứ hai nộp kết quả cho cùng K và cùng g;
      (b) chính worker cũ nộp lại sau khi mất ACK; (c) một retry sau lỗi ghi thêm một hàng `valid`;
      (d) ràng buộc UNIQUE một phần bị bỏ đi.
    event_order:
      - "1. `analysis.submit_result` cho (K, g) commit thành công → một hàng `valid`."
      - "2. Worker thứ hai gọi `analysis.submit_result` cho ĐÚNG (K, g) với payload khác."
      - "3. Worker cũ replay lời gọi ở bước 1 với cùng idempotency key."
      - "4. Biến thể kiểm thiết kế: chạy lại toàn bộ với `ux_analysis_valid_key` bị gỡ."
    expected_durable_state_vi: >
      Sau bước 2 và bước 3: vẫn ĐÚNG MỘT hàng `analysis` `valid` cho (K, g) — chính hàng của bước 1,
      không đổi. Bước 2 bị từ chối; bước 3 trả lại receipt đã commit.
    oracle_vi: >
      `COUNT(analysis WHERE analysis_key = K AND generation_number = g AND state = 'valid') = 1`
      ở mọi thời điểm sau bước 1; `analysis.id` và `content_hash` của hàng đó không đổi sau bước 2
      và bước 3. **Biến thể (4) PHẢI FAIL:** nếu gỡ ràng buộc UNIQUE một phần trên khóa hợp lệ mà
      hệ thống vẫn được coi là đạt, thì I04 không được ép ở tầng dữ liệu và gate này vô nghĩa —
      đây chính là counterexample mà SRC-PLAN §7 đòi.
    forbidden_effects_vi:
      - "Ghi hàng `analysis` `valid` thứ hai cho cùng (K, g)."
      - "Ghi đè hàng `valid` đã commit bằng payload của lần nộp sau."
      - "Đưa `tag_config_version` vào `analysis_key` (đổi tag sẽ sinh key mới và phá AC-06)."
      - "Coi một `analysis_attempt` là một kết quả để lách ràng buộc (xem SC56)."
    evidence_level_required: E2
    mockable_vi: >
      Hoàn toàn offline: hai tiến trình giả cộng ràng buộc UNIQUE; oracle là một phép đếm.
    needs_live_or_human_vi: >
      Không có phần bắt buộc live. Nhưng ràng buộc này dựa vào **partial UNIQUE index** của SQLite,
      thứ chưa được kiểm trên SQLite thật (rủi ro đã khai của PC02) — nên biến thể (4) chỉ thực sự
      có ý nghĩa sau E1 với engine thật.
    status: NOT_RUN
    notes_vi: >
      Tách ra từ SC28. SC28 là ca **hỗn hợp** (worker chết sau khi provider đã chạy) và nó vẫn giữ
      nguyên; scenario này là phần phản chứng thuần của I04, đứng riêng để có thể fail một mình.

  - id: SC55
    title_vi: "Usage không biết được ghi là `unknown` với ba trường NULL — mặt dương của I14"
    polarity: positive
    packages: [PC06]
    ac_ref: null
    requirement_refs: [REQ-D44, REQ-D43, REQ-D41, REQ-AC16, REQ-S10.2-05, REQ-S10.4-01]
    invariant_refs: [I14]
    contract_refs:
      - "contracts/ai/providers.yaml"
      - "contracts/ai/tasks.yaml"
      - "contracts/schemas/analysis-result.schema.json"
      - "contracts/state/analysis.yaml"
    contract_ids: [CT-ai-providers, CT-schema-analysis-result]
    error_refs: [AI_PROVIDER_UNAVAILABLE, AI_OUTPUT_INVALID]
    fixture_refs:
      - "acceptance/fixtures/ai/k-zero-api-key-all-tasks-via-cli.json"
      - "acceptance/fixtures/ai/g-cli-json-embedded-in-prose.json"
    input_vi: >
      Một task chạy qua đường CLI/ACP. Đường này KHÔNG trả token count thật (REQ-D44 cho phép giá
      trị "không rõ"). Kết quả hợp lệ về schema và về semantic.
    event_order:
      - "1. Adapter CLI trả JSON hợp lệ, không kèm số token."
      - "2. `analysis.submit_result` commit kết quả với `usage.unknown = true`."
      - "3. Bảng usage và màn hình Settings đọc bản ghi đó."
    expected_durable_state_vi: >
      Một hàng `analysis` `valid` với `usage.unknown = true` và **cả ba** trường `tokens_in`,
      `tokens_out`, `cost_micro_usd` là NULL. Giao diện hiển thị "không rõ", không hiển thị 0.
    oracle_vi: >
      `COUNT(analysis WHERE usage_unknown = true AND (tokens_in IS NOT NULL OR tokens_out IS NOT
      NULL OR cost_micro_usd IS NOT NULL)) = 0`; và ở chiều ngược lại, bản ghi này **tồn tại** và
      hợp lệ — nghĩa là "không biết chi phí" KHÔNG làm kết quả bị từ chối. Ràng buộc được ép ở mức
      schema (`usage.unknown = true` ⇒ ba trường null), không phải bằng lời khuyên.
    forbidden_effects_vi:
      - "Ghi 0 cho một giá trị không biết (chính là điều I14 cấm)."
      - "Từ chối một kết quả hợp lệ chỉ vì không có token count."
      - "Suy ra chi phí bằng cách nhân độ dài prompt với một đơn giá đoán."
    evidence_level_required: E1
    mockable_vi: "Thuần schema cộng một adapter giả; chạy được ngay ở E1."
    needs_live_or_human_vi: >
      Hành vi THẬT của một CLI provider (có trả token count hay không) chỉ biết được ở E3, và
      REQ-A5 vẫn `KC`.
    status: NOT_RUN
    notes_vi: >
      Trước đợt FIX6, I14 không có scenario nào được khai `positive` — nó chỉ được phủ bởi hai ca
      `mixed` (SC16, SC28). Đây là mặt dương đứng riêng.

  - id: SC56
    title_vi: "Ghi 0 cho usage không biết, tự bật fallback, hoặc đếm attempt là kết quả — ba phản chứng của I14 và I16"
    polarity: negative
    packages: [PC06, PC03]
    ac_ref: null
    requirement_refs: [REQ-D44, REQ-D43, REQ-S9.3-03, REQ-S10.2-05, REQ-AC16]
    invariant_refs: [I14, I16]
    contract_refs:
      - "contracts/ai/providers.yaml"
      - "contracts/state/analysis.yaml"
      - "contracts/retry-policy.yaml"
      - "contracts/data/invariants.md"
    contract_ids: [CT-ai-providers, CT-state-analysis, CT-retry-policy]
    error_refs: [AI_PROVIDER_UNAVAILABLE, AI_ATTEMPT_UNCERTAIN, AI_OUTPUT_INVALID]
    fixture_refs:
      - "acceptance/fixtures/ai/h-provider-unavailable-no-fallback.json"
      - "acceptance/fixtures/ai/i-crash-after-provider-completion.json"
    input_vi: >
      Ba đường vi phạm, mỗi đường phải làm gate FAIL: (a) một kết quả có `usage.unknown = true`
      nhưng ghi `tokens_in = 0`; (b) provider chính không dùng được và owner **chưa** cấu hình
      fallback, nhưng hệ thống tự chuyển sang một provider khác; (c) một `analysis_attempt` ở
      trạng thái `unknown_attempt` hoặc `failed` được đếm như một kết quả hợp lệ.
    event_order:
      - "1. (a) Adapter CLI không trả token count; đường ghi đặt 0 thay vì NULL."
      - "2. (b) `AI_PROVIDER_UNAVAILABLE`; không có `fallback_allowlist` do owner cấu hình; hệ thống vẫn thử provider khác."
      - "3. (c) Worker chết sau khi provider chạy xong; attempt `unknown_attempt` được view kết quả đếm vào."
    expected_durable_state_vi: >
      Cả ba đường đều PHẢI bị chặn. (a) bị schema từ chối; (b) item vào `retry_wait` rồi `failed`
      khi hết budget, KHÔNG có lời gọi tới provider ngoài allowlist; (c) view kết quả chỉ đếm
      hàng `state = 'valid'`.
    oracle_vi: >
      (a) `COUNT(analysis WHERE usage_unknown = true AND tokens_in IS NOT NULL) = 0` — nếu payload
      ở bước 1 được chấp nhận thì gate FAIL. (b) số lời gọi tới bất kỳ provider nào ngoài
      `fallback_allowlist` do owner cấu hình = **0**; nếu > 0 thì gate FAIL. (c)
      `COUNT(kết quả hiển thị) == COUNT(analysis WHERE state = 'valid')`, và
      `COUNT(analysis_attempt WHERE outcome != 'accepted')` KHÔNG đóng góp vào con số đó; nếu một
      attempt xuất hiện như một kết quả thì gate FAIL.
    forbidden_effects_vi:
      - "Ghi 0 cho usage không biết (I14)."
      - "Tự bật một provider fallback chưa được owner cấu hình (I14) — model không được chọn đường đi của chính nó."
      - "Đếm một attempt lỗi hoặc không xác định là một kết quả (I16)."
      - "Cam kết rằng một `unknown_attempt` chưa phát sinh phí."
    evidence_level_required: E2
    mockable_vi: >
      Cả ba đường inject được bằng adapter giả cộng một network audit; oracle là ba phép đếm.
    needs_live_or_human_vi: >
      Không có phần bắt buộc live cho ba phản chứng này. Việc một provider THẬT có bị gọi hay
      không thuộc E3.
    status: NOT_RUN
    notes_vi: >
      Trước đợt FIX6, I14 không có cực nào và I16 không có cực âm; cả hai chỉ được phủ bởi ca
      `mixed` SC28. Scenario này gom ba phản chứng lại vì chúng chia sẻ cùng bộ fixture và cùng
      một chủ đề: **không được biến "không biết" thành một con số, và không được biến một lần thử
      thành một kết quả.**
