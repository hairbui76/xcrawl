  - id: SC52
    title_vi: "Dựng lại embedding generation rồi chuyển active NGUYÊN TỬ → selection dùng đúng một generation"
    polarity: positive
    packages: [PC04]
    ac_ref: null
    requirement_refs: [REQ-D48, REQ-D49, REQ-D50, REQ-D59, REQ-S7.3-03, REQ-OQ09, REQ-A3]
    invariant_refs: [I12, I05, I06]
    contract_refs:
      - "contracts/reporting/selection.md"
      - "contracts/data/entities.yaml"
      - "contracts/ports.yaml"
      - "contracts/state/report.yaml"
    contract_ids: [CT-reporting-selection, CT-data-entities]
    error_refs: [EMBEDDING_GENERATION_MISMATCH, CONFLICT, STORAGE_WRITE_FAILED]
    fixture_refs: ["acceptance/fixtures/reporting/n-embedding-generation-switch-positive.json"]
    input_vi: >
      Generation G1 active với N vector. Owner đổi model embedding, buộc tính lại toàn kho
      (REQ-D48: "đổi model là phải tính lại toàn kho"). G2 được dựng dần.
    event_order:
      - "1. Owner đổi model embedding trong Settings (`settings.update_config`)."
      - "2. `MOD-settings-service` gọi `embedding.start_generation_rebuild` → G2 ở `state='building'`; G1 VẪN active."
      - "3. `embedding.generate_vectors` sinh vector G2 cho tag/alias/exclusion rồi cho toàn bộ `work_label`; trong lúc này mọi selection vẫn đọc `embedding.get_active_generation` → G1."
      - "4. Một kỳ báo cáo được dựng GIỮA LÚC rebuild và publish với `embedding_generation_id = G1` — rebuild không chặn kỳ."
      - "5. `embedding.activate_generation` được gọi khi `built_vector_count < expected_vector_count` → BỊ TỪ CHỐI, G1 vẫn active."
      - "6. `embedding.generate_vectors` hoàn tất phần còn lại: `built_vector_count == expected_vector_count`."
      - "7. `embedding.activate_generation` chuyển G1 → G2 trong MỘT transaction: G2 `active`, G1 `retired`."
      - "8. Kỳ kế tiếp build và publish với `embedding_generation_id = G2`."
    expected_durable_state_vi: >
      Trong suốt bước 2, mọi selection dùng G1; sau bước 4, mọi selection dùng G2; không có thời
      điểm nào một selection nhìn thấy cả hai. Report ở bước 5 ghi
      `embedding_generation_id = G2`.
    oracle_vi: >
      `COUNT(vector WHERE generation=G2) == COUNT(vector WHERE generation=G1)` trước khi bước 4
      được phép chạy — chuyển generation khi chưa đủ vector bị từ chối;
      số phép cosine giữa hai generation khác nhau bằng **0** trong toàn bộ chuỗi (instrument trên
      hàm similarity); báo cáo trước bước 4 mang `embedding_generation_id = G1`, báo cáo sau mang
      G2, không có báo cáo nào mang cả hai. Đây là mặt DƯƠNG của I12; SC24 là mặt âm (bị chặn).
    forbidden_effects_vi:
      - "Chuyển active khi G2 chưa đủ vector."
      - "Trộn vector G1 và G2 trong một lần selection (I12)."
      - "Gọi API ngoài để sinh embedding thay cho model local (REQ-D48: model local, không cần API key)."
      - "Sửa report đã publish để đổi `embedding_generation_id` của nó."
    evidence_level_required: E2
    mockable_vi: >
      Vector giả, hai generation, một instrument đếm phép so sánh; toàn bộ offline.
    needs_live_or_human_vi: >
      Chất lượng của model đa ngôn ngữ trên thuật ngữ khoa học (REQ-A3) và model embedding cụ thể
      (REQ-OQ09) là E4 và `KC`: cần so với một model chỉ tiếng Anh trên cùng tập thử, rubric khóa
      trước khi đo.
    status: NOT_RUN
    notes_vi: >
      Fixture được cấp ở đợt FIX5 (`reporting/n-…`, ruling R5-02). `event_order` ở trên trích đúng
      hai operation authoritative của `contracts/ports.yaml` — `embedding.start_generation_rebuild`
      và `embedding.activate_generation` — thay cho hai tên tôi đặt sai ở bản đầu (chúng ghép
      "embedding" với "start_generation" và với "switch_generation"; cả hai KHÔNG tồn tại trong
      inventory 85 operation). `CR-PC04-11` được ghi là đóng ở bản trước, nhưng bản sửa khi đó chỉ
      chạm SC52 — **SC24 vẫn mang cả hai tên sai** và sáu tên `backup.*`/`job.*` sai khác chưa ai
      thấy. Cả chín được sửa ở đợt FIX6 sau khi A2 phát hiện (`F-A2R1-01`), và lớp lỗi nay có một
      cửa kiểm thường trực: `E0-04b-prose-op-tokens`. I12 trước đợt FIX5 chỉ có mặt âm.

