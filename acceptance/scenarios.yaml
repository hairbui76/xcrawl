  - id: SC14
    title_vi: "Telegram gửi lỗi: unknown, multipart và lỗi vĩnh viễn → app giữ report đủ, không gửi lặp tự động"
    polarity: mixed
    packages: [PC07]
    ac_ref: AC-14
    requirement_refs: [REQ-AC14, REQ-D38, REQ-S9.1-03, REQ-S9.2-05, REQ-S9.3-06]
    invariant_refs: [I05, I09, I13]
    contract_refs:
      - "contracts/state/delivery.yaml"
      - "contracts/telegram/delivery.md"
      - "contracts/errors.yaml"
      - "contracts/retry-policy.yaml"
    contract_ids: [CT-state-delivery, CT-telegram-delivery, CT-errors]
    error_refs: [TELEGRAM_SEND_UNCERTAIN, TELEGRAM_PERMANENT_FAILURE, RATE_LIMITED, UNAUTHORIZED]
    fixture_refs:
      - "acceptance/fixtures/telegram/a-multipart-part2-unknown-no-resend.json"
      - "acceptance/fixtures/telegram/b-response-lost-unknown-operator-decides.json"
      - "acceptance/fixtures/telegram/c-permanent-failure-report-intact.json"
    input_vi: >
      Một digest hai phần đã publish. Biến thể (a): part 1 `sent`, part 2 timeout sau khi request
      có thể đã tới Telegram. Biến thể (b): Telegram nhận tin nhưng response mất. Biến thể (c):
      recipient bị thu hồi → lỗi vĩnh viễn.
    event_order:
      - "1. `delivery.create_intent` tại transaction publish."
      - "2. `delivery.dispatch_next` ghi `delivery_attempt` TRƯỚC network call."
      - "3. Part 1 nhận message_id → `sent`. Part 2 timeout → `unknown`."
      - "4. Owner đọc trạng thái trong app; `delivery.decide_unknown` là hành động của người."
    expected_durable_state_vi: >
      `delivery_part[1].state='sent'` với receipt; `delivery_part[2].state='unknown'`;
      `delivery.state='unknown'`; `report.content_hash` không đổi; `run.status`/`run.outcome`
      không đổi vì delivery lỗi.
    oracle_vi: >
      Sau khi một part vào `unknown`, số network call tiếp theo cho part đó bằng **0** cho tới
      khi có quyết định của người; `report.content_hash` trước và sau ba biến thể bằng nhau;
      `run.outcome` không đổi; ở biến thể (c) `delivery.state='failed'` mà report vẫn mở được
      đầy đủ trong app. UI KHÔNG được hiển thị `unknown` thành `sent` hay `failed`.
    forbidden_effects_vi:
      - "Tự retry từ `unknown` (AMD-B03)."
      - "Gửi lại part `unknown` chỉ vì tổng thể chưa `sent`."
      - "Đặt `run.status = failed` khi delivery thất bại (I09)."
      - "Xóa hoặc sửa report khi delivery thất bại."
    evidence_level_required: E3
    mockable_vi: >
      Cắt response, timeout và lỗi vĩnh viễn mô phỏng được bằng một Telegram giả; đếm network
      call là oracle số học ở E2.
    needs_live_or_human_vi: >
      Hành vi THẬT khi Telegram đã nhận tin rồi cắt response chỉ quan sát được với endpoint thật
      (E3). SRC-PLAN §3.1 đã ghi: `sendMessage` không nhận idempotency key của client, nên UNIQUE
      trong SQLite KHÔNG phải bằng chứng exactly-once ở mạng ngoài.
    status: NOT_RUN

