    event_order:
      - "1. Task `running`; provider trả kết quả; worker chết."
      - "2. Lease hết hạn; item chuyển `unknown_attempt` với `cost_uncertain = true`."
      - "3. Một lần tự chạy lại (`analysis_unknown_attempt_auto_rerun = 1`)."
      - "4. Hai worker cùng nộp kết quả cho cùng `analysis_key` và cùng generation."
    expected_durable_state_vi: >
      Một hàng `analysis_attempt` với `unknown_attempt` và `cost_uncertain=true`; sau bước 3 và
      bước 4, đúng MỘT hàng `analysis` hợp lệ cho `(analysis_key, generation_number)`; lần nộp thứ
      hai bị từ chối.
    oracle_vi: >
      `COUNT(analysis WHERE analysis_key=K AND generation_number=g AND state='valid') = 1` sau tất
      cả các bước; tổng số lời gọi model cho `(K, g)` ≤ `analysis_attempts_per_item` = 2 (ràng
      buộc RPC-08: `auto_rerun ≤ attempts_per_item − 1`, nên D43 "thử lại một lần" được giữ);
      `usage.unknown = true` với ba trường NULL, KHÔNG ghi 0 (I14); attempt lỗi hoặc không xác
      định KHÔNG bao giờ được đếm là kết quả (I16).
    forbidden_effects_vi:
      - "Ghi hai hàng `analysis` hợp lệ cùng key và cùng generation."
      - "Cam kết rằng chưa phát sinh phí khi kết quả không xác định."
      - "Ghi usage không rõ thành 0."
      - "Coi một attempt là một kết quả."
    evidence_level_required: E2
    mockable_vi: >
      Crash-after-provider-completion inject được; đếm hàng và đếm lời gọi là oracle số học.
    needs_live_or_human_vi: >
      Không thể hứa inference bên ngoài chạy đúng một lần (SRC-PLAN §8.2); điều được bảo đảm là
      không có hai KẾT QUẢ ĐÃ COMMIT cùng key. Quyết định tự chạy lại một lần là PROVISIONAL
      (`PROV-PC03-04`) và cần Owner phê chuẩn.
    status: NOT_RUN

