      - "1. `research.fetch_work_metadata` (caller `MOD-ingest-service`) trả không có metadata."
      - "2. Target được đánh dấu `evidence_level = post_only`."
      - "3. `analysis.submit_result` với từng biến thể."
    expected_durable_state_vi: >
      Biến thể (a): một hàng `analysis` hợp lệ với `evidence_level='post_only'`, mọi statement có
      `claim_kind='ai_inference'` và `comparator='unknown'`. Biến thể (b) và (c): KHÔNG hàng
      `analysis` hợp lệ nào; một `analysis_attempt` với `AI_OUTPUT_INVALID`.
    oracle_vi: >
      Với (a): không statement nào có `claim_kind='source_verified'` khi `evidence_level='post_only'`
      (quy tắc SV-03); mọi phát biểu về tính mới có `claim_kind='ai_inference'`; `comparator='unknown'`,
      không có baseline nào được bịa. Với (b): validator từ chối tại con trỏ
      `/result/statements/*/citation_refs`. Với (c): schema chấp nhận nhưng cửa semantic từ chối;
      `COUNT(analysis WHERE state='valid') = 0` trong cả hai.
    forbidden_effects_vi:
      - "Đoán DOI/arXiv ID từ ảnh chụp (REQ-D33)."
      - "Xóa abstract cũ đã có khi nguồn tạm thời lỗi."
      - "Ghi một output sai schema thành `valid`."
      - "Bịa một baseline để có 'điểm khác với cái đã có' (AMD-B16)."
    evidence_level_required: E4
    mockable_vi: >
      Cửa schema và cửa citation-resolution kiểm được ở E1 bằng chính bốn fixture trên.
    needs_live_or_human_vi: >
      "Trình bày là suy luận, không phải kết luận" là phán đoán ngữ nghĩa: cần groundedness review
      của người theo rubric `contracts/ai/grounding.md` §6 (ngưỡng G1/G2 = 1.00, mẫu 10 mục/kỳ,
      ≥ 3 kỳ) — E4, `NOT_RUN`.
    status: NOT_RUN

  - id: SC12
    title_vi: "Save một mục, khởi động lại, bài gốc bị xóa trên X → snapshot còn nguyên và đọc được"
    polarity: positive
