scope: >
  Danh mục scenario chấp nhận của toàn bộ hệ thống. Mỗi scenario là một tình huống có thứ tự
  sự kiện xác định, một trạng thái bền mong đợi, một tập hiệu ứng bị cấm và một oracle độc lập
  — nghĩa là một kết quả kiểm được bằng số hàng, hash, trạng thái hoặc số lời gọi, không phải
  bằng "log trông ổn" hay bằng câu trả lời của agent (SRC-PLAN §2). SC01–SC18 phủ AC-01..AC-18
  của SRC-SPEC §12 theo bảng SRC-PLAN §13. SC19–SC28 là mười scenario bổ sung tối thiểu của
  SRC-PLAN §13 dòng 505. SC29–SC48 do các gói PC01–PC08 đăng ký qua ruling của Coordinator.
  SC49–SC53 do PC09 cấp để lấp đúng bốn lỗ hổng đo được: cạnh bị cấm chưa có scenario, đường
  chạy thành công đầu-cuối chưa có scenario dương, thiết lập lần đầu chưa có scenario, và ba
  invariant chưa có mặt dương (I12, I15 và chuỗi kỳ hoàn chỉnh).
verification: >
  E0 — `evidence/tools/e0_check.py` check `E0-16-scenario-catalogue` (mọi AC có SC; mọi mã lỗi
  có SC; mọi fixture_refs và contract_refs phân giải được; đánh số liên tục; và mọi status
  hoặc là `NOT_RUN`, hoặc là `PASS (E1)`/`PASS (E2)` KÈM `status_evidence_refs` phân giải được
  trên đĩa, `status_scope_vi`, và một `evidence_level_required` không cao hơn cấp được khai —
  `PASS (E3)`/`PASS (E4)` bị từ chối thẳng), check `E0-11b-invariant-polarity` (mỗi invariant
  có ít nhất một scenario dương và một scenario âm) và check `E0-10a-denied-edge-scenario`
  (mỗi cạnh bị cấm có scenario).
  E3–E4 chưa chạy ở bất kỳ scenario nào; xem `evidence/index.json`.
claim_ceiling: DRAFT_FOR_REVIEW

reading_guide_vi: >
  `polarity` nói scenario này chứng minh invariant ĐÚNG (positive), chứng minh hệ thống TỪ CHỐI
  điều sai (negative), hay cả hai (mixed). `oracle_vi` là kết quả mong đợi độc lập: nó phải
  kiểm được mà không cần tin vào lời của hệ thống đang bị kiểm. `evidence_level_required` là
  cấp bằng chứng TỐI THIỂU để chấp nhận implementation của scenario đó (SRC-PLAN §14.2): E0 lint
  hợp đồng, E1 contract test bằng fixture, E2 integration + fault injection, E3 live probe có
  giới hạn, E4 review nội dung nhiều kỳ. `mockable_vi` và `needs_live_or_human_vi` chia đôi:
  cái gì giả lập được bằng fixture/fake-clock, và cái gì bắt buộc phải có dịch vụ thật hoặc
  người đọc. `status` nay có ba giá trị: `NOT_RUN` (52 dòng), `PASS (E1)` (2 dòng) và
  `PASS (E2)` (2 dòng). Bốn dòng PASS là bốn scenario mà Giai đoạn 1 chạy TOÀN BỘ oracle trong
  phạm vi một card và một auditor độc lập (A3-R1, A3-R2) đã chạy lại từ chính bytes đã đóng
  băng; mỗi dòng mang `status_evidence_refs` và một `status_scope_vi` nói cả cái đã và cái
  CHƯA thiết lập. Một scenario mà Giai đoạn 1 chỉ chạm được MỘT PHẦN oracle vẫn là `NOT_RUN`
  và mang `partial_evidence_vi` nói phần nào đã chạy và phần nào chưa — một phần không phải
  một PASS, và điều đã đo không được phép biến mất chỉ vì nó chưa đủ.

fixture_missing_note_vi: >
  `fixture_refs: [MISSING]` là cơ chế dành cho một scenario đã có oracle nhưng CHƯA có dữ liệu
  vào/ra dưới `acceptance/fixtures/`. Đó là một thiếu sót thật, không phải một lựa chọn thiết kế:
  mỗi lần dùng phải kèm một CR và scenario đó không được coi là sẵn sàng cho E1.
  **Tại phiên bản này KHÔNG scenario nào mang nhãn đó.** Mười hai scenario từng thiếu fixture
  (SC10, SC32, SC33, SC34, SC35, SC36, SC44, SC49, SC50, SC51, SC52, SC53) đã được cấp dữ liệu ở
  đợt FIX5 theo ruling R5-02, trong ba thư mục mới `boundary/`, `e2e/`, `ui/` và trong
  `collection/`, `recovery/`, `reporting/`. `CR-PC09-01` chuyển sang `FIX_PROPOSED`; nó chỉ đóng
  khi một auditor độc lập xác minh trên epoch mới.

evidence_level_policy_vi: >
  Không nâng cấp cấp bằng chứng bằng suy diễn (SRC-PLAN §2). Một scenario ghi E3 KHÔNG được
  tuyên bố đạt bằng một fixture E1 chạy xanh; một scenario ghi E4 không đạt bằng schema hợp lệ.
  Với AC-16 (SC16), nếu chưa adapter CLI nào qua probe cô lập thì kết quả là `BLOCKED`, KHÔNG
  phải `FAIL` (ADR-0010, CR-PC06-04).

scenarios:

  # ------------------------------------------------------------------------------------
  # SC01–SC18 — một scenario cho mỗi acceptance criterion của SRC-SPEC §12
  # ------------------------------------------------------------------------------------

  - id: SC01
    title_vi: "Lịch tới hạn khi collector online → assignment tự được claim, người dùng không phải mở X"
    polarity: positive
    packages: [PC03, PC05]
    ac_ref: AC-01
    requirement_refs: [REQ-AC01, REQ-D10, REQ-D11, REQ-D13, REQ-P0-10, REQ-S5.2-01, REQ-S6.1-01]
    invariant_refs: [I01, I10, I15]
    contract_refs:
      - "contracts/state/run.yaml"
      - "contracts/ports.yaml"
      - "contracts/modules.yaml"
      - "contracts/ops/deployment.md"
    contract_ids: [CT-state-run, CT-ports, CT-modules]
    error_refs: [UNAUTHORIZED, STORAGE_WRITE_FAILED, RESTORE_UNVERIFIED]
    fixture_refs: ["acceptance/fixtures/collection/g-schedule-due-claim.json"]
    input_vi: >
      Settings có một mốc lịch 08:00 theo timezone IANA của owner; collector đã đăng ký
      capability và đang heartbeat; `storage.health = healthy`; không có run non-terminal nào.
    event_order:
      - "1. Fake-clock tiến tới mốc lịch. Scheduler sinh `schedule_occurrence`."
      - "2. `MOD-scheduler` gọi `job.enqueue_scheduled_run` → một hàng `run(status=queued, trigger_type=scheduled)`."
      - "3. `MOD-x-collector` gọi `worker.claim_assignment` (T-RUN-01)."
      - "4. Server cấp `assignment_lease(state=held, lease_epoch=n+1)` và trả checkpoint đã ACK."
    expected_durable_state_vi: >
      Đúng một hàng `run` với `status=running`, `phase=collecting`, `trigger_type=scheduled`;
      đúng một hàng `assignment_lease` `state=held`; `run.current_lease_epoch` bằng epoch vừa cấp.
    oracle_vi: >
      `COUNT(run WHERE status NOT IN ('completed','failed','cancelled')) = 1` VÀ
      `COUNT(assignment_lease WHERE state='held' AND run_id = <run>) = 1` VÀ độ trễ từ mốc lịch
      tới khi lease tồn tại ≤ trần `claim_idle_backoff` (45 s, `contracts/retry-policy.yaml`).
      Không có lời gọi nào tới X trước khi lease tồn tại.
    forbidden_effects_vi:
      - "Cấp hai lease cho cùng một job."
      - "Cấp lease khi `storage.health != healthy` hoặc khi còn `restore_record` chưa đối soát."
      - "Yêu cầu người dùng mở trình duyệt X để kích hoạt đợt chạy."
    evidence_level_required: E2
    mockable_vi: >
      Toàn bộ chuỗi lịch → queue → claim mock được bằng fake-clock và một collector giả; không
      cần X thật để chứng minh assignment được claim.
    needs_live_or_human_vi: >
      "Người dùng không phải mở X" ở mức sản phẩm chỉ chứng minh được bằng một đợt chạy thật có
      timestamp (E3, gắn với probe SP1 của `contracts/ops/collector-probe.md`).
    status: NOT_RUN

  - id: SC02
    title_vi: "Nhiều kỳ lịch bị bỏ lỡ vì máy tắt → đúng MỘT run chạy bù, tin nhắn ghi khoảng bao trùm"
    polarity: positive
    packages: [PC03, PC04]
    ac_ref: AC-02
    requirement_refs: [REQ-AC02, REQ-D13, REQ-D15, REQ-D16, REQ-D56, REQ-S8.2-08]
    invariant_refs: [I06, I13]
    contract_refs:
      - "contracts/state/run.yaml"
      - "contracts/reporting/time-and-tags.md"
      - "contracts/ports.yaml"
    contract_ids: [CT-state-run, CT-reporting-time-and-tags]
    error_refs: [STORAGE_WRITE_FAILED]
    fixture_refs: ["acceptance/fixtures/reporting/f-three-offline-periods-one-catchup.json"]
    input_vi: >
      Lịch 08:00 và 20:00; máy tắt qua ba mốc liên tiếp; timezone owner `Asia/Ho_Chi_Minh`
      (PROVISIONAL, B08); coverage window trước có `window_to = X`.
    event_order:
      - "1. Ba mốc lịch trôi qua khi collector offline; scheduler ghi ba `schedule_occurrence` quá hạn."
      - "2. Máy thức. Collector đăng ký lại capability."
      - "3. `job.coalesce_overdue` gộp ba occurrence thành MỘT run (`run_now_active_run_policy = coalesce`)."
      - "4. Run chạy tới publish; coverage window mới có `window_from = X`."
    expected_durable_state_vi: >
      Đúng một hàng `run` cho ba occurrence; `run.catch_up_window_from/to` bao trùm cả ba mốc;
      đúng MỘT `coverage_window` mới, nối liền với window trước, không hở và không chồng lấn.
    oracle_vi: >
      `COUNT(run WHERE schedule_occurrence_ids ⊇ {o1,o2,o3}) = 1` VÀ `COUNT(run) = 1` cho ba
      occurrence đó VÀ `coverage_window[n].window_from == coverage_window[n-1].window_to` VÀ
      `run.catch_up_window_from == min(o1..o3)`, `catch_up_window_to == max(o1..o3)`.
      Không sinh ba digest; đúng một digest ghi khoảng bao trùm.
    forbidden_effects_vi:
      - "Chạy dồn ba đợt liên tiếp (SRC-SPEC §8.2 hàng 8)."
      - "Gửi bù các báo cáo cũ của các kỳ đã lỡ (REQ-D16)."
      - "Bỏ qua occurrence nào khiến coverage bị hở."
    evidence_level_required: E2
    mockable_vi: "Fake-clock + queue giả; không cần X hay Telegram thật."
    needs_live_or_human_vi: "Không có phần bắt buộc live."
    status: NOT_RUN

  - id: SC03
    title_vi: "Đạt giới hạn đợt → dừng thu thập, checkpoint đã ACK được giữ, phase/outcome đúng AMD-B02"
    polarity: mixed
    packages: [PC03, PC05]
    ac_ref: AC-03
    requirement_refs: [REQ-AC03, REQ-P0-12, REQ-S9.1-01, REQ-S9.3-02, REQ-OQ05]
    invariant_refs: [I02, I10, I13]
    contract_refs:
      - "contracts/state/run.yaml"
      - "contracts/retry-policy.yaml"
      - "contracts/ports.yaml"
      - "contracts/http/openapi.yaml"
    contract_ids: [CT-state-run, CT-retry-policy]
    error_refs: [SOURCE_LAYOUT_CHANGED, STORAGE_WRITE_FAILED, STALE_LEASE]
    fixture_refs:
      - "acceptance/fixtures/collection/e-limit-reached-stop.json"
      - "acceptance/fixtures/collection/a-feed-layout-changed.json"
      - "acceptance/fixtures/collection/b-cursor-invalidated-reread-dedup.json"
    input_vi: >
      `per_run_post_limit` = 200 post hoặc `per_run_duration_limit` = 30 phút (cả hai
      PROVISIONAL, REQ-OQ05); collector đang ở phase `collecting` với checkpoint tại
      `acked_through_ingest_sequence = N`.
    event_order:
      - "1. Collector ingest tới khi chạm ngưỡng cấu hình."
      - "2. Collector gọi `worker.report_stop` với `stop_reason = limit_reached`."
      - "3. Server đóng collection segment, giữ checkpoint, chuyển phase sang `enriching`."
    expected_durable_state_vi: >
      `run.stop_reason = 'limit_reached'`; run KHÔNG ở `failed`; sau khi chuỗi kết thúc,
      `run.status = completed` với `outcome ∈ {partial, complete}` theo AMD-B02;
      `checkpoint.acked_through_ingest_sequence` không đổi so với trước lời gọi stop.
    oracle_vi: >
      Số request tới nguồn sau `report_stop` bằng 0; `checkpoint.acked_through_ingest_sequence
      ≤ MAX(ingest_receipt.max_ingest_sequence đã commit)`; hash của hàng checkpoint trước và
      sau `report_stop` bằng nhau; bộ ba `(status, outcome, stop_reason)` khớp đúng một dòng của
      bảng ánh xạ AMD-B02.
    forbidden_effects_vi:
      - "Ghi run thành `failed` chỉ vì chạm giới hạn (SRC-SPEC §8.3: 'đợt dừng sớm' ≠ 'đợt thất bại')."
      - "Tiến con trỏ vượt quá dữ liệu đã commit."
      - "Tự claim lại và chạy tiếp trong cùng run."
    evidence_level_required: E2
    mockable_vi: "Đếm request và kiểm hash checkpoint bằng collector giả; không cần X thật."
    needs_live_or_human_vi: >
      Con số giới hạn THẬT (REQ-OQ05) chỉ chốt được sau M0 bằng số liệu probe; scenario này
      chứng minh cơ chế, không chứng minh con số đúng.
    status: NOT_RUN
    partial_evidence_vi: >
      Nửa 'đọc lại sau khi con trỏ mất hiệu lực' đã chạy trong
      tests/integration/test_ingest_ack_lost.py, nhưng oracle của SC03 là bộ ba (status,
      outcome, stop_reason) theo AMD-B02 và số request tới nguồn sau report_stop — cả hai thuộc
      collector/scheduler, chưa tồn tại ở M1.

  - id: SC04
    title_vi: "CAPTCHA giữa lô → needs_user, ĐÚNG MỘT cảnh báo, không tự thử lại, resume phải cấp lease mới"
    polarity: mixed
    packages: [PC03, PC05, PC07]
    ac_ref: AC-04
    requirement_refs: [REQ-AC04, REQ-D09, REQ-S5.4-01, REQ-S5.4-02, REQ-S5.4-03, REQ-S5.4-04, REQ-S9.3-01, REQ-A7]
    invariant_refs: [I02, I10, I13]
    contract_refs:
      - "contracts/state/run.yaml"
      - "contracts/errors.yaml"
      - "contracts/state/delivery.yaml"
      - "contracts/telegram/commands.yaml"
    contract_ids: [CT-state-run, CT-errors, CT-state-delivery]
    error_refs: [X_CHALLENGE_REQUIRED, STALE_LEASE, WORKER_LEASE_EXPIRED]
    fixture_refs:
      - "acceptance/fixtures/collection/c-challenge-mid-batch.json"
      - "acceptance/fixtures/telegram/l-run-now-while-needs-user.json"
    input_vi: >
      Collector đã ingest và được ACK tới sequence N; đang tải thêm một lô CHƯA gửi thì X trả
      trang xác minh.
    event_order:
      - "1. Lô 1 được commit và ACK (sequence tới N)."
      - "2. Sự kiện cục bộ: collector tải thêm 7 bài nhưng CHƯA gửi; X trả challenge."
      - "3. `worker.report_stop` với `X_CHALLENGE_REQUIRED` → `run.status = needs_user`."
      - "4. Một `outbox_intent` cảnh báo được tạo, gắn `run_id`."
      - "5. Owner gửi `/status` và `/run_now` qua Telegram — cả hai KHÔNG đưa run rời `needs_user`."
      - "6. Owner xử lý challenge rồi bấm 'tiếp tục' trong app → `run.resume` → `queued`, lease mới."
    expected_durable_state_vi: >
      `run.status = needs_user`, `stop_reason = 'captcha'`; đúng một `outbox_intent` kiểu cảnh
      báo cho run này; `checkpoint.acked_through_ingest_sequence = N` (7 bài chưa gửi KHÔNG nằm
      trong checkpoint); sau resume, `run.current_lease_epoch` tăng và lease cũ bị từ chối.
    oracle_vi: >
      `COUNT(outbox_intent WHERE kind='run_alert' AND run_id=<run>) = 1` bất kể số lần phát hiện
      lại; `COUNT(post) sau bước 2 == COUNT(post) sau bước 1` (7 bài chưa ingest không tồn tại);
      giữa bước 3 và bước 6 số request tới X bằng 0; sau bước 6, một lời gọi bằng lease epoch cũ
      trả `STALE_LEASE` và không đổi hàng nào.
    forbidden_effects_vi:
      - "Tự thử lại hoặc tự giải CAPTCHA bằng bất kỳ cơ chế nào (SRC-SPEC §2.3)."
      - "Gửi cảnh báo thứ hai cho cùng một run."
      - "Cho `/status` hoặc `/run_now` resume run (AMD-B10)."
      - "Ghi 7 bài chưa ACK vào checkpoint."
    evidence_level_required: E2
    mockable_vi: >
      Challenge inject được bằng fixture; đếm alert intent và đếm request là oracle số học.
    needs_live_or_human_vi: >
      Tần suất challenge thật (REQ-A1, REQ-A7) chỉ đo được bằng probe SP1 5–10 đợt; nhánh "người
      dùng xử lý tay trong cửa sổ Chrome" là bước con người, không tự động hóa được.
    status: NOT_RUN

  - id: SC05
    title_vi: "Bỏ tag trước transaction publish → mục khớp tag đó không vào báo cáo, dữ liệu vẫn ở kho"
    polarity: mixed
    packages: [PC04]
    ac_ref: AC-05
    requirement_refs: [REQ-AC05, REQ-CTAG, REQ-D23, REQ-D24, REQ-S5.5-01, REQ-S8.2-02, REQ-S8.1-03]
    invariant_refs: [I05]
    contract_refs:
      - "contracts/reporting/time-and-tags.md"
      - "contracts/reporting/selection.md"
      - "contracts/schemas/report.schema.json"
