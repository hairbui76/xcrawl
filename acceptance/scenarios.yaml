      khởi động lại, rồi bài gốc bị xóa trên X, rồi một chu kỳ backup–restore hoàn tất.
    event_order:
      - "1. `save.create` → `saved_item` + `saved_snapshot(content_hash=H)`."
      - "2. Khởi động lại tiến trình."
      - "3. Collector quan sát bài gốc đã biến mất trên X và gửi quan sát đó qua `ingest.submit_batch`: item mang trường `source_deleted_observed_at`. KHÔNG có operation riêng cho việc này — PC01 đã bác một operation `post.*` chuyên dụng và chốt rằng quan sát đi kèm lô ingest (ruling PKT-PC01-FIX1)."
      - "4. `backup.create_snapshot` rồi `backup.restore_snapshot` vào môi trường sạch, rồi đối soát."
    expected_durable_state_vi: >
      `saved_snapshot.content_hash` bằng H ở cả bốn thời điểm; nội dung Saved đọc được kể cả khi
      `post.source_deleted_observed_at` đã được đặt; sau restore, hash vẫn bằng H.
    oracle_vi: >
      `saved_snapshot.content_hash` trước bước 2 == sau bước 2 == sau bước 3 == sau bước 4 == H,
      và H tính lại được từ payload theo quy tắc canonical JSON của
      `contracts/schemas/saved-snapshot.schema.json`; `COUNT(saved_item WHERE target_key=T AND
      state='active') = 1` ở mọi thời điểm; đọc Saved sau bước 3 trả nội dung, không trả NOT_FOUND.
    forbidden_effects_vi:
      - "Xóa hoặc sửa `saved_snapshot` khi nguồn bị xóa (REQ-D55)."
      - "Coi 'bỏ lưu' là 'xóa dữ liệu gốc' (REQ-S7.3-05: ba thao tác riêng)."
      - "Cập nhật snapshot sang một analysis revision mới hơn."
    evidence_level_required: E2
    mockable_vi: "Hash trước/sau và restart là kiểm số học; fixture + drill giả đủ ở E2."
    needs_live_or_human_vi: >
      Restore THẬT vào môi trường sạch chưa từng chạy (`contracts/ops/backup-restore.md` §5.7);
      chỉ một drill thật mới chứng minh khôi phục được, hash một artifact thì không.
