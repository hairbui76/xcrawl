  - id: SC08
    title_vi: "Chuỗi kỳ báo cáo có kỳ rỗng và một publisher crash → các cửa sổ coverage nối liền, nửa mở"
    polarity: mixed
    packages: [PC04]
    ac_ref: AC-08
    requirement_refs: [REQ-AC08, REQ-D27, REQ-D57, REQ-S8.2-09, REQ-S9.2-04]
    invariant_refs: [I05, I06, I12]
    contract_refs:
      - "contracts/reporting/time-and-tags.md"
      - "contracts/state/report.yaml"
      - "contracts/schemas/report.schema.json"
      - "contracts/data/entities.yaml"
    contract_ids: [CT-reporting-time-and-tags, CT-state-report, CT-schema-report]
    error_refs: [CONFLICT, TAG_VERSION_STALE, EMBEDDING_GENERATION_MISMATCH]
    fixture_refs:
      - "acceptance/fixtures/reporting/d-empty-period-coverage-only.json"
      - "acceptance/fixtures/reporting/f-three-offline-periods-one-catchup.json"
      - "acceptance/fixtures/reporting/g-concurrent-publishers-cas.json"
      - "acceptance/fixtures/reporting/k-builder-crash-backfill-not-consumed.json"
      - "acceptance/fixtures/reporting/m-density-worked-example.json"
    input_vi: >
      Bốn kỳ liên tiếp: kỳ 1 có nội dung, kỳ 2 RỖNG (không mục nào khớp tag và không lỗi thiếu
      dữ liệu), kỳ 3 có hai publisher chạy đồng thời, kỳ 4 builder crash giữa chừng.
    event_order:
      - "1. Kỳ 1 publish; `coverage_window(sequence=1)` ghi `[from1, to1)`."
      - "2. Kỳ 2: build không chọn được mục nào → `report(status='aborted', abort_reason='empty_period')` + `coverage_window(sequence=2, report_id=NULL)`; KHÔNG tạo digest."
      - "3. Kỳ 3: hai publisher cùng chạy; một thắng CAS trên `report_build_id`, một thua và đọc lại."
      - "4. Kỳ 4: builder crash sau khi chọn mục, trước commit → không hàng report nào, không tiêu thụ backfill."
    expected_durable_state_vi: >
      Với mọi n: `coverage_window[n].window_from == coverage_window[n-1].window_to` và
      `ingest_sequence_from[n] == ingest_sequence_to[n-1]`; kỳ rỗng vẫn có hàng coverage;
      kỳ 3 có đúng một report `published`; kỳ 4 không để lại report một phần.
    oracle_vi: >
      Không hở, không chồng lấn: với chuỗi window sắp theo `sequence`, hiệu
      `window_from[n] − window_to[n−1] = 0` cho mọi n; `COUNT(report WHERE status='published'
      AND coverage_window_id=<kỳ 3>) = 1`; publisher thua trả `CONFLICT` và không ghi hàng nào;
      sau crash ở kỳ 4, `backfill_ledger.consumed_in_report_id` vẫn NULL và
      `COUNT(report_item WHERE report_id=<kỳ 4>) = 0`; không digest nào cho kỳ 2.
    forbidden_effects_vi:
      - "Publish một kỳ chồng lấn kỳ trước."
      - "Gửi digest cho kỳ rỗng (REQ-D57)."
      - "Tiêu thụ backfill vì builder crash (SRC-PLAN §9.2)."
      - "So sánh vector khác generation trong cùng một lần selection (I12)."
    evidence_level_required: E2
    mockable_vi: >
      Toàn bộ là transaction và truy vấn; crash inject được; CAS kiểm bằng hai tiến trình giả.
    needs_live_or_human_vi: "Không có phần bắt buộc live."
    status: NOT_RUN
    notes_vi: >
      Lựa chọn (b) cho kỳ rỗng (giữ hàng `report(status='aborted')` mang `report_build_id` làm
      mỏ neo replay) là quyết định PROVISIONAL của PC04 TRÁI với khuyến nghị (a) của Coordinator;
      xem `precode/review.md` §6. Oracle ở trên đúng với cả hai lựa chọn trừ dòng nói về hàng
      `report` của kỳ 2.

  - id: SC09
    title_vi: "Work đã công bố ở kỳ trước → kỳ sau hiện dạng THAM CHIẾU CÓ NGÀY, không phải phát hiện mới"
    polarity: mixed
    packages: [PC02, PC04]
    ac_ref: AC-09
