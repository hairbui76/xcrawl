      của DB; tách file DB khỏi WAL có thể mất transaction ĐÃ COMMIT, nên hash file và
      `integrity_check` **không đủ** làm bằng chứng backup hợp lệ. Backup hợp lệ phải qua Online
      Backup API hoặc `VACUUM INTO`.
