# Alembic configuration for the Research Radar server (ADR-0011: SQLAlchemy 2 Core + Alembic).
#
# The database URL is intentionally NOT written here. `migrations/env.py` reads it from the
# environment variable RR_DATABASE_URL, so no path to a real database — and no secret — is
# ever committed (contracts/ops/secrets.md: secrets come from a restricted-permission file
# on the machine, never from the repo).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
