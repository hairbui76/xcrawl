# rr-contracts — GENERATED Pydantic models and constants, produced from contracts/ by
# shared/rr_contracts/generate.py. This is the ONE real (installable) package in the
# workspace, because server/, collector/ and worker/ all import it.
#
# Nothing under rr_contracts/generated/ may be hand-edited: ADR-0011 "Hệ quả" and
# agent-tasks/README.md §5.3. The diff-on-regenerate test in tests/ makes that checkable.

[project]
name = "rr-contracts"
version = "0.1.0"
description = "Research Radar shared contract models and constants (generated from contracts/)"
requires-python = "==3.12.*"
dependencies = [
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rr_contracts"]
